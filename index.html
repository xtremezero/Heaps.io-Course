lter<\/span> <span class=\"c-k\">extends<\/span> h2d.filter.<span class=\"c-t\">Filter<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> wobble = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Wobble<\/span>();<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(parent:h2d.<span class=\"c-t\">Object<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">super<\/span>();<\/span>","<span class=\"cl\">        shader = wobble;                  <span class=\"c-c\">// the filter applies YOUR shader<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> animate(dt:<span class=\"c-t\">Float<\/span>) wobble.time += dt;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\">tilemapSprite.filter = <span class=\"c-k\">new<\/span> <span class=\"c-t\">HeatFilter<\/span>();   <span class=\"c-c\">// whole tile layer shimmers<\/span><\/span>"],"raw":"// \"wavy heat\" = your wobble shader (vertex) inside a filter region:\nclass HeatFilter extends h2d.filter.Filter {\n    final wobble = new Wobble();\n    public function new(parent:h2d.Object) {\n        super();\n        shader = wobble;                  // the filter applies YOUR shader\n    }\n    public function animate(dt:Float) wobble.time += dt;\n}\ntilemapSprite.filter = new HeatFilter();   // whole tile layer shimmers"},{"k":"ul","i":["The filter auto-captures the drawable's output and re-renders it through your shader — full-quad fragment effects become trivial."]},{"k":"note","h":"For pixel-perfect games: prefer direct <code>addShader<\/code> (no render target) for sprite-level effects; use filters when the effect must cover a composite region."}],"src":"12_ch11.txt:172","n":237},{"ch":12,"kind":"content","title":"Post-Processing: The Concept","tt":"Post-Processing: The Concept","blocks":[{"k":"p","h":"Post = rendering the whole scene into a texture, then drawing that texture through effects — fullscreen = one quad."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">scene ──► render to texture T ──► [fullscreen quad with shader] ──► screen<\/span>","<span class=\"cl\">                                   · vignette      · color grading<\/span>","<span class=\"cl\">                                   · chromatic aberration  · scanlines<\/span>","<span class=\"cl\">                                   · bloom (Ch. 14, 3D renderer passes)<\/span>"],"raw":"scene ──► render to texture T ──► [fullscreen quad with shader] ──► screen\n                                   · vignette      · color grading\n                                   · chromatic aberration  · scanlines\n                                   · bloom (Ch. 14, 3D renderer passes)"},{"k":"ul","i":["In h2d: the cheapest post is a fullscreen bitmap+shader drawn over <code>s2d<\/code> (read the scene from a captured texture).","In h3d: the renderer's pass pipeline IS the post system (Chapter 14's renderer slides)."]},{"k":"best","t":"Post grades AFTER composition","h":"A single grading pass (color LUT or matrix) unifies art from different sources — the \"why does the game suddenly look cohesive\" trick."}],"src":"12_ch11.txt:184","n":238},{"ch":12,"kind":"content","title":"A Vignette Shader: Post in Practice","tt":"A Vignette Shader: Post in Practice","blocks":[{"k":"p","h":"The most-asked post effect, as a fullscreen 2D shader."},{"k":"code","lang":"haxe","file":"Vignette.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Vignette<\/span> <span class=\"c-k\">extends<\/span> hxsl.<span class=\"c-t\">Shader<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">SRC<\/span> = {<\/span>","<span class=\"cl\">        @:<span class=\"c-k\">import<\/span> h3d.shader.<span class=\"c-t\">Base2d<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> strength : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> radius : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> resolution : <span class=\"c-t\">Vec2<\/span>;              <span class=\"c-c\">// screen size in pixels<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> fragment() {<\/span>","<span class=\"cl\">            <span class=\"c-c\">// distance from screen center, normalized<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> d = distance(absolutePosition.xy, resolution * <span class=\"c-n\">0.5<\/span>) / (length(resolution) * <span class=\"c-n\">0.5<\/span>);<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> v = smoothstep(radius, radius + <span class=\"c-n\">0.35<\/span>, d);   <span class=\"c-c\">// 0 center → 1 corners<\/span><\/span>","<span class=\"cl\">            pixelColor.rgb *= <span class=\"c-n\">1.0<\/span> - v * strength;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    };<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> strength = <span class=\"c-n\">0.45<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> radius = <span class=\"c-n\">0.55<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> resolution : h3d.<span class=\"c-t\">Vector<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>() { <span class=\"c-k\">super<\/span>(); resolution = <span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Vector<\/span>(<span class=\"c-n\">1280<\/span>, <span class=\"c-n\">720<\/span>); }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Vignette extends hxsl.Shader {\n    static var SRC = {\n        @:import h3d.shader.Base2d;\n        @param var strength : Float;\n        @param var radius : Float;\n        @param var resolution : Vec2;              // screen size in pixels\n        function fragment() {\n            // distance from screen center, normalized\n            final d = distance(absolutePosition.xy, resolution * 0.5) / (length(resolution) * 0.5);\n            final v = smoothstep(radius, radius + 0.35, d);   // 0 center → 1 corners\n            pixelColor.rgb *= 1.0 - v * strength;\n        }\n    };\n    public var strength = 0.45;\n    public var radius = 0.55;\n    public var resolution : h3d.Vector;\n    public function new() { super(); resolution = new h3d.Vector(1280, 720); }\n}"},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// fullscreen dark quad + vignette + multiply blend = the grade<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> grade = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(h2d.<span class=\"c-t\">Tile<\/span>.fromColor(<span class=\"c-n\">0x000000<\/span>), s2d);<\/span>","<span class=\"cl\">grade.blendMode = h2d.<span class=\"c-t\">BlendMode<\/span>.<span class=\"c-t\">Multiply<\/span>;<\/span>","<span class=\"cl\">grade.scaleX = s2d.width; grade.scaleY = s2d.height;<\/span>","<span class=\"cl\">grade.addShader(<span class=\"c-k\">new<\/span> <span class=\"c-t\">Vignette<\/span>());<\/span>"],"raw":"// fullscreen dark quad + vignette + multiply blend = the grade\nfinal grade = new h2d.Bitmap(h2d.Tile.fromColor(0x000000), s2d);\ngrade.blendMode = h2d.BlendMode.Multiply;\ngrade.scaleX = s2d.width; grade.scaleY = s2d.height;\ngrade.addShader(new Vignette());"},{"k":"note","h":"Low-health danger vignette: tween <code>strength<\/code> 0 → 0.7 with health (Chapter 13 tween + this shader = the entire \"I'm dying\" feedback loop)."}],"src":"12_ch11.txt:215","n":239},{"ch":12,"kind":"content","title":"Water and Refraction Sketch","tt":"Water and Refraction Sketch","blocks":[{"k":"p","h":"A medley combining this chapter's tools: scrolling noise + displacement."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Water<\/span> <span class=\"c-k\">extends<\/span> hxsl.<span class=\"c-t\">Shader<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">SRC<\/span> = {<\/span>","<span class=\"cl\">        @:<span class=\"c-k\">import<\/span> h3d.shader.<span class=\"c-t\">Base2d<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> noise : <span class=\"c-t\">Sampler2D<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> time : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> vertex() {<\/span>","<span class=\"cl\">            <span class=\"c-c\">// gentle vertical bob<\/span><\/span>","<span class=\"cl\">            relativePosition.y += <span class=\"c-t\">Math<\/span>.sin(time * <span class=\"c-n\">2.0<\/span> + calculatedUV.x * <span class=\"c-n\">12.0<\/span>) * <span class=\"c-n\">2.0<\/span>;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> fragment() {<\/span>","<span class=\"cl\">            <span class=\"c-c\">// shimmer by nudging sampled color brightness with noise<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> n = noise.get(<span class=\"c-t\">Vec2<\/span>(calculatedUV.x + time * <span class=\"c-n\">0.05<\/span>, calculatedUV.y)).r;<\/span>","<span class=\"cl\">            pixelColor.rgb *= <span class=\"c-n\">0.85<\/span> + <span class=\"c-n\">0.3<\/span> * n;<\/span>","<span class=\"cl\">            pixelColor.b += <span class=\"c-n\">0.08<\/span> * n;              <span class=\"c-c\">// blue-ish sparkle<\/span><\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    };<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> noise : h3d.mat.<span class=\"c-t\">Texture<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> time = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Water extends hxsl.Shader {\n    static var SRC = {\n        @:import h3d.shader.Base2d;\n        @param var noise : Sampler2D;\n        @param var time : Float;\n        function vertex() {\n            // gentle vertical bob\n            relativePosition.y += Math.sin(time * 2.0 + calculatedUV.x * 12.0) * 2.0;\n        }\n        function fragment() {\n            // shimmer by nudging sampled color brightness with noise\n            final n = noise.get(Vec2(calculatedUV.x + time * 0.05, calculatedUV.y)).r;\n            pixelColor.rgb *= 0.85 + 0.3 * n;\n            pixelColor.b += 0.08 * n;              // blue-ish sparkle\n        }\n    };\n    public var noise : h3d.mat.Texture;\n    public var time = 0.0;\n}"},{"k":"ul","i":["True refraction (bending what is <em>behind<\/em>) needs the scene captured to a texture first — the filter/post machinery above, one step further."]}],"src":"12_ch11.txt:240","n":240},{"ch":12,"kind":"content","title":"Debugging Shaders","tt":"Debugging Shaders","blocks":[{"k":"p","h":"Shaders fail silently — pixels just look wrong. The debugging kit:"},{"k":"ul","i":["<b>Output the value you suspect<\/b>: <code>pixelColor.rgb = vec3(suspect, 0, 0);<\/code> — a red debug pass beats staring at math.","<b>Reduce to the base case<\/b>: comment out stages until the plain texture returns; add back one stage at a time.","<b>Uniform sanity<\/b>: a constant-uniform branch (<code>if (amount &gt; 999) pixelColor = vec4(1,0,1,1);<\/code>) proves binding works.","Compile errors <em>are<\/em> Haxe errors: read the macro message — it names the SRC line."]},{"k":"pit","t":"Silent black pixels","h":"Usually: sampling a null texture, NaN propagation (0/0), or alpha multiplied to 0 before your fragment math. Test with a solid-color bitmap first."}],"src":"12_ch11.txt:248","n":241},{"ch":12,"kind":"content","title":"Cross-Platform Shader Caveats","tt":"Cross-Platform Shader Caveats","blocks":[{"k":"p","h":"hxsl compiles per backend — but capabilities still differ."},{"k":"ul","i":["<b>WebGL1<\/b> (older mobile browsers): limited texture units, no dynamic loops in some drivers — keep loops constant-bounded.","<b>Precision<\/b>: mobile fragment shaders run at mediump by default; large <code>time<\/code> values or far-from-origin positions shimmer. Wrap time (<code>time % 6.28<\/code>), keep coordinates local.","<b>Driver bugs exist<\/b> — a shader that works on one Android GPU may glitch on another. Your only defense: testing on real devices early."]},{"k":"best","t":"Feature-degrade, never crash","h":"Wrap exotic effects in a quality setting (Chapter 7's settings!): high = full effects, low = tints only. The 10% of old devices keep 60 FPS and you keep good reviews."}],"src":"12_ch11.txt:255","n":242},{"ch":12,"kind":"content","title":"Project: The Stylized Pass","tt":"Project: The Stylized Pass","blocks":[{"k":"p","h":"Chapter 11's exit: Cavern Run looks <em>designed<\/em>, not assembled."},{"k":"ul","i":["Palette-grade the gameplay layer via one ColorMatrix on <code>entityLayer<\/code> root.","Gem sparkle: additive glow filter + palette shader on the gem icon.","Water pools with the Water shader; heat shimmer room via the HeatFilter.","Low-health vignette driven by health; pause desaturation.","A \"quality\" setting toggling filters for the mobile build."]},{"k":"best","t":"A shader budget is a performance contract","h":"Decide now: 2 fullscreen passes max, 4 filtered drawables max on low quality. Write it in the asset manifest (Chapter 5) — future effects negotiate against the budget, not against hope."}],"src":"12_ch11.txt:264","n":243},{"ch":12,"kind":"content","title":"Chapter 11 Checklist","tt":"Chapter 11 Checklist","blocks":[{"k":"ul","i":["hxsl mental model: SRC, @:import, vertex/fragment, @param ↔ public fields.","Wobble (vertex), Desaturate (fragment), Palette (sampler) written and attached.","Filters used deliberately (UI/hero only on mobile); custom filter composed.","Post: vignette + grade pass; concept of render-to-texture clear.","Debug workflow: value-out passes, base-case reduction.","Quality-tier shader policy shipped in settings."]}],"src":"12_ch11.txt:272","n":244},{"ch":13,"kind":"chapter","title":"Alternative Input: Touch, Tilt &amp; Gestures","tt":"Alternative Input: Touch, Tilt & Gestures","sub":"Virtual joysticks, touch buttons, accelerometer, swipes and multi-touch — plus the input router that unifies everything.","blocks":[],"src":"13_ch12.txt:1","n":245},{"ch":13,"kind":"content","title":"Input Beyond the Keyboard","tt":"Input Beyond the Keyboard","blocks":[{"k":"p","h":"Desktop is a keyboard; the other half of the market is a thumb. Touch changes three things at once."},{"k":"ul","i":["<b>No hover, no cursor<\/b> — everything is a press; targets need size.","<b>Fingers hide the screen<\/b> — controls live at the edges, gameplay in the middle.","<b>One to five simultaneous contacts<\/b> — multi-touch is a feature, plan for it.","Heaps gives the raw events (Chapter 2's <code>hxd.Event<\/code> with <code>touchId<\/code>); this chapter builds the vocabulary on top."]},{"k":"best","t":"Design \"pointer-first\" once","h":"If gameplay listens to actions (<code>Move<\/code>, <code>Jump<\/code>) rather than keys (Chapter 2's Input manager), adding touch is purely additive — no gameplay file changes."}],"src":"13_ch12.txt:11","n":246},{"ch":13,"kind":"content","title":"The Input Router: One Abstraction for All Devices","tt":"The Input Router: One Abstraction for All Devices","blocks":[{"k":"p","h":"The payoff slide of Chapter 2's Input manager — every device contributes to the same actions."},{"k":"code","lang":"haxe","file":"InputRouter.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">InputRouter<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-c\">// ACTION SOURCES merge here every frame:<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// 1. keyboard (Ch. 2)<\/span><\/span>","<span class=\"cl\">        <span class=\"c-t\">Input<\/span>.pollKeyboard();<\/span>","<span class=\"cl\">        <span class=\"c-c\">// 2. gamepad (Ch. 2)<\/span><\/span>","<span class=\"cl\">        <span class=\"c-t\">Input<\/span>.pollPads();<\/span>","<span class=\"cl\">        <span class=\"c-c\">// 3. virtual controls (this chapter) — only when visible/active<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (touchUI.visible) touchUI.poll();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-c\">// Gameplay never knows who is steering:<\/span><\/span>","<span class=\"cl\">hero.tick(dt, <span class=\"c-t\">Input<\/span>.down(<span class=\"c-t\">Action<\/span>.<span class=\"c-t\">Right<\/span>), <span class=\"c-t\">Input<\/span>.pressed(<span class=\"c-t\">Action<\/span>.<span class=\"c-t\">Jump<\/span>));<\/span>"],"raw":"class InputRouter {\n    // ACTION SOURCES merge here every frame:\n    public static function update(dt:Float) {\n        // 1. keyboard (Ch. 2)\n        Input.pollKeyboard();\n        // 2. gamepad (Ch. 2)\n        Input.pollPads();\n        // 3. virtual controls (this chapter) — only when visible/active\n        if (touchUI.visible) touchUI.poll();\n    }\n}\n// Gameplay never knows who is steering:\nhero.tick(dt, Input.down(Action.Right), Input.pressed(Action.Jump));"},{"k":"ul","i":["The router runs inside the fixed-step pipeline (Chapter 4) — all sources sampled identically."]},{"k":"pit","t":"Touch UI updating from two places","h":"The joystick writing actions from an event callback AND the router polling it = double input. Pick one (poll in the router), everywhere."}],"src":"13_ch12.txt:31","n":247},{"ch":13,"kind":"content","title":"The Virtual Joystick: Design","tt":"The Virtual Joystick: Design","blocks":[{"k":"p","h":"The standard mobile movement control: a floating base that appears where the thumb lands."},{"k":"ul","i":["<b>Floating origin<\/b>: the joystick is created at the first touch, not fixed — thumbs drift, players forgive.","<b>Dead zone<\/b>: inner 20% reads as zero (Chapter 2's gamepad lesson, applied to touch).","<b>Max radius<\/b>: 60-80 px; farther is ignored (clamped direction, normalized magnitude).","<b>Two zones<\/b>: left third = movement stick; right two-thirds = camera/actions."]},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">touchstart (x &lt; 33% screen)  →  stick spawns at touch point<\/span>","<span class=\"cl\">                              →  drag vector = clamp(touch - origin, R)<\/span>","<span class=\"cl\">                              →  action.Move = vector / R   (-1..1, deadzone applied)<\/span>","<span class=\"cl\">touchend                     →  stick fades, Move = 0<\/span>"],"raw":"touchstart (x < 33% screen)  →  stick spawns at touch point\n                              →  drag vector = clamp(touch - origin, R)\n                              →  action.Move = vector / R   (-1..1, deadzone applied)\ntouchend                     →  stick fades, Move = 0"}],"src":"13_ch12.txt:44","n":248},{"ch":13,"kind":"content","title":"The Virtual Joystick: Implementation","tt":"The Virtual Joystick: Implementation","blocks":[{"k":"p","h":"Built from Chapter 3 pieces: two bitmaps, one Interactive, <code>s2d.startDrag<\/code>."},{"k":"code","lang":"haxe","file":"VStick.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">VStick<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> base : h2d.<span class=\"c-t\">Bitmap<\/span>; <span class=\"c-k\">final<\/span> knob : h2d.<span class=\"c-t\">Bitmap<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> hit : h2d.<span class=\"c-t\">Interactive<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> dx = <span class=\"c-n\">0.0<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> dy = <span class=\"c-n\">0.0<\/span>;      <span class=\"c-c\">// -1..1 outputs<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">R<\/span> = <span class=\"c-n\">70.0<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(parent:h2d.<span class=\"c-t\">Object<\/span>) {<\/span>","<span class=\"cl\">        base = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(atlas.get(<span class=\"c-s\">\"stick_base\"<\/span>), parent);<\/span>","<span class=\"cl\">        knob = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(atlas.get(<span class=\"c-s\">\"stick_knob\"<\/span>), parent);<\/span>","<span class=\"cl\">        base.visible = knob.visible = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">        base.tile.setCenter(); knob.tile.setCenter();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        hit = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Interactive<\/span>(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">0<\/span>, parent);   <span class=\"c-c\">// fullscreen-left zone, see note<\/span><\/span>","<span class=\"cl\">        hit.onClick = e -&gt; begin(e.relX, e.relY);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> begin(x:<span class=\"c-t\">Float<\/span>, y:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        base.visible = knob.visible = <span class=\"c-k\">true<\/span>;<\/span>","<span class=\"cl\">        base.x = knob.x = x; base.y = knob.y = y;<\/span>","<span class=\"cl\">        s2d.startDrag(onDrag);                      <span class=\"c-c\">// all moves until release<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> onDrag(e:hxd.<span class=\"c-t\">Event<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (e.kind == <span class=\"c-t\">ERelease<\/span>) { dx = dy = <span class=\"c-n\">0<\/span>; hide(); s2d.stopDrag(); <span class=\"c-k\">return<\/span>; }<\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> vx = e.relX - base.x, vy = e.relY - base.y;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> len = <span class=\"c-t\">Math<\/span>.sqrt(vx * vx + vy * vy);<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (len &gt; <span class=\"c-t\">R<\/span>) { vx = vx / len * <span class=\"c-t\">R<\/span>; vy = vy / len * <span class=\"c-t\">R<\/span>; }<\/span>","<span class=\"cl\">        knob.x = base.x + vx; knob.y = base.y + vy;<\/span>","<span class=\"cl\">        dx = applyDeadzone((vx / <span class=\"c-t\">R<\/span>), <span class=\"c-n\">0.2<\/span>); dy = applyDeadzone((vy / <span class=\"c-t\">R<\/span>), <span class=\"c-n\">0.2<\/span>);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> poll() <span class=\"c-k\">return<\/span> { x : dx, y : dy };<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> applyDeadzone(v:<span class=\"c-t\">Float<\/span>, dz:<span class=\"c-t\">Float<\/span>)<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-t\">Math<\/span>.abs(v) &lt; dz ? <span class=\"c-n\">0<\/span> : (v - <span class=\"c-t\">Math<\/span>.sign(v) * dz) / (<span class=\"c-n\">1<\/span> - dz);<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> hide() base.visible = knob.visible = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class VStick {\n    final base : h2d.Bitmap; final knob : h2d.Bitmap;\n    final hit : h2d.Interactive;\n    public var dx = 0.0; public var dy = 0.0;      // -1..1 outputs\n    static final R = 70.0;\n\n    public function new(parent:h2d.Object) {\n        base = new h2d.Bitmap(atlas.get(\"stick_base\"), parent);\n        knob = new h2d.Bitmap(atlas.get(\"stick_knob\"), parent);\n        base.visible = knob.visible = false;\n        base.tile.setCenter(); knob.tile.setCenter();\n\n        hit = new h2d.Interactive(0, 0, parent);   // fullscreen-left zone, see note\n        hit.onClick = e -> begin(e.relX, e.relY);\n    }\n    function begin(x:Float, y:Float) {\n        base.visible = knob.visible = true;\n        base.x = knob.x = x; base.y = knob.y = y;\n        s2d.startDrag(onDrag);                      // all moves until release\n    }\n    function onDrag(e:hxd.Event) {\n        if (e.kind == ERelease) { dx = dy = 0; hide(); s2d.stopDrag(); return; }\n        var vx = e.relX - base.x, vy = e.relY - base.y;\n        final len = Math.sqrt(vx * vx + vy * vy);\n        if (len > R) { vx = vx / len * R; vy = vy / len * R; }\n        knob.x = base.x + vx; knob.y = base.y + vy;\n        dx = applyDeadzone((vx / R), 0.2); dy = applyDeadzone((vy / R), 0.2);\n    }\n    public inline function poll() return { x : dx, y : dy };\n    function applyDeadzone(v:Float, dz:Float)\n        return Math.abs(v) < dz ? 0 : (v - Math.sign(v) * dz) / (1 - dz);\n    function hide() base.visible = knob.visible = false;\n}"},{"k":"note","h":"The Interactive should cover the left screen zone: width = <code>s2d.width * 0.33<\/code>, height = <code>s2d.height<\/code>, positioned at (0,0), above gameplay but below menus (Chapter 4's layer table)."}],"src":"13_ch12.txt:83","n":249},{"ch":13,"kind":"content","title":"Touch Buttons","tt":"Touch Buttons","blocks":[{"k":"p","h":"Jump, pause, interact — action buttons mirror Chapter 7's Button, with touch-sized hit areas."},{"k":"code","lang":"haxe","file":"VButton.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">VButton<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> bmp : h2d.<span class=\"c-t\">Bitmap<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> hit : h2d.<span class=\"c-t\">Interactive<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> held = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> pressed = <span class=\"c-k\">false<\/span>;       <span class=\"c-c\">// frame-local, like hxd.Key.isPressed<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(tile:h2d.<span class=\"c-t\">Tile<\/span>, x:<span class=\"c-t\">Float<\/span>, y:<span class=\"c-t\">Float<\/span>, parent:h2d.<span class=\"c-t\">Object<\/span>) {<\/span>","<span class=\"cl\">        bmp = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(tile, parent);<\/span>","<span class=\"cl\">        bmp.tile.setCenter(); bmp.x = x; bmp.y = y;<\/span>","<span class=\"cl\">        hit = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Interactive<\/span>(<span class=\"c-n\">96<\/span>, <span class=\"c-n\">96<\/span>, parent);   <span class=\"c-c\">// 96px generous target<\/span><\/span>","<span class=\"cl\">        hit.x = x - <span class=\"c-n\">48<\/span>; hit.y = y - <span class=\"c-n\">48<\/span>;<\/span>","<span class=\"cl\">        hit.onPush  = e -&gt; { held = <span class=\"c-k\">true<\/span>; pressed = <span class=\"c-k\">true<\/span>; bmp.scale = <span class=\"c-n\">1.15<\/span>; };<\/span>","<span class=\"cl\">        hit.onRelease = e -&gt; { held = <span class=\"c-k\">false<\/span>; bmp.scale = <span class=\"c-n\">1<\/span>; };<\/span>","<span class=\"cl\">        hit.onOut   = e -&gt; held = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class VButton {\n    final bmp : h2d.Bitmap;\n    final hit : h2d.Interactive;\n    public var held = false;\n    public var pressed = false;       // frame-local, like hxd.Key.isPressed\n\n    public function new(tile:h2d.Tile, x:Float, y:Float, parent:h2d.Object) {\n        bmp = new h2d.Bitmap(tile, parent);\n        bmp.tile.setCenter(); bmp.x = x; bmp.y = y;\n        hit = new h2d.Interactive(96, 96, parent);   // 96px generous target\n        hit.x = x - 48; hit.y = y - 48;\n        hit.onPush  = e -> { held = true; pressed = true; bmp.scale = 1.15; };\n        hit.onRelease = e -> { held = false; bmp.scale = 1; };\n        hit.onOut   = e -> held = false;\n    }\n}"},{"k":"best","t":"44 px is the floor, 64+ px is polite","h":"Apple's human-interface floor is 44 pt; game thumbs in motion want more. Touch targets are always bigger than their art — art 56 px, hit 96 px."}],"src":"13_ch12.txt:105","n":250},{"ch":13,"kind":"content","title":"Tilt Controls: The Accelerometer","tt":"Tilt Controls: The Accelerometer","blocks":[{"k":"p","h":"Tilt = the device's gravity vector — one axis becomes a steering input."},{"k":"ul","i":["Heaps exposes accelerometer data through platform-specific paths (HashLink mobile backends expose sensors; web via the JS <code>DeviceMotion<\/code> API through interop) — wrap it once, in the input module.","Tilt rules: <b>calibrate at \"hold comfortably\"<\/b> (store the neutral angle on first use), deadzone the neutral band, and always offer the stick as an alternative (accessibility)."]},{"k":"code","lang":"haxe","file":"Tilt.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Tilt<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> neutral = <span class=\"c-n\">0.0<\/span>;          <span class=\"c-c\">// captured rest angle<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> sample() : <span class=\"c-t\">Float<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> angle = readDeviceAngle();      <span class=\"c-c\">// platform-wrapped, radians<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> v = (angle - neutral) / <span class=\"c-n\">0.5<\/span>;      <span class=\"c-c\">// ±0.5 rad = full lock<\/span><\/span>","<span class=\"cl\">        v = <span class=\"c-t\">Math<\/span>.max(-<span class=\"c-n\">1<\/span>, <span class=\"c-t\">Math<\/span>.min(<span class=\"c-n\">1<\/span>, v));<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-t\">Math<\/span>.abs(v) &lt; <span class=\"c-n\">0.15<\/span> ? <span class=\"c-n\">0<\/span> : v;    <span class=\"c-c\">// deadzone<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> calibrate() neutral = readDeviceAngle();<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Tilt {\n    public static var neutral = 0.0;          // captured rest angle\n    public static function sample() : Float {\n        final angle = readDeviceAngle();      // platform-wrapped, radians\n        var v = (angle - neutral) / 0.5;      // ±0.5 rad = full lock\n        v = Math.max(-1, Math.min(1, v));\n        return Math.abs(v) < 0.15 ? 0 : v;    // deadzone\n    }\n    public static function calibrate() neutral = readDeviceAngle();\n}"},{"k":"pit","t":"Tilt drift and buses","h":"Players tilt while riding vehicles; the neutral drifts. A recalibrate action (visible in settings) plus stick fallback saves your support inbox."}],"src":"13_ch12.txt:123","n":251},{"ch":13,"kind":"content","title":"Gesture Recognition: The Framework","tt":"Gesture Recognition: The Framework","blocks":[{"k":"p","h":"Gestures are a small state machine over the touch stream — recognize, don't half-recognize."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">idle ──touch──► tracking(1 finger) ──move──► evaluating ──┐<\/span>","<span class=\"cl\">   ▲                 │release                    threshold│<\/span>","<span class=\"cl\">   └────── tap ─────┘                                     ▼<\/span>","<span class=\"cl\">   ◄── swipe / longpress / pinch (with 2 fingers) ── decided<\/span>"],"raw":"idle ──touch──► tracking(1 finger) ──move──► evaluating ──┐\n   ▲                 │release                    threshold│\n   └────── tap ─────┘                                     ▼\n   ◄── swipe / longpress / pinch (with 2 fingers) ── decided"},{"k":"ul","i":["A gesture is decided when distance/time crosses a threshold — or cancelled when it contradicts one.","Thresholds: tap &lt; 12 px &amp; &lt; 250 ms; swipe &gt; 40 px &amp; speed &gt; 0.5 px/ms; long-press ≥ 450 ms &amp; &lt; 10 px."]}],"src":"13_ch12.txt:134","n":252},{"ch":13,"kind":"content","title":"Swipes and Taps: Implementation","tt":"Swipes and Taps: Implementation","blocks":[{"k":"p","h":"The two bread-and-butter gestures over the global event listener (Chapter 2)."},{"k":"code","lang":"haxe","file":"Gestures.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Gestures<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> downAt = { x : <span class=\"c-n\">0.0<\/span>, y : <span class=\"c-n\">0.0<\/span>, t : <span class=\"c-n\">0.0<\/span>, active : <span class=\"c-k\">false<\/span> };<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> enable(s2d:h2d.<span class=\"c-t\">Scene<\/span>) {<\/span>","<span class=\"cl\">        s2d.addEventListener(<span class=\"c-k\">function<\/span>(e:hxd.<span class=\"c-t\">Event<\/span>) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">switch<\/span> (e.kind) {<\/span>","<span class=\"cl\">                <span class=\"c-k\">case<\/span> <span class=\"c-t\">EPush<\/span> <span class=\"c-k\">if<\/span> (!overUI(e)):        <span class=\"c-c\">// Chapter 7 UI eats its own<\/span><\/span>","<span class=\"cl\">                    downAt = { x : e.relX, y : e.relY, t : haxe.<span class=\"c-t\">Timer<\/span>.stamp(), active : <span class=\"c-k\">true<\/span> };<\/span>","<span class=\"cl\">                <span class=\"c-k\">case<\/span> <span class=\"c-t\">ERelease<\/span> <span class=\"c-k\">if<\/span> (downAt.active):<\/span>","<span class=\"cl\">                    downAt.active = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">                    <span class=\"c-k\">final<\/span> dx = e.relX - downAt.x, dy = e.relY - downAt.y;<\/span>","<span class=\"cl\">                    <span class=\"c-k\">final<\/span> dt = haxe.<span class=\"c-t\">Timer<\/span>.stamp() - downAt.t;<\/span>","<span class=\"cl\">                    <span class=\"c-k\">if<\/span> (<span class=\"c-t\">Math<\/span>.abs(dx) &lt; <span class=\"c-n\">12<\/span> &amp;&amp; <span class=\"c-t\">Math<\/span>.abs(dy) &lt; <span class=\"c-n\">12<\/span> &amp;&amp; dt &lt; <span class=\"c-n\">0.25<\/span>)<\/span>","<span class=\"cl\">                        <span class=\"c-t\">Game<\/span>.me.events.tap(e.relX, e.relY);<\/span>","<span class=\"cl\">                    <span class=\"c-k\">else<\/span> <span class=\"c-k\">if<\/span> (dt &lt; <span class=\"c-n\">0.4<\/span>)<\/span>","<span class=\"cl\">                        <span class=\"c-t\">Game<\/span>.me.events.swipe(direction(dx, dy));<\/span>","<span class=\"cl\">                <span class=\"c-k\">case<\/span> _:<\/span>","<span class=\"cl\">            }<\/span>","<span class=\"cl\">        });<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> direction(dx, dy) <span class=\"c-k\">return<\/span> <span class=\"c-t\">Math<\/span>.abs(dx) &gt; <span class=\"c-t\">Math<\/span>.abs(dy)<\/span>","<span class=\"cl\">        ? (dx &gt; <span class=\"c-n\">0<\/span> ? <span class=\"c-t\">Right<\/span> : <span class=\"c-t\">Left<\/span>) : (dy &gt; <span class=\"c-n\">0<\/span> ? <span class=\"c-t\">Down<\/span> : <span class=\"c-t\">Up<\/span>);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Gestures {\n    static var downAt = { x : 0.0, y : 0.0, t : 0.0, active : false };\n\n    public static function enable(s2d:h2d.Scene) {\n        s2d.addEventListener(function(e:hxd.Event) {\n            switch (e.kind) {\n                case EPush if (!overUI(e)):        // Chapter 7 UI eats its own\n                    downAt = { x : e.relX, y : e.relY, t : haxe.Timer.stamp(), active : true };\n                case ERelease if (downAt.active):\n                    downAt.active = false;\n                    final dx = e.relX - downAt.x, dy = e.relY - downAt.y;\n                    final dt = haxe.Timer.stamp() - downAt.t;\n                    if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 0.25)\n                        Game.me.events.tap(e.relX, e.relY);\n                    else if (dt < 0.4)\n                        Game.me.events.swipe(direction(dx, dy));\n                case _:\n            }\n        });\n    }\n    static function direction(dx, dy) return Math.abs(dx) > Math.abs(dy)\n        ? (dx > 0 ? Right : Left) : (dy > 0 ? Down : Up);\n}"},{"k":"best","t":"Give feedback the frame a gesture is <em>suspected<\/em>","h":"Highlight the inventory edge the instant a swipe crosses 12 px; confirm on threshold. Gestures without feedback feel like lag even when recognition is instant."}],"src":"13_ch12.txt:163","n":253},{"ch":13,"kind":"content","title":"Pinch Zoom and Two-Finger Gestures","tt":"Pinch Zoom and Two-Finger Gestures","blocks":[{"k":"p","h":"Track two <code>touchId<\/code>s and compare their distance over time."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> touches = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Map<\/span>&lt;<span class=\"c-t\">Int<\/span>, { x : <span class=\"c-t\">Float<\/span>, y : <span class=\"c-t\">Float<\/span> }&gt;();<\/span>","<span class=\"cl\"><span class=\"c-k\">var<\/span> pinchStart = <span class=\"c-n\">0.0<\/span>; <span class=\"c-k\">var<\/span> zoomStart = <span class=\"c-n\">1.0<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// in the global listener:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">case<\/span> <span class=\"c-t\">EPush<\/span>:  touches.set(e.touchId, { x : e.relX, y : e.relY });<\/span>","<span class=\"cl\">             <span class=\"c-k\">if<\/span> (touches.count() == <span class=\"c-n\">2<\/span>) {<\/span>","<span class=\"cl\">                 pinchStart = touchesDist();<\/span>","<span class=\"cl\">                 zoomStart = camera.zoom;<\/span>","<span class=\"cl\">             }<\/span>","<span class=\"cl\"><span class=\"c-k\">case<\/span> <span class=\"c-t\">EMove<\/span>:  <span class=\"c-k\">if<\/span> (touches.exists(e.touchId)) touches.set(e.touchId, { x : e.relX, y : e.relY });<\/span>","<span class=\"cl\">             <span class=\"c-k\">if<\/span> (touches.count() == <span class=\"c-n\">2<\/span> &amp;&amp; pinchStart &gt; <span class=\"c-n\">0<\/span>)<\/span>","<span class=\"cl\">                 camera.zoom = zoomStart * (touchesDist() / pinchStart);<\/span>","<span class=\"cl\"><span class=\"c-k\">case<\/span> <span class=\"c-t\">ERelease<\/span>: touches.remove(e.touchId); <span class=\"c-k\">if<\/span> (touches.count() &lt; <span class=\"c-n\">2<\/span>) pinchStart = <span class=\"c-n\">0<\/span>;<\/span>"],"raw":"final touches = new Map<Int, { x : Float, y : Float }>();\nvar pinchStart = 0.0; var zoomStart = 1.0;\n\n// in the global listener:\ncase EPush:  touches.set(e.touchId, { x : e.relX, y : e.relY });\n             if (touches.count() == 2) {\n                 pinchStart = touchesDist();\n                 zoomStart = camera.zoom;\n             }\ncase EMove:  if (touches.exists(e.touchId)) touches.set(e.touchId, { x : e.relX, y : e.relY });\n             if (touches.count() == 2 && pinchStart > 0)\n                 camera.zoom = zoomStart * (touchesDist() / pinchStart);\ncase ERelease: touches.remove(e.touchId); if (touches.count() < 2) pinchStart = 0;"},{"k":"ul","i":["Two-finger tap (both released quickly, distance barely changed) = a distinct gesture — good for rotate/objective pings."]}],"src":"13_ch12.txt:182","n":254},{"ch":13,"kind":"content","title":"Mobile Ergonomics and UI Scaling","tt":"Mobile Ergonomics and UI Scaling","blocks":[{"k":"p","h":"Input correctness is half; the other half is thumbs + screens."},{"k":"ul","i":["<b>Safe areas<\/b>: notches and rounded corners — inset HUD by 5% or the platform safe-area value.","<b>Thumb map<\/b>: movement bottom-left, actions bottom-right, pause top — a convention because hands exist.","<b>Contrast in daylight<\/b>: touch UI needs stronger outlines than desktop UI; test on a phone at noon.","<b>Left-handedness<\/b>: mirror the control layout behind a settings flag (your Skin system makes it one switch)."]},{"k":"best","t":"Playtest on the worst device you support","h":"A mid-range 2019 phone reveals: hit targets too small, frames too slow, controls under the thumb's shadow. Lab devices lie."}],"src":"13_ch12.txt:190","n":255},{"ch":13,"kind":"content","title":"Debugging Input on Device","tt":"Debugging Input on Device","blocks":[{"k":"p","h":"You cannot console.log your way through touch feel. Build the overlay once."},{"k":"code","lang":"haxe","file":"TouchDebug.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">TouchDebug<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> g = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Graphics<\/span>(s2d);<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(events:<span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">TouchRecord<\/span>&gt;) {<\/span>","<span class=\"cl\">        g.clear();<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (t in events) {                     <span class=\"c-c\">// recorded per frame by the router<\/span><\/span>","<span class=\"cl\">            g.beginFill(<span class=\"c-n\">0x3DDC97<\/span>, <span class=\"c-n\">0.3<\/span>);<\/span>","<span class=\"cl\">            g.drawCircle(t.x, t.y, <span class=\"c-n\">44<\/span>);         <span class=\"c-c\">// the ACTUAL hit target size<\/span><\/span>","<span class=\"cl\">            g.endFill();<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        <span class=\"c-c\">// joystick zone boundary, deadzones, thresholds — draw them all<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class TouchDebug {\n    final g = new h2d.Graphics(s2d);\n    public function update(events:Array<TouchRecord>) {\n        g.clear();\n        for (t in events) {                     // recorded per frame by the router\n            g.beginFill(0x3DDC97, 0.3);\n            g.drawCircle(t.x, t.y, 44);         // the ACTUAL hit target size\n            g.endFill();\n        }\n        // joystick zone boundary, deadzones, thresholds — draw them all\n    }\n}"},{"k":"ul","i":["Log gesture decisions (tap/swipe/cancel + timing) to an on-screen console — device video + overlay beats remote breakpoints every time."]}],"src":"13_ch12.txt:208","n":256},{"ch":13,"kind":"content","title":"Project: Mobile-Ready Input Layer","tt":"Project: Mobile-Ready Input Layer","blocks":[{"k":"p","h":"Chapter 12's exit: Cavern Run fully playable on a phone."},{"k":"ul","i":["Floating joystick (left zone) + jump button (right) wired into the action router.","Tap-to-start on title (audio unlock, Chapter 7), swipe on level select, pinch in the pause map.","Tilt steering behind a settings toggle with calibration screen.","All debug overlays working on-device; hit targets ≥ 96 px."]},{"k":"best","t":"A \"demo mode\" screen","h":"Auto-playing attract mode (AI presses the actions) on the title screen doubles as the cheapest input-simulation test harness you will ever build."}],"src":"13_ch12.txt:216","n":257},{"ch":13,"kind":"content","title":"Chapter 12 Checklist","tt":"Chapter 12 Checklist","blocks":[{"k":"ul","i":["Input router merges keyboard, pad and touch into actions; gameplay is device-blind.","Floating virtual joystick with deadzone and drag clamping.","Touch buttons with 96 px targets; UI never relies on hover.","Gestures: tap, swipe, long-press, pinch — thresholds constant, feedback instant.","Tilt wrapped, calibratable, optional.","Device debug overlay + worst-device playtest done."]}],"src":"13_ch12.txt:224","n":258},{"ch":14,"kind":"chapter","title":"Animation Systems &amp; Tweening","tt":"Animation Systems & Tweening","sub":"Sprite-sheet playback modes, animation events, a declarative tween engine with sequences and parallel execution, and game-feel juice.","blocks":[],"src":"14_ch13.txt:1","n":259},{"ch":14,"kind":"content","title":"The Animation Taxonomy","tt":"The Animation Taxonomy","blocks":[{"k":"p","h":"\"Animation\" means three different systems — name them and they stop fighting."},{"k":"table","head":["Kind","Driven by","Chapter"],"rows":[["Frame animation","sprite sheet + time","Ch. 3 base, this chapter deepens"],["Tweening","property interpolation + easing","this chapter"],["Procedural","physics/sine/noise per frame","Ch. 6, 8 (camera, particles)"]]},{"k":"ul","i":["A gem sparkle is frame + tween. A boss slam is procedural + tween + frame. Real motion stacks all three."]},{"k":"best","t":"Pick the cheapest kind that reads","h":"If a scale tween reads like squash-and-stretch, you just saved 12 drawn frames. Frames for personality, tweens for transitions, procedural for physics."}],"src":"14_ch13.txt:14","n":260},{"ch":14,"kind":"content","title":"Sprite Sheets and h2d.Anim Deep Dive","tt":"Sprite Sheets and h2d.Anim Deep Dive","blocks":[{"k":"p","h":"Chapter 3 showed the basics; production needs frame-time control and swapping."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// Non-uniform frames (a punch: 6 frames, each its own duration):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">Frame<\/span> = { t : h2d.<span class=\"c-t\">Tile<\/span>, dur : <span class=\"c-t\">Float<\/span> };     <span class=\"c-c\">// seconds<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> anim = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Anim<\/span>(<span class=\"c-k\">null<\/span>, <span class=\"c-n\">0<\/span>, s2d);           <span class=\"c-c\">// start empty<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> frames : <span class=\"c-t\">Array<\/span>&lt;h2d.<span class=\"c-t\">Tile<\/span>&gt; = [ ... ];<\/span>","<span class=\"cl\">anim.play(frames, <span class=\"c-n\">0<\/span>);                               <span class=\"c-c\">// frames, start index<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">anim.speed = <span class=\"c-n\">12<\/span>;              <span class=\"c-c\">// fps for uniform frames<\/span><\/span>","<span class=\"cl\">anim.pause = <span class=\"c-k\">true<\/span>;            <span class=\"c-c\">// freeze (views sync pause with world pause)<\/span><\/span>","<span class=\"cl\">anim.currentFrame = <span class=\"c-n\">3<\/span>;        <span class=\"c-c\">// seek to frame 3<\/span><\/span>"],"raw":"// Non-uniform frames (a punch: 6 frames, each its own duration):\ntypedef Frame = { t : h2d.Tile, dur : Float };     // seconds\n\nfinal anim = new h2d.Anim(null, 0, s2d);           // start empty\nfinal frames : Array<h2d.Tile> = [ ... ];\nanim.play(frames, 0);                               // frames, start index\n\nanim.speed = 12;              // fps for uniform frames\nanim.pause = true;            // freeze (views sync pause with world pause)\nanim.currentFrame = 3;        // seek to frame 3"},{"k":"ul","i":["<code>Anim<\/code> auto-advances on <b>engine time<\/b> — pause the world, and remember Chapter 4's lesson: views read <code>Time.paused<\/code> and set <code>anim.pause<\/code> themselves."]},{"k":"best","t":"One Anim node per entity, forever","h":"Creation churn (new Anim per state) fragments memory and GC. Swap frames with <code>play()<\/code>, keep the node from spawn to death."}],"src":"14_ch13.txt:31","n":261},{"ch":14,"kind":"content","title":"Playback Modes: Loop, Ping-Pong, Reversed","tt":"Playback Modes: Loop, Ping-Pong, Reversed","blocks":[{"k":"p","h":"Four modes, one formula. The manual controller gives exact control (and all four) over <code>currentFrame<\/code>."},{"k":"code","lang":"haxe","file":"PlayModes.hx","lines":["<span class=\"cl\"><span class=\"c-k\">enum<\/span> <span class=\"c-t\">PlayMode<\/span> { <span class=\"c-t\">Normal<\/span>; <span class=\"c-t\">Loop<\/span>; <span class=\"c-t\">PingPong<\/span>; <span class=\"c-t\">Reversed<\/span>; }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">FramePlayer<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> time = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> mode = <span class=\"c-t\">Loop<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> fps = <span class=\"c-n\">12.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> frames : <span class=\"c-t\">Array<\/span>&lt;h2d.<span class=\"c-t\">Tile<\/span>&gt; = [];<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> onLoop : () -&gt; <span class=\"c-t\">Void<\/span> = <span class=\"c-k\">null<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) : h2d.<span class=\"c-t\">Tile<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (frames.length == <span class=\"c-n\">0<\/span>) <span class=\"c-k\">return<\/span> <span class=\"c-k\">null<\/span>;<\/span>","<span class=\"cl\">        time += dt * (mode == <span class=\"c-t\">Reversed<\/span> ? <span class=\"c-f\">-fps<\/span> : fps);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> last = frames.length - <span class=\"c-n\">1<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">switch<\/span> mode {<\/span>","<span class=\"cl\">            <span class=\"c-k\">case<\/span> <span class=\"c-t\">Normal<\/span> | <span class=\"c-t\">Reversed<\/span>:                       <span class=\"c-c\">// clamp, fire once<\/span><\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (time &lt; <span class=\"c-n\">0<\/span>) time = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (time &gt; last) { time = last; <span class=\"c-k\">if<\/span> (onLoop != <span class=\"c-k\">null<\/span>) onLoop(); }<\/span>","<span class=\"cl\">            <span class=\"c-k\">case<\/span> <span class=\"c-t\">Loop<\/span>:<\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (time &gt; last) { time -= last; <span class=\"c-k\">if<\/span> (onLoop != <span class=\"c-k\">null<\/span>) onLoop(); }<\/span>","<span class=\"cl\">            <span class=\"c-k\">case<\/span> <span class=\"c-t\">PingPong<\/span>:<\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (time &gt; last) { time = last * <span class=\"c-n\">2<\/span> - time; <span class=\"c-k\">if<\/span> (onLoop != <span class=\"c-k\">null<\/span>) onLoop(); }<\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (time &lt; <span class=\"c-n\">0<\/span>) time = <span class=\"c-f\">-time<\/span>;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> frames[<span class=\"c-t\">Std<\/span>.int(time)];<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"enum PlayMode { Normal; Loop; PingPong; Reversed; }\n\nclass FramePlayer {\n    public var time = 0.0;\n    public var mode = Loop;\n    public var fps = 12.0;\n    public var frames : Array<h2d.Tile> = [];\n    public var onLoop : () -> Void = null;\n\n    public function update(dt:Float) : h2d.Tile {\n        if (frames.length == 0) return null;\n        time += dt * (mode == Reversed ? -fps : fps);\n        final last = frames.length - 1;\n        switch mode {\n            case Normal | Reversed:                       // clamp, fire once\n                if (time < 0) time = 0;\n                if (time > last) { time = last; if (onLoop != null) onLoop(); }\n            case Loop:\n                if (time > last) { time -= last; if (onLoop != null) onLoop(); }\n            case PingPong:\n                if (time > last) { time = last * 2 - time; if (onLoop != null) onLoop(); }\n                if (time < 0) time = -time;\n        }\n        return frames[Std.int(time)];\n    }\n}"},{"k":"ul","i":["Ping-pong math (<code>last*2 - time<\/code>) reflects time at both ends — no frame duplicated, no frame skipped.","Reversed = negative fps in this controller — the honest version of \"play backwards\"."]}],"src":"14_ch13.txt:64","n":262},{"ch":14,"kind":"content","title":"Animation Events: Footsteps, Hits, Cues","tt":"Animation Events: Footsteps, Hits, Cues","blocks":[{"k":"p","h":"The magic of data-driven frames: events attached to frame indices, fired exactly once per pass."},{"k":"code","lang":"haxe","file":"AnimEvents.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">AnimEvents<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-c\">// frame index → callbacks<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> cues = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Map<\/span>&lt;<span class=\"c-t\">Int<\/span>, <span class=\"c-t\">Array<\/span>&lt;() -&gt; <span class=\"c-t\">Void<\/span>&gt;&gt;();<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> lastIdx = -<span class=\"c-n\">1<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> on(frame:<span class=\"c-t\">Int<\/span>, fn:() -&gt; <span class=\"c-t\">Void<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (!cues.exists(frame)) cues[frame] = [];<\/span>","<span class=\"cl\">        cues[frame].push(fn);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(player:<span class=\"c-t\">FramePlayer<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> idx = <span class=\"c-t\">Std<\/span>.int(player.time);<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (idx != lastIdx) {                     <span class=\"c-c\">// fire once on ENTERING a frame<\/span><\/span>","<span class=\"cl\">            lastIdx = idx;<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (cues.exists(idx)) <span class=\"c-k\">for<\/span> (c in cues[idx]) c();<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-c\">// wiring: frame 3 = foot hits ground → dust + sfx<\/span><\/span>","<span class=\"cl\">events.on(<span class=\"c-n\">3<\/span>, () -&gt; { fx.dust(hero.x, hero.y + <span class=\"c-n\">24<\/span>); <span class=\"c-t\">Sfx<\/span>.play(<span class=\"c-t\">Res<\/span>.snd.step); });<\/span>"],"raw":"class AnimEvents {\n    // frame index → callbacks\n    final cues = new Map<Int, Array<() -> Void>>();\n    var lastIdx = -1;\n\n    public function on(frame:Int, fn:() -> Void) {\n        if (!cues.exists(frame)) cues[frame] = [];\n        cues[frame].push(fn);\n    }\n    public function update(player:FramePlayer) {\n        final idx = Std.int(player.time);\n        if (idx != lastIdx) {                     // fire once on ENTERING a frame\n            lastIdx = idx;\n            if (cues.exists(idx)) for (c in cues[idx]) c();\n        }\n    }\n}\n// wiring: frame 3 = foot hits ground → dust + sfx\nevents.on(3, () -> { fx.dust(hero.x, hero.y + 24); Sfx.play(Res.snd.step); });"},{"k":"best","t":"Author cues in the data, not the code","h":"Extend the level/anim JSON (Chapter 5 pattern): <code>{\"frames\": [...], \"cues\": [{\"frame\": 3, \"event\": \"step\"}]}<\/code>. Animators retime frames without programmer edits."}],"src":"14_ch13.txt:89","n":263},{"ch":14,"kind":"content","title":"Declarative Motion: The Tween API Design","tt":"Declarative Motion: The Tween API Design","blocks":[{"k":"p","h":"Tweens describe <em>what<\/em> should happen; an engine makes it so. The API is the whole user experience."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// The course API — reads like intent:<\/span><\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(camera, <span class=\"c-n\">0.6<\/span>, { zoom : <span class=\"c-n\">2.0<\/span> }).ease(<span class=\"c-t\">Ease<\/span>.quadOut);<\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(hero, <span class=\"c-n\">0.25<\/span>, { x : <span class=\"c-n\">500<\/span>, y : <span class=\"c-n\">300<\/span> }).delay(<span class=\"c-n\">0.4<\/span>).onComplete(fireEvent);<\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.seq([<\/span>","<span class=\"cl\">    <span class=\"c-t\">Tweener<\/span>.fadeIn(overlay, <span class=\"c-n\">0.3<\/span>),<\/span>","<span class=\"cl\">    <span class=\"c-t\">Tweener<\/span>.call(() -&gt; screens.show(<span class=\"c-k\">new<\/span> <span class=\"c-t\">TitleScreen<\/span>())),<\/span>","<span class=\"cl\">    <span class=\"c-t\">Tweener<\/span>.fadeOut(overlay, <span class=\"c-n\">0.3<\/span>),<\/span>","<span class=\"cl\">]);<\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.after(<span class=\"c-n\">2.0<\/span>, () -&gt; spawnWave(<span class=\"c-n\">3<\/span>));       <span class=\"c-c\">// timer sugar<\/span><\/span>"],"raw":"// The course API — reads like intent:\nTweener.to(camera, 0.6, { zoom : 2.0 }).ease(Ease.quadOut);\nTweener.to(hero, 0.25, { x : 500, y : 300 }).delay(0.4).onComplete(fireEvent);\nTweener.seq([\n    Tweener.fadeIn(overlay, 0.3),\n    Tweener.call(() -> screens.show(new TitleScreen())),\n    Tweener.fadeOut(overlay, 0.3),\n]);\nTweener.after(2.0, () -> spawnWave(3));       // timer sugar"},{"k":"ul","i":["Declarative: no per-frame code, no manual bookkeeping, cancellable handles.","<code>Tweener.to<\/code> returns a <code>Tween<\/code> handle: <code>.cancel()<\/code>, <code>.pause()<\/code>, <code>.chain(...)<\/code>."]}],"src":"14_ch13.txt:105","n":264},{"ch":14,"kind":"content","title":"The Tween Engine Core","tt":"The Tween Engine Core","blocks":[{"k":"p","h":"Reflect-based property tweening — 70 lines, zero dependencies, runs anything."},{"k":"code","lang":"haxe","file":"Tween.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Tween<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> target : <span class=\"c-t\">Dynamic<\/span>;                <span class=\"c-c\">// any object<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> props : <span class=\"c-t\">Dynamic<\/span>;                 <span class=\"c-c\">// { x : 100, alpha : 0 }<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> dur : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> ease : <span class=\"c-t\">EaseFn<\/span> = <span class=\"c-t\">Ease<\/span>.quadOut;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> delay = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> onComplete : () -&gt; <span class=\"c-t\">Void<\/span> = <span class=\"c-k\">null<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> canceled = <span class=\"c-k\">false<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> done = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> <span class=\"c-k\">from<\/span> : <span class=\"c-t\">Dynamic<\/span> = {};<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> t = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> start() {<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (f in <span class=\"c-t\">Reflect<\/span>.fields(props))<\/span>","<span class=\"cl\">            <span class=\"c-t\">Reflect<\/span>.setField(<span class=\"c-k\">from<\/span>, f, <span class=\"c-t\">Reflect<\/span>.field(target, f));<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Bool<\/span> {   <span class=\"c-c\">// false = finished<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (canceled || done) <span class=\"c-k\">return<\/span> <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (delay &gt; <span class=\"c-n\">0<\/span>) { delay -= dt; <span class=\"c-k\">return<\/span> <span class=\"c-k\">true<\/span>; }<\/span>","<span class=\"cl\">        t += dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> k = <span class=\"c-t\">Math<\/span>.min(<span class=\"c-n\">1<\/span>, t / dur);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> e = ease(k);<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (f in <span class=\"c-t\">Reflect<\/span>.fields(props))<\/span>","<span class=\"cl\">            <span class=\"c-t\">Reflect<\/span>.setField(target, f,<\/span>","<span class=\"cl\">                <span class=\"c-t\">L<\/span>.lerp(<span class=\"c-t\">Reflect<\/span>.field(<span class=\"c-k\">from<\/span>, f), <span class=\"c-t\">Reflect<\/span>.field(props, f), e));<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (k &gt;= <span class=\"c-n\">1<\/span>) { done = <span class=\"c-k\">true<\/span>; <span class=\"c-k\">if<\/span> (onComplete != <span class=\"c-k\">null<\/span>) onComplete(); <span class=\"c-k\">return<\/span> <span class=\"c-k\">false<\/span>; }<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-k\">true<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Tween {\n    public var target : Dynamic;                // any object\n    public var props : Dynamic;                 // { x : 100, alpha : 0 }\n    public var dur : Float;\n    public var ease : EaseFn = Ease.quadOut;\n    public var delay = 0.0;\n    public var onComplete : () -> Void = null;\n    public var canceled = false; public var done = false;\n    var from : Dynamic = {};\n    var t = 0.0;\n\n    public function start() {\n        for (f in Reflect.fields(props))\n            Reflect.setField(from, f, Reflect.field(target, f));\n    }\n    public function update(dt:Float) : Bool {   // false = finished\n        if (canceled || done) return false;\n        if (delay > 0) { delay -= dt; return true; }\n        t += dt;\n        final k = Math.min(1, t / dur);\n        final e = ease(k);\n        for (f in Reflect.fields(props))\n            Reflect.setField(target, f,\n                L.lerp(Reflect.field(from, f), Reflect.field(props, f), e));\n        if (k >= 1) { done = true; if (onComplete != null) onComplete(); return false; }\n        return true;\n    }\n}"},{"k":"note","h":"Reflection (<code>Reflect<\/code>) is the pragmatic cost: it tweens ANY object's numeric fields without interfaces. For hot paths (hundreds of tweens), a typed variant on <code>x/y<\/code> only is the optimization — rarely needed."}],"src":"14_ch13.txt:139","n":265},{"ch":14,"kind":"content","title":"The Manager: Pools, Time Domain, Lifecycle","tt":"The Manager: Pools, Time Domain, Lifecycle","blocks":[{"k":"code","lang":"haxe","file":"Tweener.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Tweener<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> live : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Tween<\/span>&gt; = [];<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> timeScale = <span class=\"c-n\">1.0<\/span>;         <span class=\"c-c\">// UI tweens: 1, world tweens: Time.scale<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">to<\/span>(target, dur, props) : <span class=\"c-t\">Tween<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> t = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Tween<\/span>();<\/span>","<span class=\"cl\">        t.target = target; t.dur = dur; t.props = props;<\/span>","<span class=\"cl\">        t.start();<\/span>","<span class=\"cl\">        live.push(t);<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> t;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (t in live) t.update(dt * timeScale);<\/span>","<span class=\"cl\">        live = live.filter(t -&gt; !t.done &amp;&amp; !t.canceled);   <span class=\"c-c\">// sweep finished<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> cancelAll() { <span class=\"c-k\">for<\/span> (t in live) t.canceled = <span class=\"c-k\">true<\/span>; live = []; }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> count() <span class=\"c-k\">return<\/span> live.length;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Tweener {\n    static var live : Array<Tween> = [];\n    public static var timeScale = 1.0;         // UI tweens: 1, world tweens: Time.scale\n\n    public static function to(target, dur, props) : Tween {\n        final t = new Tween();\n        t.target = target; t.dur = dur; t.props = props;\n        t.start();\n        live.push(t);\n        return t;\n    }\n    public static function update(dt:Float) {\n        for (t in live) t.update(dt * timeScale);\n        live = live.filter(t -> !t.done && !t.canceled);   // sweep finished\n    }\n    public static function cancelAll() { for (t in live) t.canceled = true; live = []; }\n    public static function count() return live.length;\n}"},{"k":"pit","t":"Leaked tweens after screen changes","h":"Leaving the settings screen mid-tween leaves tweens writing to removed objects — harmless until it is not. Every screen's <code>exit()<\/code> calls <code>Tweener.cancelAll()<\/code> scoped to its widgets (give Tweener a small owner-tag to filter by)."}],"src":"14_ch13.txt:162","n":266},{"ch":14,"kind":"content","title":"Sequences: Chaining and Timelines","tt":"Sequences: Chaining and Timelines","blocks":[{"k":"p","h":"Sequencing = tweens with <code>delay<\/code>s, or an explicit timeline object. Both patterns, one choice."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// PATTERN A — delay arithmetic (fine for &lt; 6 steps):<\/span><\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(panel, <span class=\"c-n\">0.3<\/span>, { y : <span class=\"c-n\">100<\/span> });<\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(panel2, <span class=\"c-n\">0.3<\/span>, { y : <span class=\"c-n\">160<\/span> }).delay(<span class=\"c-n\">0.08<\/span>);   <span class=\"c-c\">// stagger!<\/span><\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(panel3, <span class=\"c-n\">0.3<\/span>, { y : <span class=\"c-n\">220<\/span> }).delay(<span class=\"c-n\">0.16<\/span>);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// PATTERN B — Timeline (serial, explicit, re-orderable):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Timeline<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> items : <span class=\"c-t\">Array<\/span>&lt;{ at : <span class=\"c-t\">Float<\/span>, fn : () -&gt; <span class=\"c-t\">Void<\/span> }&gt; = [];<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> t = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> at(sec:<span class=\"c-t\">Float<\/span>, fn:() -&gt; <span class=\"c-t\">Void<\/span>) { items.push({ at : sec, fn : fn }); <span class=\"c-k\">return<\/span> <span class=\"c-k\">this<\/span>; }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Bool<\/span> {<\/span>","<span class=\"cl\">        t += dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">while<\/span> (items.length &gt; <span class=\"c-n\">0<\/span> &amp;&amp; items[<span class=\"c-n\">0<\/span>].at &lt;= t) items.shift().fn();<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> items.length &gt; <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"// PATTERN A — delay arithmetic (fine for < 6 steps):\nTweener.to(panel, 0.3, { y : 100 });\nTweener.to(panel2, 0.3, { y : 160 }).delay(0.08);   // stagger!\nTweener.to(panel3, 0.3, { y : 220 }).delay(0.16);\n\n// PATTERN B — Timeline (serial, explicit, re-orderable):\nclass Timeline {\n    var items : Array<{ at : Float, fn : () -> Void }> = [];\n    var t = 0.0;\n    public function at(sec:Float, fn:() -> Void) { items.push({ at : sec, fn : fn }); return this; }\n    public function update(dt:Float) : Bool {\n        t += dt;\n        while (items.length > 0 && items[0].at <= t) items.shift().fn();\n        return items.length > 0;\n    }\n}"},{"k":"best","t":"Stagger everything","h":"Lists animating together feel robotic; each item 60-80 ms later feels designed. <code>.delay(i * 0.07)<\/code> is the single cheapest juice in this chapter."}],"src":"14_ch13.txt:184","n":267},{"ch":14,"kind":"content","title":"Parallel Execution and Grouping","tt":"Parallel Execution and Grouping","blocks":[{"k":"p","h":"Run tweens together, sync their easing, or repeat them."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// PARALLEL — just spawn them; they run concurrently by default:<\/span><\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(banner, <span class=\"c-n\">0.4<\/span>, { y : <span class=\"c-n\">40<\/span> }).ease(<span class=\"c-t\">Ease<\/span>.backOut);<\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(banner, <span class=\"c-n\">0.4<\/span>, { alpha : <span class=\"c-n\">1<\/span> }).ease(<span class=\"c-t\">Ease<\/span>.quadOut);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// YOYO / REPEAT — the two handle extensions worth writing:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> yoyo(times = -<span class=\"c-n\">1<\/span>) {               <span class=\"c-c\">// there and back, forever if -1<\/span><\/span>","<span class=\"cl\">    onComplete = () -&gt; {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (times != <span class=\"c-n\">0<\/span>) {<\/span>","<span class=\"cl\">            times--;<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> tmp = <span class=\"c-k\">from<\/span>; <span class=\"c-k\">from<\/span> = props; props = tmp;<\/span>","<span class=\"cl\">            t = <span class=\"c-n\">0<\/span>; done = <span class=\"c-k\">false<\/span>; start();<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    };<\/span>","<span class=\"cl\">    <span class=\"c-k\">return<\/span> <span class=\"c-k\">this<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"// PARALLEL — just spawn them; they run concurrently by default:\nTweener.to(banner, 0.4, { y : 40 }).ease(Ease.backOut);\nTweener.to(banner, 0.4, { alpha : 1 }).ease(Ease.quadOut);\n\n// YOYO / REPEAT — the two handle extensions worth writing:\npublic function yoyo(times = -1) {               // there and back, forever if -1\n    onComplete = () -> {\n        if (times != 0) {\n            times--;\n            final tmp = from; from = props; props = tmp;\n            t = 0; done = false; start();\n        }\n    };\n    return this;\n}"},{"k":"ul","i":["Yoyo swaps from/to and restarts — a breathing idle, a pulsing \"press start\".","Repeat chains: <code>onComplete<\/code> re-spawning the tween is deliberately dumb — debuggable beats clever."]}],"src":"14_ch13.txt:206","n":268},{"ch":14,"kind":"content","title":"Tweening Anything: Colors, Volumes, Shaders","tt":"Tweening Anything: Colors, Volumes, Shaders","blocks":[{"k":"p","h":"<code>Reflect<\/code> tweens any numeric field — which includes vectors, volumes and shader uniforms."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// audio duck (Ch. 2's manual fade becomes one line):<\/span><\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(musicChannel, <span class=\"c-n\">0.8<\/span>, { volume : <span class=\"c-n\">0.15<\/span> });<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// shader uniform — tween the strength (Ch. 11's design pays off):<\/span><\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(vignetteShader, <span class=\"c-n\">1.2<\/span>, { strength : <span class=\"c-n\">0.7<\/span> }).ease(<span class=\"c-t\">Ease<\/span>.quadIn);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// tint: tween a Vector component-wise via a tiny proxy object<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> tint = { r : <span class=\"c-n\">1.0<\/span> };<\/span>","<span class=\"cl\"><span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(tint, <span class=\"c-n\">0.25<\/span>, { r : <span class=\"c-n\">2.0<\/span> }).onUpdate = () -&gt; heroView.bmp.color.load(<\/span>","<span class=\"cl\">    <span class=\"c-t\">Math<\/span>.round(tint.r * <span class=\"c-n\">255<\/span>), <span class=\"c-n\">0<\/span>, <span class=\"c-n\">0<\/span>);<\/span>"],"raw":"// audio duck (Ch. 2's manual fade becomes one line):\nTweener.to(musicChannel, 0.8, { volume : 0.15 });\n\n// shader uniform — tween the strength (Ch. 11's design pays off):\nTweener.to(vignetteShader, 1.2, { strength : 0.7 }).ease(Ease.quadIn);\n\n// tint: tween a Vector component-wise via a tiny proxy object\nfinal tint = { r : 1.0 };\nTweener.to(tint, 0.25, { r : 2.0 }).onUpdate = () -> heroView.bmp.color.load(\n    Math.round(tint.r * 255), 0, 0);"},{"k":"note","h":"Tween engines earn their keep the day you tween a <em>shader uniform<\/em> — suddenly \"damage vignette on low health\" is a declarative one-liner instead of bespoke update code."}],"src":"14_ch13.txt:222","n":269},{"ch":14,"kind":"content","title":"Squash and Stretch: The Feel Basics","tt":"Squash and Stretch: The Feel Basics","blocks":[{"k":"p","h":"The 12 principles of animation, filtered to the four that matter in code."},{"k":"ul","i":["<b>Squash &amp; stretch<\/b>: land = scale (1.4, 0.6) → (1, 1) in 120 ms; jump = the reverse. Volume-preserving: keep <code>sx*sy ≈ 1<\/code>.","<b>Anticipation<\/b>: 80 ms wind-up scale-down before the jump — players read it as \"I am about to\".","<b>Follow-through<\/b>: the gem HUD counter pops 1.3 → 1.0 with <code>backOut<\/code> — momentum in UI.","<b>Secondary motion<\/b>: hair/cape/tail = a 3-node verlet chain (a 15-line classic) lagging the body."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">function<\/span> landFx() {<\/span>","<span class=\"cl\">    heroView.scaleX = <span class=\"c-n\">1.4<\/span>; heroView.scaleY = <span class=\"c-n\">0.6<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(heroView, <span class=\"c-n\">0.14<\/span>, { scaleX : <span class=\"c-n\">1<\/span>, scaleY : <span class=\"c-n\">1<\/span> }).ease(<span class=\"c-t\">Ease<\/span>.quadOut);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"function landFx() {\n    heroView.scaleX = 1.4; heroView.scaleY = 0.6;\n    Tweener.to(heroView, 0.14, { scaleX : 1, scaleY : 1 }).ease(Ease.quadOut);\n}"},{"k":"best","t":"Squash on the VIEW, never the simulation","h":"The hitbox must stay honest (Chapter 6). Squash is presentation lying charmingly — keep the lie in the render layer where it belongs."}],"src":"14_ch13.txt:236","n":270},{"ch":14,"kind":"content","title":"UI Motion: Micro-Interactions","tt":"UI Motion: Micro-Interactions","blocks":[{"k":"p","h":"Every Chapter 7 widget gets a motion grammar — consistent, fast, subtle."},{"k":"table","head":["Interaction","Motion","Time"],"rows":[["Hover","scale 1.0 → 1.04, tint accent","80 ms quadOut"],["Press","scale 1.0 → 0.96","60 ms quadIn"],["Screen in","y +20 → 0, alpha 0 → 1","220 ms quadOut"],["Focus change","focus ring slides to widget","130 ms quadOut"],["List change","stagge
