r slide-in (Ch. 9/13)","70 ms/item"]]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// Button.press — wired in Chapter 7's Button, animated here:<\/span><\/span>","<span class=\"cl\">hit.onPush = e -&gt; <span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(root, <span class=\"c-n\">0.06<\/span>, { scaleX : .<span class=\"c-n\">96<\/span>, scaleY : .<span class=\"c-n\">96<\/span> });<\/span>","<span class=\"cl\">hit.onRelease = hit.onOut = e -&gt; <span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(root, <span class=\"c-n\">0.12<\/span>, { scaleX : <span class=\"c-n\">1<\/span>, scaleY : <span class=\"c-n\">1<\/span> });<\/span>"],"raw":"// Button.press — wired in Chapter 7's Button, animated here:\nhit.onPush = e -> Tweener.to(root, 0.06, { scaleX : .96, scaleY : .96 });\nhit.onRelease = hit.onOut = e -> Tweener.to(root, 0.12, { scaleX : 1, scaleY : 1 });"},{"k":"best","t":"UI motion ≤ 250 ms or it feels broken","h":"UI is not a cutscene. If a menu transition exceeds a quarter second, players start clicking through it — and through your carefully laid-out buttons."}],"src":"14_ch13.txt:253","n":271},{"ch":14,"kind":"content","title":"Cutscenes and Scripted Sequences","tt":"Cutscenes and Scripted Sequences","blocks":[{"k":"p","h":"Timeline + camera + dialogue = cutscenes without a cutscene engine."},{"k":"code","lang":"haxe","file":"Cutscene.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Cutscene<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> intro() {<\/span>","<span class=\"cl\">        <span class=\"c-t\">Time<\/span>.scale = <span class=\"c-n\">0<\/span>;                       <span class=\"c-c\">// freeze simulation<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> cam = <span class=\"c-t\">Game<\/span>.me.camera;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> tl = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Timeline<\/span>();<\/span>","<span class=\"cl\">        tl.at(<span class=\"c-n\">0.0<\/span>, () -&gt; <span class=\"c-t\">Sfx<\/span>.play(<span class=\"c-t\">Res<\/span>.snd.rumble))<\/span>","<span class=\"cl\">          .at(<span class=\"c-n\">0.2<\/span>, () -&gt; <span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(cam, <span class=\"c-n\">2.2<\/span>, { zoom : <span class=\"c-n\">2.0<\/span> }))<\/span>","<span class=\"cl\">          .at(<span class=\"c-n\">0.5<\/span>, () -&gt; dialogue.say(<span class=\"c-s\">\"narrator\"<\/span>, <span class=\"c-s\">\"The caves remember.\"<\/span>))<\/span>","<span class=\"cl\">          .at(<span class=\"c-n\">2.4<\/span>, () -&gt; dialogue.hide())<\/span>","<span class=\"cl\">          .at(<span class=\"c-n\">2.8<\/span>, () -&gt; { <span class=\"c-t\">Time<\/span>.scale = <span class=\"c-n\">1<\/span>; <span class=\"c-t\">Tweener<\/span>.<span class=\"c-k\">to<\/span>(cam, <span class=\"c-n\">0.6<\/span>, { zoom : <span class=\"c-n\">1.0<\/span> }); });<\/span>","<span class=\"cl\">        <span class=\"c-t\">Game<\/span>.me.timeline = tl;                <span class=\"c-c\">// updated in Game.update<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Cutscene {\n    public static function intro() {\n        Time.scale = 0;                       // freeze simulation\n        final cam = Game.me.camera;\n        final tl = new Timeline();\n        tl.at(0.0, () -> Sfx.play(Res.snd.rumble))\n          .at(0.2, () -> Tweener.to(cam, 2.2, { zoom : 2.0 }))\n          .at(0.5, () -> dialogue.say(\"narrator\", \"The caves remember.\"))\n          .at(2.4, () -> dialogue.hide())\n          .at(2.8, () -> { Time.scale = 1; Tweener.to(cam, 0.6, { zoom : 1.0 }); });\n        Game.me.timeline = tl;                // updated in Game.update\n    }\n}"},{"k":"ul","i":["Cutscene state (camera control, time scale, input gate) is a pushed screen (Chapter 7) — modality for free."]},{"k":"pit","t":"Cutscenes without a skip option","h":"Every tester asks by day two. Gate the skip to logical beats (<code>.at()<\/code> boundaries), not mid-tween, and your writers will forgive you."}],"src":"14_ch13.txt:273","n":272},{"ch":14,"kind":"content","title":"Profiling Animation Cost","tt":"Profiling Animation Cost","blocks":[{"k":"p","h":"Tweens are cheap; what they <em>drive<\/em> can be anything."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// A debug counter in the HUD (Ch. 1 pattern):<\/span><\/span>","<span class=\"cl\">trace(<span class=\"c-s\">'tweens: ${Tweener.count()}  particles: ${fx.count()}  anims: ${viewCount}'<\/span>);<\/span>"],"raw":"// A debug counter in the HUD (Ch. 1 pattern):\ntrace('tweens: ${Tweener.count()}  particles: ${fx.count()}  anims: ${viewCount}');"},{"k":"ul","i":["Budgets that hold on a mid-range laptop: 300 tweens, 2,000 particles, 400 Anims — all simultaneous, 60 FPS.","The usual criminal is not the tween loop (microseconds) but what each completion spawns — a burst tween that spawns 200 particles × 30 gems at once."]},{"k":"best","t":"Measure the spike, not the average","h":"Profile at the spike frame (F12/capture on gem-collect). Averages hide the one 90 ms frame that players feel as a hitch."}],"src":"14_ch13.txt:283","n":273},{"ch":14,"kind":"content","title":"Project: The Juice Pass","tt":"Project: The Juice Pass","blocks":[{"k":"p","h":"Chapter 13's exit: press a button, feel three systems cooperate."},{"k":"ul","i":["Land squash, jump stretch, gem counter pop (backOut), staggered level-complete list.","Camera zoom punch on explosion (Ch. 8+10+13 in one effect).","Title screen: \"press start\" breathing yoyo + staggered menu slide-ins.","One cutscene: 4-beat intro with skip."]},{"k":"best","t":"\"Juice\" is just applied animation grammar","h":"Squash (frame), stagger (tween), freeze-frame (procedural), sparkle (particles) — you have all four systems; juice is choosing where to point them."}],"src":"14_ch13.txt:291","n":274},{"ch":14,"kind":"content","title":"Chapter 13 Checklist","tt":"Chapter 13 Checklist","blocks":[{"k":"ul","i":["FramePlayer with four play modes + once-per-frame cue events, data-authored.","Tween engine: reflect-based, pooled via manager, owner-tagged cancellation on screen exit.","Sequences via delays AND a Timeline; stagger pattern in every list UI.","Squash/anticipation on views only; UI micro-interactions under 250 ms.","One cutscene with skippable beats; animation budgets measured at the spike."]}],"src":"14_ch13.txt:298","n":275},{"ch":15,"kind":"chapter","title":"3D Graphics &amp; Physics: Orbital Salvage","tt":"3D Graphics & Physics: Orbital Salvage","sub":"The h3d pipeline: scenes, lights, materials, cameras, models, instancing, raycasting — and a 3D physics layer with constraints, triggers and shadow studies.","blocks":[],"src":"15_ch14.txt:1","n":276},{"ch":15,"kind":"content","title":"From 2D to 3D: What Actually Changes","tt":"From 2D to 3D: What Actually Changes","blocks":[{"k":"p","h":"Your architecture (Chapter 4) transfers untouched; the renderer's world gets an extra axis and a lighting model."},{"k":"ul","i":["<code>s3d<\/code> replaces <code>s2d<\/code> as the rendering root — <code>h3d.scene.Object<\/code> is the 3D twin of <code>h2d.Object<\/code> (position, rotation, children).","Lights and materials become mandatory: without light, most 3D scenes render black.","The camera is a 3D object with real optics: position, target, field of view, near/far planes.","Chapter 4's separation is the entire strategy: same Game/World/Renderer shape, <code>WorldRenderer<\/code> now parents into <code>s3d<\/code>."]},{"k":"best","t":"Reuse Cavern Run's coordinator verbatim","h":"The 3D capstone plugs into the same screens, input, save and settings services. If you have to rewrite those for 3D, Chapter 4 was not followed — fix that first, it is cheaper."}],"src":"15_ch14.txt:11","n":277},{"ch":15,"kind":"content","title":"h3d Architecture: Scene, Camera, Renderer","tt":"h3d Architecture: Scene, Camera, Renderer","blocks":[{"k":"p","h":"The three pillars of every h3d frame."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">h3d.scene.Scene  ── the object tree you fill<\/span>","<span class=\"cl\">  ├── camera (h3d.Camera)        where the eye is<\/span>","<span class=\"cl\">  ├── lightSystem                lights + ambient<\/span>","<span class=\"cl\">  └── renderer                   HOW to draw (passes, shadows, post)<\/span>","<span class=\"cl\">frame: cull → sort → passes (shadow, main, extras) → post → present<\/span>"],"raw":"h3d.scene.Scene  ── the object tree you fill\n  ├── camera (h3d.Camera)        where the eye is\n  ├── lightSystem                lights + ambient\n  └── renderer                   HOW to draw (passes, shadows, post)\nframe: cull → sort → passes (shadow, main, extras) → post → present"},{"k":"ul","i":["The scene owns defaults for all three — you can run a 3D app with zero configuration, then specialize each pillar as this chapter does.","<code>s3d<\/code> exists since Chapter 1's <code>hxd.App<\/code> — 2D and 3D scenes render in the same frame (h3d first, h2d on top): HUD stays 2D even in a 3D game."]},{"k":"best","t":"3D world, 2D interface","h":"Orbital Salvage's HUD, menus and dialogs reuse Chapter 7's toolkit pixel-for-pixel. Cross-dipping (2D HUD over 3D world) is the industry-standard architecture."}],"src":"15_ch14.txt:24","n":278},{"ch":15,"kind":"content","title":"The 3D Scene Graph: h3d.scene.Object","tt":"The 3D Scene Graph: h3d.scene.Object","blocks":[{"k":"p","h":"Same tree thinking as h2d — different units and rotation rules."},{"k":"code","lang":"haxe","file":"ThreeDBasics.hx","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> group = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">Object<\/span>(s3d);        <span class=\"c-c\">// container<\/span><\/span>","<span class=\"cl\">group.setPosition(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">10<\/span>);                    <span class=\"c-c\">// (x, y, z) — y is UP in h3d<\/span><\/span>","<span class=\"cl\">group.setRotation(<span class=\"c-n\">0<\/span>, <span class=\"c-t\">Math<\/span>.<span class=\"c-t\">PI<\/span> / <span class=\"c-n\">4<\/span>, <span class=\"c-n\">0<\/span>);           <span class=\"c-c\">// yaw around y<\/span><\/span>","<span class=\"cl\">group.scale = <span class=\"c-n\">2.0<\/span>;                              <span class=\"c-c\">// uniform scale<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> child = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">Object<\/span>(group);      <span class=\"c-c\">// parented<\/span><\/span>","<span class=\"cl\">child.setPosition(<span class=\"c-n\">2<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">0<\/span>);                     <span class=\"c-c\">// 2 units right OF THE PARENT<\/span><\/span>","<span class=\"cl\">child.follow();                                 <span class=\"c-c\">// inherit? (child of group does)<\/span><\/span>"],"raw":"final group = new h3d.scene.Object(s3d);        // container\ngroup.setPosition(0, 0, 10);                    // (x, y, z) — y is UP in h3d\ngroup.setRotation(0, Math.PI / 4, 0);           // yaw around y\ngroup.scale = 2.0;                              // uniform scale\n\nfinal child = new h3d.scene.Object(group);      // parented\nchild.setPosition(2, 0, 0);                     // 2 units right OF THE PARENT\nchild.follow();                                 // inherit? (child of group does)"},{"k":"ul","i":["Coordinates: <b>y is up<\/b>, one unit = one meter by convention.","<code>setRotation(x, y, z)<\/code> is euler (radians); for gameplay math prefer quaternions (<code>h3d.Quat<\/code>) — shown later with the ship."]},{"k":"pit","t":"Mixing 2D and 3D habits","h":"h2d y grows downward, h3d y grows upward; h2d rotation is a scalar, h3d is three axes. Two silent bugs walk in the day you open <code>s3d<\/code> — write the axes on a sticky note first."}],"src":"15_ch14.txt:40","n":279},{"ch":15,"kind":"content","title":"Primitives: Cube, Sphere, Cylinder","tt":"Primitives: Cube, Sphere, Cylinder","blocks":[{"k":"p","h":"The debug-geometry starter kit — placeholders that ship into graybox levels."},{"k":"code","lang":"haxe","file":"Prims.hx","lines":["<span class=\"cl\"><span class=\"c-k\">function<\/span> cube(parent) {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> prim = <span class=\"c-k\">new<\/span> h3d.prim.<span class=\"c-t\">Cube<\/span>();<\/span>","<span class=\"cl\">    prim.addNormals();     <span class=\"c-c\">// lighting requires normals<\/span><\/span>","<span class=\"cl\">    prim.addUVs();         <span class=\"c-c\">// textures require UVs<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> m = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">Mesh<\/span>(prim, h3d.mat.<span class=\"c-t\">Material<\/span>.create(colorTex()), parent);<\/span>","<span class=\"cl\">    m.material.color.set(<span class=\"c-n\">0.9<\/span>, <span class=\"c-n\">0.4<\/span>, <span class=\"c-n\">0.3<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-k\">return<\/span> m;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">function<\/span> sphere(parent) {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> prim = <span class=\"c-k\">new<\/span> h3d.prim.<span class=\"c-t\">Sphere<\/span>(<span class=\"c-n\">1<\/span>, <span class=\"c-n\">32<\/span>, <span class=\"c-n\">24<\/span>);   <span class=\"c-c\">// radius, segs<\/span><\/span>","<span class=\"cl\">    prim.addNormals(); prim.addUVs();<\/span>","<span class=\"cl\">    <span class=\"c-k\">return<\/span> <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">Mesh<\/span>(prim, h3d.mat.<span class=\"c-t\">Material<\/span>.create(colorTex()), parent);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"function cube(parent) {\n    final prim = new h3d.prim.Cube();\n    prim.addNormals();     // lighting requires normals\n    prim.addUVs();         // textures require UVs\n    final m = new h3d.scene.Mesh(prim, h3d.mat.Material.create(colorTex()), parent);\n    m.material.color.set(0.9, 0.4, 0.3);\n    return m;\n}\nfunction sphere(parent) {\n    final prim = new h3d.prim.Sphere(1, 32, 24);   // radius, segs\n    prim.addNormals(); prim.addUVs();\n    return new h3d.scene.Mesh(prim, h3d.mat.Material.create(colorTex()), parent);\n}"},{"k":"ul","i":["<code>addNormals()<\/code>/<code>addUVs()<\/code> are opt-in per primitive — forgetting them is the #1 \"why is my cube black\" cause.","Primitives are shared GPU geometry: one Cube object, 500 Meshes — cheap grayboxing."]},{"k":"best","t":"Graybox first, art second","h":"Orbital Salvage's whole bay is playable with cubes and spheres (this slide) before a single artist asset loads (models, ahead)."}],"src":"15_ch14.txt:61","n":280},{"ch":15,"kind":"content","title":"Materials and Textures","tt":"Materials and Textures","blocks":[{"k":"p","h":"A material binds a texture plus surface rules; meshes get one material each (sub-groups get more)."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> tex = hxd.<span class=\"c-t\">Res<\/span>.img.crate.toTexture();        <span class=\"c-c\">// any image resource → texture<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> mat = h3d.mat.<span class=\"c-t\">Material<\/span>.create(tex);<\/span>","<span class=\"cl\">mat.color.set(<span class=\"c-n\">1<\/span>, <span class=\"c-n\">1<\/span>, <span class=\"c-n\">1<\/span>);                          <span class=\"c-c\">// tint multiplier (0..1 each)<\/span><\/span>","<span class=\"cl\">mat.blendMode = <span class=\"c-t\">Alpha<\/span>;                           <span class=\"c-c\">// Alpha for cutouts, None for opaque<\/span><\/span>","<span class=\"cl\">mat.depthWrite = <span class=\"c-k\">true<\/span>;                           <span class=\"c-c\">// solid geometry default<\/span><\/span>","<span class=\"cl\">mat.culling = <span class=\"c-k\">true<\/span>;                              <span class=\"c-c\">// backface culling on<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> mesh = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">Mesh<\/span>(cubePrim, mat, s3d);<\/span>","<span class=\"cl\">mesh.material.shadows = <span class=\"c-k\">true<\/span>;                    <span class=\"c-c\">// casts AND receives<\/span><\/span>"],"raw":"final tex = hxd.Res.img.crate.toTexture();        // any image resource → texture\nfinal mat = h3d.mat.Material.create(tex);\nmat.color.set(1, 1, 1);                          // tint multiplier (0..1 each)\nmat.blendMode = Alpha;                           // Alpha for cutouts, None for opaque\nmat.depthWrite = true;                           // solid geometry default\nmat.culling = true;                              // backface culling on\n\nfinal mesh = new h3d.scene.Mesh(cubePrim, mat, s3d);\nmesh.material.shadows = true;                    // casts AND receives"},{"k":"ul","i":["For transparent cutout foliage: <code>blendMode = Alpha<\/code>, <code>culling = false<\/code> (both faces).","<code>mat.color<\/code> tints — the same multiply rule as h2d bitmaps."]},{"k":"note","h":"PBR workflows (metal/rough materials) use Heaps' PBR renderer path; this chapter runs the default renderer for deterministic teaching. The architecture is identical — only the material inputs change."}],"src":"15_ch14.txt:78","n":281},{"ch":15,"kind":"content","title":"Lights: Directional, Point, Spot","tt":"Lights: Directional, Point, Spot","blocks":[{"k":"p","h":"Three light types, three roles. Everything is relative to the sun."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// SUN — parallel rays, no position, one per scene<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> sun = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">DirLight<\/span>(s3d);<\/span>","<span class=\"cl\">sun.color.set(<span class=\"c-n\">1<\/span>, <span class=\"c-n\">0.96<\/span>, <span class=\"c-n\">0.9<\/span>);          <span class=\"c-c\">// warm<\/span><\/span>","<span class=\"cl\">sun.enableSpecular = <span class=\"c-k\">true<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// LAMP — point radiance with falloff<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> lamp = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">PointLight<\/span>(s3d);<\/span>","<span class=\"cl\">lamp.setPosition(<span class=\"c-n\">2<\/span>, <span class=\"c-n\">3<\/span>, -<span class=\"c-n\">1<\/span>);<\/span>","<span class=\"cl\">lamp.color.set(<span class=\"c-n\">0.4<\/span>, <span class=\"c-n\">0.7<\/span>, <span class=\"c-n\">1<\/span>);          <span class=\"c-c\">// cold cargo-bay lamp<\/span><\/span>","<span class=\"cl\">lamp.params.set(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">0.5<\/span>, <span class=\"c-n\">0.02<\/span>);        <span class=\"c-c\">// range/decay (renderer-dependent)<\/span><\/span>"],"raw":"// SUN — parallel rays, no position, one per scene\nfinal sun = new h3d.scene.DirLight(s3d);\nsun.color.set(1, 0.96, 0.9);          // warm\nsun.enableSpecular = true;\n\n// LAMP — point radiance with falloff\nfinal lamp = new h3d.scene.PointLight(s3d);\nlamp.setPosition(2, 3, -1);\nlamp.color.set(0.4, 0.7, 1);          // cold cargo-bay lamp\nlamp.params.set(0, 0.5, 0.02);        // range/decay (renderer-dependent)"},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// SPOT — cone for the salvage beam (below)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> spot = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">SpotLight<\/span>(s3d);<\/span>","<span class=\"cl\">spot.setPosition(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">6<\/span>, <span class=\"c-n\">0<\/span>);<\/span>","<span class=\"cl\">spot.setDirection(<span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Vector<\/span>(<span class=\"c-n\">0<\/span>, -<span class=\"c-n\">1<\/span>, <span class=\"c-n\">0.2<\/span>));<\/span>","<span class=\"cl\">spot.range = <span class=\"c-n\">14<\/span>;<\/span>","<span class=\"cl\">spot.angle = <span class=\"c-n\">0.6<\/span>;<\/span>"],"raw":"// SPOT — cone for the salvage beam (below)\nfinal spot = new h3d.scene.SpotLight(s3d);\nspot.setPosition(0, 6, 0);\nspot.setDirection(new h3d.Vector(0, -1, 0.2));\nspot.range = 14;\nspot.angle = 0.6;"},{"k":"note","h":"Light constructors and <code>params<\/code> shapes shift between Heaps versions more than the rest of the API — the <b>pattern<\/b> (create, parent to s3d, set color/position) is stable; check <code>h3d/scene/*Light.hx<\/code> for your pinned version."}],"src":"15_ch14.txt:102","n":282},{"ch":15,"kind":"content","title":"Ambient Light and the Light System","tt":"Ambient Light and the Light System","blocks":[{"k":"p","h":"Pure black shadows read as bugs; ambient is the anti-black."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// Global ambient — the \"there is air in this room\" light:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> ls = s3d.lightSystem;<\/span>","<span class=\"cl\">ls.ambientLight.set(<span class=\"c-n\">0.35<\/span>, <span class=\"c-n\">0.38<\/span>, <span class=\"c-n\">0.45<\/span>);   <span class=\"c-c\">// slightly blue = space station night<\/span><\/span>"],"raw":"// Global ambient — the \"there is air in this room\" light:\nfinal ls = s3d.lightSystem;\nls.ambientLight.set(0.35, 0.38, 0.45);   // slightly blue = space station night"},{"k":"ul","i":["Ambient is cheap: one term in the lighting equation — no rays, no shadows.","Art-direct ambient per scene mood: warm 0.4 for interiors, cool 0.25 for space, near-0 for horror."]},{"k":"best","t":"Ambient sets the floor, not the mood","h":"Mood comes from the key light's color and direction; ambient just decides how dark \"shadow\" is. Raise it until shadows are readable, then stop."}],"src":"15_ch14.txt:113","n":283},{"ch":15,"kind":"content","title":"Shadows: Shadow Mapping","tt":"Shadows: Shadow Mapping","blocks":[{"k":"p","h":"Heaps' default renderer supports shadow maps — the depth-render trick."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// enable on the renderer (DirectionalLight shadow system):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> sun = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">DirLight<\/span>(s3d);<\/span>","<span class=\"cl\">s3d.renderer.shadows = <span class=\"c-k\">new<\/span> h3d.pass.<span class=\"c-t\">DefaultShadowMap<\/span>(<span class=\"c-n\">1024<\/span>);   <span class=\"c-c\">// resolution<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// per-object participation:<\/span><\/span>","<span class=\"cl\">mesh.material.shadows = <span class=\"c-k\">true<\/span>;      <span class=\"c-c\">// cast + receive (default true)<\/span><\/span>","<span class=\"cl\">mesh.visible = <span class=\"c-k\">true<\/span>;<\/span>"],"raw":"// enable on the renderer (DirectionalLight shadow system):\nfinal sun = new h3d.scene.DirLight(s3d);\ns3d.renderer.shadows = new h3d.pass.DefaultShadowMap(1024);   // resolution\n\n// per-object participation:\nmesh.material.shadows = true;      // cast + receive (default true)\nmesh.visible = true;"},{"k":"ul","i":["Bigger map (2048/4096) = crisper edges, more GPU memory; mobile often uses 1024.","Everything is a trade: shadows re-render the scene from the light's view — heavy scenes pay twice per frame."]},{"k":"pit","t":"Shadow acne and peter-panning","h":"Sawtooth stripes = \"acne\" (bias too low); objects floating off their shadows = bias too high. Tune the shadow map's bias/normalBias once per scene, not per object."}],"src":"15_ch14.txt:128","n":284},{"ch":15,"kind":"content","title":"The Camera: Perspective","tt":"The Camera: Perspective","blocks":[{"k":"p","h":"<code>h3d.Camera<\/code> defaults exist; gameplay wants explicit control."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> cam = s3d.camera;<\/span>","<span class=\"cl\">cam.pos.set(<span class=\"c-n\">5<\/span>, <span class=\"c-n\">4<\/span>, <span class=\"c-n\">8<\/span>);              <span class=\"c-c\">// where the eye is (y up!)<\/span><\/span>","<span class=\"cl\">cam.target.set(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">1<\/span>, <span class=\"c-n\">0<\/span>);           <span class=\"c-c\">// what it looks at<\/span><\/span>","<span class=\"cl\">cam.fovY = <span class=\"c-n\">55<\/span>;                     <span class=\"c-c\">// vertical field of view, degrees<\/span><\/span>","<span class=\"cl\">cam.zNear = <span class=\"c-n\">0.1<\/span>;                   <span class=\"c-c\">// near plane (meters)<\/span><\/span>","<span class=\"cl\">cam.zFar = <span class=\"c-n\">200<\/span>;                    <span class=\"c-c\">// far plane (meters)<\/span><\/span>","<span class=\"cl\">cam.update();                      <span class=\"c-c\">// apply after manual changes<\/span><\/span>"],"raw":"final cam = s3d.camera;\ncam.pos.set(5, 4, 8);              // where the eye is (y up!)\ncam.target.set(0, 1, 0);           // what it looks at\ncam.fovY = 55;                     // vertical field of view, degrees\ncam.zNear = 0.1;                   // near plane (meters)\ncam.zFar = 200;                    // far plane (meters)\ncam.update();                      // apply after manual changes"},{"k":"ul","i":["FOV is feel: 45 = calm/strategic, 60+ = action/energetic, 90 = platformer-ish spatial awareness.","zNear/zFar are not free: a 0.01/1000 range wastes depth precision → z-fighting on distant surfaces. Keep the ratio under ~2000."]},{"k":"best","t":"Orbit-cam debug defaults","h":"Before gameplay cameras exist, give every 3D scene the next slide's CameraController. You will pan around every bug for the rest of the project."}],"src":"15_ch14.txt:143","n":285},{"ch":15,"kind":"content","title":"CameraController: The Debug Orbit Cam","tt":"CameraController: The Debug Orbit Cam","blocks":[{"k":"p","h":"The single best debugging tool in h3d — free orbit/pan/zoom."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">DebugCam<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> cc : h3d.scene.<span class=\"c-t\">CameraController<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(s3d:h3d.scene.<span class=\"c-t\">Scene<\/span>) {<\/span>","<span class=\"cl\">        cc = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">CameraController<\/span>(s3d);<\/span>","<span class=\"cl\">        s3d.camera.pos.set(<span class=\"c-n\">6<\/span>, <span class=\"c-n\">5<\/span>, <span class=\"c-n\">9<\/span>);<\/span>","<span class=\"cl\">        s3d.camera.target.set(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">1<\/span>, <span class=\"c-n\">0<\/span>);<\/span>","<span class=\"cl\">        cc.loadFromCamera();       <span class=\"c-c\">// adopt current camera state<\/span><\/span>","<span class=\"cl\">        <span class=\"c-c\">// LMB drag = orbit · RMB drag = pan · wheel = zoom<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class DebugCam {\n    final cc : h3d.scene.CameraController;\n    public function new(s3d:h3d.scene.Scene) {\n        cc = new h3d.scene.CameraController(s3d);\n        s3d.camera.pos.set(6, 5, 9);\n        s3d.camera.target.set(0, 1, 0);\n        cc.loadFromCamera();       // adopt current camera state\n        // LMB drag = orbit · RMB drag = pan · wheel = zoom\n    }\n}"},{"k":"ul","i":["Present in virtually every Heaps 3D sample for good reason.","Gameplay cameras later take over by setting <code>camera.pos/target<\/code> themselves (and you remove or disable <code>cc<\/code> then)."]}],"src":"15_ch14.txt:160","n":286},{"ch":15,"kind":"content","title":"The Perspective/Orthographic Choice","tt":"The Perspective/Orthographic Choice","blocks":[{"k":"p","h":"Perspective = human eye; orthographic = no distance scaling (isometric city builders, CAD, 2D-style 3D)."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// ORTHOGRAPHIC — define a world-space box instead of fov:<\/span><\/span>","<span class=\"cl\">s3d.camera.orthoBounds = <span class=\"c-k\">new<\/span> h3d.col.<span class=\"c-t\">Bounds<\/span>();<\/span>","<span class=\"cl\">s3d.camera.orthoBounds.setMin(<span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Vector<\/span>(-<span class=\"c-n\">10<\/span>, -<span class=\"c-n\">10<\/span>, -<span class=\"c-n\">50<\/span>));<\/span>","<span class=\"cl\">s3d.camera.orthoBounds.setMax(<span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Vector<\/span>( <span class=\"c-n\">10<\/span>,  <span class=\"c-n\">10<\/span>,  <span class=\"c-n\">50<\/span>));<\/span>","<span class=\"cl\">s3d.camera.update();<\/span>"],"raw":"// ORTHOGRAPHIC — define a world-space box instead of fov:\ns3d.camera.orthoBounds = new h3d.col.Bounds();\ns3d.camera.orthoBounds.setMin(new h3d.Vector(-10, -10, -50));\ns3d.camera.orthoBounds.setMax(new h3d.Vector( 10,  10,  50));\ns3d.camera.update();"},{"k":"ul","i":["Ortho zoom = shrink the bounds; perspective zoom = dolly or fov.","Mixed pipelines (3D world + pixel HUD) love ortho — it matches 2D instincts exactly."]},{"k":"note","h":"<code>orthoBounds = null<\/code> returns to perspective. The two modes share pos/target code — switching is one field, not a rewrite."}],"src":"15_ch14.txt:173","n":287},{"ch":15,"kind":"content","title":"Model Formats: HMD, FBX, GLTF, OBJ","tt":"Model Formats: HMD, FBX, GLTF, OBJ","blocks":[{"k":"p","h":"Heaps' model pipeline in one table."},{"k":"table","head":["Format","Path into Heaps","Use"],"rows":[["HMD","native — Heaps' own binary format","production (fast, streaming-friendly)"],["FBX","convert offline to HMD with Heaps' hmd tool","DCC interchange (Blender/Maya export)"],["GLTF","supported by recent Heaps versions","modern glTF assets directly"],["OBJ","via converters / external importers","quick static props"]]},{"k":"ul","i":["The pipeline: Blender → FBX (or GLTF) → <code>hmd<\/code> converter → <code>res/<\/code> → loaded as any resource.","Materials and textures travel with the model when referenced correctly in the DCC."]},{"k":"best","t":"Automate conversion in the asset script","h":"Chapter 5's pipeline gains one step: <code>*.fbx → hmd<\/code> invoked by the same export script. Manual conversions get forgotten at deadline, every time."}],"src":"15_ch14.txt:186","n":288},{"ch":15,"kind":"content","title":"Loading Models with ModelCache","tt":"Loading Models with ModelCache","blocks":[{"k":"p","h":"<code>h3d.prim.ModelCache<\/code> is the front door for hmd assets, with animation pairing."},{"k":"code","lang":"haxe","file":"Models.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Models<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> cache : h3d.prim.<span class=\"c-t\">ModelCache<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> init() cache = <span class=\"c-k\">new<\/span> h3d.prim.<span class=\"c-t\">ModelCache<\/span>();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> cargoBay() : h3d.scene.<span class=\"c-t\">Object<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> model = cache.loadModel(hxd.<span class=\"c-t\">Res<\/span>.models.cargoBay);   <span class=\"c-c\">// res/models/cargoBay.hmd<\/span><\/span>","<span class=\"cl\">        s3d.addChild(model);<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> model;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> drone() : { obj : h3d.scene.<span class=\"c-t\">Object<\/span>, anim : h3d.scene.<span class=\"c-t\">Animation<\/span> } {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> obj = cache.loadModel(hxd.<span class=\"c-t\">Res<\/span>.models.drone);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> anim = cache.loadAnimation(hxd.<span class=\"c-t\">Res<\/span>.models.drone);   <span class=\"c-c\">// takes + clips<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (anim != <span class=\"c-k\">null<\/span>) obj.playAnimation(anim);<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> { obj, anim };<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Models {\n    static var cache : h3d.prim.ModelCache;\n    public static function init() cache = new h3d.prim.ModelCache();\n\n    public static function cargoBay() : h3d.scene.Object {\n        final model = cache.loadModel(hxd.Res.models.cargoBay);   // res/models/cargoBay.hmd\n        s3d.addChild(model);\n        return model;\n    }\n    public static function drone() : { obj : h3d.scene.Object, anim : h3d.scene.Animation } {\n        final obj = cache.loadModel(hxd.Res.models.drone);\n        final anim = cache.loadAnimation(hxd.Res.models.drone);   // takes + clips\n        if (anim != null) obj.playAnimation(anim);\n        return { obj, anim };\n    }\n}"},{"k":"ul","i":["The cache deduplicates geometry and textures — models loaded twice share GPU data.","<code>hxd.Res.models.drone<\/code> is the same typed-resource system from Chapter 5; 3D files ride the same rules (paths, versioning, disposal)."]},{"k":"pit","t":"Loading per-frame instead of caching","h":"<code>cache.loadModel<\/code> inside a spawn loop re-parses file headers; load once at level load, clone/instance afterwards (next slide)."}],"src":"15_ch14.txt:210","n":289},{"ch":15,"kind":"content","title":"Skeletal Animation and Skinning","tt":"Skeletal Animation and Skinning","blocks":[{"k":"p","h":"HMD carries skeletal rigs; playing them is one call."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> pair = <span class=\"c-t\">Models<\/span>.drone();<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> obj = pair.obj;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">obj.playAnimation(pair.anim);       <span class=\"c-c\">// plays, loops per the asset<\/span><\/span>","<span class=\"cl\">obj.currentAnimation.speed = <span class=\"c-n\">1.5<\/span>;   <span class=\"c-c\">// slow-mo / fast-forward<\/span><\/span>","<span class=\"cl\">obj.stopAnimation();                <span class=\"c-c\">// freeze back to bind pose<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// blending to another clip:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> hover = cache.loadAnimation(hxd.<span class=\"c-t\">Res<\/span>.models.droneHover);<\/span>","<span class=\"cl\">obj.playAnimation(hover);           <span class=\"c-c\">// swap clip (see note on mixing)<\/span><\/span>"],"raw":"final pair = Models.drone();\nfinal obj = pair.obj;\n\nobj.playAnimation(pair.anim);       // plays, loops per the asset\nobj.currentAnimation.speed = 1.5;   // slow-mo / fast-forward\nobj.stopAnimation();                // freeze back to bind pose\n\n// blending to another clip:\nfinal hover = cache.loadAnimation(hxd.Res.models.droneHover);\nobj.playAnimation(hover);           // swap clip (see note on mixing)"},{"k":"ul","i":["Frame events (footsteps) ride the same cue pattern as Chapter 13 — animation data drives code."]},{"k":"note","h":"Cross-fade blending (mix two clips over 0.3 s) uses the animation-controller layer in current Heaps (<code>h3d.scene.AnimationController<\/code>-family classes). API shape varies by version; the pattern — controller, weights, fade time — is stable across engines."}],"src":"15_ch14.txt:227","n":290},{"ch":15,"kind":"content","title":"Instancing: MeshBatch","tt":"Instancing: MeshBatch","blocks":[{"k":"p","h":"Ten thousand identical objects (debris fields, forests) must not be ten thousand scene nodes."},{"k":"code","lang":"haxe","file":"Debris.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Debris<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> spawnField(count:<span class=\"c-t\">Int<\/span>, rock:hxd.res.<span class=\"c-t\">Model<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// MeshBatch = one draw call for N transforms of one geometry<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> batch = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">MeshBatch<\/span>(<\/span>","<span class=\"cl\">            cache.loadModel(rock).toMesh().primitive,<\/span>","<span class=\"cl\">            cache.loadModel(rock).toMesh().material,<\/span>","<span class=\"cl\">            s3d<\/span>","<span class=\"cl\">        );<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> t = <span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Matrix<\/span>();<\/span>","<span class=\"cl\">        batch.begin();                       <span class=\"c-c\">// reset + declare stream usage<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...count) {<\/span>","<span class=\"cl\">            t.identity();<\/span>","<span class=\"cl\">            t.translate(rand(-<span class=\"c-n\">40<\/span>, <span class=\"c-n\">40<\/span>), rand(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">20<\/span>), rand(-<span class=\"c-n\">40<\/span>, <span class=\"c-n\">40<\/span>));<\/span>","<span class=\"cl\">            t.scale(rand(<span class=\"c-n\">0.5<\/span>, <span class=\"c-n\">2<\/span>));<\/span>","<span class=\"cl\">            batch.addInstance(t);            <span class=\"c-c\">// one transform per rock<\/span><\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Debris {\n    public static function spawnField(count:Int, rock:hxd.res.Model) {\n        // MeshBatch = one draw call for N transforms of one geometry\n        final batch = new h3d.scene.MeshBatch(\n            cache.loadModel(rock).toMesh().primitive,\n            cache.loadModel(rock).toMesh().material,\n            s3d\n        );\n        final t = new h3d.Matrix();\n        batch.begin();                       // reset + declare stream usage\n        for (i in 0...count) {\n            t.identity();\n            t.translate(rand(-40, 40), rand(0, 20), rand(-40, 40));\n            t.scale(rand(0.5, 2));\n            batch.addInstance(t);            // one transform per rock\n        }\n    }\n}"},{"k":"ul","i":["One <code>MeshBatch<\/code> per (geometry, material) pair; per-rock state is a matrix, not an object.","Moving instances = re-<code>begin()<\/code> + re-add (dynamic fields update per frame fine at these counts)."]},{"k":"note","h":"Method names around MeshBatch (<code>begin<\/code>/<code>addInstance<\/code> vs <code>add<\/code>) vary slightly across Heaps versions — check the <code>MeshBatch<\/code> sample in the Heaps repository for your pinned release; the architecture (batch + matrices) is constant."}],"src":"15_ch14.txt:253","n":291},{"ch":15,"kind":"content","title":"Draw Call Economics","tt":"Draw Call Economics","blocks":[{"k":"p","h":"The performance model of 3D in one slide — where your frame budget actually goes."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">frame cost ≈   draw calls (CPU + state changes)      ← batch this<\/span>","<span class=\"cl\">             + triangles (vertex processing)         ← LOD/cull this<\/span>","<span class=\"cl\">             + fill rate (pixels shaded)             ← resolution/effects<\/span>","<span class=\"cl\">             + texture memory bandwidth              ← atlas/compress this<\/span>"],"raw":"frame cost ≈   draw calls (CPU + state changes)      ← batch this\n             + triangles (vertex processing)         ← LOD/cull this\n             + fill rate (pixels shaded)             ← resolution/effects\n             + texture memory bandwidth              ← atlas/compress this"},{"k":"ul","i":["1,000 draw calls is a common desktop budget; mobile targets a few hundred.","Heaps' renderer batches automatically within a pass — your job: same-material runs, instancing, atlased textures."]},{"k":"best","t":"Measure with the engine's stats","h":"<code>engine.driver.info<\/code> (draw calls, triangles — check your version's stats overlay) next to the FPS counter from Chapter 1. Optimizing without draw-call counts is guessing with confidence."}],"src":"15_ch14.txt:265","n":292},{"ch":15,"kind":"content","title":"Frustum Culling","tt":"Frustum Culling","blocks":[{"k":"p","h":"Culling skips what the camera cannot see — Heaps does per-object bounds culling automatically."},{"k":"ul","i":["The scene tests each object's bounding box against the camera <b>frustum<\/b> (the pyramid between near and far planes).","You help by keeping objects <b>separable<\/b>: a giant merged level mesh defeats culling; per-chunk meshes cull beautifully.","Manual control: <code>obj.cullingCollider<\/code> / <code>obj.visible<\/code> — the latter for gameplay culling (Chapter 2's fixed view trick)."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// Verify what culling is saving you: count visible objects per frame<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\">// (scene iterate APIs differ slightly across versions — this is the pattern)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">var<\/span> vis = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">s3d.iterateVisible(obj -&gt; vis++);<\/span>","<span class=\"cl\">debugHud.text = <span class=\"c-s\">'visible objects: $vis'<\/span>;<\/span>"],"raw":"// Verify what culling is saving you: count visible objects per frame\n// (scene iterate APIs differ slightly across versions — this is the pattern)\nvar vis = 0;\ns3d.iterateVisible(obj -> vis++);\ndebugHud.text = 'visible objects: $vis';"},{"k":"pit","t":"One \"level\" mesh = zero culling","h":"Exported-as-one-piece levels render at full cost regardless of camera. Chunk exports (by room / 10m grid) restore culling — an export setting, not a code change."}],"src":"15_ch14.txt:279","n":293},{"ch":15,"kind":"content","title":"Raycasting: Picking in 3D","tt":"Raycasting: Picking in 3D","blocks":[{"k":"p","h":"\"Click the cargo orb\" needs a ray from the camera through the pixel, intersected with the world."},{"k":"code","lang":"haxe","file":"Picking.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Picking<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-c\">// ray-sphere: t of nearest hit, or -1<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> raySphere(ro:h3d.<span class=\"c-t\">Vector<\/span>, rd:h3d.<span class=\"c-t\">Vector<\/span>, c:h3d.<span class=\"c-t\">Vector<\/span>, r:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Float<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> oc = ro.sub(c);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> b = oc.dot(rd);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> cc = oc.dot(oc) - r * r;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> h = b * b - cc;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (h &lt; <span class=\"c-n\">0<\/span>) <span class=\"c-k\">return<\/span> -<span class=\"c-n\">1<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-f\">-b<\/span> - <span class=\"c-t\">Math<\/span>.sqrt(h);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> pick(s2d:h2d.<span class=\"c-t\">Scene<\/span>, pickables:<span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Pickable<\/span>&gt;) : <span class=\"c-t\">Pickable<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> ray = s3d.camera.getRay(mouseX, mouseY);   <span class=\"c-c\">// camera through pixel!<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> best : <span class=\"c-t\">Pickable<\/span> = <span class=\"c-k\">null<\/span>, bestT = 1e9;<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (p in pickables) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> t = raySphere(ray.lx, ray.ly, ray.lz, p.pos, p.radius);<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (t &gt;= <span class=\"c-n\">0<\/span> &amp;&amp; t &lt; bestT) { best = p; bestT = t; }<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> best;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">Pickable<\/span> = { pos : h3d.<span class=\"c-t\">Vector<\/span>, radius : <span class=\"c-t\">Float<\/span>, entity : <span class=\"c-t\">Entity<\/span> };<\/span>"],"raw":"class Picking {\n    // ray-sphere: t of nearest hit, or -1\n    static function raySphere(ro:h3d.Vector, rd:h3d.Vector, c:h3d.Vector, r:Float) : Float {\n        final oc = ro.sub(c);\n        final b = oc.dot(rd);\n        final cc = oc.dot(oc) - r * r;\n        final h = b * b - cc;\n        if (h < 0) return -1;\n        return -b - Math.sqrt(h);\n    }\n\n    public static function pick(s2d:h2d.Scene, pickables:Array<Pickable>) : Pickable {\n        final ray = s3d.camera.getRay(mouseX, mouseY);   // camera through pixel!\n        var best : Pickable = null, bestT = 1e9;\n        for (p in pickables) {\n            final t = raySphere(ray.lx, ray.ly, ray.lz, p.pos, p.radius);\n            if (t >= 0 && t < bestT) { best = p; bestT = t; }\n        }\n        return best;\n    }\n}\ntypedef Pickable = { pos : h3d.Vector, radius : Float, entity : Entity };"},{"k":"ul","i":["<code>camera.getRay(x, y)<\/code> gives origin + direction (fields like <code>lx/ly/lz<\/code> = direction; check your version's Ray fields).","Ray vs sphere is the 80% solution for picking; ray vs triangle (mesh-accurate) is the heavy version — Heaps provides scene-level raycast helpers in recent versions."]},{"k":"best","t":"Debug-draw your rays","h":"Draw the ray as a thin line (Graphics in 3D or a stretched cube) for a day — picking bugs are 95% \"the ray was never where I thought\"."}],"src":"15_ch14.txt:309","n":294},{"ch":15,"kind":"content","title":"3D Physics: The Landscape","tt":"3D Physics: The Landscape","blocks":[{"k":"p","h":"As with 2D, Heaps ships no solver. For 3D the usual companion is a <b>Bullet<\/b>-style engine (e.g. the haxebullet haxelib on native targets; on web, simpler custom kinematics often win)."},{"k":"ul","i":["Same adapter discipline as Chapter 10: physics types behind an interface, one import point, PPM-less (meters already).","Orbital Salvage needs: rigid crates, triggers, one constraint (tether) — modest, deliberately. 3D physics scope creep sinks projects."]},{"k":"code","lang":"haxe","file":"IPhysics.hx","lines":["<span class=\"cl\"><span class=\"c-k\">interface<\/span> <span class=\"c-t\">IPhysicsWorld<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> init(gravity:h3d.<span class=\"c-t\">Vector<\/span>) : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> step(dt:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> createBox(size:h3d.<span class=\"c-t\">Vector<\/span>, pos:h3d.<span class=\"c-t\">Vector<\/span>, <span class=\"c-k\">dynamic<\/span>:<span class=\"c-t\">Bool<\/span>) : <span class=\"c-t\">IPhysicsBody<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> raycast(<span class=\"c-k\">from<\/span>:h3d.<span class=\"c-t\">Vector<\/span>, <span class=\"c-k\">to<\/span>:h3d.<span class=\"c-t\">Vector<\/span>) : <span class=\"c-t\">Null<\/span>&lt;<span class=\"c-t\">IPhysicsBody<\/span>&gt;;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">interface<\/span> <span class=\"c-t\">IPhysicsBody<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> position(get, set) : h3d.<span class=\"c-t\">Vector<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> dynamicBody : <span class=\"c-t\">Bool<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> applyImpulse(v:h3d.<span class=\"c-t\">Vector<\/span>) : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> onContact : <span class=\"c-t\">IPhysicsBody<\/span> -&gt; <span class=\"c-t\">Void<\/span>;   <span class=\"c-c\">// deferred events (Ch. 10 pattern)<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"interface IPhysicsWorld {\n    function init(gravity:h3d.Vector) : Void;\n    function step(dt:Float) : Void;\n    function createBox(size:h3d.Vector, pos:h3d.Vector, dynamic:Bool) : IPhysicsBody;\n    function raycast(from:h3d.Vector, to:h3d.Vector) : Null<IPhysicsBody>;\n}\ninterface IPhysicsBody {\n    var position(get, set) : h3d.Vector;\n    var dynamicBody : Bool;\n    function applyImpulse(v:h3d.Vector) : Void;\n    var onContact : IPhysicsBody -> Void;   // deferred events (Ch. 10 pattern)\n}"},{"k":"best","t":"Physics behind an interface, even if you never swap it","h":"The interface is not for swapping engines — it is for: testing without physics, mocking for cutscenes, and shipping the web build without a native-only solver."}],"src":"15_ch14.txt:329","n":295},{"ch":15,"kind":"content","title":"Rigid Body Dynamics in Practice","tt":"Rigid Body Dynamics in Practice","blocks":[{"k":"p","h":"With the adapter in place, a rigid-body scene is a dozen lines."},{"k":"code","lang":"haxe","file":"PhysicsScene.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">PhysicsScene<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> world : <span class=\"c-t\">IPhysicsWorld<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> boxes : <span class=\"c-t\">Array<\/span>&lt;{ body : <span class=\"c-t\">IPhysicsBody<\/span>, view : h3d.scene.<span class=\"c-t\">Mesh<\/span>, prev : h3d.<span class=\"c-t\">Vector<\/span> }&gt; = [];<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> init() {<\/span>","<span class=\"cl\">        world = <span class=\"c-t\">Phys<\/span>.factory();                    <span class=\"c-c\">// bullet adapter (native) or null<\/span><\/span>","<span class=\"cl\">        world.init(<span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Vector<\/span>(<span class=\"c-n\">0<\/span>, -<span class=\"c-n\">9.8<\/span>, <span class=\"c-n\">0<\/span>));    <span class=\"c-c\">// gravity: minus y<\/span><\/span>","<span class=\"cl\">        <span class=\"c-c\">// static floor<\/span><\/span>","<span class=\"cl\">        world.createBox(<span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Vector<\/span>(<span class=\"c-n\">60<\/span>, <span class=\"c-n\">1<\/span>, <span class=\"c-n\">60<\/span>), <span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Vector<\/span>(<span class=\"c-n\">0<\/span>, -<span class=\"c-n\">0.5<\/span>, <span class=\"c-n\">0<\/span>), <span class=\"c-k\">false<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-c\">// dynamic crates<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...<span class=\"c-n\">20<\/span>) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> b = world.createBox(<span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Vector<\/span>(<span class=\"c-n\">1<\/span>, <span class=\"c-n\">1<\/span>, <span class=\"c-n\">1<\/span>),<\/span>","<span class=\"cl\">                <span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Vector<\/span>(rand(-<span class=\"c-n\">5<\/span>, <span class=\"c-n\">5<\/span>), <span class=\"c-n\">2<\/span> + i * <span class=\"c-n\">1.2<\/span>, rand(-<span class=\"c-n\">5<\/span>, <span class=\"c-n\">5<\/span>)), <span class=\"c-k\">true<\/span>);<\/span>","<span class=\"cl\">            boxes.push({ body : b, view : <span class=\"c-t\">Prims<\/span>.cube(s3d), prev : b.position });<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        world.step(dt);<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (b in boxes) {<\/span>","<span class=\"cl\">            b.view.setPosition(b.body.position.x, b.body.position.y, b.body.position.z);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class PhysicsScene {\n    static var world : IPhysicsWorld;\n    static var boxes : Array<{ body : IPhysicsBody, view : h3d.scene.Mesh, prev : h3d.Vector }> = [];\n\n    public static function init() {\n        world = Phys.factory();                    // bullet adapter (native) or null\n        world.init(new h3d.Vector(0, -9.8, 0));    // gravity: minus y\n        // static floor\n        world.createBox(new h3d.Vector(60, 1, 60), new h3d.Vector(0, -0.5, 0), false);\n        // dynamic crates\n        for (i in 0...20) {\n            final b = world.createBox(new h3d.Vector(1, 1, 1),\n                new h3d.Vector(rand(-5, 5), 2 + i * 1.2, rand(-5, 5)), true);\n            boxes.push({ body : b, view : Prims.cube(s3d), prev : b.position });\n        }\n    }\n    public static function update(dt:Float) {\n        world.step(dt);\n        for (b in boxes) {\n            b.view.setPosition(b.body.position.x, b.body.position.y, b.body.position.z);\n        }\n    }\n}"},{"k":"note","h":"When no adapter exists (web), the same scene runs kinematically: gravity + floor clamp — the interface means the scene code above does not know which world it lives in."}],"src":"15_ch14.txt:358","n":296},{"ch":15,"kind":"content","title":"Constraints: Tethers and Hinges","tt":"Constraints: Tethers and Hinges","blocks":[{"k":"p","h":"Constraints link bodies — Orbital Salvage's salvage tether is one distance constraint."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">interface<\/span> <span class=\"c-t\">IPhysicsConstraint<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> breakForce(force:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Bool<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> remove() : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-c\">// adapter adds e.g. on bullet-native:<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\">//   DistanceConstraint (tether) · PointConstraint (rope end)<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\">//   HingeConstraint (door) · SliderConstraint (airlock)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> tether = world.linkDistance(crateA.body, orb.body, maxLen = <span class=\"c-n\">4.0<\/span>);<\/span>","<span class=\"cl\"><span class=\"c-k\">if<\/span> (tether.breakForce(<span class=\"c-n\">500<\/span>)) { snapFx(); tether.remove(); }<\/span>"],"raw":"interface IPhysicsConstraint {\n    function breakForce(force:Float) : Bool;\n    function remove() : Void;\n}\n// adapter adds e.g. on bullet-native:\n//   DistanceConstraint (tether) · PointConstraint (rope end)\n//   HingeConstraint (door) · SliderConstraint (airlock)\nfinal tether = world.linkDistance(crateA.body, orb.body, maxLen = 4.0);\nif (tether.breakForce(500)) { snapFx(); tether.remove(); }"},{"k":"best","t":"Constraints as gameplay verbs","h":"Tether-swing, magnet, tow-cable — constraint-driven mechanics are emergent physics' gift to designers. One well-used constraint beats ten scripted set-pieces."}],"src":"15_ch14.txt:373","n":297},{"ch":15,"kind":"content","title":"Contact Listeners and Trigger Volumes","tt":"Contact Listeners and Trigger Volumes","blocks":[{"k":"p","h":"Chapter 10's deferred-contact pattern, imported into 3D wholesale."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\">world.createTrigger(sphereCenter, radius, <span class=\"c-k\">function<\/span>(entering:<span class=\"c-t\">IPhysicsBody<\/span>) {<\/span>","<span class=\"cl\">    <span class=\"c-k\">if<\/span> (entering == orb.body) events.emit(<span class=\"c-s\">\"salvage\"<\/span>, orb.entity);   <span class=\"c-c\">// deferred queue<\/span><\/span>","<span class=\"cl\">});<\/span>","<span class=\"cl\"><span class=\"c-c\">// hazards, exit volumes, dialogue triggers — all sensors, all deferred<\/span><\/span>"],"raw":"world.createTrigger(sphereCenter, radius, function(entering:IPhysicsBody) {\n    if (entering == orb.body) events.emit(\"salvage\", orb.entity);   // deferred queue\n});\n// hazards, exit volumes, dialogue triggers — all sensors, all deferred"},{"k":"ul","i":["Defer, defer, defer: contact callbacks inside a solver step are the same UB they were in 2D.","Trigger volumes double as audio zones (Chapter 2's music beds) — one concept, three systems."]}],"src":"15_ch14.txt:384","n":298},{"ch":15,"kind":"content","title":"Dynamic Shadows with Moving Lights","tt":"Dynamic Shadows with Moving Lights","blocks":[{"k":"p","h":"A point light orbiting a stack of crates — the demo that proves your whole 3D setup."},{"k":"code","lang":"haxe","file":"ShadowStudy.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">ShadowStudy<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> lamp : h3d.scene.<span class=\"c-t\">PointLight<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> t = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>() { lamp = <span class=\"c-k\">new<\/span> h3d.scene.<span class=\"c-t\">PointLight<\/span>(s3d); }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        t += dt;<\/span>","<span class=\"cl\">        lamp.setPosition(<span class=\"c-t\">Math<\/span>.sin(t * <span class=\"c-n\">0.7<\/span>) * <span class=\"c-n\">6<\/span>, <span class=\"c-n\">5<\/span>, <span class=\"c-t\">Math<\/span>.cos(t * <span class=\"c-n\">0.7<\/span>) * <span class=\"c-n\">6<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-c\">// renderer shadows already enabled (shadow-mapping slide)<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class ShadowStudy {\n    final lamp : h3d.scene.PointLight;\n    var t = 0.0;\n    public function new() { lamp = new h3d.scene.PointLight(s3d); }\n    public function update(dt:Float) {\n        t += dt;\n        lamp.setPosition(Math.sin(t * 0.7) * 6, 5, Math.cos(t * 0.7) * 6);\n        // renderer shadows already enabled (shadow-mapping slide)\n    }\n}"},{"k":"ul","i":["Watch for: shadow map resolution (acne), update costs, and flicker when the light crosses geometry."]},{"k":"pit","t":"Dynamic point-light shadows × 6 lights","h":"Each shadow-casting light re-renders the scene. Budget: ONE dynamic shadow-caster; make the rest static or non-casting."}],"src":"15_ch14.txt:401","n":299},{"ch":15,"kind":"content","title":"The Stacking Test Scene","tt":"The Stacking Test Scene","blocks":[{"k":"p","h":"The classic 3D physics certification: a tower of crates, a wrecking orb, and a candle."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">[THE SCENE]                     [WHAT IT PROVES]<\/span>","<span class=\"cl\">15-crate tower on a ramp   →    solver stability, friction, sleeping<\/span>","<span class=\"cl\">orb fired at the tower     →    CCD (no tunneling), impulse transfer<\/span>","<span class=\"cl\">candle flicker point light →    dynamic shadows + frame budget<\/span>","<span class=\"cl\">pause + step-one-frame     →    determinism (same input, same collapse?)<\/span>"],"raw":"[THE SCENE]                     [WHAT IT PROVES]\n15-crate tower on a ramp   →    solver stability, friction, sleeping\norb fired at the tower     →    CCD (no tunneling), impulse transfer\ncandle flicker point light →    dynamic shadows + frame budget\npause + step-one-frame     →    determinism (same input, same collapse?)"},{"k":"ul","i":["Step-one-frame debugging (pause, advance 1/60 s) is the physics debugger's microscope — build it once (a debug key), use it forever."]},{"k":"best","t":"Record the collapse","h":"Fixed timestep + seeded impulse = reproducible tower. If the same seed collapses differently across machines, your determinism contract is broken — find out in the test scene, not in player support."}],"src":"15_ch14.txt:413","n":300},{"ch":15,"kind":"content","title":"Performance: Batching, Culling, LOD","tt":"Performance: Batching, Culling, LOD","blocks":[{"k":"p","h":"The 3D performance checklist, in the order it pays."},{"k":"ul","i":["<b>Draw calls first<\/b>: merge static geometry per material, instance repeats (MeshBatch), atlas textures.","<b>Culling second<\/b>: chunked level exports; verify visible-object counts with the iterate snippet.","<b>LOD third<\/b>: two model versions (near/far), swap at distance — only after batching+culling stop paying.","<b>Fill rate last<\/b>: resolution scale (Chapter 2's strategy applies to <code>engine<\/code> render scale) and post effects tier (Chapter 11)."]},{"k":"pit","t":"Optimizing triangles before draw calls","h":"A 100k-tri model in ONE call beats 10 models of 1k in 10 calls on most hardware. Count calls, then count triangles — in that order, always."}],"src":"15_ch14.txt:421","n":301},{"ch":15,"kind":"content","title":"Project: Orbital Salvage — Assembly","tt":"Project: Orbital Salvage — Assembly","blocks":[{"k":"p","h":"The capstone assembles the chapter's pieces into the course's final build."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">scene:   cargoBay.hmd (chopped for culling) · debris MeshBatch (500 rocks)<\/span>","<span class=\"cl\">light:   DirLight sun (shadow-mapped) · 2 PointLights (one dynamic) · cold ambient<\/span>","<span class=\"cl\">camera:  60° perspective · gameplay follow + DebugCam on F8<\/span>","<span class=\"cl\">physics: 30 dynamic crates · tether constraint · salvage triggers<\/span>","<span class=\"cl\">input:   click-to-salvage via raycast picking (mouse + touch)<\/span>","<span class=\"cl\">HUD:     Chapter 7 UI, unchanged · salvage counter with Ch. 13 pop<\/span>"],"raw":"scene:   cargoBay.hmd (chopped for culling) · debris MeshBatch (500 rocks)\nlight:   DirLight sun (shadow-mapped) · 2 PointLights (one dynamic) · cold ambient\ncamera:  60° perspective · gameplay follow + DebugCam on F8\nphysics: 30 dynamic crates · tether constraint · salvage triggers\ninput:   click-to-salvage via raycast picking (mouse + touch)\nHUD:     Chapter 7 UI, unchanged · salvage counter with Ch. 13 pop"},{"k":"ul","i":["Acceptance test: 60 FPS on the mid-range machine, 500 debris + 30 crates + dynamic shadow, picking accurate to the pixel, pause/step working, seed-reproducible physics."]}],"src":"15_ch14.txt:433","n":302},{"ch":15,"kind":"content","title":"Course Wrap-Up: Where to Go Next","tt":"Course Wrap-Up: Where to Go Next","blocks":[{"k":"p","h":"You now hold the complete stack: toolchain, engine modules, architecture, assets, gameplay, UI, effects, physics, shaders, input, animation, and 3D. The paths outward:"},{"k":"ul","i":["<b>Deeper engine<\/b>: Heaps' PBR renderer, castle DB data pipeline, the h3d pass system beyond this course's taste.","<b>Bigger games<\/b>: netcode (lockstep with your deterministic loop), level editors (the Ch. 8 editor pattern at scale), consoles (vendor ports of the same code).","<b>The capstones<\/b>: Cavern Run has three levels of content-shaped holes — fill them. Orbital Salvage has one more system begging: a 3D tweened camera director."]},{"k":"best","t":"Make the tiny game next","h":"Scope a 2-week game using only chapters you own cold. Shipping — even something tiny — is the chapter this course cannot teach."}],"src":"15_ch14.txt:440","n":303},{"ch":15,"kind":"content","title":"Chapter 14 (and Course) Checklist","tt":"Chapter 14 (and Course) Checklist","blocks":[{"k":"ul","i":["h3d scene graph, lights, materials and shadow map running with tuned ambient.","Two cameras: gameplay perspective + CameraController debug; ortho understood.","HMD pipeline: convert → load via ModelCache → animate; MeshBatch debris field.","Draw-call budget measured; culling verified; LOD policy decided.","Raycast picking works with mouse and touch.","Physics behind <code>IPhysicsWorld<\/code>: crates stack, tether breaks, triggers defer.","Stacking test passes: stable, non-tunneling, seed-reproducible, one dynamic shadow at 60 FPS."]}],"src":"15_ch14.txt:449","n":304}]}</script>
<script>
(function(){
"use strict";
var payloadEl = document.getElementById('slide-data');
var DATA = JSON.parse(payloadEl.textContent);
var CH = DATA.chapters, SL = DATA.slides;
var N = SL.length, cur = -1;
var deck = document.getElementById('deck');
var els = [], codeBtns = [];
var barFill = document.getElementById('barfill');
var counterEl = document.getElementById('counter');
var chlabelEl = document.getElementById('chlabel');
var sideList = document.getElementById('slist');
var ovGrid = document.getElementById('ovgrid');
var ovCards = [];
var srList = document.getElementById('srlist');
var srQ = document.getElementById('srq');
var srIndex = [];          // plain text per slide for search
var lastResults = [], selIdx = 0;

function mk(t, c, p){ var e=document.createElement(t); if(c) e.className=c; if(p) p.appendChild(e); return e; }
function pad(n){ return (n<10?'0':'')+n; }

/* ---------- build slides ---------- */
function renderBlocks(blocks, into){
  blocks.forEach(function(b){
    if(b.k==='p'){ var p=mk('p'); p.innerHTML=b.h; into.appendChild(p); }
    else if(b.k==='ul'){
      var ul=mk('ul'); b.i.forEach(function(it){ var li=mk('li'); li.innerHTML=it; ul.appendChild(li); });
      into.appendChild(ul);
    }
    else if(b.k==='code'){
      var w=mk('div','codewrap');
      var h=mk('div','codehead');
      h.appendChild(mk('span','lang')).textContent=b.lang;
      if(b.file){ var f=mk('span','fname'); f.textContent=b.file; h.appendChild(f); }
      h.appendChild(mk('span','grip'));
      var btn=mk('button','copy'); btn.type='button'; btn.textContent='Copy';
      h.appendChild(btn);
      (function(btn, raw){ btn.addEventListener('click', function(){ copyText(raw, btn); }); })(btn, b.raw);
      w.appendChild(h);
      var pre=mk('pre','code');
      pre.innerHTML=b.lines.join('\n');
      w.appendChild(pre);
      into.appendChild(w);
    }
    else if(b.k==='best'||b.k==='pit'||b.k==='note'){
      var d=mk('div','callout '+b.k);
      var lab=mk('div','clabel');
      lab.textContent = b.k==='best'?'BEST PRACTICE':(b.k==='pit'?'COMMON PITFALL':'NOTE');
      d.appendChild(lab);
      if(b.t){ var t=mk('b','ct'); t.innerHTML=b.t; d.appendChild(t); }
      var bd=mk('div'); bd.innerHTML=b.h; d.appendChild(bd);
      into.appendChild(d);
    }
    else if(b.k==='table'){
      var tw=mk('div','tblwrap'); var tb=mk('table','tbl');
      var thead=mk('thead'); var tr=mk('tr');
      b.head.forEach(function(c){ var th=mk('th'); th.innerHTML=c; tr.appendChild(th); });
      thead.appendChild(tr); tb.appendChild(thead);
      var tb2=mk('tbody');
      b.rows.forEach(function(r){ var tr2=mk('tr'); r.forEach(function(c){ var td=mk('td'); td.innerHTML=c; tr2.appendChild(td); }); tb2.appendChild(tr2); });
      tb.appendChild(tb2); tw.appendChild(tb); into.appendChild(tw);
    }
    else if(b.k==='two'){
      var c=mk('div','cols');
      var a=mk('div','col'); renderBlocks(b.a,a);
      var bb=mk('div','col'); renderBlocks(b.b,bb);
      c.appendChild(a); c.appendChild(bb); into.appendChild(c);
    }
  });
}

function buildSlide(s, i){
  var ch=CH[s.ch];
  var sec=mk('section','slide k-'+s.kind);
  sec.dataset.i=i;
  sec.style.setProperty('--hue', ch.hue);
  var inner=mk('div','sinner'); sec.appendChild(inner);
  if(s.kind==='cover'){
    var k=mk('div','cvkick'); k.textContent='HAXE · HEAPS.IO · CROSS-PLATFORM GAME ENGINE'; inner.appendChild(k);
    var h1=mk('h1'); h1.innerHTML=s.title; inner.appendChild(h1);
    var sub=mk('div','cvsub'); sub.innerHTML=s.sub||''; inner.appendChild(sub);
    var chips=mk('div','chips');
    mkChip(chips, '<b>'+N+'</b> slides');
    mkChip(chips, '<b>'+CH.length+'</b> chapters');
    mkChip(chips, 'Preface → <b>Chapter 14</b>');
    mkChip(chips, '<b>2D + 3D</b> capstone projects');
    mkChip(chips, 'Production-grade <b>code patterns</b>');
    inner.appendChild(chips);
    var hint=mk('div','cvhint');
    hint.innerHTML='<span class="pulse"></span>Press <b>&rarr;</b> to start &nbsp;·&nbsp; <b>O</b> overview &nbsp;·&nbsp; <b>/</b> search &nbsp;·&nbsp; <b>F</b> fullscreen';
    inner.appendChild(hint);
    var v=mk('div','cvver'); v.textContent='Compiled '+DATA.built+' · single-file static export · works offline';
    inner.appendChild(v);
  } else if(s.kind==='chapter'){
    var num=mk('div','chbig');
    num.textContent = s.ch===1 ? 'P' : pad(s.ch-1);
    inner.appendChild(num);
    var lab=mk('div','chlab'); lab.textContent=CH[s.ch].label; inner.appendChild(lab);
    var h2=mk('h2'); h2.innerHTML=s.title; inner.appendChild(h2);
    var cs=mk('div','chsub'); cs.innerHTML=s.sub||''; inner.appendChild(cs);
    var r=mk('div','chrng');
    r.textContent='SLIDES '+ch.start+' – '+ch.end+' · '+(ch.end-ch.start+1)+' TOTAL';
    inner.appendChild(r);
  } else {
    var head=mk('header','shead');
    var kick=mk('div','kick');
    kick.textContent=CH[s.ch].label+' · SLIDE '+s.n;
    head.appendChild(kick);
    var hh=mk('h2'); hh.innerHTML=s.title; head.appendChild(hh);
    head.appendChild(mk('div','rule'));
    inner.appendChild(head);
    var body=mk('div','sbody'); renderBlocks(s.blocks, body); inner.appendChild(body);
  }
  deck.appendChild(sec);
  return sec;
}
function mkChip(p,h){ var c=mk('div','chip'); c.innerHTML=h; p.appendChild(c); }

SL.forEach(function(s,i){ els.push(buildSlide(s,i)); });

/* ---------- search index ---------- */
function plain(html){
  var d=document.createElement('div'); d.innerHTML=html;
  return d.textContent||'';
}
SL.forEach(function(s,i){
  var parts=[s.tt];
  (function walk(blocks){
    blocks.forEach(function(b){
      if(b.k==='p'||b.k==='note'||b.k==='best'||b.k==='pit') parts.push(plain(b.h), plain(b.t||''));
      else if(b.k==='ul') b.i.forEach(function(x){ parts.push(plain(x)); });
      else if(b.k==='table'){ b.head.forEach(function(x){parts.push(plain(x));}); b.rows.forEach(function(r){r.forEach(function(x){parts.push(plain(x));});}); }
      else if(b.k==='code'){ parts.push(b.raw); }
      else if(b.k==='two'){ walk(b.a); walk(b.b); }
    });
  })(s.blocks);
  srIndex.push(parts.join(' \u00b7 ').replace(/\s+/g,' ').trim());
});

/* ---------- sidebar ---------- */
CH.forEach(function(c,ci){
  var row=mk('div','chrow'); row.style.setProperty('--hue', c.hue);
  var head=mk('div','chhead');
  var badge=mk('div','badge'); badge.textContent = ci===0 ? '»' : (ci===1?'P':pad(ci-1));
  head.appendChild(badge);
  var t=mk('div','ct'); t.textContent=c.title; head.appendChild(t);
  var r=mk('div','rng'); r.textContent=c.start+'–'+c.end; head.appendChild(r);
  row.appendChild(head);
  var list=mk('div','sl');
  for(var i=c.start-1;i<c.end;i++){
    if(SL[i].kind!=='content') continue;
    var a=mk('a'); var num=mk('i'); num.textContent=SL[i].n;
    var tx=mk('span'); tx.textContent=plain(SL[i].title);
    tx.style.overflow='hidden'; tx.style.textOverflow='ellipsis';
    a.appendChild(num); a.appendChild(tx);
    a.dataset.i=i;
    (function(idx){ a.addEventListener('click', function(){ closeSide(); go(idx); }); })(i);
    list.appendChild(a);
  }
  row.appendChild(list);
  head.addEventListener('click', function(){
    document.querySelectorAll('.chrow').forEach(function(x){ x.classList.remove('open'); });
    row.classList.add('open');
    go(c.start-1);
  });
  sideList.appendChild(row);
  row.dataset.ci=ci;
});

/* ---------- overview ---------- */
SL.forEach(function(s,i){
  var ch=CH[s.ch];
  var c=mk('div','ovc'); c.style.setProperty('--hue', ch.hue);
  var n=mk('div','ovn'); n.textContent=ch.label+' · '+s.n; c.appendChild(n);
  var t=mk('div','ovt'); t.innerHTML=s.title; c.appendChild(t);
  var s2=mk('div','ovc2'); s2.textContent=ch.title; c.appendChild(s2);
  (function(idx){ c.addEventListener('click', function(){ toggleOv(false); go(idx); }); })(i);
  ovGrid.appendChild(c);
  ovCards.push(c);
});

/* ---------- navigation ---------- */
function updateChrome(){
  var s=SL[cur], ch=CH[s.ch];
  barFill.style.width=(((cur+1)/N)*100).toFixed(2)+'%';
  counterEl.innerHTML='<b>'+(cur+1)+'</b> / '+N;
  chlabelEl.innerHTML='<b>'+ch.label+'</b> · <i>'+ch.title+'</i>';
  chlabelEl.style.setProperty('--hue', ch.hue);
  document.title='('+(cur+1)+'/'+N+') '+s.tt+' — Heaps.io Game Development';
  document.querySelectorAll('.chrow').forEach(function(x){
    x.classList.toggle('open', parseInt(x.dataset.ci,10)===s.ch);
  });
  document.querySelectorAll('.sl a.cur').forEach(function(a){ a.classList.remove('cur'); });
  var curA=document.querySelector('.sl a[data-i="'+cur+'"]');
  if(curA){ curA.classList.add('cur'); curA.scrollIntoView({block:'nearest'}); }
  ovCards.forEach(function(c,i){ c.classList.toggle('cur', i===cur); });
  var cc=ovCards[cur];
  if(cc && document.body.classList.contains('ov')) cc.scrollIntoView({block:'nearest'});
}

function go(i, silent){
  i=Math.max(0, Math.min(N-1, i));
  if(i===cur) return;
  var dir = cur<0 ? 'fwd' : (i<cur ? 'back':'fwd');
  deck.dataset.dir = dir;
  if(cur>=0) els[cur].classList.remove('active');
  cur=i;
  var el=els[cur];
  el.classList.add('active');
  el.scrollTop=0;
  fitSlide(el);
  updateChrome();
  try{ localStorage.setItem('heaps-course-slide', String(cur+1)); }catch(e){}
  if(!silent){ try{ history.replaceState(null,'','#/'+(cur+1)); }catch(e){} }
}

/* ---------- fit tall slides to the viewport ---------- */
function naturalWidth(pre){                    // width of the longest line, unclamped
  var old = pre.style.width;
  pre.style.width = 'max-content';
  var w = pre.scrollWidth;
  pre.style.width = old;
  return w;
}
var SPLIT_CLASSES = ['split-code','split-body','code-s11','code-s10','code-wrap'];
function clearSplits(el){ SPLIT_CLASSES.forEach(function(c){ el.classList.remove(c); }); }

function fitSlide(el){
  if(!el) return;
  el.style.zoom = 1;                           // ALL measurements at zoom 1
  clearSplits(el);
  var avail = el.clientHeight;
  if(el.scrollHeight <= avail + 2) return;     // fits already

  var body = el.querySelector('.sbody');
  var singleCode = null;
  if(body){
    var code = null, nCodes = 0;
    body.querySelectorAll(':scope > .codewrap').forEach(function(c){ nCodes++; if(nCodes===1) code=c; });
    if(nCodes === 1 && code.querySelectorAll('.cl').length >= 18) singleCode = code;
  }

  var candidates = [];                          // { h: height@zoom1, cls: className }
  function snapshot(){ candidates.push({ h: el.scrollHeight, cls: el.className }); }

  if(singleCode){
    var pre = singleCode.querySelector('pre.code');
    var bw = body.clientWidth;
    var otherH = 0;
    body.querySelectorAll(':scope > *').forEach(function(c){ if(c !== singleCode) otherH += c.offsetHeight + 13; });
    var order = otherH < singleCode.offsetHeight * 0.35
      ? ['split-code','split-body'] : ['split-body','split-code'];
    order.forEach(function(cls){
      clearSplits(el);
      var frac = cls === 'split-code' ? 0.485 : 0.50;      // usable column fractions
      var w = naturalWidth(pre);
      var scale = w <= bw*frac ? 1 : w*0.875 <= bw*frac ? 0.875 : w*0.83 <= bw*frac ? 0.83 : 0;
      if(scale === 0) return;                              // listing too wide for columns
      if(scale === 0.875) el.classList.add('code-s11');
      if(scale === 0.83)  el.classList.add('code-s10');
      el.classList.add(cls);
      snapshot();
    });
    clearSplits(el);
    el.classList.add('split-code','code-s10','code-wrap'); // wrapped columns (any width)
    snapshot();
    clearSplits(el);
  }
  if(el.querySelector('.sbody .codewrap')){
    el.classList.add('code-s11');                          // smaller code font only
    snapshot();
    clearSplits(el);
  }
  snapshot();                                              // plain arrangement

  var best = candidates[0];
  for(var i=1;i<candidates.length;i++) if(candidates[i].h < best.h) best = candidates[i];
  el.className = best.cls;

  if(best.h <= avail + 2) return;                          // best fits at full size
  var k = avail / best.h;
  el.style.zoom = (k < 0.60 ? 0.60 : k).toFixed(3);        // beyond floor: slide may scroll
}
window.addEventListener('resize', function(){ if(cur>=0) fitSlide(els[cur]); });

/* ---------- copy ---------- */
function copyText(txt, btn){
  function done(){ btn.textContent='Copied'; btn.classList.add('ok');
    setTimeout(function(){ btn.textContent='Copy'; btn.classList.remove('ok'); },1400); }
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ btn.textContent='Ctrl+C'; }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else fallback();
}

/* ---------- overlays ---------- */
