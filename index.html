">class<\/span> <span class=\"c-t\">Atlas<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> tiles = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Map<\/span>&lt;<span class=\"c-t\">String<\/span>, h2d.<span class=\"c-t\">Tile<\/span>&gt;();<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> sheet(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : h2d.<span class=\"c-t\">Tile<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(imageRes:hxd.res.<span class=\"c-t\">Image<\/span>, jsonRes:hxd.res.<span class=\"c-t\">Resource<\/span>) {<\/span>","<span class=\"cl\">        sheet = imageRes.toTile();<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> data = haxe.<span class=\"c-t\">Json<\/span>.parse(jsonRes.entry.getText());<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (frame in <span class=\"c-t\">Reflect<\/span>.fields(data.frames)) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> f : { frame : { x:<span class=\"c-t\">Int<\/span>, y:<span class=\"c-t\">Int<\/span>, w:<span class=\"c-t\">Int<\/span>, h:<span class=\"c-t\">Int<\/span> } } =<\/span>","<span class=\"cl\">                <span class=\"c-t\">Reflect<\/span>.field(data.frames, frame);<\/span>","<span class=\"cl\">            tiles[frame] = sheet.sub(f.frame.x, f.frame.y, f.frame.w, f.frame.h);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> get(name:<span class=\"c-t\">String<\/span>) : h2d.<span class=\"c-t\">Tile<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> tiles[name];   <span class=\"c-c\">// null = typo in name: fail loud on purpose<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> load(name:<span class=\"c-t\">String<\/span>) : <span class=\"c-t\">Atlas<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-k\">new<\/span> <span class=\"c-t\">Atlas<\/span>(<span class=\"c-t\">Reflect<\/span>.field(<span class=\"c-t\">Res<\/span>.img, name), <span class=\"c-t\">Reflect<\/span>.field(<span class=\"c-t\">Res<\/span>.res, name));<\/span>","<span class=\"cl\">}<\/span>"],"raw":"import hxd.Res;\n\nclass Atlas {\n    final tiles = new Map<String, h2d.Tile>();\n    public var sheet(default, null) : h2d.Tile;\n\n    public function new(imageRes:hxd.res.Image, jsonRes:hxd.res.Resource) {\n        sheet = imageRes.toTile();\n        final data = haxe.Json.parse(jsonRes.entry.getText());\n        for (frame in Reflect.fields(data.frames)) {\n            final f : { frame : { x:Int, y:Int, w:Int, h:Int } } =\n                Reflect.field(data.frames, frame);\n            tiles[frame] = sheet.sub(f.frame.x, f.frame.y, f.frame.w, f.frame.h);\n        }\n    }\n    public inline function get(name:String) : h2d.Tile\n        return tiles[name];   // null = typo in name: fail loud on purpose\n    public static function load(name:String) : Atlas\n        return new Atlas(Reflect.field(Res.img, name), Reflect.field(Res.res, name));\n}"},{"k":"ul","i":["<code>get()<\/code> returning null on typo is a feature: the next <code>.x<\/code> access crashes with the <em>sprite name<\/em> in the stack — misloads are unmissable.","One atlas image + one atlas JSON per sheet; <code>Atlas.load(\"sprites\")<\/code> resolves <code>res/img/sprites.png<\/code> + <code>res/res/sprites.json<\/code>."]}],"src":"06_ch05.txt:102","n":111},{"ch":6,"kind":"content","title":"Using the Atlas: From Region to Animation","tt":"Using the Atlas: From Region to Animation","blocks":[{"k":"p","h":"With <code>Atlas<\/code> in hand, the spritesheet workflow becomes two lines."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> atlas = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Atlas<\/span>(<span class=\"c-t\">Res<\/span>.img.sprites, <span class=\"c-t\">Res<\/span>.res.sprites);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> heroIdle = atlas.get(<span class=\"c-s\">\"hero_idle_0\"<\/span>);<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> heroRun  = [ <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...<span class=\"c-n\">8<\/span>) atlas.get(<span class=\"c-s\">'hero_run_$i'<\/span>) ];<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> hero = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Anim<\/span>(heroRun, <span class=\"c-n\">12<\/span>, s2d);<\/span>","<span class=\"cl\">hero.play(heroIdle);<\/span>"],"raw":"final atlas = new Atlas(Res.img.sprites, Res.res.sprites);\n\nfinal heroIdle = atlas.get(\"hero_idle_0\");\nfinal heroRun  = [ for (i in 0...8) atlas.get('hero_run_$i') ];\n\nfinal hero = new h2d.Anim(heroRun, 12, s2d);\nhero.play(heroIdle);"},{"k":"ul","i":["Name your export keys systematically (<code>hero_run_0…7<\/code>) — the pattern builds arrays; ad-hoc names build bugs.","<code>hero_run_$i<\/code> uses Haxe string interpolation — remember it for every data-driven list in this chapter."]}],"src":"06_ch05.txt:116","n":112},{"ch":6,"kind":"content","title":"Synchronous vs Asynchronous Loading","tt":"Synchronous vs Asynchronous Loading","blocks":[{"k":"p","h":"Synchronous loading is simple and brutal: the frame hitches while bytes are read and decoded. Async loading keeps the title screen at 60 FPS while the world loads behind it."},{"k":"code","lang":"haxe","file":"AsyncLoad.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">AsyncLoad<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> boot(onReady:() -&gt; <span class=\"c-t\">Void<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// Res.init(callback) starts the async loader; resources become<\/span><\/span>","<span class=\"cl\">        <span class=\"c-c\">// available progressively, callback fires when the set is done.<\/span><\/span>","<span class=\"cl\">        hxd.<span class=\"c-t\">Res<\/span>.init(<span class=\"c-k\">function<\/span>() onReady());<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> progress() : <span class=\"c-t\">Float<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> l = hxd.<span class=\"c-t\">Res<\/span>.loader;   <span class=\"c-c\">// the shared hxd.res.Loader instance<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> l == <span class=\"c-k\">null<\/span> ? <span class=\"c-n\">0<\/span> : l.progressAmount / <span class=\"c-t\">Math<\/span>.max(<span class=\"c-n\">1<\/span>, l.progressTotal);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class AsyncLoad {\n    public static function boot(onReady:() -> Void) {\n        // Res.init(callback) starts the async loader; resources become\n        // available progressively, callback fires when the set is done.\n        hxd.Res.init(function() onReady());\n    }\n    public static function progress() : Float {\n        final l = hxd.Res.loader;   // the shared hxd.res.Loader instance\n        return l == null ? 0 : l.progressAmount / Math.max(1, l.progressTotal);\n    }\n}"},{"k":"ul","i":["During async loading, <code>Res.x.y<\/code> access blocks like sync on some backends — schedule <em>use<\/em> after <code>onReady<\/code>, poll <code>progress()<\/code> for the bar.","Web: async is the only correct mode (network); desktop: async still improves feel for big sheets."]},{"k":"pit","t":"A progress bar that never moves","h":"Update the bar <b>between<\/b> chunks, then render a frame, then load more — if you consume all pending loads in one tight loop, the bar jumps 0→100% and the point of async is lost."}],"src":"06_ch05.txt:135","n":113},{"ch":6,"kind":"content","title":"Loading Screens with Progress","tt":"Loading Screens with Progress","blocks":[{"k":"p","h":"The player-facing half of async loading — the pattern every shipping game needs."},{"k":"code","lang":"haxe","file":"LoadingScreen.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">LoadingScreen<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> bar : h2d.<span class=\"c-t\">Bitmap<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> label : h2d.<span class=\"c-t\">Text<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(parent:h2d.<span class=\"c-t\">Object<\/span>) {<\/span>","<span class=\"cl\">        bar = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(h2d.<span class=\"c-t\">Tile<\/span>.fromColor(<span class=\"c-n\">0x3DDC97<\/span>, <span class=\"c-n\">1<\/span>, <span class=\"c-n\">12<\/span>), parent);<\/span>","<span class=\"cl\">        bar.tile.dx = <span class=\"c-n\">0<\/span>; bar.x = <span class=\"c-n\">340<\/span>; bar.y = <span class=\"c-n\">400<\/span>; bar.scaleX = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">        label = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Text<\/span>(<span class=\"c-t\">Res<\/span>.fnt.montserrat.toFont(), parent);<\/span>","<span class=\"cl\">        label.text = <span class=\"c-s\">\"loading…\"<\/span>; label.x = <span class=\"c-n\">340<\/span>; label.y = <span class=\"c-n\">370<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update() {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> p = <span class=\"c-t\">AsyncLoad<\/span>.progress();<\/span>","<span class=\"cl\">        bar.scaleX = <span class=\"c-n\">600<\/span> * p;                 <span class=\"c-c\">// 600px wide bar<\/span><\/span>","<span class=\"cl\">        label.text = <span class=\"c-s\">'loading ${Math.round(p*100)}%'<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class LoadingScreen {\n    final bar : h2d.Bitmap;\n    final label : h2d.Text;\n    public function new(parent:h2d.Object) {\n        bar = new h2d.Bitmap(h2d.Tile.fromColor(0x3DDC97, 1, 12), parent);\n        bar.tile.dx = 0; bar.x = 340; bar.y = 400; bar.scaleX = 0;\n        label = new h2d.Text(Res.fnt.montserrat.toFont(), parent);\n        label.text = \"loading…\"; label.x = 340; label.y = 370;\n    }\n    public function update() {\n        final p = AsyncLoad.progress();\n        bar.scaleX = 600 * p;                 // 600px wide bar\n        label.text = 'loading ${Math.round(p*100)}%';\n    }\n}"},{"k":"ul","i":["Driven from a dedicated screen (Chapter 7): loading screen updates on unscaled time, world swaps in when <code>p == 1<\/code>."]},{"k":"best","t":"Show thresholds, not raw bytes","h":"\"Loading cavern-2 … 40%\" reads better than \"12/31 MB\" — map progress onto named phases players understand."}],"src":"06_ch05.txt:157","n":114},{"ch":6,"kind":"content","title":"Memory Management: Disposal and Reference Discipline","tt":"Memory Management: Disposal and Reference Discipline","blocks":[{"k":"p","h":"Textures live on the GPU until released. Heaps reference-counts resources, but <em>your<\/em> code decides lifetimes."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// Release a texture we no longer need (whole atlas page):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> img : hxd.res.<span class=\"c-t\">Image<\/span> = <span class=\"c-t\">Res<\/span>.img.oldWorld;<\/span>","<span class=\"cl\">img.dispose();           <span class=\"c-c\">// frees GPU texture; next toTile() re-uploads<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// Drop cached tiles that hold a page alive:<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\">// (tiles are views — collect and discard them with the level)<\/span><\/span>"],"raw":"// Release a texture we no longer need (whole atlas page):\nfinal img : hxd.res.Image = Res.img.oldWorld;\nimg.dispose();           // frees GPU texture; next toTile() re-uploads\n\n// Drop cached tiles that hold a page alive:\n// (tiles are views — collect and discard them with the level)"},{"k":"ul","i":["<b>Level-scoped assets<\/b>: load per-world atlases on enter, <code>dispose()<\/code> on exit — peak memory = biggest world, not sum of all.","Watch the engine's memory stat in the debug HUD (Chapter 1) while cycling levels twice: flat lines are the goal."]},{"k":"pit","t":"Dispose during use","h":"Disposing an atlas page while an Anim still references its tiles renders garbage (or nothing). Unload order: remove views → clear tile caches → dispose resource. The screen manager (Chapter 7) sequences this for you."}],"src":"06_ch05.txt:171","n":115},{"ch":6,"kind":"content","title":"Hot Reload and File Watchers","tt":"Hot Reload and File Watchers","blocks":[{"k":"p","h":"Heaps resources can watch their source files and fire a callback when they change — instant iteration without restarts."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-t\">Res<\/span>.img.sprites.watch(<span class=\"c-k\">function<\/span>() {<\/span>","<span class=\"cl\">    <span class=\"c-c\">// file changed on disk: refresh the texture and rebuild dependent views<\/span><\/span>","<span class=\"cl\">    <span class=\"c-t\">Res<\/span>.img.sprites.toTile();  <span class=\"c-c\">// reloads and re-uploads<\/span><\/span>","<span class=\"cl\">    renderer.onAtlasChanged(); <span class=\"c-c\">// e.g. re-carve atlas region tiles<\/span><\/span>","<span class=\"cl\">});<\/span>"],"raw":"Res.img.sprites.watch(function() {\n    // file changed on disk: refresh the texture and rebuild dependent views\n    Res.img.sprites.toTile();  // reloads and re-uploads\n    renderer.onAtlasChanged(); // e.g. re-carve atlas region tiles\n});"},{"k":"ul","i":["Watchers work with external resources (desktop dev builds); combine with <code>Res.initLocal()<\/code>.","Best combined with a rebuild script: Aseprite export → watcher fires → sprite updated in the running game within a second."]},{"k":"best","t":"Hot reload for shaders and data too","h":"hxsl shaders recompile on change with the right flags (Chapter 11) and level JSON reloads through the same watch pattern (this chapter's loader re-parses). A five-minute setup saves hundreds of restarts."}],"src":"06_ch05.txt:184","n":116},{"ch":6,"kind":"content","title":"Sprite Management Strategy in a Real Game","tt":"Sprite Management Strategy in a Real Game","blocks":[{"k":"p","h":"Zoom out: the whole-game policy for sprites and textures, decided once."},{"k":"ul","i":["<b>One atlas per world/theme<\/b> (~2048x2048 max on mobile-safe settings), UI atlas separate — screens never wait for world textures.","<b>Tiles are cheap, textures are expensive<\/b>: carve unlimited tiles from a page; never load a second page for one sprite.","<b>Naming conventions encode usage<\/b>: <code>hero_run_0..N<\/code>, <code>gem_ruby<\/code>, <code>cave_bg_mid<\/code> — the loader and level data stay human-readable.","<b>Unload discipline<\/b>: level exit disposes world atlas; UI atlas lives for the app's lifetime."]},{"k":"best","t":"Keep a one-page asset manifest","h":"A table of atlas name → contents → owner → unload policy. When \"why is memory 400 MB?\" gets asked, the manifest answers in seconds."}],"src":"06_ch05.txt:192","n":117},{"ch":6,"kind":"content","title":"Level Data: Choosing a Format","tt":"Level Data: Choosing a Format","blocks":[{"k":"p","h":"Levels are data, and data format choice decides your tooling destiny. The candidates, honestly compared."},{"k":"table","head":["Format","Human-readable","Size","Tooling","Best for"],"rows":[["JSON","yes","large","everything, Tiled exports it","default choice, hand-editable"],["XML","yes","large","classic, Tiled native","interop with legacy tools"],["Plain text","yes","tiny","your own","ASCII tile maps, speedruns to prototype"],["Binary","no","tiny","custom writer/parser","shipped builds, big levels"]]},{"k":"ul","i":["The course pipeline: <b>author JSON, ship JSON<\/b> (it gzips well on web); binary is taught and used for saves (Chapter 7) where it shines."]},{"k":"best","t":"Author in the format you can debug","h":"During development the game should be able to hot-reload a level from a text editor. Binary is a <em>shipment<\/em> optimization, not an authoring one."}],"src":"06_ch05.txt:204","n":118},{"ch":6,"kind":"content","title":"JSON Levels: Schema Design","tt":"JSON Levels: Schema Design","blocks":[{"k":"p","h":"Design the schema before the editor — data shapes drive tool feasibility. Cavern Run's actual level schema:"},{"k":"code","lang":"json","file":"res/levels/cavern1.json","lines":["<span class=\"cl\">{<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"version\"<\/span>: <span class=\"c-n\">2<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"name\"<\/span>: <span class=\"c-s\">\"Fungal Hollow\"<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"size\"<\/span>: { <span class=\"c-f\">\"w\"<\/span>: <span class=\"c-n\">40<\/span>, <span class=\"c-f\">\"h\"<\/span>: <span class=\"c-n\">23<\/span> },<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"tiles\"<\/span>: <span class=\"c-s\">\"………………#………\\n……####……\"<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"entities\"<\/span>: [<\/span>","<span class=\"cl\">    { <span class=\"c-f\">\"kind\"<\/span>: <span class=\"c-s\">\"player\"<\/span>, <span class=\"c-f\">\"x\"<\/span>: <span class=\"c-n\">3<\/span>, <span class=\"c-f\">\"y\"<\/span>: <span class=\"c-n\">18<\/span> },<\/span>","<span class=\"cl\">    { <span class=\"c-f\">\"kind\"<\/span>: <span class=\"c-s\">\"gem\"<\/span>,   <span class=\"c-f\">\"x\"<\/span>: <span class=\"c-n\">12<\/span>, <span class=\"c-f\">\"y\"<\/span>: <span class=\"c-n\">16<\/span>, <span class=\"c-f\">\"gem\"<\/span>: <span class=\"c-s\">\"ruby\"<\/span> },<\/span>","<span class=\"cl\">    { <span class=\"c-f\">\"kind\"<\/span>: <span class=\"c-s\">\"bat\"<\/span>,   <span class=\"c-f\">\"x\"<\/span>: <span class=\"c-n\">20<\/span>, <span class=\"c-f\">\"y\"<\/span>: <span class=\"c-n\">10<\/span>, <span class=\"c-f\">\"range\"<\/span>: <span class=\"c-n\">5<\/span> },<\/span>","<span class=\"cl\">    { <span class=\"c-f\">\"kind\"<\/span>: <span class=\"c-s\">\"door\"<\/span>,  <span class=\"c-f\">\"x\"<\/span>: <span class=\"c-n\">37<\/span>, <span class=\"c-f\">\"y\"<\/span>: <span class=\"c-n\">17<\/span> }<\/span>","<span class=\"cl\">  ],<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"theme\"<\/span>: <span class=\"c-s\">\"cave\"<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"music\"<\/span>: <span class=\"c-s\">\"cave_ambient\"<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"{\n  \"version\": 2,\n  \"name\": \"Fungal Hollow\",\n  \"size\": { \"w\": 40, \"h\": 23 },\n  \"tiles\": \"………………#………\\n……####……\",\n  \"entities\": [\n    { \"kind\": \"player\", \"x\": 3, \"y\": 18 },\n    { \"kind\": \"gem\",   \"x\": 12, \"y\": 16, \"gem\": \"ruby\" },\n    { \"kind\": \"bat\",   \"x\": 20, \"y\": 10, \"range\": 5 },\n    { \"kind\": \"door\",  \"x\": 37, \"y\": 17 }\n  ],\n  \"theme\": \"cave\",\n  \"music\": \"cave_ambient\"\n}"},{"k":"ul","i":["<code>tiles<\/code> as newline-joined strings keeps files diffable — the ASCII map IS the level.","<code>version<\/code> from day one (migration slide ahead); <code>theme<\/code> selects the atlas page."]},{"k":"best","t":"Schema = the game design contract","h":"When you add a mechanic, add a field with a default. Never repurpose existing fields — old levels and old tools both break in silent ways."}],"src":"06_ch05.txt:226","n":119},{"ch":6,"kind":"content","title":"Parsing JSON Levels: The Loader","tt":"Parsing JSON Levels: The Loader","blocks":[{"k":"p","h":"Schema defined; now the code that turns text into a live world. Note the strictness — strictness is love."},{"k":"code","lang":"haxe","file":"JsonLevel.hx","lines":["<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">LevelData<\/span> = {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> version : <span class=\"c-t\">Int<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> name : <span class=\"c-t\">String<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> w : <span class=\"c-t\">Int<\/span>;  <span class=\"c-k\">final<\/span> h : <span class=\"c-t\">Int<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> tileIds : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Int<\/span>&gt;&gt;;   <span class=\"c-c\">// decoded from ASCII rows<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> spawns : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">SpawnDef<\/span>&gt;;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> theme : <span class=\"c-t\">String<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">SpawnDef<\/span> = { <span class=\"c-k\">final<\/span> kind : <span class=\"c-t\">String<\/span>; <span class=\"c-k\">final<\/span> x : <span class=\"c-t\">Int<\/span>; <span class=\"c-k\">final<\/span> y : <span class=\"c-t\">Int<\/span>; <span class=\"c-k\">final<\/span> ?gem : <span class=\"c-t\">String<\/span>; <span class=\"c-k\">final<\/span> ?range : <span class=\"c-t\">Int<\/span>; }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">LevelJson<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> parse(text:<span class=\"c-t\">String<\/span>) : <span class=\"c-t\">LevelData<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> raw = haxe.<span class=\"c-t\">Json<\/span>.parse(text);<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (raw.version != <span class=\"c-n\">2<\/span>) <span class=\"c-k\">throw<\/span> <span class=\"c-s\">'unsupported level version ${raw.version}'<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> rows : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">String<\/span>&gt; = raw.tiles.split(<span class=\"c-s\">\"\\n\"<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (rows.length != raw.size.h) <span class=\"c-k\">throw<\/span> <span class=\"c-s\">'tile rows ${rows.length} != size.h ${raw.size.h}'<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> {<\/span>","<span class=\"cl\">            version: raw.version,<\/span>","<span class=\"cl\">            name: raw.name,<\/span>","<span class=\"cl\">            w: raw.size.w, h: raw.size.h,<\/span>","<span class=\"cl\">            tileIds: [ <span class=\"c-k\">for<\/span> (row in rows) [ <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...row.length) charToId(row.charAt(i)) ] ],<\/span>","<span class=\"cl\">            spawns: raw.entities,<\/span>","<span class=\"cl\">            theme: raw.theme,<\/span>","<span class=\"cl\">        };<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> charToId(c:<span class=\"c-t\">String<\/span>) : <span class=\"c-t\">Int<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-k\">switch<\/span> c {<\/span>","<span class=\"cl\">            <span class=\"c-k\">case<\/span> <span class=\"c-s\">\".\"<\/span>: <span class=\"c-n\">0<\/span>;  <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"#\"<\/span>: <span class=\"c-n\">1<\/span>;  <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"=\"<\/span>: <span class=\"c-n\">2<\/span>;  <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"^\"<\/span>: <span class=\"c-n\">3<\/span>; <span class=\"c-c\">// spikes<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">case<\/span> t: <span class=\"c-k\">throw<\/span> <span class=\"c-s\">'unknown tile char: \"$t\"'<\/span>;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"typedef LevelData = {\n    final version : Int;\n    final name : String;\n    final w : Int;  final h : Int;\n    final tileIds : Array<Array<Int>>;   // decoded from ASCII rows\n    final spawns : Array<SpawnDef>;\n    final theme : String;\n}\n\ntypedef SpawnDef = { final kind : String; final x : Int; final y : Int; final ?gem : String; final ?range : Int; }\n\nclass LevelJson {\n    public static function parse(text:String) : LevelData {\n        final raw = haxe.Json.parse(text);\n        if (raw.version != 2) throw 'unsupported level version ${raw.version}';\n        final rows : Array<String> = raw.tiles.split(\"\\n\");\n        if (rows.length != raw.size.h) throw 'tile rows ${rows.length} != size.h ${raw.size.h}';\n        return {\n            version: raw.version,\n            name: raw.name,\n            w: raw.size.w, h: raw.size.h,\n            tileIds: [ for (row in rows) [ for (i in 0...row.length) charToId(row.charAt(i)) ] ],\n            spawns: raw.entities,\n            theme: raw.theme,\n        };\n    }\n    static function charToId(c:String) : Int\n        return switch c {\n            case \".\": 0;  case \"#\": 1;  case \"=\": 2;  case \"^\": 3; // spikes\n            case t: throw 'unknown tile char: \"$t\"';\n        }\n}"},{"k":"ul","i":["Every structural expectation is checked with a thrown message naming the file — corrupt levels are found at load, not mid-jump."]}],"src":"06_ch05.txt:264","n":120},{"ch":6,"kind":"content","title":"Validating and Reporting Level Errors","tt":"Validating and Reporting Level Errors","blocks":[{"k":"p","h":"Beyond structure, semantic validation catches design mistakes before playtesting does."},{"k":"code","lang":"haxe","file":"LevelValidator.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">LevelValidator<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">RULES<\/span> : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">String<\/span>&gt; = [];<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> validate(l:<span class=\"c-t\">LevelData<\/span>) : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">String<\/span>&gt; {<\/span>","<span class=\"cl\">        <span class=\"c-t\">RULES<\/span>.splice(<span class=\"c-n\">0<\/span>, <span class=\"c-t\">RULES<\/span>.length);<\/span>","<span class=\"cl\">        exactlyOne(l, <span class=\"c-s\">\"player\"<\/span>);<\/span>","<span class=\"cl\">        atLeast(l, <span class=\"c-s\">\"door\"<\/span>, <span class=\"c-n\">1<\/span>);<\/span>","<span class=\"cl\">        reachable(l);                       <span class=\"c-c\">// BFS from player through walkables<\/span><\/span>","<span class=\"cl\">        noSpikesOnSpawn(l);<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-t\">RULES<\/span>.copy();               <span class=\"c-c\">// empty = valid<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> exactlyOne(l:<span class=\"c-t\">LevelData<\/span>, kind:<span class=\"c-t\">String<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> n = l.spawns.filter(s -&gt; s.kind == kind).length;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (n != <span class=\"c-n\">1<\/span>) <span class=\"c-t\">RULES<\/span>.push(<span class=\"c-s\">'need exactly 1 \"$kind\", found $n'<\/span>);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> reachable(l:<span class=\"c-t\">LevelData<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// flood-fill from player; flag spawns stranded inside walls<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> noSpikesOnSpawn(l:<span class=\"c-t\">LevelData<\/span>) { <span class=\"c-c\">/* … */<\/span> }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class LevelValidator {\n    static final RULES : Array<String> = [];\n    public static function validate(l:LevelData) : Array<String> {\n        RULES.splice(0, RULES.length);\n        exactlyOne(l, \"player\");\n        atLeast(l, \"door\", 1);\n        reachable(l);                       // BFS from player through walkables\n        noSpikesOnSpawn(l);\n        return RULES.copy();               // empty = valid\n    }\n    static function exactlyOne(l:LevelData, kind:String) {\n        final n = l.spawns.filter(s -> s.kind == kind).length;\n        if (n != 1) RULES.push('need exactly 1 \"$kind\", found $n');\n    }\n    static function reachable(l:LevelData) {\n        // flood-fill from player; flag spawns stranded inside walls\n    }\n    static function noSpikesOnSpawn(l:LevelData) { /* … */ }\n}"},{"k":"best","t":"Validation output goes to the level editor UI","h":"The same rule list feeds an in-game validator panel (F5) — designers see errors in seconds, not in code review. Editor integration is Chapter 8's particle-editor pattern applied to levels."}],"src":"06_ch05.txt:289","n":121},{"ch":6,"kind":"content","title":"XML Levels: When You Inherit Them","tt":"XML Levels: When You Inherit Them","blocks":[{"k":"p","h":"XML is not better — but Tiled's classic exports, legacy pipelines and some studios' tools speak it. Reading it is a 15-minute skill."},{"k":"code","lang":"haxe","file":"LevelXml.hx","lines":["<span class=\"cl\"><span class=\"c-k\">import<\/span> haxe.xml.<span class=\"c-t\">Access<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">LevelXml<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> parse(text:<span class=\"c-t\">String<\/span>) : <span class=\"c-t\">LevelData<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> xml = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Access<\/span>(<span class=\"c-t\">Xml<\/span>.parse(text).firstElement());<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> w = <span class=\"c-t\">Std<\/span>.parseInt(xml.att.w), h = <span class=\"c-t\">Std<\/span>.parseInt(xml.att.h);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> spawns = [ <span class=\"c-k\">for<\/span> (e in xml.nodes.entity) {<\/span>","<span class=\"cl\">            kind : e.att.kind,<\/span>","<span class=\"cl\">            x : <span class=\"c-t\">Std<\/span>.parseInt(e.att.x), y : <span class=\"c-t\">Std<\/span>.parseInt(e.att.y),<\/span>","<span class=\"cl\">        }];<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> { version : <span class=\"c-n\">2<\/span>, name : xml.att.name, w : w, h : h,<\/span>","<span class=\"cl\">                 tileIds : [], spawns : spawns, theme : xml.att.theme };<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"import haxe.xml.Access;\n\nclass LevelXml {\n    public static function parse(text:String) : LevelData {\n        final xml = new Access(Xml.parse(text).firstElement());\n        final w = Std.parseInt(xml.att.w), h = Std.parseInt(xml.att.h);\n        final spawns = [ for (e in xml.nodes.entity) {\n            kind : e.att.kind,\n            x : Std.parseInt(e.att.x), y : Std.parseInt(e.att.y),\n        }];\n        return { version : 2, name : xml.att.name, w : w, h : h,\n                 tileIds : [], spawns : spawns, theme : xml.att.theme };\n    }\n}"},{"k":"ul","i":["<code>haxe.xml.Access<\/code> gives safe attribute/node traversal; missing attributes throw with precise messages.","XML suits deep hierarchies; JSON suits flat lists — levels are usually flat."]},{"k":"note","h":"Tiled can export JSON — if you get to choose, export JSON and keep one parser. Keep the XML one only for interop you do not control."}],"src":"06_ch05.txt:311","n":122},{"ch":6,"kind":"content","title":"Plain-Text Levels: The ASCII Prototype","tt":"Plain-Text Levels: The ASCII Prototype","blocks":[{"k":"p","h":"For tile-only levels, the fastest editor on earth is a text editor. Cavern Run's tiles row IS this format."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">res/levels/cavern1.tiles<\/span>","<span class=\"cl\">……………………………………<\/span>","<span class=\"cl\">……#####………………<\/span>","<span class=\"cl\">……#……………………#……<\/span>","<span class=\"cl\">……#…g……b…………#……<\/span>","<span class=\"cl\">##########P……D######<\/span>","<span class=\"cl\">######################<\/span>"],"raw":"res/levels/cavern1.tiles\n……………………………………\n……#####………………\n……#……………………#……\n……#…g……b…………#……\n##########P……D######\n######################"},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// decode: one char = one tile id, rows separated by \\n<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> ids = [ <span class=\"c-k\">for<\/span> (row in text.split(<span class=\"c-s\">\"\\n\"<\/span>)) [ <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...row.length) map(row.charCodeAt(i)) ] ];<\/span>"],"raw":"// decode: one char = one tile id, rows separated by \\n\nfinal ids = [ for (row in text.split(\"\\n\")) [ for (i in 0...row.length) map(row.charCodeAt(i)) ] ];"},{"k":"ul","i":["Legend: <code>.<\/code> empty, <code>#<\/code> wall, <code>=<\/code> platform, <code>^<\/code> spike, <code>P<\/code> player, <code>g<\/code> gem, <code>b<\/code> bat, <code>D<\/code> door.","The whole first prototype of any tile game should ship in this format — you iterate on the <em>game<\/em>, not the tooling."]},{"k":"pit","t":"Hand-authoring past ~10 levels","h":"Humans cannot keep difficulty curves in their heads. The moment you feel this, graduate to Tiled/JSON with the same loader underneath — the schema stays, only the authoring surface changes."}],"src":"06_ch05.txt:330","n":123},{"ch":6,"kind":"content","title":"Binary Levels: Bytes, BytesInput and BytesOutput","tt":"Binary Levels: Bytes, BytesInput and BytesOutput","blocks":[{"k":"p","h":"When levels ship (or saves serialize — Chapter 7 uses this exact toolkit), binary cuts size by ~10x and parsing by ~50x vs JSON."},{"k":"code","lang":"haxe","file":"LevelBin.hx","lines":["<span class=\"cl\"><span class=\"c-k\">import<\/span> haxe.io.<span class=\"c-t\">Bytes<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">import<\/span> haxe.io.<span class=\"c-t\">BytesInput<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">import<\/span> haxe.io.<span class=\"c-t\">BytesOutput<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">LevelBin<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> write(l:<span class=\"c-t\">LevelData<\/span>) : <span class=\"c-t\">Bytes<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> o = <span class=\"c-k\">new<\/span> <span class=\"c-t\">BytesOutput<\/span>();<\/span>","<span class=\"cl\">        o.writeInt32(l.version);<\/span>","<span class=\"cl\">        o.writeInt32(l.w); o.writeInt32(l.h);<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (row in l.tileIds) <span class=\"c-k\">for<\/span> (t in row) o.writeByte(t);      <span class=\"c-c\">// packed grid<\/span><\/span>","<span class=\"cl\">        o.writeInt32(l.spawns.length);<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (s in l.spawns) {<\/span>","<span class=\"cl\">            o.writeInt32(s.kind.length); o.writeString(s.kind);  <span class=\"c-c\">// length-prefixed<\/span><\/span>","<span class=\"cl\">            o.writeInt32(s.x); o.writeInt32(s.y);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> o.getBytes();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> read(b:<span class=\"c-t\">Bytes<\/span>) : <span class=\"c-t\">LevelData<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> i = <span class=\"c-k\">new<\/span> <span class=\"c-t\">BytesInput<\/span>(b);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> ver = i.readInt32();<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (ver != <span class=\"c-n\">2<\/span>) <span class=\"c-k\">throw<\/span> <span class=\"c-s\">'unsupported level version $ver'<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> w = i.readInt32(), h = i.readInt32();<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> rows = [ <span class=\"c-k\">for<\/span> (_ in <span class=\"c-n\">0<\/span>...h) [ <span class=\"c-k\">for<\/span> (_ in <span class=\"c-n\">0<\/span>...w) i.readByte() ] ];<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> spawns = [ <span class=\"c-k\">for<\/span> (_ in <span class=\"c-n\">0<\/span>...i.readInt32()) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> kind = i.readString(i.readInt32());   <span class=\"c-c\">// length-prefixed<\/span><\/span>","<span class=\"cl\">            kind : kind, x : i.readInt32(), y : i.readInt32(),<\/span>","<span class=\"cl\">        }];<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> { version : ver, name : <span class=\"c-s\">\"bin\"<\/span>, w : w, h : h, tileIds : rows, spawns : spawns, theme : <span class=\"c-s\">\"cave\"<\/span> };<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"import haxe.io.Bytes;\nimport haxe.io.BytesInput;\nimport haxe.io.BytesOutput;\n\nclass LevelBin {\n    public static function write(l:LevelData) : Bytes {\n        final o = new BytesOutput();\n        o.writeInt32(l.version);\n        o.writeInt32(l.w); o.writeInt32(l.h);\n        for (row in l.tileIds) for (t in row) o.writeByte(t);      // packed grid\n        o.writeInt32(l.spawns.length);\n        for (s in l.spawns) {\n            o.writeInt32(s.kind.length); o.writeString(s.kind);  // length-prefixed\n            o.writeInt32(s.x); o.writeInt32(s.y);\n        }\n        return o.getBytes();\n    }\n    public static function read(b:Bytes) : LevelData {\n        final i = new BytesInput(b);\n        final ver = i.readInt32();\n        if (ver != 2) throw 'unsupported level version $ver';\n        final w = i.readInt32(), h = i.readInt32();\n        final rows = [ for (_ in 0...h) [ for (_ in 0...w) i.readByte() ] ];\n        final spawns = [ for (_ in 0...i.readInt32()) {\n            final kind = i.readString(i.readInt32());   // length-prefixed\n            kind : kind, x : i.readInt32(), y : i.readInt32(),\n        }];\n        return { version : ver, name : \"bin\", w : w, h : h, tileIds : rows, spawns : spawns, theme : \"cave\" };\n    }\n}"},{"k":"best","t":"Same data class, many codecs","h":"<code>LevelData<\/code> is one typedef; JSON/XML/text/binary are four codecs for it. New format? One new codec file, zero game changes."}],"src":"06_ch05.txt:366","n":124},{"ch":6,"kind":"content","title":"Format Comparison in Practice","tt":"Format Comparison in Practice","blocks":[{"k":"p","h":"Measured guidance for Cavern Run's levels (40x23, ~20 entities)."},{"k":"table","head":["Metric","JSON","Binary"],"rows":[["File size","~3.5 KB","~0.4 KB"],["Parse time (100 loads)","~12 ms","~0.4 ms"],["Human-editable","yes","no"],["Diff-friendly in git","yes","no"],["Hot reload","yes","rebuild step"]]},{"k":"ul","i":["Web builds: JSON arrives gzipped (network cost ~= binary), so JSON often wins even shipped.","Consoles/mobile with file IO: binary avoids decode hitches on big levels."]},{"k":"best","t":"Ship the format you measured, not the one you feared","h":"The table above for <em>your<\/em> level sizes decides in five minutes. Protip: generate it by timing your own loader in a debug screen (Chapter 1's HUD does the timing)."}],"src":"06_ch05.txt:380","n":125},{"ch":6,"kind":"content","title":"Designing the Custom Level Format: Decisions","tt":"Designing the Custom Level Format: Decisions","blocks":[{"k":"p","h":"Zooming out from codecs to format <em>design<\/em> — the decisions that outlive engines."},{"k":"ul","i":["<b>Identity<\/b>: stable <code>id<\/code> per level (not filename) — saves, leaderboards and debug keys reference it forever.","<b>Version field + defaults<\/b>: missing fields mean \"default\" — forward compatibility for free.","<b>Entities as data, not classes<\/b>: <code>kind<\/code> string + fields; the world maps kinds to behaviors (Chapter 4's <code>EntityKind<\/code>).","<b>Theme as data<\/b>: theme selects atlas page, music, palette — the same level file rethemes into a new world."]},{"k":"note","h":"Cavern Run ships exactly these four decisions. Every one of them was cheaper at format-time than it would have been at content-time."}],"src":"06_ch05.txt:388","n":126},{"ch":6,"kind":"content","title":"The Level Loader Interface","tt":"The Level Loader Interface","blocks":[{"k":"p","h":"The game should not know which codec produced a level. One interface, four implementations behind it."},{"k":"code","lang":"haxe","file":"ILevelLoader.hx","lines":["<span class=\"cl\"><span class=\"c-k\">interface<\/span> <span class=\"c-t\">ILevelLoader<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> detect(entry:hxd.res.<span class=\"c-t\">Resource<\/span>) : <span class=\"c-t\">Bool<\/span>;   <span class=\"c-c\">// by extension<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> load(entry:hxd.res.<span class=\"c-t\">Resource<\/span>) : <span class=\"c-t\">LevelData<\/span>; <span class=\"c-c\">// throws LevelError<\/span><\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">LevelLoaders<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> all : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">ILevelLoader<\/span>&gt; = [<\/span>","<span class=\"cl\">        <span class=\"c-k\">new<\/span> <span class=\"c-t\">JsonLevelLoader<\/span>(),   <span class=\"c-c\">// .json<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">new<\/span> <span class=\"c-t\">TextLevelLoader<\/span>(),   <span class=\"c-c\">// .tiles<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">new<\/span> <span class=\"c-t\">BinLevelLoader<\/span>(),    <span class=\"c-c\">// .bin<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">new<\/span> <span class=\"c-t\">XmlLevelLoader<\/span>(),    <span class=\"c-c\">// .xml<\/span><\/span>","<span class=\"cl\">    ];<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> load(entry:hxd.res.<span class=\"c-t\">Resource<\/span>) : <span class=\"c-t\">LevelData<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (l in all) <span class=\"c-k\">if<\/span> (l.detect(entry))<\/span>","<span class=\"cl\">            <span class=\"c-k\">return<\/span> validate(l.load(entry));<\/span>","<span class=\"cl\">        <span class=\"c-k\">throw<\/span> <span class=\"c-s\">'no loader for ${entry.entry.path}'<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> validate(l:<span class=\"c-t\">LevelData<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> errs = <span class=\"c-t\">LevelValidator<\/span>.validate(l);<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (errs.length &gt; <span class=\"c-n\">0<\/span>) <span class=\"c-k\">throw<\/span> <span class=\"c-s\">'level ${l.name}: ${errs.join(\"; \")}'<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> l;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"interface ILevelLoader {\n    function detect(entry:hxd.res.Resource) : Bool;   // by extension\n    function load(entry:hxd.res.Resource) : LevelData; // throws LevelError\n}\n\nclass LevelLoaders {\n    public static var all : Array<ILevelLoader> = [\n        new JsonLevelLoader(),   // .json\n        new TextLevelLoader(),   // .tiles\n        new BinLevelLoader(),    // .bin\n        new XmlLevelLoader(),    // .xml\n    ];\n    public static function load(entry:hxd.res.Resource) : LevelData {\n        for (l in all) if (l.detect(entry))\n            return validate(l.load(entry));\n        throw 'no loader for ${entry.entry.path}';\n    }\n    static function validate(l:LevelData) {\n        final errs = LevelValidator.validate(l);\n        if (errs.length > 0) throw 'level ${l.name}: ${errs.join(\"; \")}';\n        return l;\n    }\n}"},{"k":"ul","i":["Detection by file extension keeps authoring frictionless: designers use whatever tool fits the day."]},{"k":"best","t":"Validation inside the loader, not the caller","h":"Every load path — game, editor, tests, CI level-lint — gets validation for free because it cannot be forgotten."}],"src":"06_ch05.txt:418","n":127},{"ch":6,"kind":"content","title":"Loading Levels into the World","tt":"Loading Levels into the World","blocks":[{"k":"p","h":"The final step: LevelData → live entities and tiles. This is where Chapter 4's architecture pays rent."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">LevelFactory<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> build(w:<span class=\"c-t\">WorldController<\/span>, data:<span class=\"c-t\">LevelData<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> atlas = <span class=\"c-t\">ThemeAtlas<\/span>.get(data.theme);      <span class=\"c-c\">// per-theme atlas page<\/span><\/span>","<span class=\"cl\">        w.level = <span class=\"c-t\">TileGrid<\/span>.fromData(data, atlas);      <span class=\"c-c\">// Chapter 6 uses this<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (s in data.spawns) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> e = <span class=\"c-k\">switch<\/span> s.kind {<\/span>","<span class=\"cl\">                <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"player\"<\/span>: <span class=\"c-t\">HeroFactory<\/span>.make(s);<\/span>","<span class=\"cl\">                <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"bat\"<\/span>:    <span class=\"c-k\">new<\/span> <span class=\"c-t\">Entity<\/span>(<span class=\"c-t\">KBat<\/span>, s.x * <span class=\"c-t\">T<\/span>, s.y * <span class=\"c-t\">T<\/span>).add(<span class=\"c-k\">new<\/span> <span class=\"c-t\">Patrol<\/span>(s.range * <span class=\"c-t\">T<\/span>));<\/span>","<span class=\"cl\">                <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"gem\"<\/span>:    <span class=\"c-t\">GemFactory<\/span>.make(s.gem, s.x, s.y);<\/span>","<span class=\"cl\">                <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"door\"<\/span>:   <span class=\"c-k\">new<\/span> <span class=\"c-t\">Entity<\/span>(<span class=\"c-t\">KDoor<\/span>, s.x * <span class=\"c-t\">T<\/span>, s.y * <span class=\"c-t\">T<\/span>);<\/span>","<span class=\"cl\">                <span class=\"c-k\">case<\/span> k: <span class=\"c-k\">throw<\/span> <span class=\"c-s\">'unknown spawn kind $k'<\/span>;<\/span>","<span class=\"cl\">            }<\/span>","<span class=\"cl\">            w.entities.push(e);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class LevelFactory {\n    public static function build(w:WorldController, data:LevelData) {\n        final atlas = ThemeAtlas.get(data.theme);      // per-theme atlas page\n        w.level = TileGrid.fromData(data, atlas);      // Chapter 6 uses this\n        for (s in data.spawns) {\n            final e = switch s.kind {\n                case \"player\": HeroFactory.make(s);\n                case \"bat\":    new Entity(KBat, s.x * T, s.y * T).add(new Patrol(s.range * T));\n                case \"gem\":    GemFactory.make(s.gem, s.x, s.y);\n                case \"door\":   new Entity(KDoor, s.x * T, s.y * T);\n                case k: throw 'unknown spawn kind $k';\n            }\n            w.entities.push(e);\n        }\n    }\n}"},{"k":"ul","i":["Factories per complex kind keep the switch small; simple kinds stay inline.","<code>T<\/code> = tile size in pixels — one constant keeping design-space (tiles) and render-space (pixels) honest."]}],"src":"06_ch05.txt:441","n":128},{"ch":6,"kind":"content","title":"Versioning Level Data and Migration","tt":"Versioning Level Data and Migration","blocks":[{"k":"p","h":"Content outlives code. <code>version<\/code> fields plus a migration chain keep old levels loadable forever."},{"k":"code","lang":"haxe","file":"LevelMigrations.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">LevelMigrations<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> migrations = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Map<\/span>&lt;<span class=\"c-t\">Int<\/span>, (<span class=\"c-t\">Dynamic<\/span>) -&gt; <span class=\"c-t\">Dynamic<\/span>&gt;();  <span class=\"c-c\">// from → to<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> toCurrent(raw:<span class=\"c-t\">Dynamic<\/span>) : <span class=\"c-t\">LevelData<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (raw.version == <span class=\"c-k\">null<\/span>) raw.version = <span class=\"c-n\">1<\/span>;              <span class=\"c-c\">// pre-version era<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">while<\/span> (raw.version &lt; <span class=\"c-n\">2<\/span>) {<\/span>","<span class=\"cl\">            raw = migrations[raw.version](raw);<\/span>","<span class=\"cl\">            raw.version++;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (raw.version != <span class=\"c-n\">2<\/span>) <span class=\"c-k\">throw<\/span> <span class=\"c-s\">'level from the future (v${raw.version})'<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> raw;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> register() {<\/span>","<span class=\"cl\">        migrations[<span class=\"c-n\">1<\/span>] = raw -&gt; {               <span class=\"c-c\">// v1→v2: gems gained colors<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">for<\/span> (e in raw.entities) <span class=\"c-k\">if<\/span> (e.kind == <span class=\"c-s\">\"gem\"<\/span> &amp;&amp; e.gem == <span class=\"c-k\">null<\/span>) e.gem = <span class=\"c-s\">\"ruby\"<\/span>;<\/span>","<span class=\"cl\">            <span class=\"c-k\">return<\/span> raw;<\/span>","<span class=\"cl\">        };<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class LevelMigrations {\n    static final migrations = new Map<Int, (Dynamic) -> Dynamic>();  // from → to\n    public static function toCurrent(raw:Dynamic) : LevelData {\n        if (raw.version == null) raw.version = 1;              // pre-version era\n        while (raw.version < 2) {\n            raw = migrations[raw.version](raw);\n            raw.version++;\n        }\n        if (raw.version != 2) throw 'level from the future (v${raw.version})';\n        return raw;\n    }\n    public static function register() {\n        migrations[1] = raw -> {               // v1→v2: gems gained colors\n            for (e in raw.entities) if (e.kind == \"gem\" && e.gem == null) e.gem = \"ruby\";\n            return raw;\n        };\n    }\n}"},{"k":"ul","i":["Write a migration when the schema changes; keep a v1 level file in a <code>testlevels/<\/code> folder so the chain is regression-tested."]},{"k":"pit","t":"\"I'll just fix the levels by hand\"","h":"At five levels, maybe. At fifty, you will skip fixing some and ship a crash. Migration code is cheaper than even one shipped content bug."}],"src":"06_ch05.txt:466","n":129},{"ch":6,"kind":"content","title":"Project: Load and Render a JSON Level","tt":"Project: Load and Render a JSON Level","blocks":[{"k":"p","h":"Chapter 5's exit ticket — Cavern Run loads <code>cavern1.json<\/code> and draws it."},{"k":"code","lang":"haxe","file":"LevelBoot.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">LevelBoot<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> run(s2d:h2d.<span class=\"c-t\">Scene<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// 1. typed resource for the level file<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> entry = <span class=\"c-t\">Res<\/span>.levels.cavern1;<\/span>","<span class=\"cl\">        <span class=\"c-c\">// 2. codec + validation + migration<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> data = <span class=\"c-t\">LevelLoaders<\/span>.load(entry);<\/span>","<span class=\"cl\">        <span class=\"c-c\">// 3. world + entities<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> world = <span class=\"c-k\">new<\/span> <span class=\"c-t\">WorldController<\/span>();<\/span>","<span class=\"cl\">        <span class=\"c-t\">LevelFactory<\/span>.build(world, data);<\/span>","<span class=\"cl\">        <span class=\"c-c\">// 4. render: tile grid draws each tile id as an atlas tile<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> grid = <span class=\"c-k\">new<\/span> <span class=\"c-t\">TileGridView<\/span>(world.level, s2d);<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> world;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class LevelBoot {\n    public static function run(s2d:h2d.Scene) {\n        // 1. typed resource for the level file\n        final entry = Res.levels.cavern1;\n        // 2. codec + validation + migration\n        final data = LevelLoaders.load(entry);\n        // 3. world + entities\n        final world = new WorldController();\n        LevelFactory.build(world, data);\n        // 4. render: tile grid draws each tile id as an atlas tile\n        final grid = new TileGridView(world.level, s2d);\n        return world;\n    }\n}"},{"k":"ul","i":["Run it, walk the map with the debug camera (Chapter 3's <code>cameraX/cameraY<\/code>), and F5-edit the JSON: hot-reload through <code>entry.watch()<\/code> reloads the level in-place."]}],"src":"06_ch05.txt:486","n":130},{"ch":6,"kind":"content","title":"Chapter 5 Checklist","tt":"Chapter 5 Checklist","blocks":[{"k":"ul","i":["Atlas built via TexturePacker JSON; <code>Atlas<\/code> class carves named tiles.","Boot set embedded; game set loads async with a working progress bar.","Level exit disposes world atlas; memory graph is flat across level cycles.","Hot reload wired for at least one atlas page and one level file.","<code>LevelData<\/code> schema with <code>version<\/code>, validated on every load, migrating v1→v2.","Four codecs behind <code>ILevelLoader<\/code>; JSON is the authoring format.","Entities spawn from data via factories — no level content in code."]}],"src":"06_ch05.txt:495","n":131},{"ch":7,"kind":"chapter","title":"Gameplay Mechanics: Collisions, Lives &amp; Camera","tt":"Gameplay Mechanics: Collisions, Lives & Camera","sub":"AABB math, tile collision, spatial partitioning, player lives, game over and the game camera — the vertical slice chapter.","blocks":[],"src":"07_ch06.txt:1","n":132},{"ch":7,"kind":"content","title":"The Gameplay Loop of a Platformer","tt":"The Gameplay Loop of a Platformer","blocks":[{"k":"p","h":"Before math, the shape of the thing: what a Cavern Run frame actually does, in order."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">tick (fixed 1/60, Chapter 2 accumulator):<\/span>","<span class=\"cl\"> 1 read input        → intended velocity<\/span>","<span class=\"cl\"> 2 apply gravity     → vy += G * dt<\/span>","<span class=\"cl\"> 3 integrate         → tentative new position<\/span>","<span class=\"cl\"> 4 collide &amp; resolve → position corrected against tiles/entities<\/span>","<span class=\"cl\"> 5 entity interactions→ pickups, hazards, enemies<\/span>","<span class=\"cl\"> 6 camera update     → follows resolved player position<\/span>"],"raw":"tick (fixed 1/60, Chapter 2 accumulator):\n 1 read input        → intended velocity\n 2 apply gravity     → vy += G * dt\n 3 integrate         → tentative new position\n 4 collide & resolve → position corrected against tiles/entities\n 5 entity interactions→ pickups, hazards, enemies\n 6 camera update     → follows resolved player position"},{"k":"ul","i":["Order matters: resolve before the camera looks, or the camera shakes with the correction.","Everything this chapter slots into step 3–6 of this loop; steps 1–2 were Chapters 2–4."]},{"k":"best","t":"Fix the loop shape first, then tune","h":"The precise order (gravity → integrate → resolve → interact) is 90% of \"platformer feel\". Tune numbers later, but never reorder casually."}],"src":"07_ch06.txt:18","n":133},{"ch":7,"kind":"content","title":"Player Controller: Intent, Physics, Feel","tt":"Player Controller: Intent, Physics, Feel","blocks":[{"k":"p","h":"A platformer character is three numbers (accel, friction, gravity) and one honesty about what input means."},{"k":"code","lang":"haxe","file":"HeroMove.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">HeroMove<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">ACCEL<\/span>   = <span class=\"c-n\">2600<\/span>;      <span class=\"c-c\">// px/s^2 ground<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">AIR<\/span>     = <span class=\"c-n\">1600<\/span>;      <span class=\"c-c\">// px/s^2 air control<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">FRICTION<\/span>= <span class=\"c-n\">2200<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">GRAV<\/span>    = <span class=\"c-n\">1900<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">JUMP<\/span>    = <span class=\"c-n\">620<\/span>;       <span class=\"c-c\">// initial jump velocity px/s<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">MAXVX<\/span>   = <span class=\"c-n\">240<\/span>;       <span class=\"c-c\">// run speed cap<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> vx = <span class=\"c-n\">0.0<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> vy = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> onGround = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> tick(dt:<span class=\"c-t\">Float<\/span>, left:<span class=\"c-t\">Bool<\/span>, right:<span class=\"c-t\">Bool<\/span>, jumpPressed:<span class=\"c-t\">Bool<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> dir = (right ? <span class=\"c-n\">1<\/span> : <span class=\"c-n\">0<\/span>) - (left ? <span class=\"c-n\">1<\/span> : <span class=\"c-n\">0<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> a = onGround ? <span class=\"c-t\">ACCEL<\/span> : <span class=\"c-t\">AIR<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (dir != <span class=\"c-n\">0<\/span>) vx += dir * a * dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">else<\/span> { <span class=\"c-c\">// apply friction toward zero, never past it<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> f = <span class=\"c-t\">FRICTION<\/span> * dt;<\/span>","<span class=\"cl\">            vx = <span class=\"c-t\">Math<\/span>.abs(vx) &lt;= f ? <span class=\"c-n\">0<\/span> : vx - <span class=\"c-t\">Math<\/span>.sign(vx) * f;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        vy += <span class=\"c-t\">GRAV<\/span> * dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (jumpPressed &amp;&amp; onGround) { vy = <span class=\"c-f\">-JUMP<\/span>; onGround = <span class=\"c-k\">false<\/span>; }<\/span>","<span class=\"cl\">        vx = clamp(vx, <span class=\"c-f\">-MAXVX<\/span>, <span class=\"c-t\">MAXVX<\/span>);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class HeroMove {\n    static final ACCEL   = 2600;      // px/s^2 ground\n    static final AIR     = 1600;      // px/s^2 air control\n    static final FRICTION= 2200;\n    static final GRAV    = 1900;\n    static final JUMP    = 620;       // initial jump velocity px/s\n    static final MAXVX   = 240;       // run speed cap\n    public var vx = 0.0; public var vy = 0.0;\n    public var onGround = false;\n\n    public function tick(dt:Float, left:Bool, right:Bool, jumpPressed:Bool) {\n        final dir = (right ? 1 : 0) - (left ? 1 : 0);\n        final a = onGround ? ACCEL : AIR;\n        if (dir != 0) vx += dir * a * dt;\n        else { // apply friction toward zero, never past it\n            final f = FRICTION * dt;\n            vx = Math.abs(vx) <= f ? 0 : vx - Math.sign(vx) * f;\n        }\n        vy += GRAV * dt;\n        if (jumpPressed && onGround) { vy = -JUMP; onGround = false; }\n        vx = clamp(vx, -MAXVX, MAXVX);\n    }\n}"},{"k":"ul","i":["Tune with constants exposed in one place; feel changes weekly during production."]},{"k":"pit","t":"Handling input inside the physics tick","h":"Input is polled per frame (variable), physics ticks fixed (Chapter 2). Poll intent per frame, latch \"jump pressed\" into a one-frame buffer (next slide), consume inside the tick."}],"src":"07_ch06.txt:48","n":134},{"ch":7,"kind":"content","title":"Input Refinement: Coyote Time and Jump Buffering","tt":"Input Refinement: Coyote Time and Jump Buffering","blocks":[{"k":"p","h":"Modern platformer feel is two timers, not better physics. Implement both — players cannot tell you why it feels right."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// Coyote time: grace period to jump after leaving ground<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">var<\/span> coyote = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">if<\/span> (onGround) coyote = <span class=\"c-n\">0.09<\/span>; <span class=\"c-k\">else<\/span> coyote -= dt;<\/span>","<span class=\"cl\"><span class=\"c-c\">// Jump buffer: a press slightly before landing still jumps<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">var<\/span> jumpBuf = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">if<\/span> (<span class=\"c-t\">Input<\/span>.pressed(<span class=\"c-t\">Jump<\/span>)) jumpBuf = <span class=\"c-n\">0.11<\/span>; <span class=\"c-k\">else<\/span> jumpBuf -= dt;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">if<\/span> (jumpBuf &gt; <span class=\"c-n\">0<\/span> &amp;&amp; coyote &gt; <span class=\"c-n\">0<\/span>) { vy = <span class=\"c-f\">-JUMP<\/span>; coyote = <span class=\"c-n\">0<\/span>; jumpBuf = <span class=\"c-n\">0<\/span>; }<\/span>"],"raw":"// Coyote time: grace period to jump after leaving ground\nvar coyote = 0.0;\nif (onGround) coyote = 0.09; else coyote -= dt;\n// Jump buffer: a press slightly before landing still jumps\nvar jumpBuf = 0.0;\nif (Input.pressed(Jump)) jumpBuf = 0.11; else jumpBuf -= dt;\n\nif (jumpBuf > 0 && coyote > 0) { vy = -JUMP; coyote = 0; jumpBuf = 0; }"},{"k":"ul","i":["Coyote (90ms) forgives \"I pressed too late\"; buffer (110ms) forgives \"I pressed too early\".","Variable jump height: if the jump key is released while rising, cut <code>vy<\/code> in half — one line, huge feel."]},{"k":"best","t":"These belong in the controller, not the engine","h":"Heaps gives you raw input; <em>game feel<\/em> transforms like these are exactly what \"controller\" classes are for. Keep them data-tunable."}],"src":"07_ch06.txt:64","n":135},{"ch":7,"kind":"content","title":"Collision Detection Overview: The Two Phases","tt":"Collision Detection Overview: The Two Phases","blocks":[{"k":"p","h":"Collision splits into a cheap <b>broad phase<\/b> (\"might touch\") and an exact <b>narrow phase<\/b> (\"does touch, and by how much\"). Confusing them is the root of most performance pain."},{"k":"ul","i":["<b>Narrow<\/b>: AABB overlap, circle vs circle, tile lookup — exact, cheap per pair.","<b>Broad<\/b>: spatial partitioning — avoids testing pairs that cannot possibly touch: O(n²) becomes ~O(n).","Cavern Run runs the whole spectrum: tiles (grid lookup = free broad phase), entities vs entities (uniform grid), fast projectiles (swept AABB)."]},{"k":"pit","t":"Testing every entity against every entity","h":"300 entities = 44,850 pairs per tick. The game runs; web builds die. The uniform grid slide fixes this in 40 lines."}],"src":"07_ch06.txt:71","n":136},{"ch":7,"kind":"content","title":"AABB: Theory and Math","tt":"AABB: Theory and Math","blocks":[{"k":"p","h":"The axis-aligned bounding box — the 2D workhorse. Two boxes overlap iff they overlap on <b>both<\/b> axes:"},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">overlap(A, B) =<\/span>","<span class=\"cl\">    A.x &lt; B.x + B.w  and  B.x &lt; A.x + A.w     // x axis<\/span>","<span class=\"cl\"> and A.y &lt; B.y + B.h  and  B.y &lt; A.y + A.h     // y axis<\/span>"],"raw":"overlap(A, B) =\n    A.x < B.x + B.w  and  B.x < A.x + A.w     // x axis\n and A.y < B.y + B.h  and  B.y < A.y + A.h     // y axis"},{"k":"ul","i":["Four comparisons, no square roots, no trig — this is why AABB is the default.","Penetration depth per axis = <code>min(A.right, B.right) - max(A.left, B.left)<\/code> — the basis of resolution (next slide)."]},{"k":"best","t":"Keep hitboxes SMALLER than art","h":"A player box ~70% of sprite width is the classic fairness trick: overlapping art looks dramatic, overlapping boxes kills. Enemies: forgiving boxes; hazards: tiny boxes."}],"src":"07_ch06.txt:82","n":137},{"ch":7,"kind":"content","title":"AABB Implementation","tt":"AABB Implementation","blocks":[{"k":"p","h":"The pair used by every entity in this course — plain floats, zero allocations, unit-testable."},{"k":"code","lang":"haxe","file":"Aabb.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Aabb<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> x : <span class=\"c-t\">Float<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> y : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> w : <span class=\"c-t\">Float<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> h : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> left() <span class=\"c-k\">return<\/span> x;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> right() <span class=\"c-k\">return<\/span> x + w;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> top() <span class=\"c-k\">return<\/span> y;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> bottom() <span class=\"c-k\">return<\/span> y + h;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> overlaps(o:<span class=\"c-t\">Aabb<\/span>) : <span class=\"c-t\">Bool<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> x &lt; o.x + o.w &amp;&amp; o.x &lt; x + w<\/span>","<span class=\"cl\">            &amp;&amp; y &lt; o.y + o.h &amp;&amp; o.y &lt; y + h;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> set(cx, cy, cw, ch) { x = cx; y = cy; w = cw; h = ch; }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> setCenter(px, py, hw, hh) { x = px - hw; y = py - hh; w = hw * <span class=\"c-n\">2<\/span>; h = hh * <span class=\"c-n\">2<\/span>; }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Aabb {\n    public var x : Float; public var y : Float;\n    public var w : Float; public var h : Float;\n\n    public inline function left() return x;\n    public inline function right() return x + w;\n    public inline function top() return y;\n    public inline function bottom() return y + h;\n\n    public inline function overlaps(o:Aabb) : Bool\n        return x < o.x + o.w && o.x < x + w\n            && y < o.y + o.h && o.y < y + h;\n\n    public inline function set(cx, cy, cw, ch) { x = cx; y = cy; w = cw; h = ch; }\n    public inline function setCenter(px, py, hw, hh) { x = px - hw; y = py - hh; w = hw * 2; h = hh * 2; }\n}"},{"k":"ul","i":["Entities keep a <code>hit:Aabb<\/code> refreshed from their center + half-extents each tick.","No allocations in the hot path: reuse one scratch Aabb for queries."]},{"k":"best","t":"Unit test your collision math","h":"Pure-float classes like this take 20 lines of tests and prevent the worst class of bug: one that looks like \"bad level design\" while actually being <code>&lt;<\/code> vs <code>&lt;=<\/code>."}],"src":"07_ch06.txt:106","n":138},{"ch":7,"kind":"content","title":"Resolution: The Minimal Translation Vector","tt":"Resolution: The Minimal Translation Vector","blocks":[{"k":"p","h":"Detecting overlap is half the job; separating boxes is the other half. The <b>MTV<\/b> pushes the mover out along the smallest overlapping axis."},{"k":"code","lang":"haxe","file":"Mtv.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Mtv<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-c\">/** returns correction to apply to A (dx, dy) or null when not overlapping */<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> resolve(a:<span class=\"c-t\">Aabb<\/span>, b:<span class=\"c-t\">Aabb<\/span>) : { dx : <span class=\"c-t\">Float<\/span>, dy : <span class=\"c-t\">Float<\/span> } {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> ox = <span class=\"c-t\">Math<\/span>.min(a.right(), b.right()) - <span class=\"c-t\">Math<\/span>.max(a.left(), b.left());   <span class=\"c-c\">// x overlap<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> oy = <span class=\"c-t\">Math<\/span>.min(a.bottom(), b.bottom()) - <span class=\"c-t\">Math<\/span>.max(a.top(), b.top());   <span class=\"c-c\">// y overlap<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (ox &lt;= <span class=\"c-n\">0<\/span> || oy &lt;= <span class=\"c-n\">0<\/span>) <span class=\"c-k\">return<\/span> <span class=\"c-k\">null<\/span>;               <span class=\"c-c\">// not overlapping<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (ox &lt; oy)                                        <span class=\"c-c\">// push on x (smaller)<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">return<\/span> { dx : (centerX(a) &lt; centerX(b) ? <span class=\"c-f\">-ox<\/span> : ox), dy : <span class=\"c-n\">0<\/span> };<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> { dx : <span class=\"c-n\">0<\/span>, dy : (centerY(a) &lt; centerY(b) ? <span class=\"c-f\">-oy<\/span> : oy) };   <span class=\"c-c\">// push on y<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> centerX(a:<span class=\"c-t\">Aabb<\/span>) <span class=\"c-k\">return<\/span> a.x + a.w / <span class=\"c-n\">2<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> centerY(a:<span class=\"c-t\">Aabb<\/span>) <span class=\"c-k\">return<\/span> a.y + a.h / <span class=\"c-n\">2<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Mtv {\n    /** returns correction to apply to A (dx, dy) or null when not overlapping */\n    public static function resolve(a:Aabb, b:Aabb) : { dx : Float, dy : Float } {\n        final ox = Math.min(a.right(), b.right()) - Math.max(a.left(), b.left());   // x overlap\n        final oy = Math.min(a.bottom(), b.bottom()) - Math.max(a.top(), b.top());   // y overlap\n        if (ox <= 0 || oy <= 0) return null;               // not overlapping\n        if (ox < oy)                                        // push on x (smaller)\n            return { dx : (centerX(a) < centerX(b) ? -ox : ox), dy : 0 };\n        return { dx : 0, dy : (centerY(a) < centerY(b) ? -oy : oy) };   // push on y\n    }\n    static inline function centerX(a:Aabb) return a.x + a.w / 2;\n    static inline function centerY(a:Aabb) return a.y + a.h / 2;\n}"},{"k":"ul","i":["Direction comes from relative centers; magnitude from overlap.","Apply the correction, then zero the velocity component into the surface (<code>vy = 0<\/code> on floor)."]},{"k":"pit","t":"The jittering box","h":"Resolving both axes every frame with naive MTV makes resting boxes vibrate. Resolve one axis at a time (slide on X, then on Y) — the classic stable order, shown next for tiles."}],"src":"07_ch06.txt:127","n":139},{"ch":7,"kind":"content","title":"Tile Collision: Grid Lookups and the Two-Axis Sweep","tt":"Tile Collision: Grid Lookups and the Two-Axis Sweep","blocks":[{"k":"p","h":"Tiles are the cheapest collision there is: the grid IS the broad phase. The two-axis sweep makes it robust."},{"k":"code","lang":"haxe","file":"TileCollision.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">TileCollision<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> grid : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Int<\/span>&gt;&gt;;    <span class=\"c-c\">// from LevelData (Ch. 5)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> tileW = <span class=\"c-n\">32<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> tileH = <span class=\"c-n\">32<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> solidAt(px:<span class=\"c-t\">Float<\/span>, py:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Bool<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> tx = <span class=\"c-t\">Std<\/span>.int(px / tileW), ty = <span class=\"c-t\">Std<\/span>.int(py / tileH);<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> tx &lt; <span class=\"c-n\">0<\/span> || ty &lt; <span class=\"c-n\">0<\/span> || ty &gt;= grid.length<\/span>","<span class=\"cl\">            || tx &gt;= grid[ty].length || grid[ty][tx] == <span class=\"c-n\">1<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-c\">/** move e by (dx, dy), resolving against solid tiles; sets grounded */<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> move(e:{ x:<span class=\"c-t\">Float<\/span>, y:<span class=\"c-t\">Float<\/span>, w:<span class=\"c-t\">Float<\/span>, h:<span class=\"c-t\">Float<\/span>, vx:<span class=\"c-t\">Float<\/span>, vy:<span class=\"c-t\">Float<\/span> }, dx:<span class=\"c-t\">Float<\/span>, dy:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Bool<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> grounded = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">        e.x += dx;                                     <span class=\"c-c\">// X first<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (dx != <span class=\"c-n\">0<\/span>) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> dir = dx &gt; <span class=\"c-n\">0<\/span> ? e.x + e.w : e.x;      <span class=\"c-c\">// leading edge<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (lineSolid(dir, e.y, e.y + e.h)) {      <span class=\"c-c\">// sample top/mid/bottom<\/span><\/span>","<span class=\"cl\">                e.x = dx &gt; <span class
