/span>","<span class=\"cl\">        <span class=\"c-s\">\"title.start\"<\/span> =&gt; <span class=\"c-s\">\"START\"<\/span>,<\/span>","<span class=\"cl\">        <span class=\"c-s\">\"title.settings\"<\/span> =&gt; <span class=\"c-s\">\"SETTINGS\"<\/span>,<\/span>","<span class=\"cl\">        <span class=\"c-s\">\"pause.header\"<\/span> =&gt; <span class=\"c-s\">\"PAUSED\"<\/span>,<\/span>","<span class=\"cl\">        <span class=\"c-s\">\"game.gems\"<\/span> =&gt; <span class=\"c-s\">\"GEMS: {n}\"<\/span>,<\/span>","<span class=\"cl\">    ];<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> get(key:<span class=\"c-t\">String<\/span>, ?args:{}) : <span class=\"c-t\">String<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> s = table[key];<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (s == <span class=\"c-k\">null<\/span>) { s = key; trace(<span class=\"c-s\">'missing string: $key'<\/span>); }   <span class=\"c-c\">// fail loud<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (args != <span class=\"c-k\">null<\/span>) <span class=\"c-k\">for<\/span> (f in <span class=\"c-t\">Reflect<\/span>.fields(args))<\/span>","<span class=\"cl\">            s = <span class=\"c-t\">StringTools<\/span>.replace(s, <span class=\"c-s\">'{${f}}'<\/span>, <span class=\"c-t\">Std<\/span>.string(<span class=\"c-t\">Reflect<\/span>.field(args, f)));<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> s;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-c\">// usage<\/span><\/span>","<span class=\"cl\">label.text = <span class=\"c-t\">Strings<\/span>.get(<span class=\"c-s\">\"game.gems\"<\/span>, { n : <span class=\"c-n\">13<\/span> });<\/span>"],"raw":"class Strings {\n    static var table : Map<String, String> = [\n        \"title.start\" => \"START\",\n        \"title.settings\" => \"SETTINGS\",\n        \"pause.header\" => \"PAUSED\",\n        \"game.gems\" => \"GEMS: {n}\",\n    ];\n    public static function get(key:String, ?args:{}) : String {\n        var s = table[key];\n        if (s == null) { s = key; trace('missing string: $key'); }   // fail loud\n        if (args != null) for (f in Reflect.fields(args))\n            s = StringTools.replace(s, '{${f}}', Std.string(Reflect.field(args, f)));\n        return s;\n    }\n}\n// usage\nlabel.text = Strings.get(\"game.gems\", { n : 13 });"},{"k":"ul","i":["All UI text flows through one table; German/French becomes a second table file, not a code change.","BMFont export must include the target languages' glyphs — a font swap, not a surprise at the end."]},{"k":"pit","t":"String-concatenated UI","h":"<code>label.text = \"GEMS: \" + n<\/code> translates to nothing. Parameters via <code>{n}<\/code> placeholders keep word order flexible per language (\"GEMS: 13\" vs \"13 GEMS\")."}],"src":"08_ch07.txt:292","n":168},{"ch":8,"kind":"content","title":"Settings: Model, Persistence, Application","tt":"Settings: Model, Persistence, Application","blocks":[{"k":"p","h":"Settings tie the whole chapter together: a data class, Chapter 2's <code>hxd.Save<\/code>, and live application."},{"k":"code","lang":"haxe","file":"Settings.hx","lines":["<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">SettingsData<\/span> = {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> version : <span class=\"c-t\">Int<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> music : <span class=\"c-t\">Bool<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> sfx : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> fullscreen : <span class=\"c-t\">Bool<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> locale : <span class=\"c-t\">String<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Settings<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> data(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">SettingsData<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> load() {<\/span>","<span class=\"cl\">        data = hxd.<span class=\"c-t\">Save<\/span>.load(<span class=\"c-s\">\"settings\"<\/span>, defaults());<\/span>","<span class=\"cl\">        apply();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> set(d:<span class=\"c-t\">SettingsData<\/span>) {      <span class=\"c-c\">// the ONLY mutation path<\/span><\/span>","<span class=\"cl\">        data = d;<\/span>","<span class=\"cl\">        apply();<\/span>","<span class=\"cl\">        hxd.<span class=\"c-t\">Save<\/span>.save(d, <span class=\"c-s\">\"settings\"<\/span>);                 <span class=\"c-c\">// save on change, not on exit<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> apply() {<\/span>","<span class=\"cl\">        <span class=\"c-t\">Music<\/span>.enabled = data.music;<\/span>","<span class=\"cl\">        <span class=\"c-t\">Sfx<\/span>.master = data.sfx;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (data.fullscreen) h3d.<span class=\"c-t\">Engine<\/span>.getCurrent().setFullscreen(<span class=\"c-k\">true<\/span>);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> defaults() : <span class=\"c-t\">SettingsData<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> { version : <span class=\"c-n\">1<\/span>, music : <span class=\"c-k\">true<\/span>, sfx : <span class=\"c-n\">0.8<\/span>, fullscreen : <span class=\"c-k\">false<\/span>, locale : <span class=\"c-s\">\"en\"<\/span> };<\/span>","<span class=\"cl\">}<\/span>"],"raw":"typedef SettingsData = {\n    final version : Int;\n    final music : Bool;\n    final sfx : Float;\n    final fullscreen : Bool;\n    final locale : String;\n}\n\nclass Settings {\n    public static var data(default, null) : SettingsData;\n\n    public static function load() {\n        data = hxd.Save.load(\"settings\", defaults());\n        apply();\n    }\n    public static function set(d:SettingsData) {      // the ONLY mutation path\n        data = d;\n        apply();\n        hxd.Save.save(d, \"settings\");                 // save on change, not on exit\n    }\n    public static function apply() {\n        Music.enabled = data.music;\n        Sfx.master = data.sfx;\n        if (data.fullscreen) h3d.Engine.getCurrent().setFullscreen(true);\n    }\n    static function defaults() : SettingsData\n        return { version : 1, music : true, sfx : 0.8, fullscreen : false, locale : \"en\" };\n}"},{"k":"best","t":"Apply settings through one choke point","h":"Every setting effect (audio volume, fullscreen, locale) lives in <code>apply()<\/code>. Bugs become \"one function to read\" instead of archaeology."}],"src":"08_ch07.txt:326","n":169},{"ch":8,"kind":"content","title":"The Settings Screen: Full Walkthrough","tt":"The Settings Screen: Full Walkthrough","blocks":[{"k":"p","h":"The screen that exercises every UI technique in one place."},{"k":"code","lang":"haxe","file":"SettingsScreen.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">SettingsScreen<\/span> <span class=\"c-k\">implements<\/span> <span class=\"c-t\">Screen<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">final<\/span> root : h2d.<span class=\"c-t\">Flow<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>() {<\/span>","<span class=\"cl\">        root = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Flow<\/span>();<\/span>","<span class=\"cl\">        root.vertical = <span class=\"c-k\">true<\/span>; root.spacing = <span class=\"c-n\">14<\/span>; root.padding = <span class=\"c-n\">30<\/span>;<\/span>","<span class=\"cl\">        root.backgroundTile = <span class=\"c-t\">Game<\/span>.me.skin.panel();<\/span>","<span class=\"cl\">        root.maxWidth = <span class=\"c-n\">460<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> music = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Checkbox<\/span>(<span class=\"c-t\">Game<\/span>.me.skin, <span class=\"c-t\">Strings<\/span>.get(<span class=\"c-s\">\"settings.music\"<\/span>), <span class=\"c-t\">Settings<\/span>.data.music);<\/span>","<span class=\"cl\">        music.onChange = on -&gt; <span class=\"c-t\">Settings<\/span>.set({ ...<span class=\"c-t\">Settings<\/span>.data, music : on });<\/span>","<span class=\"cl\">        root.addChild(music.root);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> vol = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Slider<\/span>(<span class=\"c-t\">Game<\/span>.me.skin, <span class=\"c-t\">Settings<\/span>.data.sfx);<\/span>","<span class=\"cl\">        vol.onChange = v -&gt; <span class=\"c-t\">Settings<\/span>.set({ ...<span class=\"c-t\">Settings<\/span>.data, sfx : v });<\/span>","<span class=\"cl\">        root.addChild(vol.root);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> back = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Button<\/span>(<span class=\"c-t\">Game<\/span>.me.skin, <span class=\"c-t\">Strings<\/span>.get(<span class=\"c-s\">\"common.back\"<\/span>));<\/span>","<span class=\"cl\">        back.onClick = () -&gt; <span class=\"c-t\">Game<\/span>.me.screens.show(<span class=\"c-k\">new<\/span> <span class=\"c-t\">TitleScreen<\/span>());<\/span>","<span class=\"cl\">        root.addChild(back.root);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> enter(_) center();<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> exit(_) {}<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (<span class=\"c-t\">Input<\/span>.pressed(<span class=\"c-t\">Pause<\/span>)) <span class=\"c-t\">Game<\/span>.me.screens.show(<span class=\"c-k\">new<\/span> <span class=\"c-t\">TitleScreen<\/span>());<\/span>","<span class=\"cl\">        root.reflow(); center();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> onEvent(e) <span class=\"c-k\">return<\/span> <span class=\"c-t\">Focus<\/span>.route(e);<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> center() { root.reflow(); root.x = (s2d.width - root.outerWidth) / <span class=\"c-n\">2<\/span>; }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class SettingsScreen implements Screen {\n    public final root : h2d.Flow;\n    public function new() {\n        root = new h2d.Flow();\n        root.vertical = true; root.spacing = 14; root.padding = 30;\n        root.backgroundTile = Game.me.skin.panel();\n        root.maxWidth = 460;\n\n        final music = new Checkbox(Game.me.skin, Strings.get(\"settings.music\"), Settings.data.music);\n        music.onChange = on -> Settings.set({ ...Settings.data, music : on });\n        root.addChild(music.root);\n\n        final vol = new Slider(Game.me.skin, Settings.data.sfx);\n        vol.onChange = v -> Settings.set({ ...Settings.data, sfx : v });\n        root.addChild(vol.root);\n\n        final back = new Button(Game.me.skin, Strings.get(\"common.back\"));\n        back.onClick = () -> Game.me.screens.show(new TitleScreen());\n        root.addChild(back.root);\n    }\n    public function enter(_) center();\n    public function exit(_) {}\n    public function update(dt) {\n        if (Input.pressed(Pause)) Game.me.screens.show(new TitleScreen());\n        root.reflow(); center();\n    }\n    public function onEvent(e) return Focus.route(e);\n    function center() { root.reflow(); root.x = (s2d.width - root.outerWidth) / 2; }\n}"},{"k":"note","h":"<code>{ ...Settings.data, sfx : v }<\/code> — structure spread, Haxe's functional update: new value, no mutation. The settings type stays <code>final<\/code>-friendly."}],"src":"08_ch07.txt:361","n":170},{"ch":8,"kind":"content","title":"Save Games: What, When, Where","tt":"Save Games: What, When, Where","blocks":[{"k":"p","h":"Progress saves are heavier than settings: world state, checkpoints, inventory. Three questions answered once."},{"k":"ul","i":["<b>What<\/b>: a serializable snapshot — entity data that matters (kind, position, state), never live objects (views, textures, closures).","<b>When<\/b>: at checkpoints (trusted points) plus a hidden autosave every 30 s — never every frame, never only on exit (crashes happen).","<b>Where<\/b>: <code>hxd.Save<\/code> per platform (Chapter 2) — the game never knows the path."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">SaveGame<\/span> = {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> version : <span class=\"c-t\">Int<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> levelId : <span class=\"c-t\">String<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> checkpoint : <span class=\"c-t\">Int<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> gems : <span class=\"c-t\">Array<\/span>&lt;{ id : <span class=\"c-t\">String<\/span>, taken : <span class=\"c-t\">Bool<\/span> }&gt;;   <span class=\"c-c\">// taken flags, not live entities<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> playTime : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"typedef SaveGame = {\n    final version : Int;\n    final levelId : String;\n    final checkpoint : Int;\n    final gems : Array<{ id : String, taken : Bool }>;   // taken flags, not live entities\n    final playTime : Float;\n}"},{"k":"best","t":"Save the delta, not the level","h":"Store which gems are taken against the level's static data (Chapter 5), not a copy of the world. Saves stay tiny, level edits after release don't corrupt old saves."}],"src":"08_ch07.txt:377","n":171},{"ch":8,"kind":"content","title":"Save Robustness: Versioning and Corruption","tt":"Save Robustness: Versioning and Corruption","blocks":[{"k":"p","h":"Player saves are sacred and frequently corrupted by: crashes mid-write, old versions, cloud-sync conflicts. Armor accordingly."},{"k":"code","lang":"haxe","file":"SaveGame.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">SaveGame<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">SLOT<\/span> = <span class=\"c-s\">\"cavern-run-save\"<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> load() : <span class=\"c-t\">Null<\/span>&lt;<span class=\"c-t\">SaveGameData<\/span>&gt; {<\/span>","<span class=\"cl\">        <span class=\"c-k\">try<\/span> {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> raw = hxd.<span class=\"c-t\">Save<\/span>.load(<span class=\"c-t\">SLOT<\/span>, <span class=\"c-k\">null<\/span>);<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (raw == <span class=\"c-k\">null<\/span>) <span class=\"c-k\">return<\/span> <span class=\"c-k\">null<\/span>;<\/span>","<span class=\"cl\">            <span class=\"c-k\">return<\/span> <span class=\"c-t\">Migrations<\/span>.saveToCurrent(raw);<\/span>","<span class=\"cl\">        } <span class=\"c-k\">catch<\/span> (e) {<\/span>","<span class=\"cl\">            trace(<span class=\"c-s\">'save corrupted, keeping .bak: $e'<\/span>);<\/span>","<span class=\"cl\">            <span class=\"c-k\">return<\/span> tryLoadBackup();                     <span class=\"c-c\">// one generation behind &gt; nothing<\/span><\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> store(d:<span class=\"c-t\">SaveGameData<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// keep last good save as .bak before overwriting<\/span><\/span>","<span class=\"cl\">        hxd.<span class=\"c-t\">Save<\/span>.save(d, <span class=\"c-t\">SLOT<\/span>);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class SaveGame {\n    static final SLOT = \"cavern-run-save\";\n\n    public static function load() : Null<SaveGameData> {\n        try {\n            final raw = hxd.Save.load(SLOT, null);\n            if (raw == null) return null;\n            return Migrations.saveToCurrent(raw);\n        } catch (e) {\n            trace('save corrupted, keeping .bak: $e');\n            return tryLoadBackup();                     // one generation behind > nothing\n        }\n    }\n    public static function store(d:SaveGameData) {\n        // keep last good save as .bak before overwriting\n        hxd.Save.save(d, SLOT);\n    }\n}"},{"k":"ul","i":["Chapter 5's migration chain applies to saves exactly as it did to levels — same pattern, higher stakes."]},{"k":"pit","t":"Trusting your own save format","h":"Every field you add post-launch is a future crash in a player's console. Test loading a save from every shipped version — keep a folder of \"golden saves\" in the repo."}],"src":"08_ch07.txt:402","n":172},{"ch":8,"kind":"content","title":"The Title Screen: Boot Flow Complete","tt":"The Title Screen: Boot Flow Complete","blocks":[{"k":"p","h":"Where everything connects: boot → loading → title, with the web audio unlock from Chapter 2."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">boot:  Res.initEmbed (boot set) → LoadingScreen (async GameSet)<\/span>","<span class=\"cl\">            ↓ progress == 1<\/span>","<span class=\"cl\">title: TitleScreen [START] [SETTINGS] [QUIT]<\/span>","<span class=\"cl\">            ↓                      ↓<\/span>","<span class=\"cl\">       PlayScreen(levelId)    SettingsScreen<\/span>","<span class=\"cl\">            ↓ death<\/span>","<span class=\"cl\">       GameOverScreen(score) → title | retry<\/span>"],"raw":"boot:  Res.initEmbed (boot set) → LoadingScreen (async GameSet)\n            ↓ progress == 1\ntitle: TitleScreen [START] [SETTINGS] [QUIT]\n            ↓                      ↓\n       PlayScreen(levelId)    SettingsScreen\n            ↓ death\n       GameOverScreen(score) → title | retry"},{"k":"ul","i":["On web, the first button press doubles as the audio-unlock gesture — free, because the title screen is where players press first."]},{"k":"best","t":"Title screen must appear &lt; 1 s","h":"It is why the boot set is tiny (Chapter 5). Players forgive loading a world; they do not forgive loading a logo."}],"src":"08_ch07.txt:416","n":173},{"ch":8,"kind":"content","title":"Project: The Complete Flow","tt":"Project: The Complete Flow","blocks":[{"k":"p","h":"Chapter 7's exit ticket: play Cavern Run start-to-game-over without touching a single <code>if (state)<\/code> anywhere."},{"k":"ul","i":["Boot → loading (progress bar) → title (focus-driven, gamepad-navigable) → play → pause (stack overlay) → settings (live-applied) → game over (score passed by constructor) → retry/title.","Every widget skinned through <code>Skin<\/code>; debug skin proves separation.","Settings and progress both save-and-load cleanly, including a v1→v2 save migration test."]},{"k":"best","t":"Click-through with a gamepad only","h":"Final acceptance test: unplug the mouse. If the whole flow (menus, sliders, dialogs) works on pad alone, the focus system is honest — and console ports are already half-done."}],"src":"08_ch07.txt:423","n":174},{"ch":8,"kind":"content","title":"Chapter 7 Checklist","tt":"Chapter 7 Checklist","blocks":[{"k":"ul","i":["<code>Screen<\/code> interface + manager with swap, stack overlays, input capture.","Data between screens via constructors and services — no cross-screen field digging.","Button/Checkbox/Slider/List built on Flow + Interactive + Skin; focus manager navigates them all.","Modals use the screen stack with input-blocking scrim.","All strings through <code>Strings.get<\/code>; placeholders for parameters.","Settings: single mutation path, applied live, saved on change.","Saves: checkpoint deltas, <code>.bak<\/code> generation, migration chain, golden-save tests."]}],"src":"08_ch07.txt:432","n":175},{"ch":9,"kind":"chapter","title":"Effects: Particles, Parallax &amp; Lerp","tt":"Effects: Particles, Parallax & Lerp","sub":"Lerp and easing math, frame-rate independence, parallax layers, and a data-driven particle system with its own editor.","blocks":[],"src":"09_ch08.txt:1","n":176},{"ch":9,"kind":"content","title":"Effects vs Gameplay Animation","tt":"Effects vs Gameplay Animation","blocks":[{"k":"p","h":"Two different jobs share one chapter because they share one toolbox: interpolation."},{"k":"ul","i":["<b>Gameplay animation<\/b> (jump arcs, camera) is <em>simulation<\/em> — deterministic, fixed-step, from Chapter 6.","<b>Effects<\/b> (particles, parallax, UI motion, tweens) are <em>presentation<\/em> — they run on render dt, tolerate approximate math, and die without consequence.","Effects live in <code>render/fx/<\/code> (Chapter 4's folder law): they read the world, they never write it."]},{"k":"best","t":"Effects must be safe to skip","h":"If turning all effects off breaks gameplay, an effect leaked into simulation. The <code>--no-fx<\/code> debug flag is both a perf mode and an architecture audit."}],"src":"09_ch08.txt:10","n":177},{"ch":9,"kind":"content","title":"Lerp: Linear Interpolation","tt":"Lerp: Linear Interpolation","blocks":[{"k":"p","h":"The atom of all animation: blend from A to B by t ∈ [0,1]."},{"k":"code","lang":"haxe","file":"Lerp.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">L<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> lerp(a:<span class=\"c-t\">Float<\/span>, b:<span class=\"c-t\">Float<\/span>, t:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Float<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> a + (b - a) * t;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-c\">// inverse: how far along are we?<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> invLerp(a:<span class=\"c-t\">Float<\/span>, b:<span class=\"c-t\">Float<\/span>, v:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Float<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> (v - a) / (b - a);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-c\">// remap from one range to another (gems → HUD bar)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> remap(v:<span class=\"c-t\">Float<\/span>, a0:<span class=\"c-t\">Float<\/span>, a1:<span class=\"c-t\">Float<\/span>, b0:<span class=\"c-t\">Float<\/span>, b1:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Float<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> lerp(b0, b1, invLerp(a0, a1, v));<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class L {\n    public static inline function lerp(a:Float, b:Float, t:Float) : Float\n        return a + (b - a) * t;\n\n    // inverse: how far along are we?\n    public static inline function invLerp(a:Float, b:Float, v:Float) : Float\n        return (v - a) / (b - a);\n\n    // remap from one range to another (gems → HUD bar)\n    public static inline function remap(v:Float, a0:Float, a1:Float, b0:Float, b1:Float) : Float\n        return lerp(b0, b1, invLerp(a0, a1, v));\n}"},{"k":"ul","i":["lerp is also the <em>pattern<\/em> for game design: health bars, camera (Ch. 6), color fades, audio crossfades (Ch. 2)."]},{"k":"pit","t":"lerp with t outside 0..1 silently extrapolates","h":"<code>lerp(0, 100, 1.4)<\/code> = 140 — overshoot when you meant clamp. Where overshoot is not intended, clamp t first (or use the easing toolkit below where it <em>is<\/em> intended)."}],"src":"09_ch08.txt:29","n":178},{"ch":9,"kind":"content","title":"Frame-Rate Independent Interpolation","tt":"Frame-Rate Independent Interpolation","blocks":[{"k":"p","h":"The single most-asked effect question: \"my fade speed differs per machine\". Because <code>k * dt<\/code> is wrong; exponential decay is right."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// WRONG: fade speed depends on framerate<\/span><\/span>","<span class=\"cl\">alpha += (target - alpha) * <span class=\"c-n\">4<\/span> * dt;            <span class=\"c-c\">// 60fps vs 144fps = different feel<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// RIGHT: exponential approach — identical speed at any framerate<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> k = <span class=\"c-n\">1<\/span> - <span class=\"c-t\">Math<\/span>.exp(<span class=\"c-f\">-speed<\/span> * dt);<\/span>","<span class=\"cl\">alpha += (target - alpha) * k;<\/span>"],"raw":"// WRONG: fade speed depends on framerate\nalpha += (target - alpha) * 4 * dt;            // 60fps vs 144fps = different feel\n\n// RIGHT: exponential approach — identical speed at any framerate\nfinal k = 1 - Math.exp(-speed * dt);\nalpha += (target - alpha) * k;"},{"k":"ul","i":["Intuition: <code>exp(-speed*dt)<\/code> is \"the fraction of the distance NOT closed this frame\", independent of frame length.","Same formula fixed Chapter 6's camera; it returns in Chapter 13's tweens as the \"smooth\" easing family."]},{"k":"best","t":"One line to memorize, used forever","h":"<code>1 - exp(-k * dt)<\/code> appears in cameras, fades, health-bar lag, aim-assist smoothing and audio ducking. Write it once as <code>L.approach(cur, target, speed, dt)<\/code> and use it everywhere."}],"src":"09_ch08.txt:43","n":179},{"ch":9,"kind":"content","title":"Easing Functions: The Catalog","tt":"Easing Functions: The Catalog","blocks":[{"k":"p","h":"Easings shape time: <code>t → e(t)<\/code> remaps progress before lerp applies it. Learn six, ship anything."},{"k":"code","lang":"haxe","file":"Ease.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Ease<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> linear    = (t:<span class=\"c-t\">Float<\/span>) -&gt; t;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> quadOut   = (t:<span class=\"c-t\">Float<\/span>) -&gt; <span class=\"c-n\">1<\/span> - (<span class=\"c-n\">1<\/span> - t) * (<span class=\"c-n\">1<\/span> - t);   <span class=\"c-c\">// decelerate<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> quadIn    = (t:<span class=\"c-t\">Float<\/span>) -&gt; t * t;                   <span class=\"c-c\">// accelerate<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> inOut     = (t:<span class=\"c-t\">Float<\/span>) -&gt; t &lt; .<span class=\"c-n\">5<\/span> ? <span class=\"c-n\">2<\/span>*t*t : <span class=\"c-n\">1<\/span> - <span class=\"c-t\">Math<\/span>.pow(-<span class=\"c-n\">2<\/span>*t+<span class=\"c-n\">2<\/span>, <span class=\"c-n\">2<\/span>)/<span class=\"c-n\">2<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> backOut   = (t:<span class=\"c-t\">Float<\/span>) -&gt; {                        <span class=\"c-c\">// overshoot &amp; settle<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> c = <span class=\"c-n\">1.70158<\/span>; <span class=\"c-n\">1<\/span> + (c+<span class=\"c-n\">1<\/span>) * <span class=\"c-t\">Math<\/span>.pow(t-<span class=\"c-n\">1<\/span>, <span class=\"c-n\">3<\/span>) + c * <span class=\"c-t\">Math<\/span>.pow(t-<span class=\"c-n\">1<\/span>, <span class=\"c-n\">2<\/span>); };<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> elasticOut= (t:<span class=\"c-t\">Float<\/span>) -&gt; t == <span class=\"c-n\">0<\/span> || t == <span class=\"c-n\">1<\/span> ? t<\/span>","<span class=\"cl\">        : <span class=\"c-t\">Math<\/span>.pow(<span class=\"c-n\">2<\/span>, -<span class=\"c-n\">10<\/span>*t) * <span class=\"c-t\">Math<\/span>.sin((t*<span class=\"c-n\">10<\/span> - .<span class=\"c-n\">75<\/span>) * (<span class=\"c-n\">2<\/span>*<span class=\"c-t\">Math<\/span>.<span class=\"c-t\">PI<\/span>/<span class=\"c-n\">3<\/span>)) + <span class=\"c-n\">1<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">EaseFn<\/span> = <span class=\"c-t\">Float<\/span> -&gt; <span class=\"c-t\">Float<\/span>;<\/span>"],"raw":"class Ease {\n    public static final linear    = (t:Float) -> t;\n    public static final quadOut   = (t:Float) -> 1 - (1 - t) * (1 - t);   // decelerate\n    public static final quadIn    = (t:Float) -> t * t;                   // accelerate\n    public static final inOut     = (t:Float) -> t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;\n    public static final backOut   = (t:Float) -> {                        // overshoot & settle\n        final c = 1.70158; 1 + (c+1) * Math.pow(t-1, 3) + c * Math.pow(t-1, 2); };\n    public static final elasticOut= (t:Float) -> t == 0 || t == 1 ? t\n        : Math.pow(2, -10*t) * Math.sin((t*10 - .75) * (2*Math.PI/3)) + 1;\n}\ntypedef EaseFn = Float -> Float;"},{"k":"table","head":["Easing","Feel","Use it for"],"rows":[["quadOut","fast then settle","motion INTO place (panels, camera)"],["quadIn","slow then fast","leaving (enemies wind-up, fade-out start)"],["inOut","smooth both ends","position across screen"],["backOut","tiny overshoot","button/pop \"snack\" feedback"],["elasticOut","wobble","rewards, celebrations"],["linear","none","scrollbars, debugging"]]}],"src":"09_ch08.txt:68","n":180},{"ch":9,"kind":"content","title":"Applying Easings: Effects in Motion","tt":"Applying Easings: Effects in Motion","blocks":[{"k":"p","h":"Apply = lerp with remapped time. A tiny \"job\" type runs any eased effect on any property."},{"k":"code","lang":"haxe","file":"Eased.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Eased<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-k\">from<\/span> : <span class=\"c-t\">Float<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-k\">to<\/span> : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> t = <span class=\"c-n\">0.0<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> dur : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> ease : <span class=\"c-t\">EaseFn<\/span> = <span class=\"c-t\">Ease<\/span>.quadOut;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> done(get, <span class=\"c-k\">never<\/span>) : <span class=\"c-t\">Bool<\/span>; <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> get_done() <span class=\"c-k\">return<\/span> t &gt;= dur;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(<span class=\"c-k\">from<\/span>, <span class=\"c-k\">to<\/span>, dur, ?ease) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">this<\/span>.<span class=\"c-k\">from<\/span> = <span class=\"c-k\">from<\/span>; <span class=\"c-k\">this<\/span>.<span class=\"c-k\">to<\/span> = <span class=\"c-k\">to<\/span>; <span class=\"c-k\">this<\/span>.dur = dur;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (ease != <span class=\"c-k\">null<\/span>) <span class=\"c-k\">this<\/span>.ease = ease;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> step(dt:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Float<\/span> {<\/span>","<span class=\"cl\">        t += dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> k = <span class=\"c-t\">Math<\/span>.min(<span class=\"c-n\">1<\/span>, t / dur);<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-t\">L<\/span>.lerp(<span class=\"c-k\">from<\/span>, <span class=\"c-k\">to<\/span>, ease(k));<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-c\">// usage — panel slides 300px in 0.35s, settling:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> slide = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Eased<\/span>(-<span class=\"c-n\">320<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">0.35<\/span>);<\/span>","<span class=\"cl\">panel.x = slide.step(dt);<\/span>"],"raw":"class Eased {\n    public var from : Float; public var to : Float;\n    public var t = 0.0; public var dur : Float;\n    public var ease : EaseFn = Ease.quadOut;\n    public var done(get, never) : Bool; inline function get_done() return t >= dur;\n\n    public function new(from, to, dur, ?ease) {\n        this.from = from; this.to = to; this.dur = dur;\n        if (ease != null) this.ease = ease;\n    }\n    public function step(dt:Float) : Float {\n        t += dt;\n        final k = Math.min(1, t / dur);\n        return L.lerp(from, to, ease(k));\n    }\n}\n// usage — panel slides 300px in 0.35s, settling:\nfinal slide = new Eased(-320, 0, 0.35);\npanel.x = slide.step(dt);"},{"k":"best","t":"Durations in seconds, not frames","h":"\"12 frames\" means nothing at 144 Hz. Seconds (0.15 UI, 0.3 panels, 0.6 cinematic) are platform-independent and communicate intent."}],"src":"09_ch08.txt:93","n":181},{"ch":9,"kind":"content","title":"Parallax Scrolling: Depth by Ratio","tt":"Parallax Scrolling: Depth by Ratio","blocks":[{"k":"p","h":"Parallax sells depth with zero 3D: each background layer scrolls at a fraction of camera speed. Far layers move less."},{"k":"code","lang":"haxe","file":"ParallaxLayer.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">ParallaxLayer<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> bmp : h2d.<span class=\"c-t\">Bitmap<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> ratio : <span class=\"c-t\">Float<\/span>;      <span class=\"c-c\">// 0.0 = infinite distance, 1.0 = gameplay speed<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> yOffset : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(tile:h2d.<span class=\"c-t\">Tile<\/span>, ratio, ?parent) {<\/span>","<span class=\"cl\">        bmp = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(tile, parent);<\/span>","<span class=\"cl\">        <span class=\"c-k\">this<\/span>.ratio = ratio;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> sync(camX:<span class=\"c-t\">Float<\/span>, camY:<span class=\"c-t\">Float<\/span>, viewW:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        bmp.x = <span class=\"c-f\">-camX<\/span> * ratio;               <span class=\"c-c\">// the whole trick<\/span><\/span>","<span class=\"cl\">        bmp.y = yOffset - camY * ratio * <span class=\"c-n\">0.4<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-c\">// seamless wrap (below) keeps the layer infinite<\/span><\/span>","<span class=\"cl\">        bmp.x %= bmp.tile.width;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (bmp.x &gt; <span class=\"c-n\">0<\/span>) bmp.x -= bmp.tile.width;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class ParallaxLayer {\n    final bmp : h2d.Bitmap;\n    public var ratio : Float;      // 0.0 = infinite distance, 1.0 = gameplay speed\n    public var yOffset : Float;\n\n    public function new(tile:h2d.Tile, ratio, ?parent) {\n        bmp = new h2d.Bitmap(tile, parent);\n        this.ratio = ratio;\n    }\n    public function sync(camX:Float, camY:Float, viewW:Float) {\n        bmp.x = -camX * ratio;               // the whole trick\n        bmp.y = yOffset - camY * ratio * 0.4;\n        // seamless wrap (below) keeps the layer infinite\n        bmp.x %= bmp.tile.width;\n        if (bmp.x > 0) bmp.x -= bmp.tile.width;\n    }\n}"},{"k":"ul","i":["Layer plan for Cavern Run: far crystals 0.15 · mid stalactites 0.4 · gameplay 1.0 · foreground fog 1.3 (moves <em>faster<\/em> — foreground passes you)."]},{"k":"best","t":"Foreground faster than 1.0 is the pro move","h":"Everyone parallax-maxes at gameplay speed; one 1.2-1.4 layer in FRONT adds the feeling the world has volume."}],"src":"09_ch08.txt:117","n":182},{"ch":9,"kind":"content","title":"Parallax: Seamless Tiling and Auto-Scroll","tt":"Parallax: Seamless Tiling and Auto-Scroll","blocks":[{"k":"p","h":"Two finish details make parallax production-grade."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// 1. SEAMLESS: art must wrap horizontally — duplicate 2 instances and roll them:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> a = <span class=\"c-k\">new<\/span> <span class=\"c-t\">ParallaxLayer<\/span>(tex, <span class=\"c-n\">0.15<\/span>, fxRoot);<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> b = <span class=\"c-k\">new<\/span> <span class=\"c-t\">ParallaxLayer<\/span>(tex, <span class=\"c-n\">0.15<\/span>, fxRoot);<\/span>","<span class=\"cl\"><span class=\"c-k\">function<\/span> syncWrap(camX) {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> w = tex.width;<\/span>","<span class=\"cl\">    a.bmp.x = -((camX * <span class=\"c-n\">0.15<\/span>) % w);<\/span>","<span class=\"cl\">    b.bmp.x = a.bmp.x + w;                       <span class=\"c-c\">// right neighbor, always<\/span><\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-c\">// 2. AUTO-SCROLL: title screens drift forever:<\/span><\/span>","<span class=\"cl\">autoX += <span class=\"c-n\">24<\/span> * dt;                                <span class=\"c-c\">// px/s drift<\/span><\/span>","<span class=\"cl\">syncWrap(autoX);<\/span>"],"raw":"// 1. SEAMLESS: art must wrap horizontally — duplicate 2 instances and roll them:\nfinal a = new ParallaxLayer(tex, 0.15, fxRoot);\nfinal b = new ParallaxLayer(tex, 0.15, fxRoot);\nfunction syncWrap(camX) {\n    final w = tex.width;\n    a.bmp.x = -((camX * 0.15) % w);\n    b.bmp.x = a.bmp.x + w;                       // right neighbor, always\n}\n// 2. AUTO-SCROLL: title screens drift forever:\nautoX += 24 * dt;                                // px/s drift\nsyncWrap(autoX);"},{"k":"ul","i":["Author tileable art with a 1-2px overlap margin and mirror-fix the seam column if needed."]},{"k":"pit","t":"A visible seam line once per screen","h":"It scrolls through slowly and reads as \"bug\" not \"art\". Test by flying the camera fast for 10 seconds in both directions — seams show at wrap only."}],"src":"09_ch08.txt:135","n":183},{"ch":9,"kind":"content","title":"Particle Systems: The Anatomy","tt":"Particle Systems: The Anatomy","blocks":[{"k":"p","h":"Particles are the highest-leverage effect: dust, sparks, explosions, ambience. Decompose once, reuse forever."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">EMITTER (spawner)         UPDATER (physics)        RENDERER (draw)<\/span>","<span class=\"cl\"> where &amp; when births  →   pos += vel*dt      →     tile per particle<\/span>","<span class=\"cl\"> how many, how fast       vel += gravity*dt        color/alpha over life<\/span>","<span class=\"cl\"> initial state random     life -= dt               rotation, scale<\/span>","<span class=\"cl\">                          dead? → recycle          (this course: pooled Bitmaps)<\/span>"],"raw":"EMITTER (spawner)         UPDATER (physics)        RENDERER (draw)\n where & when births  →   pos += vel*dt      →     tile per particle\n how many, how fast       vel += gravity*dt        color/alpha over life\n initial state random     life -= dt               rotation, scale\n                          dead? → recycle          (this course: pooled Bitmaps)"},{"k":"ul","i":["Emitter = <em>policy<\/em> (when/what). Updater = <em>math<\/em> (all particles share one loop). Renderer = <em>pixels<\/em>.","Keeping the three as data + one loop each means 1,000 particles cost ~1 update loop and ~1 texture — not 1,000 objects with 3 scripts each."]}],"src":"09_ch08.txt:147","n":184},{"ch":9,"kind":"content","title":"Particle Data Structure","tt":"Particle Data Structure","blocks":[{"k":"p","h":"Plain floats, arrays-of-structs, zero allocations — the Chapter 4 \"plain data first\" lesson at full power."},{"k":"code","lang":"haxe","file":"Particles.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Particles<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">MAX<\/span> = <span class=\"c-n\">2048<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-c\">// parallel arrays (cache-friendly, no per-particle objects)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> px = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">FixedArray<\/span>&lt;<span class=\"c-t\">Float<\/span>&gt;(<span class=\"c-t\">MAX<\/span>);     <span class=\"c-c\">// position<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> py = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">FixedArray<\/span>&lt;<span class=\"c-t\">Float<\/span>&gt;(<span class=\"c-t\">MAX<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> vx = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">FixedArray<\/span>&lt;<span class=\"c-t\">Float<\/span>&gt;(<span class=\"c-t\">MAX<\/span>);     <span class=\"c-c\">// velocity<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> vy = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">FixedArray<\/span>&lt;<span class=\"c-t\">Float<\/span>&gt;(<span class=\"c-t\">MAX<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> life = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">FixedArray<\/span>&lt;<span class=\"c-t\">Float<\/span>&gt;(<span class=\"c-t\">MAX<\/span>);   <span class=\"c-c\">// seconds remaining<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> maxLife = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">FixedArray<\/span>&lt;<span class=\"c-t\">Float<\/span>&gt;(<span class=\"c-t\">MAX<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> size0 = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">FixedArray<\/span>&lt;<span class=\"c-t\">Float<\/span>&gt;(<span class=\"c-t\">MAX<\/span>);  <span class=\"c-c\">// start size<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> rot = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">FixedArray<\/span>&lt;<span class=\"c-t\">Float<\/span>&gt;(<span class=\"c-t\">MAX<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> count = <span class=\"c-n\">0<\/span>;                          <span class=\"c-c\">// live particles<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> kill(i:<span class=\"c-t\">Int<\/span>) {                  <span class=\"c-c\">// swap-with-last removal O(1)<\/span><\/span>","<span class=\"cl\">        count--;<\/span>","<span class=\"cl\">        px[i] = px[count]; py[i] = py[count]; vx[i] = vx[count]; vy[i] = vy[count];<\/span>","<span class=\"cl\">        life[i] = life[count]; maxLife[i] = maxLife[count];<\/span>","<span class=\"cl\">        size0[i] = size0[count]; rot[i] = rot[count];<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Particles {\n    static inline var MAX = 2048;\n    // parallel arrays (cache-friendly, no per-particle objects)\n    final px = new hxd.FixedArray<Float>(MAX);     // position\n    final py = new hxd.FixedArray<Float>(MAX);\n    final vx = new hxd.FixedArray<Float>(MAX);     // velocity\n    final vy = new hxd.FixedArray<Float>(MAX);\n    final life = new hxd.FixedArray<Float>(MAX);   // seconds remaining\n    final maxLife = new hxd.FixedArray<Float>(MAX);\n    final size0 = new hxd.FixedArray<Float>(MAX);  // start size\n    final rot = new hxd.FixedArray<Float>(MAX);\n    public var count = 0;                          // live particles\n\n    public function kill(i:Int) {                  // swap-with-last removal O(1)\n        count--;\n        px[i] = px[count]; py[i] = py[count]; vx[i] = vx[count]; vy[i] = vy[count];\n        life[i] = life[count]; maxLife[i] = maxLife[count];\n        size0[i] = size0[count]; rot[i] = rot[count];\n    }\n}"},{"k":"note","h":"<code>hxd.FixedArray<\/code> is Heaps' fixed-length array — no growth, no GC pressure. A plain <code>Array<\/code> with pre-allocated length also works; the discipline (never allocate in update) matters more than the type."}],"src":"09_ch08.txt:173","n":185},{"ch":9,"kind":"content","title":"The Emitter: Configuration and Bursts","tt":"The Emitter: Configuration and Bursts","blocks":[{"k":"p","h":"Emitters are <em>data<\/em>: one config produces one effect; a config library is your VFX palette."},{"k":"code","lang":"haxe","file":"EmitterConfig.hx","lines":["<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">EmitterConfig<\/span> = {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> tile : <span class=\"c-t\">String<\/span>;              <span class=\"c-c\">// atlas key<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> rate : <span class=\"c-t\">Float<\/span>;               <span class=\"c-c\">// particles/sec (0 = burst-only)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> burst : <span class=\"c-t\">Int<\/span>;                <span class=\"c-c\">// one-shot count<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> life : <span class=\"c-t\">Float<\/span>;               <span class=\"c-c\">// seconds ±<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> speed : <span class=\"c-t\">Float<\/span>;              <span class=\"c-c\">// px/s ±<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> spread : <span class=\"c-t\">Float<\/span>;             <span class=\"c-c\">// emission angle (radians), e.g. Math.PI/3<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> angle : <span class=\"c-t\">Float<\/span>;              <span class=\"c-c\">// emission direction<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> gravity : <span class=\"c-t\">Float<\/span>;            <span class=\"c-c\">// px/s²  (positive = down)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> size0 : <span class=\"c-t\">Float<\/span>; <span class=\"c-k\">final<\/span> size1 : <span class=\"c-t\">Float<\/span>;   <span class=\"c-c\">// size over life<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> color0 : <span class=\"c-t\">Int<\/span>; <span class=\"c-k\">final<\/span> color1 : <span class=\"c-t\">Int<\/span>;     <span class=\"c-c\">// tint over life<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> additive : <span class=\"c-t\">Bool<\/span>;            <span class=\"c-c\">// Add blend for glows<\/span><\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Emitter<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> cfg : <span class=\"c-t\">EmitterConfig<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> x : <span class=\"c-t\">Float<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> y : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> emitAcc = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>, ps:<span class=\"c-t\">Particles<\/span>) {<\/span>","<span class=\"cl\">        emitAcc += cfg.rate * dt;                       <span class=\"c-c\">// fractional rate<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">while<\/span> (emitAcc &gt;= <span class=\"c-n\">1<\/span>) { emitAcc--; ps.spawn(x, y, cfg); }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> burst(n:<span class=\"c-t\">Int<\/span>, ps:<span class=\"c-t\">Particles<\/span>)<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (_ in <span class=\"c-n\">0<\/span>...n) ps.spawn(x, y, cfg);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"typedef EmitterConfig = {\n    final tile : String;              // atlas key\n    final rate : Float;               // particles/sec (0 = burst-only)\n    final burst : Int;                // one-shot count\n    final life : Float;               // seconds ±\n    final speed : Float;              // px/s ±\n    final spread : Float;             // emission angle (radians), e.g. Math.PI/3\n    final angle : Float;              // emission direction\n    final gravity : Float;            // px/s²  (positive = down)\n    final size0 : Float; final size1 : Float;   // size over life\n    final color0 : Int; final color1 : Int;     // tint over life\n    final additive : Bool;            // Add blend for glows\n}\n\nclass Emitter {\n    public var cfg : EmitterConfig;\n    public var x : Float; public var y : Float;\n    var emitAcc = 0.0;\n\n    public function update(dt:Float, ps:Particles) {\n        emitAcc += cfg.rate * dt;                       // fractional rate\n        while (emitAcc >= 1) { emitAcc--; ps.spawn(x, y, cfg); }\n    }\n    public function burst(n:Int, ps:Particles)\n        for (_ in 0...n) ps.spawn(x, y, cfg);\n}"},{"k":"best","t":"Effects as configs, not classes","h":"<code>dust.json<\/code>, <code>explosion.json<\/code>, <code>gemSparkle.json<\/code> — one Particles engine, N configs. That is exactly how the editor (below) saves files."}],"src":"09_ch08.txt:205","n":186},{"ch":9,"kind":"content","title":"The Updater and the Pooled Renderer","tt":"The Updater and the Pooled Renderer","blocks":[{"k":"p","h":"One loop updates; pooled Bitmaps draw. This is the honest, portable baseline before any custom batcher."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">ParticleFx<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> ps = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Particles<\/span>();<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> emitters : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Emitter<\/span>&gt; = [];<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> pool : <span class=\"c-t\">Array<\/span>&lt;h2d.<span class=\"c-t\">Bitmap<\/span>&gt; = [];        <span class=\"c-c\">// recycled views<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> layer : h2d.<span class=\"c-t\">Layers<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (e in emitters) e.update(dt, ps);<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...ps.count) {               <span class=\"c-c\">// swap-removal: iterate backwards<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">var<\/span> j = ps.count - <span class=\"c-n\">1<\/span> - i;<\/span>","<span class=\"cl\">            ps.vy[j] += currentGravity * dt;<\/span>","<span class=\"cl\">            ps.px[j] += ps.vx[j] * dt;  ps.py[j] += ps.vy[j] * dt;<\/span>","<span class=\"cl\">            ps.life[j] -= dt;<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (ps.life[j] &lt;= <span class=\"c-n\">0<\/span>) ps.kill(j);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        render();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> render() {<\/span>","<span class=\"cl\">        <span class=\"c-k\">while<\/span> (pool.length &lt; ps.count) {        <span class=\"c-c\">// grow pool lazily, never shrink<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> b = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(atlas.get(<span class=\"c-s\">\"spark\"<\/span>), layer);<\/span>","<span class=\"cl\">            b.blendMode = h2d.<span class=\"c-t\">BlendMode<\/span>.<span class=\"c-t\">Add<\/span>;<\/span>","<span class=\"cl\">            pool.push(b);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...pool.length) {            <span class=\"c-c\">// hide the unused tail<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> b = pool[i];<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (i &gt;= ps.count) { b.visible = <span class=\"c-k\">false<\/span>; <span class=\"c-k\">continue<\/span>; }<\/span>","<span class=\"cl\">            b.visible = <span class=\"c-k\">true<\/span>;<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> k = ps.life[i] / ps.maxLife[i];        <span class=\"c-c\">// 1 → 0 over life<\/span><\/span>","<span class=\"cl\">            b.x = ps.px[i]; b.y = ps.py[i];<\/span>","<span class=\"cl\">            b.scale = <span class=\"c-t\">L<\/span>.lerp(ps.size0[i] * <span class=\"c-n\">0.3<\/span>, ps.size0[i], k);<\/span>","<span class=\"cl\">            b.alpha = k;                                  <span class=\"c-c\">// fade out<\/span><\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class ParticleFx {\n    final ps = new Particles();\n    final emitters : Array<Emitter> = [];\n    final pool : Array<h2d.Bitmap> = [];        // recycled views\n    final layer : h2d.Layers;\n\n    public function update(dt:Float) {\n        for (e in emitters) e.update(dt, ps);\n        for (i in 0...ps.count) {               // swap-removal: iterate backwards\n            var j = ps.count - 1 - i;\n            ps.vy[j] += currentGravity * dt;\n            ps.px[j] += ps.vx[j] * dt;  ps.py[j] += ps.vy[j] * dt;\n            ps.life[j] -= dt;\n            if (ps.life[j] <= 0) ps.kill(j);\n        }\n        render();\n    }\n    function render() {\n        while (pool.length < ps.count) {        // grow pool lazily, never shrink\n            final b = new h2d.Bitmap(atlas.get(\"spark\"), layer);\n            b.blendMode = h2d.BlendMode.Add;\n            pool.push(b);\n        }\n        for (i in 0...pool.length) {            // hide the unused tail\n            final b = pool[i];\n            if (i >= ps.count) { b.visible = false; continue; }\n            b.visible = true;\n            final k = ps.life[i] / ps.maxLife[i];        // 1 → 0 over life\n            b.x = ps.px[i]; b.y = ps.py[i];\n            b.scale = L.lerp(ps.size0[i] * 0.3, ps.size0[i], k);\n            b.alpha = k;                                  // fade out\n        }\n    }\n}"},{"k":"ul","i":["500 pooled Bitmaps from one atlas page ≈ 1 draw call in Heaps — surprisingly far."]},{"k":"pit","t":"Spawning view objects per particle","h":"<code>new Bitmap<\/code> per spark = GC churn = frame hitches exactly at explosions. The pool is not an optimization; it is the design."}],"src":"09_ch08.txt:246","n":187},{"ch":9,"kind":"content","title":"Emitter Recipes: Dust, Sparks, Explosions","tt":"Emitter Recipes: Dust, Sparks, Explosions","blocks":[{"k":"p","h":"Three configs from Cavern Run — copy, tune, ship."},{"k":"code","lang":"json","file":"res/fx/dust.json","lines":["<span class=\"cl\">{<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"tile\"<\/span>: <span class=\"c-s\">\"soft_circle\"<\/span>, <span class=\"c-f\">\"rate\"<\/span>: <span class=\"c-n\">14<\/span>, <span class=\"c-f\">\"burst\"<\/span>: <span class=\"c-n\">0<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"life\"<\/span>: <span class=\"c-n\">0.8<\/span>, <span class=\"c-f\">\"speed\"<\/span>: <span class=\"c-n\">26<\/span>, <span class=\"c-f\">\"spread\"<\/span>: <span class=\"c-n\">3.14<\/span>, <span class=\"c-f\">\"angle\"<\/span>: <span class=\"c-n\">-1.57<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"gravity\"<\/span>: <span class=\"c-n\">-12<\/span>, <span class=\"c-f\">\"size0\"<\/span>: <span class=\"c-n\">6<\/span>, <span class=\"c-f\">\"size1\"<\/span>: <span class=\"c-n\">14<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"color0\"<\/span>: <span class=\"c-n\">10987431<\/span>, <span class=\"c-f\">\"color1\"<\/span>: <span class=\"c-n\">5592405<\/span>, <span class=\"c-f\">\"additive\"<\/span>: <span class=\"c-k\">false<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"{\n  \"tile\": \"soft_circle\", \"rate\": 14, \"burst\": 0,\n  \"life\": 0.8, \"speed\": 26, \"spread\": 3.14, \"angle\": -1.57,\n  \"gravity\": -12, \"size0\": 6, \"size1\": 14,\n  \"color0\": 10987431, \"color1\": 5592405, \"additive\": false\n}"},{"k":"code","lang":"json","file":"res/fx/explosion.json","lines":["<span class=\"cl\">{<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"tile\"<\/span>: <span class=\"c-s\">\"spark\"<\/span>, <span class=\"c-f\">\"rate\"<\/span>: <span class=\"c-n\">0<\/span>, <span class=\"c-f\">\"burst\"<\/span>: <span class=\"c-n\">42<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"life\"<\/span>: <span class=\"c-n\">0.5<\/span>, <span class=\"c-f\">\"speed\"<\/span>: <span class=\"c-n\">240<\/span>, <span class=\"c-f\">\"spread\"<\/span>: <span class=\"c-n\">6.28<\/span>, <span class=\"c-f\">\"angle\"<\/span>: <span class=\"c-n\">0<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"gravity\"<\/span>: <span class=\"c-n\">300<\/span>, <span class=\"c-f\">\"size0\"<\/span>: <span class=\"c-n\">10<\/span>, <span class=\"c-f\">\"size1\"<\/span>: <span class=\"c-n\">2<\/span>,<\/span>","<span class=\"cl\">  <span class=\"c-f\">\"color0\"<\/span>: <span class=\"c-n\">16763904<\/span>, <span class=\"c-f\">\"color1\"<\/span>: <span class=\"c-n\">16711680<\/span>, <span class=\"c-f\">\"additive\"<\/span>: <span class=\"c-k\">true<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"{\n  \"tile\": \"spark\", \"rate\": 0, \"burst\": 42,\n  \"life\": 0.5, \"speed\": 240, \"spread\": 6.28, \"angle\": 0,\n  \"gravity\": 300, \"size0\": 10, \"size1\": 2,\n  \"color0\": 16763904, \"color1\": 16711680, \"additive\": true\n}"},{"k":"ul","i":["Dust: slow, upward, growing, non-additive. Explosion: burst, radial, gravity, additive, shrinking.","The third recipe (gem sparkle) is the chapter project: burst 8, elastic scale-in, additive gold."]}],"src":"09_ch08.txt:267","n":188},{"ch":9,"kind":"content","title":"The Particle Editor: Live Tuning","tt":"The Particle Editor: Live Tuning","blocks":[{"k":"p","h":"Tuning configs by reloading the game is agony; an editor is 150 lines on what you already have."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">[FX EDITOR screen]  (a Screen from Ch. 7 — it gets focus + input for free)<\/span>","<span class=\"cl\">┌───────────────────────────────┬──────────────────────┐<\/span>","<span class=\"cl\">│  live preview (Particles +    │ config sliders       │<\/span>","<span class=\"cl\">│  looping emitters, grid bg)   │ rate/life/speed/...  │<\/span>","<span class=\"cl\">│  R = re-burst   SPACE = pause │ [save] [load] [reset]│<\/span>","<span class=\"cl\">└───────────────────────────────┴──────────────────────┘<\/span>"],"raw":"[FX EDITOR screen]  (a Screen from Ch. 7 — it gets focus + input for free)\n┌───────────────────────────────┬──────────────────────┐\n│  live preview (Particles +    │ config sliders       │\n│  looping emitters, grid bg)   │ rate/life/speed/...  │\n│  R = re-burst   SPACE = pause │ [save] [load] [reset]│\n└───────────────────────────────┴──────────────────────┘"},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">FxEditorScreen<\/span> <span class=\"c-k\">implements<\/span> <span class=\"c-t\">Screen<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> cfg : <span class=\"c-t\">EmitterConfig<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> preview = <span class=\"c-k\">new<\/span> <span class=\"c-t\">ParticleFx<\/span>();<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        cfg.rate  = rateSlider.value;      <span class=\"c-c\">// sliders write INTO the config<\/span><\/span>","<span class=\"cl\">        cfg.speed = speedSlider.value;     <span class=\"c-c\">// emitter reads it next frame — live!<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (<span class=\"c-t\">Input<\/span>.pressed(<span class=\"c-t\">R<\/span>)) preview.burst(cfg);<\/span>","<span class=\"cl\">        preview.update(dt);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> save()<\/span>","<span class=\"cl\">        hxd.<span class=\"c-t\">Save<\/span>.save(cfg, <span class=\"c-s\">'fx-${name}'<\/span>);  <span class=\"c-c\">// or write JSON next to res/ for hot reload<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"class FxEditorScreen implements Screen {\n    final cfg : EmitterConfig;\n    final preview = new ParticleFx();\n    public function update(dt:Float) {\n        cfg.rate  = rateSlider.value;      // sliders write INTO the config\n        cfg.speed = speedSlider.value;     // emitter reads it next frame — live!\n        if (Input.pressed(R)) preview.burst(cfg);\n        preview.update(dt);\n    }\n    function save()\n        hxd.Save.save(cfg, 'fx-${name}');  // or write JSON next to res/ for hot reload\n}"},{"k":"ul","i":["The \"editor\" is the game rendering its own effect with sliders wired to the config object — no duplicate implementation to drift out of sync."]},{"k":"best","t":"Editors that play IN the engine","h":"The editor preview IS the engine — particle behavior can never differ between editor and game. This principle scales to level editors and (Chapter 14) material viewers."}],"src":"09_ch08.txt:294","n":189},{"ch":9,"kind":"content","title":"Ambient Effects: Weather and Mood","tt":"Ambient Effects: Weather and Mood","blocks":[{"k":"p","h":"Long-lived emitters turn levels alive — and test your pooling discipline."},{"k":"ul","i":["<b>Ambient dust<\/b>: rate 3-6, whole-screen spawn box, 30 s life, no additive — the \"cave breath\".","<b>Drips<\/b>: burst 1 every 2-6 s (random timer) at random ceiling spots; gravity does the rest.","<b>Fireflies<\/b>: sine-wander instead of straight lines (velocity toward a moving attractor point)."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// wander: nudge velocity toward a slowly moving target each tick<\/span><\/span>","<span class=\"cl\">vx += (attractorX - px[i]) * <span class=\"c-n\">0.4<\/span> * dt;<\/span>","<span class=\"cl\">vy += (attractorY - py[i]) * <span class=\"c-n\">0.4<\/span> * dt;<\/span>","<span class=\"cl\">vx *= <span class=\"c-n\">0.98<\/span>; vy *= <span class=\"c-n\">0.98<\/span>;               <span class=\"c-c\">// drag keeps it lazy<\/span><\/span>"],"raw":"// wander: nudge velocity toward a slowly moving target each tick\nvx += (attractorX - px[i]) * 0.4 * dt;\nvy += (attractorY - py[i]) * 0.4 * dt;\nvx *= 0.98; vy *= 0.98;               // drag keeps it lazy"},{"k":"best","t":"Emitters positioned in WORLD space, parented to the fx layer","h":"Chapter 4's layers table gives fx z=20 above gameplay; ambience spawns in world coordinates so it scrolls correctly with the camera."}],"src":"09_ch08.txt:307","n":190},{"ch":9,"kind":"content","title":"Project: Dust Trails and Gem Showers","tt":"Project: Dust Trails and Gem Showers","blocks":[{"k":"p","h":"Chapter 8's exit ticket, three effects deep."},{"k":"ul","i":["Player run: dust puffs at footfalls (rate driven by speed, spawn at feet, non-additive).","Gem collect: burst 8 gold sparks + one elastic \"snack\" scale on the HUD counter (Ch. 13 builds the tween version).","Explosion crates (Ch. 10 preview): burst config + camera trauma (Ch. 6) — effect systems composing."]},{"k":"best","t":"Effects sell mechanics","h":"A gem without sparkle is a bug fix; with sparkle + sound + counter-pop it is a reward loop. Budget effects time as design time, not polish time."}],"src":"09_ch08.txt:314","n":191},{"ch":9,"kind":"content","title":"Chapter 8 Checklist","tt":"Chapter 8 Checklist","blocks":[{"k":"ul","i":["<code>L.approach<\/code> (exponential) replaces all naive <code>k*dt<\/code> smoothing.","Six easings in a table; durations in seconds.","Parallax layers with wrap and one 1.2+ foreground layer.","Particles: parallel arrays, swap-kill, pooled Bitmap renderer, zero allocation per frame.","Emitters are configs; three recipes saved as JSON.","Editor screen tunes configs live and saves them."]}],"src":"09_ch08.txt:322","n":192},{"ch":10,"kind":"chapter","title":"Screen Transitions","tt":"Screen Transitions","sub":"Fade, slide, wipe and shader-based transitions — the polish layer between screens.","blocks":[],"src":"10_ch09.txt:1","n":193},{"ch":10,"kind":"content","title":"Screen Transitions: Why They Matter","tt":"Screen Transitions: Why They Matter","blocks":[{"k":"p","h":"Transitions are information: \"the old is over, the new has begun\". They also hide the one-frame cost of building the next screen."},{"k":"ul","i":["<b>Cover<\/b> the construction hitch: screens build objects; a 20 ms build inside a visible frame is a flicker.","<b>Signal flow direction<\/b>: deeper = darker/slower; back = quicker, brighter. Players feel hierarchy subconsciously.","<b>Never block input silently<\/b>: mid-transition input must be captured or players double-trigger buttons."]},{"k":"pit","t":"Instant screen swaps feel broken","h":"A hard cut reads as a crash to non-technical players. Even a 0.12 s fade changes \"did it break?\" into \"it worked\"."}],"src":"10_ch09.txt:10","n":194},{"ch":10,"kind":"content","title":"The Transition Framework","tt":"The Transition Framework","blocks":[{"k":"p","h":"One abstract shape: two phases, a midpoint callback to swap screens, easing on both halves."},{"k":"code","lang":"haxe","file":"Transition.hx","lines":["<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">Transition<\/span> = {<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> play(oldScr:<span class=\"c-t\">Screen<\/span>, newScr:<span class=\"c-t\">Screen<\/span>, done:() -&gt; <span class=\"c-t\">Void<\/span>) : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> blocking() : <span class=\"c-t\">Bool<\/span>;      <span class=\"c-c\">// modal while running<\/span><\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">abstract<\/span> <span class=\"c-k\">class<\/span> <span class=\"c-t\">BasicTransition<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> half : <span class=\"c-t\">Float<\/span>;                 <span class=\"c-c\">// seconds per phase<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> mid : () -&gt; <span class=\"c-t\">Void<\/span>;             <span class=\"c-c\">// swap happens here<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> t = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> phase = <span class=\"c-n\">0<\/span>;                    <span class=\"c-c\">// 0 = cover, 1 = reveal<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        t += dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (phase == <span class=\"c-n\">0<\/span> &amp;&amp; t &gt;= half) { phase = <span class=\"c-n\">1<\/span>; t = <span class=\"c-n\">0<\/span>; mid(); }  <span class=\"c-c\">// SWAP<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (phase == <span class=\"c-n\">1<\/span> &amp;&amp; t &gt;= half) done();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"typedef Transition = {\n    function play(oldScr:Screen, newScr:Screen, done:() -> Void) : Void;\n    function update(dt:Float) : Void;\n    function blocking() : Bool;      // modal while running\n}\n\nabstract class BasicTransition {\n    var half : Float;                 // seconds per phase\n    var mid : () -> Void;             // swap happens here\n    var t = 0.0;\n    var phase = 0;                    // 0 = cover, 1 = reveal\n\n    public function update(dt:Float) {\n        t += dt;\n        if (phase == 0 && t >= half) { phase = 1; t = 0; mid(); }  // SWAP\n        if (phase == 1 && t >= half) done();\n    }\n}"},{"k":"ul","i":["Phase 1 (cover): old screen fully visible, effect grows.","Midpoint: <code>ScreenManager.show()<\/code> fires <em>behind<\/em> the effect — construction cost is hidden.","Phase 2 (reveal): new screen shown, effect retreats."]},{"k":"best","t":"Build the swap into the midpoint, not the end","h":"The next screen builds while covered — the transition IS your loading cover for cheap screens. Bigger loads need Chapter 5's async screen."}],"src":"10_ch09.txt:37","n":195},{"ch":10,"kind":"content","title":"Fade to Color","tt":"Fade to Color","blocks":[{"k":"p","h":"The workhorse: black fade, 0.18 s out, 0.22 s in. Asymmetric times feel more natural than symmetry."},{"k":"code","lang":"haxe","file":"Fade.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Fade<\/span> <span class=\"c-k\">extends<\/span> <span class=\"c-t\">BasicTransition<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> cover : h2d.<span class=\"c-t\">Bitmap<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> s2d : h2d.<span class=\"c-t\">Scene<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(s2d:h2d.<span class=\"c-t\">Scene<\/span>, halfOut = <span class=\"c-n\">0.18<\/span>, halfIn = <span class=\"c-n\">0.22<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">this<\/span>.s2d = s2d;<\/span>","<span class=\"cl\">        cover = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(h2d.<span class=\"c-t\">Tile<\/span>.fromColor(<span class=\"c-n\">0x000000<\/span>), s2d);<\/span>","<span class=\"cl\">        cover.scaleX = s2d.width; cover.scaleY = s2d.height;  <span class=\"c-c\">// fullscreen black<\/span><\/span>","<span class=\"cl\">        cover.tile.dx = <span class=\"c-n\">0<\/span>; cover.tile.dy = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">this<\/span>.half = halfOut; <span class=\"c-k\">this<\/span>.halfIn = halfIn;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">super<\/span>.update(dt);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> k = <span class=\"c-t\">Ease<\/span>.quadIn(<span class=\"c-t\">Math<\/span>.min(<span class=\"c-n\">1<\/span>, t / half));       <span class=\"c-c\">// ease each phase<\/span><\/span>","<span class=\"cl\">        cover.alpha = phase == <span class=\"c-n\">0<\/span> ? k : <span class=\"c-n\">1<\/span> - k;               <span class=\"c-c\">// out then in<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (finished) cover.remove();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Fade extends BasicTransition {\n    final cover : h2d.Bitmap;\n    final s2d : h2d.Scene;\n    public function new(s2d:h2d.Scene, halfOut = 0.18, halfIn = 0.22) {\n        this.s2d = s2d;\n        cover = new h2d.Bitmap(h2d.Tile.fromColor(0x000000), s2d);\n        cover.scaleX = s2d.width; cover.scaleY = s2d.height;  // fullscreen black\n        cover.tile.dx = 0; cover.tile.dy = 0;\n        this.half = halfOut; this.halfIn = halfIn;\n    }\n    public function update(dt:Float) {\n        super.update(dt);\n        final k = Ease.quadIn(Math.min(1, t / half));       // ease each phase\n        cover.alpha = phase == 0 ? k : 1 - k;               // out then in\n        if (finished) cover.remove();\n    }\n}"},{"k":"ul","i":["The cover bitmap sits above everything: <code>s2d.addChild(cover)<\/code> puts it topmost.","White fades hurt eyes; use black or your theme's dark tone (skin palette, Chapter 7)."]}],"src":"10_ch09.txt:61","n":196},{"ch":10,"kind":"content","title":"Slide and Push Transitions","tt":"Slide and Push Transitions","blocks":[{"k":"p","h":"Direction has meaning: push left = forward in a flow, push right = back."},{"k":"code","lang":"haxe","file":"Slide.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Slide<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> oldRoot : h2d.<span class=\"c-t\">Object<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> newRoot : h2d.<span class=\"c-t\">Object<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(oldScr, newScr, dirX = <span class=\"c-n\">1<\/span>) {<\/span>","<span class=\"cl\">        oldRoot = oldScr.root; newRoot = newScr.root;<\/span>","<span class=\"cl\">        newRoot.x = s2d.width * dirX;      <span class=\"c-c\">// new screen starts off-screen<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> k = <span class=\"c-t\">Ease<\/span>.inOut(<span class=\"c-t\">Math<\/span>.min(<span class=\"c-n\">1<\/span>, t / dur));<\/span>","<span class=\"cl\">        oldRoot.x = <span class=\"c-f\">-s2d<\/span>.width * k * dirX; <span class=\"c-c\">// old leaves opposite<\/span><\/span>","<span class=\"cl\">        newRoot.x = s2d.width * (<span class=\"c-n\">1<\/span> - k) * dirX;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (k &gt;= <span class=\"c-n\">1<\/span>) { oldRoot.remove(); onDone(); }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Slide {\n    final oldRoot : h2d.Object;\n    final newRoot : h2d.Object;\n    public function new(oldScr, newScr, dirX = 1) {\n        oldRoot = oldScr.root; newRoot = newScr.root;\n        newRoot.x = s2d.width * dirX;      // new screen starts off-screen\n    }\n    public function update(dt:Float) {\n        final k = Ease.inOut(Math.min(1, t / dur));\n        oldRoot.x = -s2d.width * k * dirX; // old leaves opposite\n        newRoot.x = s2d.width * (1 - k) * dirX;\n        if (k >= 1) { oldRoot.remove(); onDone(); }\n    }\n}"},{"k":"ul","i":["\"Push\" = both move. \"Replace\" = old slides out, new waits, new slides in (use two phases like Fade)."]},{"k":"pit","t":"Sliding reveals the void","h":"Behind both screens is the scene background. Set <code>s2d.backgroundColor<\/code> to the destination theme's color, or slide a third static panel underneath."}],"src":"10_ch09.txt:82","n":197},{"ch":10,"kind":"content","title":"Wipe Transitions and Masking","tt":"Wipe Transitions and Masking","blocks":[{"k":"p","h":"A wipe is a growing mask: reveal rectangle interpolates from nothing to fullscreen."},{"k":"code","lang":"haxe","file":"Wipe.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Wipe<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> mask : h2d.<span clas
