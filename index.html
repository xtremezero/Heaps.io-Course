function anyOverlay(){ return document.body.classList.contains('ov')||document.body.classList.contains('sr')||document.body.classList.contains('side'); }
function toggleOv(force){
  var on = typeof force==='boolean' ? force : !document.body.classList.contains('ov');
  document.body.classList.toggle('ov', on);
  if(on){ var c=ovCards[cur]; if(c) c.scrollIntoView({block:'center'}); }
}
function openSearch(){
  document.body.classList.add('sr');
  srQ.value=''; renderResults('');
  setTimeout(function(){ srQ.focus(); }, 30);
}
function closeSearch(){ document.body.classList.remove('sr'); }
function toggleSide(force){
  var on = typeof force==='boolean' ? force : !document.body.classList.contains('side');
  document.body.classList.toggle('side', on);
  if(on){
    var row=document.querySelector('.chrow.open');
    if(row) setTimeout(function(){ row.scrollIntoView({block:'nearest'}); }, 60);
  }
}
function closeSide(){ document.body.classList.remove('side'); }

function renderResults(q){
  q=q.trim().toLowerCase();
  srList.innerHTML='';
  lastResults=[]; selIdx=0;
  if(!q){ var e=mk('div'); e.id='srempty'; e.textContent='Type to search slide titles and code...'; srList.appendChild(e); return; }
  for(var i=0;i<N && lastResults.length<60;i++){
    var hay=srIndex[i].toLowerCase();
    var pos=hay.indexOf(q);
    if(pos<0) continue;
    var s=SL[i];
    var r=mk('div','srr');
    var n=mk('div','srn'); n.textContent=s.n; r.appendChild(n);
    var m=mk('div'); var t=mk('div','srt');
    var titlePlain=plain(s.title);
    var tp=titlePlain.toLowerCase().indexOf(q);
    t.innerHTML = tp>=0 ? esc(titlePlain.slice(0,tp))+'<mark>'+esc(titlePlain.slice(tp,tp+q.length))+'</mark>'+esc(titlePlain.slice(tp+q.length)) : esc(titlePlain);
    m.appendChild(t);
    var sn=mk('div','srs');
    var raw=srIndex[i];
    sn.textContent='…'+raw.slice(Math.max(0,pos-40), pos+60)+'…';
    m.appendChild(sn);
    r.appendChild(m);
    (function(idx){ r.addEventListener('click', function(){ closeSearch(); go(idx); }); })(i);
    srList.appendChild(r);
    lastResults.push(r);
  }
  if(!lastResults.length){
    var e2=mk('div'); e2.id='srempty'; e2.textContent='No slides match “'+esc(q)+'”.'; srList.appendChild(e2);
  } else lastResults[0].classList.add('sel');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- events ---------- */
document.addEventListener('keydown', function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') {
    if(e.key==='Escape'){ closeSearch(); e.target.blur(); e.preventDefault(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(lastResults.length) lastResults[0].click(); }
    return;
  }
  switch(e.key){
    case 'ArrowRight': case 'PageDown': case ' ':
      e.preventDefault(); if(document.body.classList.contains('ov')) toggleOv(false); else go(cur+1); break;
    case 'ArrowLeft': case 'PageUp':
      e.preventDefault(); if(document.body.classList.contains('ov')) toggleOv(false); else go(cur-1); break;
    case 'Home': e.preventDefault(); go(0); break;
    case 'End': e.preventDefault(); go(N-1); break;
    case 'Escape':
      if(document.body.classList.contains('ov')) toggleOv(false);
      else if(document.body.classList.contains('sr')) closeSearch();
      else if(document.body.classList.contains('side')) closeSide();
      break;
    case 'o': case 'O': toggleOv(); break;
    case 'f': case 'F':
      if(document.fullscreenElement){ document.exitFullscreen&&document.exitFullscreen(); }
      else { var d=document.documentElement; (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); }
      break;
    case '/': case 's': case 'S':
      e.preventDefault(); if(!document.body.classList.contains('sr')) openSearch(); break;
    case 'g': case 'G':
      var v=window.prompt('Go to slide (1–'+N+'):');
      if(v){ var n=parseInt(v,10); if(!isNaN(n)) go(n-1); }
      break;
  }
});

/* swipe */
var tx=0, ty=0, tt=0;
document.addEventListener('touchstart', function(e){
  if(e.touches.length!==1||anyOverlay()) return;
  tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now();
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(!tt) return;
  var t=e.changedTouches[0];
  var dx=t.clientX-tx, dy=t.clientY-ty, dt=Date.now()-tt; tt=0;
  if(dt<700 && Math.abs(dx)>60 && Math.abs(dx)>1.6*Math.abs(dy)){
    if(dx<0) go(cur+1); else go(cur-1);
  }
}, {passive:true});

/* chrome buttons */
document.getElementById('btn-next').addEventListener('click', function(){ go(cur+1); });
document.getElementById('btn-prev').addEventListener('click', function(){ go(cur-1); });
document.getElementById('btn-ov').addEventListener('click', function(){ toggleOv(); });
document.getElementById('btn-sr').addEventListener('click', openSearch);
document.getElementById('btn-fs').addEventListener('click', function(){
  if(document.fullscreenElement){ document.exitFullscreen&&document.exitFullscreen(); }
  else { var d=document.documentElement; (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); }
});
document.getElementById('btn-side').addEventListener('click', function(){ toggleSide(); });
document.getElementById('sideclose').addEventListener('click', closeSide);
document.getElementById('brand').addEventListener('click', function(){ go(0); });
document.getElementById('ovclose').addEventListener('click', function(){ toggleOv(false); });
document.getElementById('scrim').addEventListener('click', closeSide);
document.getElementById('bar').addEventListener('click', function(e){
  var r=e.currentTarget.getBoundingClientRect();
  go(Math.floor(((e.clientX-r.left)/r.width)*N));
});
srQ.addEventListener('input', function(){ renderResults(srQ.value); });

/* hash + restore */
function initFromHash(){
  var m=/^#\/(\d+)$/.exec(location.hash||'');
  if(m){ var n=parseInt(m[1],10); if(n>=1&&n<=N) return n-1; }
  try{
    var s=parseInt(localStorage.getItem('heaps-course-slide')||'0',10);
    if(s>=1&&s<=N) return s-1;
  }catch(e){}
  return 0;
}
window.addEventListener('hashchange', function(){
  var m=/^#\/(\d+)$/.exec(location.hash||'');
  if(m){ var n=parseInt(m[1],10); if(n>=1&&n<=N) go(n-1,true); }
});
go(initFromHash(), true);
})();
</script>
