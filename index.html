s=\"c-t\">Bitmap<\/span>;      <span class=\"c-c\">// opaque cover with a hole — implemented below<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> wipeW = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        wipeW = <span class=\"c-t\">L<\/span>.lerp(<span class=\"c-n\">0<\/span>, s2d.width, <span class=\"c-t\">Ease<\/span>.quadOut(t / dur));<\/span>","<span class=\"cl\">        mask.scaleX = wipeW;      <span class=\"c-c\">// cover grows from the left...<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-c\">// variant — BARN DOOR: two covers close from both sides then open:<\/span><\/span>","<span class=\"cl\">left.scaleX  = half(t);  right.scaleX = half(t);   <span class=\"c-c\">// half(t) = lerp(0, w/2, e)<\/span><\/span>"],"raw":"class Wipe {\n    final mask : h2d.Bitmap;      // opaque cover with a hole — implemented below\n    var wipeW = 0.0;\n    public function update(dt:Float) {\n        wipeW = L.lerp(0, s2d.width, Ease.quadOut(t / dur));\n        mask.scaleX = wipeW;      // cover grows from the left...\n    }\n}\n// variant — BARN DOOR: two covers close from both sides then open:\nleft.scaleX  = half(t);  right.scaleX = half(t);   // half(t) = lerp(0, w/2, e)"},{"k":"ul","i":["Wipes say \"same world, different moment\" (level complete); fades say \"different context\" (title → game)."]},{"k":"best","t":"Pick per flow, not per whim","h":"A transition grammar (fade = context change, wipe = scene change, slide = navigation) is invisible when consistent and nausea-inducing when random."}],"src":"10_ch09.txt:99","n":198},{"ch":10,"kind":"content","title":"Shader-Based Transitions: The Concept","tt":"Shader-Based Transitions: The Concept","blocks":[{"k":"p","h":"GPU wipes unlock organic shapes: noise thresholds, burning edges, liquid dissolve — impossible with rectangles."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">CPU wipe:   if (x &lt; edge) draw old else new         ← hard edge, no shapes<\/span>","<span class=\"cl\">GPU dissolve: noise(x,y) &lt; progress ? new : old     ← soft organic frontier<\/span>","<span class=\"cl\">   + smoothstep band around threshold = feathered edge<\/span>","<span class=\"cl\">   + tint band color = burning / electric / frost<\/span>"],"raw":"CPU wipe:   if (x < edge) draw old else new         ← hard edge, no shapes\nGPU dissolve: noise(x,y) < progress ? new : old     ← soft organic frontier\n   + smoothstep band around threshold = feathered edge\n   + tint band color = burning / electric / frost"},{"k":"ul","i":["Progress is a single uniform 0→1 — the transition system from this chapter drives it identically.","The noise can be a pre-generated texture (Chapter 5 atlas) — no runtime noise cost."]}],"src":"10_ch09.txt:110","n":199},{"ch":10,"kind":"content","title":"Shader-Based Wipe: The Code","tt":"Shader-Based Wipe: The Code","blocks":[{"k":"p","h":"The course's second real shader (Chapter 11 does the full treatment) — a dissolve on a fullscreen cover."},{"k":"code","lang":"haxe","file":"DissolveShader.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">DissolveShader<\/span> <span class=\"c-k\">extends<\/span> hxsl.<span class=\"c-t\">Shader<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">SRC<\/span> = {<\/span>","<span class=\"cl\">        @:<span class=\"c-k\">import<\/span> h3d.shader.<span class=\"c-t\">Base2d<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> progress : <span class=\"c-t\">Float<\/span>;              <span class=\"c-c\">// 0 → 1<\/span><\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> noise : <span class=\"c-t\">Sampler2D<\/span>;             <span class=\"c-c\">// noise texture<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> fragment() {<\/span>","<span class=\"cl\">            <span class=\"c-k\">var<\/span> n = noise.get(calculatedUV).r;    <span class=\"c-c\">// 0..1 noise per pixel<\/span><\/span>","<span class=\"cl\">            <span class=\"c-c\">// burn away where noise &lt; progress, feathered edge band<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">var<\/span> edge = smoothstep(progress, progress - <span class=\"c-n\">0.08<\/span>, n);<\/span>","<span class=\"cl\">            pixelColor.a *= edge;                 <span class=\"c-c\">// dissolve the cover<\/span><\/span>","<span class=\"cl\">            <span class=\"c-c\">// glowing rim right at the threshold:<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">var<\/span> rim = <span class=\"c-n\">1<\/span> - smoothstep(<span class=\"c-n\">0.0<\/span>, <span class=\"c-n\">0.06<\/span>, <span class=\"c-t\">Math<\/span>.abs(n - progress + <span class=\"c-n\">0.04<\/span>));<\/span>","<span class=\"cl\">            pixelColor.rgb += vec3(<span class=\"c-n\">1.0<\/span>, <span class=\"c-n\">0.55<\/span>, <span class=\"c-n\">0.2<\/span>) * rim * <span class=\"c-n\">0.8<\/span>;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    };<\/span>","<span class=\"cl\">    <span class=\"c-c\">// bound instance fields (auto-uploaded per draw)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> progress : <span class=\"c-t\">Float<\/span> = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> noise : h3d.mat.<span class=\"c-t\">Texture<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class DissolveShader extends hxsl.Shader {\n    static var SRC = {\n        @:import h3d.shader.Base2d;\n        @param var progress : Float;              // 0 → 1\n        @param var noise : Sampler2D;             // noise texture\n        function fragment() {\n            var n = noise.get(calculatedUV).r;    // 0..1 noise per pixel\n            // burn away where noise < progress, feathered edge band\n            var edge = smoothstep(progress, progress - 0.08, n);\n            pixelColor.a *= edge;                 // dissolve the cover\n            // glowing rim right at the threshold:\n            var rim = 1 - smoothstep(0.0, 0.06, Math.abs(n - progress + 0.04));\n            pixelColor.rgb += vec3(1.0, 0.55, 0.2) * rim * 0.8;\n        }\n    };\n    // bound instance fields (auto-uploaded per draw)\n    public var progress : Float = 0;\n    public var noise : h3d.mat.Texture;\n}"},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// cover bitmap with the shader; transition drives `progress`:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> sh = <span class=\"c-k\">new<\/span> <span class=\"c-t\">DissolveShader<\/span>();<\/span>","<span class=\"cl\">sh.noise = atlas.get(<span class=\"c-s\">\"noise\"<\/span>).getTexture();<\/span>","<span class=\"cl\">cover.addShader(sh);<\/span>","<span class=\"cl\">sh.progress = easedT;   <span class=\"c-c\">// phase 0: 0→1 (cover appears), phase 1: 1→0<\/span><\/span>"],"raw":"// cover bitmap with the shader; transition drives `progress`:\nfinal sh = new DissolveShader();\nsh.noise = atlas.get(\"noise\").getTexture();\ncover.addShader(sh);\nsh.progress = easedT;   // phase 0: 0→1 (cover appears), phase 1: 1→0"},{"k":"note","h":"<code>calculatedUV<\/code>, <code>smoothstep<\/code> and instance-field binding are explained in Chapter 11's shader anatomy slides — revisit after that chapter for the full mental model."}],"src":"10_ch09.txt:142","n":200},{"ch":10,"kind":"content","title":"Circle Reveal and Iris Effects","tt":"Circle Reveal and Iris Effects","blocks":[{"k":"p","h":"The iris (circle expanding from a focal point) is the classic \"spotlight\" transition — distance math instead of noise."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">function<\/span> fragment() {<\/span>","<span class=\"cl\">    @param <span class=\"c-k\">var<\/span> progress : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    @param <span class=\"c-k\">var<\/span> center : <span class=\"c-t\">Vec2<\/span>;                     <span class=\"c-c\">// focus point (uv space)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> d = distance(calculatedUV, center);       <span class=\"c-c\">// 0 at focus<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> r = progress * <span class=\"c-n\">0.8<\/span>;                       <span class=\"c-c\">// growing radius<\/span><\/span>","<span class=\"cl\">    pixelColor.a *= <span class=\"c-n\">1<\/span> - smoothstep(r, r - <span class=\"c-n\">0.05<\/span>, d);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"function fragment() {\n    @param var progress : Float;\n    @param var center : Vec2;                     // focus point (uv space)\n    var d = distance(calculatedUV, center);       // 0 at focus\n    var r = progress * 0.8;                       // growing radius\n    pixelColor.a *= 1 - smoothstep(r, r - 0.05, d);\n}"},{"k":"ul","i":["Center it on the clicked button: the new screen \"grows from the thing you pressed\" — a signature-feel detail."]},{"k":"best","t":"Anchor effects on user intent","h":"Transition centered on the touch/click point converts a UI event into a visual event — cheap, and it makes the whole UI feel causal."}],"src":"10_ch09.txt:156","n":201},{"ch":10,"kind":"content","title":"Input During Transitions","tt":"Input During Transitions","blocks":[{"k":"p","h":"Transitions are modal by design — but <em>how<\/em> they block decides whether players rage."},{"k":"ul","i":["<code>ScreenManager.transitioning<\/code> (Chapter 7) gates <code>onEvent<\/code> — input during the effect goes nowhere.","Consume (don't queue) events mid-transition: queued clicks landing on the arrived screen are accidental double-activations.","Keep an escape hatch: allow skip after the first full playthrough (speedrunners and testers will thank you)."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> onEvent(e:hxd.<span class=\"c-t\">Event<\/span>) : <span class=\"c-t\">Bool<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">if<\/span> (transitioning) { e.cancel = <span class=\"c-k\">true<\/span>; <span class=\"c-k\">return<\/span> <span class=\"c-k\">true<\/span>; }   <span class=\"c-c\">// eat everything<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">return<\/span> current.onEvent(e);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"public function onEvent(e:hxd.Event) : Bool {\n    if (transitioning) { e.cancel = true; return true; }   // eat everything\n    return current.onEvent(e);\n}"},{"k":"pit","t":"Buttons that fire at the last frame","h":"A click released exactly as the reveal finishes can land on the new screen's button. The 0.1 s of input-block AFTER <code>done()<\/code> closes the race."}],"src":"10_ch09.txt:169","n":202},{"ch":10,"kind":"content","title":"Transition Pitfalls and Performance","tt":"Transition Pitfalls and Performance","blocks":[{"k":"p","h":"The classic transition bugs, pre-solved."},{"k":"pit","t":"GC spike at midpoint","h":"The midpoint constructs the next screen — one frame of allocation. Pre-build heavy screens (Chapter 5's async load) and let the transition only <em>swap roots<\/em>."},{"k":"pit","t":"Draw-order surprises","h":"The cover must be the LAST child of s2d. Use <code>s2d.addChild(cover)<\/code> at creation (moves to top), never <code>addChildAt(cover, 0)<\/code>."},{"k":"pit","t":"Camera and world still updating","h":"During cover, gameplay keeps simulating behind (fine) but the camera must not shake a paused menu into view — pause world updates on pause-transitions (Chapter 4's Time)."},{"k":"best","t":"Rehearse transitions on slow machines","h":"Transitions hide hitches by design — until they don't. A 30 FPS debug build reveals which transitions need pre-built screens."}],"src":"10_ch09.txt:176","n":203},{"ch":10,"kind":"content","title":"Project: The Polish Pass","tt":"Project: The Polish Pass","blocks":[{"k":"p","h":"Chapter 9's exit: every flow in Cavern Run moves with intention."},{"k":"ul","i":["Title → play: black fade (0.18/0.22 s), swap at midpoint, world builds hidden.","Level complete: barn-door wipe, direction follows exit door position.","Gem-collect HUD \"snack\": a 0.15 s scale-up on the counter (a taste of Chapter 13).","Pause/unpause: instant slide-down panel, no transition — speed matters more than ceremony there."]},{"k":"best","t":"Consistency checklist for the fleet","h":"One page: flow × transition type × duration × easing. When all six numbers line up, the game feels \"designed\" — this is what that word actually means."}],"src":"10_ch09.txt:184","n":204},{"ch":10,"kind":"content","title":"Chapter 9 Checklist","tt":"Chapter 9 Checklist","blocks":[{"k":"ul","i":["<code>Transition<\/code> framework with two phases and midpoint swap.","Fade, slide, wipe implemented; a documented transition grammar.","One shader dissolve transition (full theory lands in Chapter 11).","Input blocking during transitions, with a post-done grace frame.","No midpoint GC spikes: heavy screens pre-built."]}],"src":"10_ch09.txt:191","n":205},{"ch":11,"kind":"chapter","title":"2D Physics with Box2D","tt":"2D Physics with Box2D","sub":"Rigid bodies, entity types, shapes and fixtures, a physics adapter over Heaps, contacts, joints — plus when NOT to use a physics engine.","blocks":[],"src":"11_ch10.txt:1","n":206},{"ch":11,"kind":"content","title":"Do You Need a Physics Engine?","tt":"Do You Need a Physics Engine?","blocks":[{"k":"p","h":"The most important physics decision is made before writing any code."},{"k":"two","a":[{"k":"p","h":"<b>You need real physics when<\/b>"},{"k":"ul","i":["crates, ragdolls, ropes, tumbling stacks","emergent gameplay from object interactions","you accept solver \"personality\" in tuning"]}],"b":[{"k":"p","h":"<b>You do NOT when<\/b>"},{"k":"ul","i":["precise platformer movement (Chapter 6 already done)","deterministic replays/netplay","thousands of homing projectiles"]}]},{"k":"ul","i":["Cavern Run's player runs on Chapter 6's swept tiles; <b>crates and props<\/b> run on Box2D. The two coexist — that hybrid is the mainstream professional pattern."]},{"k":"best","t":"Physics for props, hand-rolled for the hero","h":"Character controllers that fight a rigid body solver feel slippery or heavy. Platformers ship kinematic heroes + dynamic props 95% of the time."}],"src":"11_ch10.txt:22","n":207},{"ch":11,"kind":"content","title":"Heaps and Physics: The Integration Landscape","tt":"Heaps and Physics: The Integration Landscape","blocks":[{"k":"p","h":"Heaps ships no physics module — by design, it is a rendering/scene engine. You integrate a 2D rigid body library; the standard choice is the <b>box2d<\/b> haxelib (the Haxe port of Box2D 2.1a)."},{"k":"ul","i":["<b>box2d<\/b> haxelib: pure Haxe, runs on every Haxe target (HL, web, mobile). This chapter's library.","The adapter pattern taught here works identically for any other solver you might swap in later."]},{"k":"code","lang":"bash","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">haxelib<\/span> install box2d      <span class=\"c-c\"># add \"-lib box2d\" to your .hxml files<\/span><\/span>"],"raw":"haxelib install box2d      # add \"-lib box2d\" to your .hxml files"},{"k":"note","h":"The port uses camelCase AS3-style names (<code>B2World<\/code>, <code>bodyDef.type = B2Body.b2_dynamicBody<\/code>). Community forks vary slightly in packaging — pin your version and check its <code>B2BodyDef<\/code> fields once."}],"src":"11_ch10.txt:31","n":208},{"ch":11,"kind":"content","title":"Box2D Concepts: World, Bodies, Fixtures","tt":"Box2D Concepts: World, Bodies, Fixtures","blocks":[{"k":"p","h":"Four nouns run everything. Map them to Heaps once and the rest of the chapter is composition."},{"k":"table","head":["Box2D term","Meaning","Heaps-side counterpart"],"rows":[["B2World","the simulation: gravity, stepping, queries","WorldController (owns it)"],["B2Body","a rigid object with mass/state","Entity (world id + view)"],["B2Fixture","a body's shape + surface material","entity's visual/hit size"],["B2Shape","geometry: box, circle, polygon","atlas tile / tile lookup"]]},{"k":"ul","i":["One body ↔ zero or more fixtures (a crate = 1 box fixture; a hammer = 2).","One body ↔ one entity view (a Bitmap), synchronized every frame (upcoming slides)."]}],"src":"11_ch10.txt:43","n":209},{"ch":11,"kind":"content","title":"Entity Types: Static, Dynamic, Kinematic","tt":"Entity Types: Static, Dynamic, Kinematic","blocks":[{"k":"p","h":"The three body types are a physics designer's palette — each exists for a reason you will use weekly."},{"k":"table","head":["Type","Moves?","Collides?","Mass","Use for"],"rows":[["Static","never","yes","infinite","walls, floors, level geometry"],["Dynamic","by forces/collision","yes","from density","crates, debris, props"],["Kinematic","by velocity only","pushes dynamics","infinite","moving platforms, doors"]]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> groundDef = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2BodyDef<\/span>();<\/span>","<span class=\"cl\">groundDef.type = <span class=\"c-t\">B2Body<\/span>.b2_staticBody;          <span class=\"c-c\">// level tile → static body<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> crateDef = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2BodyDef<\/span>();<\/span>","<span class=\"cl\">crateDef.type = <span class=\"c-t\">B2Body<\/span>.b2_dynamicBody;          <span class=\"c-c\">// crate → dynamic body<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> liftDef = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2BodyDef<\/span>();<\/span>","<span class=\"cl\">liftDef.type = <span class=\"c-t\">B2Body<\/span>.b2_kinematicBody;         <span class=\"c-c\">// elevator → kinematic<\/span><\/span>"],"raw":"final groundDef = new B2BodyDef();\ngroundDef.type = B2Body.b2_staticBody;          // level tile → static body\n\nfinal crateDef = new B2BodyDef();\ncrateDef.type = B2Body.b2_dynamicBody;          // crate → dynamic body\n\nfinal liftDef = new B2BodyDef();\nliftDef.type = B2Body.b2_kinematicBody;         // elevator → kinematic"},{"k":"best","t":"Kinematic platforms, not dynamic ones","h":"A dynamic platform is a boat: everything slides. Kinematic follows your exact path and still carries riders — the behavior players expect."}],"src":"11_ch10.txt:63","n":210},{"ch":11,"kind":"content","title":"Shapes: Boxes, Circles, Polygons","tt":"Shapes: Boxes, Circles, Polygons","blocks":[{"k":"p","h":"Geometry per prop kind: circles roll, boxes stack, polygons approximate art."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// BOX — crates, walls (half-width, half-height in METERS — see PPM below)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> box = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2PolygonShape<\/span>();<\/span>","<span class=\"cl\">box.setAsBox(w / <span class=\"c-t\">PPM<\/span> / <span class=\"c-n\">2<\/span>, h / <span class=\"c-t\">PPM<\/span> / <span class=\"c-n\">2<\/span>);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// CIRCLE — barrels, boulders (radius in meters)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> circle = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2CircleShape<\/span>(<span class=\"c-n\">16<\/span> / <span class=\"c-t\">PPM<\/span>);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// POLYGON — convex only! Author in a physics editor, load as vertices<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> poly = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2PolygonShape<\/span>();<\/span>","<span class=\"cl\">poly.setAsArray(verts <span class=\"c-c\">/* Array&lt;B2Vec2&gt;, convex, CCW */<\/span>);<\/span>"],"raw":"// BOX — crates, walls (half-width, half-height in METERS — see PPM below)\nfinal box = new B2PolygonShape();\nbox.setAsBox(w / PPM / 2, h / PPM / 2);\n\n// CIRCLE — barrels, boulders (radius in meters)\nfinal circle = new B2CircleShape(16 / PPM);\n\n// POLYGON — convex only! Author in a physics editor, load as vertices\nfinal poly = new B2PolygonShape();\npoly.setAsArray(verts /* Array<B2Vec2>, convex, CCW */);"},{"k":"ul","i":["Concave art = several convex fixtures on one body (a \"U\" bridge = 3 boxes).","Vertex order and convexity are strict — the physics-editor slide (ahead) exists because of this."]}],"src":"11_ch10.txt:80","n":211},{"ch":11,"kind":"content","title":"Fixtures: Density, Friction, Restitution","tt":"Fixtures: Density, Friction, Restitution","blocks":[{"k":"p","h":"The fixture is the <em>material<\/em> of a shape: how heavy, how slippery, how bouncy."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> fx = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2FixtureDef<\/span>();<\/span>","<span class=\"cl\">fx.shape = box;<\/span>","<span class=\"cl\">fx.density = <span class=\"c-n\">0.8<\/span>;          <span class=\"c-c\">// kg/m² → mass = density × area<\/span><\/span>","<span class=\"cl\">fx.friction = <span class=\"c-n\">0.35<\/span>;        <span class=\"c-c\">// 0 ice … 1 rubber (typical 0.2–0.6)<\/span><\/span>","<span class=\"cl\">fx.restitution = <span class=\"c-n\">0.15<\/span>;     <span class=\"c-c\">// 0 dead stop … 1 superball (typical 0–0.3)<\/span><\/span>","<span class=\"cl\">fx.userData = entity;      <span class=\"c-c\">// YOUR link back — the adapter's backbone<\/span><\/span>","<span class=\"cl\">body.createFixture(fx);<\/span>"],"raw":"final fx = new B2FixtureDef();\nfx.shape = box;\nfx.density = 0.8;          // kg/m² → mass = density × area\nfx.friction = 0.35;        // 0 ice … 1 rubber (typical 0.2–0.6)\nfx.restitution = 0.15;     // 0 dead stop … 1 superball (typical 0–0.3)\nfx.userData = entity;      // YOUR link back — the adapter's backbone\nbody.createFixture(fx);"},{"k":"ul","i":["Tuning table for Cavern Run props: crate (d 0.8, f 0.45, r 0.05), barrel (d 0.6, f 0.30, r 0.25), stone (d 2.4, f 0.70, r 0.0)."]},{"k":"best","t":"Tune fixtures in a sandbox scene first","h":"Slide \"Physics Sandbox\" (this chapter's project) exists so prop feel is decided in isolation, then exported as data — not discovered inside a designed level."}],"src":"11_ch10.txt:94","n":212},{"ch":11,"kind":"content","title":"The Physics Adapter Layer","tt":"The Physics Adapter Layer","blocks":[{"k":"p","h":"One class owns the B2World and translates between pixels/meters and entity/body. The rest of the game never imports box2d."},{"k":"code","lang":"haxe","file":"Physics.hx","lines":["<span class=\"cl\"><span class=\"c-k\">import<\/span> box2d.common.math.<span class=\"c-t\">B2Vec2<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">import<\/span> box2d.dynamics.*;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Physics<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">PPM<\/span> = <span class=\"c-n\">32<\/span>;          <span class=\"c-c\">// pixels per meter<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> world : <span class=\"c-t\">B2World<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> bodies = [];                      <span class=\"c-c\">// SimBody wrappers<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> init() {<\/span>","<span class=\"cl\">        world = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2World<\/span>(<span class=\"c-k\">new<\/span> <span class=\"c-t\">B2Vec2<\/span>(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">10<\/span>), <span class=\"c-k\">true<\/span>);   <span class=\"c-c\">// gravity, allow sleep<\/span><\/span>","<span class=\"cl\">        world.setContactListener(<span class=\"c-k\">new<\/span> <span class=\"c-t\">ContactRelay<\/span>());<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> step(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        world.step(dt, <span class=\"c-n\">8<\/span>, <span class=\"c-n\">3<\/span>);                    <span class=\"c-c\">// dt, velocity iters, position iters<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> toPx(m:<span class=\"c-t\">Float<\/span>) <span class=\"c-k\">return<\/span> m * <span class=\"c-t\">PPM<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> toM(px:<span class=\"c-t\">Float<\/span>) <span class=\"c-k\">return<\/span> px / <span class=\"c-t\">PPM<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"import box2d.common.math.B2Vec2;\nimport box2d.dynamics.*;\n\nclass Physics {\n    public static inline var PPM = 32;          // pixels per meter\n    public static var world : B2World;\n    static var bodies = [];                      // SimBody wrappers\n\n    public static function init() {\n        world = new B2World(new B2Vec2(0, 10), true);   // gravity, allow sleep\n        world.setContactListener(new ContactRelay());\n    }\n    public static function step(dt:Float) {\n        world.step(dt, 8, 3);                    // dt, velocity iters, position iters\n    }\n    public static inline function toPx(m:Float) return m * PPM;\n    public static inline function toM(px:Float) return px / PPM;\n}"},{"k":"ul","i":["<code>PPM = 32<\/code> (tile size): physics units stay in a healthy 0.1–50 m range where the solver is accurate.","<b>Only<\/b> this file says <code>import box2d.*<\/code> — swapping solvers later touches exactly one class."]}],"src":"11_ch10.txt:119","n":213},{"ch":11,"kind":"content","title":"Creating Bodies from Entities","tt":"Creating Bodies from Entities","blocks":[{"k":"p","h":"The adapter's factory: entity + spawn def → body + fixture wired by <code>userData<\/code>."},{"k":"code","lang":"haxe","file":"PhysicsFactory.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">PhysicsFactory<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> crate(e:<span class=\"c-t\">Entity<\/span>) : <span class=\"c-t\">B2Body<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> def = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2BodyDef<\/span>();<\/span>","<span class=\"cl\">        def.type = <span class=\"c-t\">B2Body<\/span>.b2_dynamicBody;<\/span>","<span class=\"cl\">        def.position.set(<span class=\"c-t\">Physics<\/span>.toM(e.x), <span class=\"c-t\">Physics<\/span>.toM(e.y));<\/span>","<span class=\"cl\">        def.angle = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">        def.fixedRotation = <span class=\"c-k\">false<\/span>;               <span class=\"c-c\">// crates tumble<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> body = <span class=\"c-t\">Physics<\/span>.world.createBody(def);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> box = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2PolygonShape<\/span>();<\/span>","<span class=\"cl\">        box.setAsBox(<span class=\"c-t\">Physics<\/span>.toM(e.w / <span class=\"c-n\">2<\/span>), <span class=\"c-t\">Physics<\/span>.toM(e.h / <span class=\"c-n\">2<\/span>));<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> fx = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2FixtureDef<\/span>();<\/span>","<span class=\"cl\">        fx.shape = box;<\/span>","<span class=\"cl\">        fx.density = <span class=\"c-n\">0.8<\/span>; fx.friction = <span class=\"c-n\">0.45<\/span>; fx.restitution = <span class=\"c-n\">0.05<\/span>;<\/span>","<span class=\"cl\">        fx.userData = e;                         <span class=\"c-c\">// ← events route back to entities<\/span><\/span>","<span class=\"cl\">        body.createFixture(fx);<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> body;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> groundTile(tx:<span class=\"c-t\">Int<\/span>, ty:<span class=\"c-t\">Int<\/span>) : <span class=\"c-t\">B2Body<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> def = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2BodyDef<\/span>();<\/span>","<span class=\"cl\">        def.type = <span class=\"c-t\">B2Body<\/span>.b2_staticBody;<\/span>","<span class=\"cl\">        def.position.set(<span class=\"c-t\">Physics<\/span>.toM(tx * <span class=\"c-n\">32<\/span> + <span class=\"c-n\">16<\/span>), <span class=\"c-t\">Physics<\/span>.toM(ty * <span class=\"c-n\">32<\/span> + <span class=\"c-n\">16<\/span>));<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> body = <span class=\"c-t\">Physics<\/span>.world.createBody(def);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> box = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2PolygonShape<\/span>();<\/span>","<span class=\"cl\">        box.setAsBox(<span class=\"c-t\">Physics<\/span>.toM(<span class=\"c-n\">16<\/span>), <span class=\"c-t\">Physics<\/span>.toM(<span class=\"c-n\">16<\/span>));<\/span>","<span class=\"cl\">        body.createFixture2(box, <span class=\"c-n\">0<\/span>);             <span class=\"c-c\">// static: density 0<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> body;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class PhysicsFactory {\n    public static function crate(e:Entity) : B2Body {\n        final def = new B2BodyDef();\n        def.type = B2Body.b2_dynamicBody;\n        def.position.set(Physics.toM(e.x), Physics.toM(e.y));\n        def.angle = 0;\n        def.fixedRotation = false;               // crates tumble\n        final body = Physics.world.createBody(def);\n\n        final box = new B2PolygonShape();\n        box.setAsBox(Physics.toM(e.w / 2), Physics.toM(e.h / 2));\n        final fx = new B2FixtureDef();\n        fx.shape = box;\n        fx.density = 0.8; fx.friction = 0.45; fx.restitution = 0.05;\n        fx.userData = e;                         // ← events route back to entities\n        body.createFixture(fx);\n        return body;\n    }\n    public static function groundTile(tx:Int, ty:Int) : B2Body {\n        final def = new B2BodyDef();\n        def.type = B2Body.b2_staticBody;\n        def.position.set(Physics.toM(tx * 32 + 16), Physics.toM(ty * 32 + 16));\n        final body = Physics.world.createBody(def);\n        final box = new B2PolygonShape();\n        box.setAsBox(Physics.toM(16), Physics.toM(16));\n        body.createFixture2(box, 0);             // static: density 0\n        return body;\n    }\n}"},{"k":"ul","i":["Level loading (Chapter 5) emits static bodies per solid tile — merge runs of tiles into long boxes to cut body count 10x."]}],"src":"11_ch10.txt:154","n":214},{"ch":11,"kind":"content","title":"Synchronizing Rendering: The Critical Loop","tt":"Synchronizing Rendering: The Critical Loop","blocks":[{"k":"p","h":"Bodies simulate in meters; views draw in pixels. <code>sync()<\/code> maps position + rotation every frame."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">PhysicsView<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> body : <span class=\"c-t\">B2Body<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> bmp : h2d.<span class=\"c-t\">Bitmap<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> sync() {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> p = body.getPosition();<\/span>","<span class=\"cl\">        bmp.x = <span class=\"c-t\">Physics<\/span>.toPx(p.x);<\/span>","<span class=\"cl\">        bmp.y = <span class=\"c-t\">Physics<\/span>.toPx(p.y);<\/span>","<span class=\"cl\">        bmp.rotation = body.getAngle();<\/span>","<span class=\"cl\">        bmp.tile.setCenter();    <span class=\"c-c\">// pivot center so rotation matches the body<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class PhysicsView {\n    public var body : B2Body;\n    public var bmp : h2d.Bitmap;\n\n    public function sync() {\n        final p = body.getPosition();\n        bmp.x = Physics.toPx(p.x);\n        bmp.y = Physics.toPx(p.y);\n        bmp.rotation = body.getAngle();\n        bmp.tile.setCenter();    // pivot center so rotation matches the body\n    }\n}"},{"k":"ul","i":["Interpolation for smoothness: render at <code>lerp(prevPos, currPos, alpha)<\/code> with Chapter 2's accumulator alpha — necessary if physics steps at 30 Hz while rendering 60."]},{"k":"pit","t":"Rendering the raw post-step position with 30 Hz physics","h":"Objects judder at their step rate. Either step at render rate (fine ≤ 60 bodies) or interpolate — the accumulator alpha from Chapter 2 is exactly the input."}],"src":"11_ch10.txt:173","n":215},{"ch":11,"kind":"content","title":"The Fixed Timestep and Solver Stability","tt":"The Fixed Timestep and Solver Stability","blocks":[{"k":"p","h":"Chapter 2's accumulator returns — physics demands it."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// The ONLY correct way to drive B2World:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">STEP<\/span> = <span class=\"c-n\">1<\/span> / <span class=\"c-n\">60<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> acc = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">    acc += dt;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> guard = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">while<\/span> (acc &gt;= <span class=\"c-t\">STEP<\/span> &amp;&amp; guard++ &lt; <span class=\"c-n\">5<\/span>) {<\/span>","<span class=\"cl\">        world.step(<span class=\"c-t\">STEP<\/span>, <span class=\"c-n\">8<\/span>, <span class=\"c-n\">3<\/span>);<\/span>","<span class=\"cl\">        acc -= <span class=\"c-t\">STEP<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    renderAlpha = acc / <span class=\"c-t\">STEP<\/span>;      <span class=\"c-c\">// for the interpolation above<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"// The ONLY correct way to drive B2World:\nstatic final STEP = 1 / 60;\nstatic var acc = 0.0;\npublic static function update(dt:Float) {\n    acc += dt;\n    var guard = 0;\n    while (acc >= STEP && guard++ < 5) {\n        world.step(STEP, 8, 3);\n        acc -= STEP;\n    }\n    renderAlpha = acc / STEP;      // for the interpolation above\n}"},{"k":"ul","i":["Variable dt confuses the solver's warm-starting → jitter and tunneling on hitches.","Iterations (8 velocity / 3 position) are the stability/perf dial; raise for stacking scenes, lower for mobile."]},{"k":"pit","t":"Stepping with the render dt","h":"<code>world.step(dt)<\/code> with dt spikes (clamped 0.1) simulates 0.1 s in one go — stacks explode. Fixed STEP, never raw dt."}],"src":"11_ch10.txt:193","n":216},{"ch":11,"kind":"content","title":"Contact Events: Begin and End","tt":"Contact Events: Begin and End","blocks":[{"k":"p","h":"Contacts route through a listener; <code>userData<\/code> links arrive as your own entities."},{"k":"code","lang":"haxe","file":"ContactRelay.hx","lines":["<span class=\"cl\"><span class=\"c-k\">import<\/span> box2d.dynamics.contacts.<span class=\"c-t\">B2Contact<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">import<\/span> box2d.dynamics.<span class=\"c-t\">B2ContactListener<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">ContactRelay<\/span> <span class=\"c-k\">extends<\/span> <span class=\"c-t\">B2ContactListener<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> beginContact(c:<span class=\"c-t\">B2Contact<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> a = c.getFixtureA().userData;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> b = c.getFixtureB().userData;     <span class=\"c-c\">// Entities (set above)<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (a != <span class=\"c-k\">null<\/span> &amp;&amp; b != <span class=\"c-k\">null<\/span>) <span class=\"c-t\">Interaction<\/span>.apply(a, b);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> endContact(c:<span class=\"c-t\">B2Contact<\/span>) { <span class=\"c-c\">/* e.g. leave trigger zones */<\/span> }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"import box2d.dynamics.contacts.B2Contact;\nimport box2d.dynamics.B2ContactListener;\n\nclass ContactRelay extends B2ContactListener {\n    override function beginContact(c:B2Contact) {\n        final a = c.getFixtureA().userData;\n        final b = c.getFixtureB().userData;     // Entities (set above)\n        if (a != null && b != null) Interaction.apply(a, b);\n    }\n    override function endContact(c:B2Contact) { /* e.g. leave trigger zones */ }\n}"},{"k":"ul","i":["Contact callbacks fire <b>inside<\/b> <code>world.step()<\/code> — flag events, apply gameplay after the step (iterating world state inside callbacks is UB territory)."]},{"k":"best","t":"Defer everything out of the solver callback","h":"Push <code>(a, b)<\/code> pairs into a queue; the systems pipeline (Chapter 4) processes them after <code>step()<\/code>. Two arrays and one loop — total safety."}],"src":"11_ch10.txt:211","n":217},{"ch":11,"kind":"content","title":"Collision Filtering: Categories and Masks","tt":"Collision Filtering: Categories and Masks","blocks":[{"k":"p","h":"Which things collide with which — decided by two 16-bit masks per fixture."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> <span class=\"c-t\">CAT_PLAYER<\/span>  = <span class=\"c-n\">0x0001<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> <span class=\"c-t\">CAT_HAZARD<\/span>  = <span class=\"c-n\">0x0002<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> <span class=\"c-t\">CAT_PROP<\/span>    = <span class=\"c-n\">0x0004<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> <span class=\"c-t\">CAT_SENSOR<\/span>  = <span class=\"c-n\">0x0008<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// players hit props and hazards; pass through sensors' solids (sensors use isSensor)<\/span><\/span>","<span class=\"cl\">fx.filter.categoryBits = <span class=\"c-t\">CAT_PROP<\/span>;<\/span>","<span class=\"cl\">fx.filter.maskBits = <span class=\"c-t\">CAT_PLAYER<\/span> | <span class=\"c-t\">CAT_PROP<\/span>;    <span class=\"c-c\">// prop collides with these<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// ghost crates the player passes through while a power-up runs:<\/span><\/span>","<span class=\"cl\">fx.filter.maskBits &amp;= ~<span class=\"c-t\">CAT_PLAYER<\/span>;<\/span>"],"raw":"final CAT_PLAYER  = 0x0001;\nfinal CAT_HAZARD  = 0x0002;\nfinal CAT_PROP    = 0x0004;\nfinal CAT_SENSOR  = 0x0008;\n\n// players hit props and hazards; pass through sensors' solids (sensors use isSensor)\nfx.filter.categoryBits = CAT_PROP;\nfx.filter.maskBits = CAT_PLAYER | CAT_PROP;    // prop collides with these\n\n// ghost crates the player passes through while a power-up runs:\nfx.filter.maskBits &= ~CAT_PLAYER;"},{"k":"ul","i":["Category = \"what am I\"; mask = \"what do I collide with\". Both must agree for a collision.","Sensors (next) still generate contacts — filtering is separate from sensing."]}],"src":"11_ch10.txt:229","n":218},{"ch":11,"kind":"content","title":"Sensors and Trigger Volumes","tt":"Sensors and Trigger Volumes","blocks":[{"k":"p","h":"<code>isSensor = true<\/code>: overlap events without any physical response — Chapter 6's sensor pattern, physics edition."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> zone = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2FixtureDef<\/span>();<\/span>","<span class=\"cl\">zone.shape = box;<\/span>","<span class=\"cl\">zone.isSensor = <span class=\"c-k\">true<\/span>;                 <span class=\"c-c\">// no push, just events<\/span><\/span>","<span class=\"cl\">zone.filter.categoryBits = <span class=\"c-t\">CAT_SENSOR<\/span>;<\/span>","<span class=\"cl\">body.createFixture(zone);<\/span>","<span class=\"cl\"><span class=\"c-c\">// ContactRelay now receives begin/end for anything entering the zone<\/span><\/span>"],"raw":"final zone = new B2FixtureDef();\nzone.shape = box;\nzone.isSensor = true;                 // no push, just events\nzone.filter.categoryBits = CAT_SENSOR;\nbody.createFixture(zone);\n// ContactRelay now receives begin/end for anything entering the zone"},{"k":"ul","i":["Trigger zones: doors, checkpoints, cutscene volumes, \"you left the map\" volumes.","One body can mix solid + sensor fixtures (a pressure plate: solid base + sensor top)."]}],"src":"11_ch10.txt:242","n":219},{"ch":11,"kind":"content","title":"Queries and Raycasts","tt":"Queries and Raycasts","blocks":[{"k":"p","h":"Ask the world questions: what is here? what is along this line?"},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// AABB QUERY — \"any dynamics inside this rectangle?\"<\/span><\/span>","<span class=\"cl\">world.queryAABB(<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span>(fixture) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> e = fixture.userData;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (e != <span class=\"c-k\">null<\/span> &amp;&amp; e.kind == <span class=\"c-t\">KCrate<\/span>) hits.push(e);<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-k\">true<\/span>;                  <span class=\"c-c\">// keep iterating<\/span><\/span>","<span class=\"cl\">    },<\/span>","<span class=\"cl\">    makeAABB(x0, y0, x1, y1)          <span class=\"c-c\">// in meters<\/span><\/span>","<span class=\"cl\">);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// RAYCAST — \"what does this line hit, and where?\"<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">var<\/span> hit = world.rayCast(<\/span>","<span class=\"cl\">    <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2Vec2<\/span>(<span class=\"c-t\">Physics<\/span>.toM(x0), <span class=\"c-t\">Physics<\/span>.toM(y0)),   <span class=\"c-c\">// from<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2Vec2<\/span>(<span class=\"c-t\">Physics<\/span>.toM(x1), <span class=\"c-t\">Physics<\/span>.toM(y1)),   <span class=\"c-c\">// to<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span>(fixture, point, normal, fraction) {<\/span>","<span class=\"cl\">        best = { e : fixture.userData, px : point.x, py : point.y };<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> fraction;             <span class=\"c-c\">// clip ray at first hit<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">);<\/span>"],"raw":"// AABB QUERY — \"any dynamics inside this rectangle?\"\nworld.queryAABB(\n    function(fixture) {\n        final e = fixture.userData;\n        if (e != null && e.kind == KCrate) hits.push(e);\n        return true;                  // keep iterating\n    },\n    makeAABB(x0, y0, x1, y1)          // in meters\n);\n\n// RAYCAST — \"what does this line hit, and where?\"\nvar hit = world.rayCast(\n    new B2Vec2(Physics.toM(x0), Physics.toM(y0)),   // from\n    new B2Vec2(Physics.toM(x1), Physics.toM(y1)),   // to\n    function(fixture, point, normal, fraction) {\n        best = { e : fixture.userData, px : point.x, py : point.y };\n        return fraction;             // clip ray at first hit\n    }\n);"},{"k":"note","h":"Port-precise names (<code>queryAABB<\/code>, <code>rayCast<\/code>, callback signatures) vary slightly between box2d haxelib versions — the shapes of the calls above are stable, check your pinned version's signatures once."}],"src":"11_ch10.txt:267","n":220},{"ch":11,"kind":"content","title":"Joints: The Useful Four","tt":"Joints: The Useful Four","blocks":[{"k":"p","h":"Joints constrain bodies together — the mechanical vocabulary of physics puzzles."},{"k":"table","head":["Joint","Constrains","Game use"],"rows":[["Revolute","shared hinge point","wheels, chains, flippers"],["Prismatic","slide along an axis","elevators, pistons"],["Distance","fixed separation","ropes, pendulums, bolas"],["Weld","frozen together","compound breakables, carried objects"]]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// WHEEL on a chassis (revolute + motor):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> axle = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2RevoluteJointDef<\/span>();<\/span>","<span class=\"cl\">axle.initialize(chassis, wheel, wheelCenterInMeters);<\/span>","<span class=\"cl\">axle.enableMotor = <span class=\"c-k\">true<\/span>;<\/span>","<span class=\"cl\">axle.motorSpeed = <span class=\"c-n\">3<\/span>;             <span class=\"c-c\">// rad/s<\/span><\/span>","<span class=\"cl\">axle.maxMotorTorque = <span class=\"c-n\">80<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-t\">Physics<\/span>.world.createJoint(axle);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// ELEVATOR (prismatic + limits):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> rail = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2PrismaticJointDef<\/span>();<\/span>","<span class=\"cl\">rail.initialize(groundBody, lift, liftCenter, <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2Vec2<\/span>(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">1<\/span>));  <span class=\"c-c\">// vertical axis<\/span><\/span>","<span class=\"cl\">rail.lowerTranslation = <span class=\"c-n\">0<\/span>; rail.upperTranslation = <span class=\"c-t\">Physics<\/span>.toM(<span class=\"c-n\">4.5<\/span>);<\/span>","<span class=\"cl\">rail.enableLimit = <span class=\"c-k\">true<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-t\">Physics<\/span>.world.createJoint(rail);<\/span>"],"raw":"// WHEEL on a chassis (revolute + motor):\nfinal axle = new B2RevoluteJointDef();\naxle.initialize(chassis, wheel, wheelCenterInMeters);\naxle.enableMotor = true;\naxle.motorSpeed = 3;             // rad/s\naxle.maxMotorTorque = 80;\nPhysics.world.createJoint(axle);\n\n// ELEVATOR (prismatic + limits):\nfinal rail = new B2PrismaticJointDef();\nrail.initialize(groundBody, lift, liftCenter, new B2Vec2(0, 1));  // vertical axis\nrail.lowerTranslation = 0; rail.upperTranslation = Physics.toM(4.5);\nrail.enableLimit = true;\nPhysics.world.createJoint(rail);"},{"k":"best","t":"Motorize, don't animate","h":"A kinematic body driven by tweens <em>teleports<\/em> through riders. A motor joint pushes — the physics stays honest."}],"src":"11_ch10.txt:294","n":221},{"ch":11,"kind":"content","title":"Character Controllers: The Hybrid Recipe","tt":"Character Controllers: The Hybrid Recipe","blocks":[{"k":"p","h":"Bringing Chapter 6's hero into a physics world without giving up game feel."},{"k":"ul","i":["The hero is <b>NOT<\/b> a dynamic body. Recipe: a dynamic body with <code>fixedRotation<\/code>, gravity scale 0, or fully kinematic + rays.","Grounded check: a short downward raycast per foot (<code>world.rayCast<\/code>), 3 rays across the width.","Move: set velocity directly (<code>body.setLinearVelocity<\/code>), keep your Chapter 6 feel numbers.","One-way platforms: pre-solve contact callback zeroing the contact when passing from below."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// grounded via feet rays (this is the whole \"controller\"):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">function<\/span> grounded() : <span class=\"c-t\">Bool<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...<span class=\"c-n\">3<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> x = feetX(i);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> hit = <span class=\"c-t\">Physics<\/span>.rayFirst(x, feetY, x, feetY + <span class=\"c-n\">6<\/span>);   <span class=\"c-c\">// 6px probe<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (hit != <span class=\"c-k\">null<\/span> &amp;&amp; hit.solid) <span class=\"c-k\">return<\/span> <span class=\"c-k\">true<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">return<\/span> <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"// grounded via feet rays (this is the whole \"controller\"):\nfunction grounded() : Bool {\n    for (i in 0...3) {\n        final x = feetX(i);\n        final hit = Physics.rayFirst(x, feetY, x, feetY + 6);   // 6px probe\n        if (hit != null && hit.solid) return true;\n    }\n    return false;\n}"},{"k":"pit","t":"Dynamic-body players feel like ice skates","h":"Slope acceleration, restitution bounce, sleep jitter — the solver optimizes realism, not your jump feel. Keep the hero on rails (rays/velocity) and let props be physical."}],"src":"11_ch10.txt:313","n":222},{"ch":11,"kind":"content","title":"Debug Rendering","tt":"Debug Rendering","blocks":[{"k":"p","h":"You cannot tune what you cannot see: draw every body's shape over the game."},{"k":"code","lang":"haxe","file":"PhysicsDebug.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">PhysicsDebug<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> g = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Graphics<\/span>(s2d);<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> draw() {<\/span>","<span class=\"cl\">        g.clear();<\/span>","<span class=\"cl\">        g.lineStyle(<span class=\"c-n\">1<\/span>, <span class=\"c-n\">0x3DDC97<\/span>, <span class=\"c-n\">0.9<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (b in <span class=\"c-t\">Physics<\/span>.allBodies()) {       <span class=\"c-c\">// adapter exposes its own list<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">var<\/span> f = b.getFixtureList();        <span class=\"c-c\">// fixtures are a linked list<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">while<\/span> (f != <span class=\"c-k\">null<\/span>) {<\/span>","<span class=\"cl\">                drawFixture(g, b, f);<\/span>","<span class=\"cl\">                f = f.getNext();<\/span>","<span class=\"cl\">            }<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class PhysicsDebug {\n    final g = new h2d.Graphics(s2d);\n    public function draw() {\n        g.clear();\n        g.lineStyle(1, 0x3DDC97, 0.9);\n        for (b in Physics.allBodies()) {       // adapter exposes its own list\n            var f = b.getFixtureList();        // fixtures are a linked list\n            while (f != null) {\n                drawFixture(g, b, f);\n                f = f.getNext();\n            }\n        }\n    }\n}"},{"k":"ul","i":["Toggle on F3 behind the debug flag; color-code: static gray, dynamic green, sensors blue, sleeping bodies dim."]},{"k":"best","t":"Debug draw is a project-long investment","h":"Every tuning session, every player bug report (\"I got stuck\"), every console cert build — the 60-line debug layer pays back weekly."}],"src":"11_ch10.txt:334","n":223},{"ch":11,"kind":"content","title":"The Physics Editor: Authoring Shapes","tt":"The Physics Editor: Authoring Shapes","blocks":[{"k":"p","h":"Box2D's strict requirements (convex, CCW, meters) make hand-authoring miserable — use a tool and export data."},{"k":"ul","i":["Tools: PhysicsEditor, R.U.B.E (editor + runtime formats), or a simple in-game shape editor.","Export target: JSON per prop <code>{ \"crate\": { \"fixtures\": [ { \"type\": \"box\", \"hw\": 16, \"hh\": 16, \"density\": 0.8 } ] } }<\/code>.","The loader maps fixture data → <code>B2FixtureDef<\/code> — one generic function replaces per-prop factory code."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">function<\/span> fromDef(body:<span class=\"c-t\">B2Body<\/span>, def:<span class=\"c-t\">FixtureDefData<\/span>) {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> fx = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2FixtureDef<\/span>();<\/span>","<span class=\"cl\">    <span class=\"c-k\">switch<\/span> def.type {<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"box\"<\/span>:    <span class=\"c-k\">final<\/span> s = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2PolygonShape<\/span>(); s.setAsBox(toM(def.hw), toM(def.hh)); fx.shape = s;<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"circle\"<\/span>: fx.shape = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2CircleShape<\/span>(toM(def.r));<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-s\">\"poly\"<\/span>:   <span class=\"c-k\">final<\/span> s = <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2PolygonShape<\/span>(); s.setAsArray([<span class=\"c-k\">for<\/span> (v in def.verts) <span class=\"c-k\">new<\/span> <span class=\"c-t\">B2Vec2<\/span>(toM(v.x), toM(v.y))]); fx.shape = s;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    fx.density = def.density; fx.friction = def.friction; fx.restitution = def.restitution;<\/span>","<span class=\"cl\">    body.createFixture(fx);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"function fromDef(body:B2Body, def:FixtureDefData) {\n    final fx = new B2FixtureDef();\n    switch def.type {\n        case \"box\":    final s = new B2PolygonShape(); s.setAsBox(toM(def.hw), toM(def.hh)); fx.shape = s;\n        case \"circle\": fx.shape = new B2CircleShape(toM(def.r));\n        case \"poly\":   final s = new B2PolygonShape(); s.setAsArray([for (v in def.verts) new B2Vec2(toM(v.x), toM(v.y))]); fx.shape = s;\n    }\n    fx.density = def.density; fx.friction = def.friction; fx.restitution = def.restitution;\n    body.createFixture(fx);\n}"}],"src":"11_ch10.txt:352","n":224},{"ch":11,"kind":"content","title":"Common Physics Pitfalls","tt":"Common Physics Pitfalls","blocks":[{"k":"p","h":"The physics hall of shame — every entry cost someone days."},{"k":"pit","t":"Tunneling: fast objects pass through thin walls","h":"Fix: CCD on fast bodies (<code>bullet = true<\/code>), thicker walls, or substeps. Bullet costs — reserve for projectiles."},{"k":"pit","t":"Ghost collisions on tile seams","h":"Two box bodies side by side have a \"ghost vertex\" where shapes snag. Fix: merge tile runs into single long bodies (the factory slide's note)."},{"k":"pit","t":"Sleeping bodies ignoring new spawns","h":"Sleep freezes bodies to save CPU; a new crate may rest ON AIR visually for a frame. Call <code>body.setAwake(true)<\/code> on spawn perturbations."},{"k":"pit","t":"Scaling the world for \"bigger physics\"","h":"Multiplying all positions by 10 because \"it feels small\" breaks density/tuning. Tune in meters with PPM conversion only at the view boundary."},{"k":"pit","t":"1000 dynamic crates \"because we can\"","h":"The solver is O(nearby pairs) — stack counts, not totals, matter. Keep dynamic bodies &lt; 100-200 on mobile, pool the rest."}],"src":"11_ch10.txt:360","n":225},{"ch":11,"kind":"content","title":"Project: The Physics Sandbox","tt":"Project: The Physics Sandbox","blocks":[{"k":"p","h":"Chapter 10's exit: a playground scene where every concept is exercised and tunable."},{"k":"ul","i":["Static: ground, ramps, tile walls. Dynamic: crates, barrels, boulders (each a saved fixture def).","A kinematic elevator and a motorized wheel ride prove joints.","Sensor door + hazard volume route events through the deferred queue.","Debug overlay (F3), prop-spaawner on a key, restart button; everything feels tuned via the exported fixture table."]},{"k":"best","t":"Sandbox scenes live in the shipped build (behold a flag)","h":"A \"physics room\" is QA gold: console cert testers, player bug reports and your own perf regression checks all reuse it."}],"src":"11_ch10.txt:368","n":226},{"ch":11,"kind":"content","title":"Chapter 10 Checklist","tt":"Chapter 10 Checklist","blocks":[{"k":"ul","i":["Adapter isolates box2d imports; PPM conversion only at boundaries.","Fixed 60 Hz stepping with accumulator; interpolated rendering if stepping lower.","Static tile runs merged; dynamic props from data-driven fixture defs.","Contacts deferred through a queue; filtering categories defined; sensors working.","Joints: elevator (prismatic) and wheel (revolute motor) in the sandbox.","Hero remains Chapter 6's controller; physics owns props only.","Debug draw on a key; the pitfall checklist reviewed against your build."]}],"src":"11_ch10.txt:377","n":227},{"ch":12,"kind":"chapter","title":"Custom Shaders: hxsl and Filters","tt":"Custom Shaders: hxsl and Filters","sub":"The Heaps shader model — hxsl, vertex and fragment effects, h2d filters, uniform binding and post-processing.","blocks":[],"src":"12_ch11.txt:1","n":228},{"ch":12,"kind":"content","title":"Shaders in Heaps: The hxsl Model","tt":"Shaders in Heaps: The hxsl Model","blocks":[{"k":"p","h":"Heaps shaders are written in <b>hxsl<\/b> — the shader language that is Haxe. Same syntax, same editor, compile-time checks, no separate GLSL files."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Tint<\/span> <span class=\"c-k\">extends<\/span> hxsl.<span class=\"c-t\">Shader<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">SRC<\/span> = {                 <span class=\"c-c\">// ← a compile-time structure, analyzed by macros<\/span><\/span>","<span class=\"cl\">        @:<span class=\"c-k\">import<\/span> h3d.shader.<span class=\"c-t\">Base2d<\/span>;    <span class=\"c-c\">// inherit the 2D vertex pipeline<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> fragment() {<\/span>","<span class=\"cl\">            pixelColor.rgb *= vec3(<span class=\"c-n\">0.9<\/span>, <span class=\"c-n\">1.0<\/span>, <span class=\"c-n\">1.1<\/span>);   <span class=\"c-c\">// cool tint, every pixel<\/span><\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    };<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Tint extends hxsl.Shader {\n    static var SRC = {                 // ← a compile-time structure, analyzed by macros\n        @:import h3d.shader.Base2d;    // inherit the 2D vertex pipeline\n        function fragment() {\n            pixelColor.rgb *= vec3(0.9, 1.0, 1.1);   // cool tint, every pixel\n        }\n    };\n}"},{"k":"ul","i":["The <code>SRC<\/code> block is <b>not runtime code<\/b> — it is compiled to GLSL/HLSL per platform by Heaps' macros, so type errors surface at Haxe compile time.","<code>@:import h3d.shader.Base2d<\/code> brings the standard 2D varyings and the vertex stage; you override only what you need."]},{"k":"best","t":"One language for game and shaders","h":"No .frag files to forget, no stringly-typed uniforms, goto-definition into shader sources. This is a top-three Heaps productivity feature."}],"src":"12_ch11.txt:19","n":229},{"ch":12,"kind":"content","title":"GPU Pipeline Refresher","tt":"GPU Pipeline Refresher","blocks":[{"k":"p","h":"Thirty seconds of graphics theory, in the shape that matters for this chapter."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">per DRAWABLE:<\/span>","<span class=\"cl\">   vertices ──► [VERTEX shader] ──► rasterizer ──► [FRAGMENT shader] ──► framebuffer<\/span>","<span class=\"cl\">                 positions/UVs      fills pixels      pixelColor = color of ONE pixel<\/span>"],"raw":"per DRAWABLE:\n   vertices ──► [VERTEX shader] ──► rasterizer ──► [FRAGMENT shader] ──► framebuffer\n                 positions/UVs      fills pixels      pixelColor = color of ONE pixel"},{"k":"ul","i":["<b>Vertex<\/b> moves points: positions, wobble, scale — runs ~4x per quad.","<b>Fragment<\/b> colors pixels: tint, dissolve, lighting math — runs per covered pixel (the expensive one).","Rule of thumb: move work <em>up<\/em> the pipeline (per-vertex beats per-pixel; per-drawable uniform beats per-vertex math)."]}],"src":"12_ch11.txt:30","n":230},{"ch":12,"kind":"content","title":"Your First Shader: Applying It to a Drawable","tt":"Your First Shader: Applying It to a Drawable","blocks":[{"k":"p","h":"Write once (previous slide), attach anywhere:"},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> bmp = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(atlas.get(<span class=\"c-s\">\"gem\"<\/span>), s2d);<\/span>","<span class=\"cl\">bmp.addShader(<span class=\"c-k\">new<\/span> <span class=\"c-t\">Tint<\/span>());            <span class=\"c-c\">// drawable gains the shader<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">bmp.removeShader(theTintInstance);    <span class=\"c-c\">// detach by reference<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">for<\/span> (s in bmp.getShaders()) trace(s); <span class=\"c-c\">// introspect the list<\/span><\/span>"],"raw":"final bmp = new h2d.Bitmap(atlas.get(\"gem\"), s2d);\nbmp.addShader(new Tint());            // drawable gains the shader\n\nbmp.removeShader(theTintInstance);    // detach by reference\nfor (s in bmp.getShaders()) trace(s); // introspect the list"},{"k":"ul","i":["<code>addShader<\/code> appends to the drawable's shader list — multiple shaders compose in order.","Shaders are <b>state<\/b>: one instance per active visual effect, not a global program. One instance CAN be shared by several drawables."]},{"k":"pit","t":"New-ing a shader every frame","h":"A fresh shader instance per frame invalidates program caches and allocates. Cache instances (<code>static final TINT = new Tint();<\/code>) and add/remove them."}],"src":"12_ch11.txt:43","n":231},{"ch":12,"kind":"content","title":"Anatomy of an hxsl Shader","tt":"Anatomy of an hxsl Shader","blocks":[{"k":"p","h":"The full anatomy with varyings and the two entry points, commented line by line."},{"k":"code","lang":"haxe","file":"Wobble.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Wobble<\/span> <span class=\"c-k\">extends<\/span> hxsl.<span class=\"c-t\">Shader<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">SRC<\/span> = {<\/span>","<span class=\"cl\">        @:<span class=\"c-k\">import<\/span> h3d.shader.<span class=\"c-t\">Base2d<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-c\">// UNIFORM — set from Haxe, constant for the whole draw<\/span><\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> amount : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> time : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-c\">// vertex() runs per vertex — wobble the sprite BEFORE projection<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> vertex() {<\/span>","<span class=\"cl\">            <span class=\"c-c\">// relativePosition: the vertex position in drawable space (pixels)<\/span><\/span>","<span class=\"cl\">            relativePosition.x += <span class=\"c-t\">Math<\/span>.sin(time * <span class=\"c-n\">3.0<\/span> + relativePosition.y * <span class=\"c-n\">0.05<\/span>) * amount;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-c\">// fragment() runs per pixel — leave Base2d's texture lookup intact<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> fragment() {<\/span>","<span class=\"cl\">            pixelColor.a *= <span class=\"c-n\">0.95<\/span>;      <span class=\"c-c\">// subtle, just to show both stages<\/span><\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    };<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-c\">// Bound Haxe-side fields (same names as @param above):<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> amount = <span class=\"c-n\">6.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> time = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>() <span class=\"c-k\">super<\/span>();<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Wobble extends hxsl.Shader {\n    static var SRC = {\n        @:import h3d.shader.Base2d;\n\n        // UNIFORM — set from Haxe, constant for the whole draw\n        @param var amount : Float;\n        @param var time : Float;\n\n        // vertex() runs per vertex — wobble the sprite BEFORE projection\n        function vertex() {\n            // relativePosition: the vertex position in drawable space (pixels)\n            relativePosition.x += Math.sin(time * 3.0 + relativePosition.y * 0.05) * amount;\n        }\n\n        // fragment() runs per pixel — leave Base2d's texture lookup intact\n        function fragment() {\n            pixelColor.a *= 0.95;      // subtle, just to show both stages\n        }\n    };\n\n    // Bound Haxe-side fields (same names as @param above):\n    public var amount = 6.0;\n    public var time = 0.0;\n    public function new() super();\n}"},{"k":"ul","i":["The public fields mirror the <code>@param<\/code> declarations and are auto-uploaded each draw — that is the entire uniform-binding mechanism."]},{"k":"note","h":"<code>Base2d<\/code> also exposes <code>absolutePosition<\/code> (screen-space), <code>pixelColor<\/code>, <code>calculatedUV<\/code> and <code>vertexColor<\/code>. Explore <code>h3d/shader/Base2d.hx<\/code> in the Heaps repo — it is short and readable."}],"src":"12_ch11.txt:75","n":232},{"ch":12,"kind":"content","title":"Vertex Shader: A Flag Wave Example","tt":"Vertex Shader: A Flag Wave Example","blocks":[{"k":"p","h":"Per-vertex sine work is nearly free — a full \"silk flag\" in five lines."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">FlagWave<\/span> <span class=\"c-k\">extends<\/span> hxsl.<span class=\"c-t\">Shader<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">SRC<\/span> = {<\/span>","<span class=\"cl\">        @:<span class=\"c-k\">import<\/span> h3d.shader.<span class=\"c-t\">Base2d<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> time : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> vertex() {<\/span>","<span class=\"cl\">            <span class=\"c-c\">// more displacement toward the right edge (uv.x: 0 left, 1 right)<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> wave = <span class=\"c-t\">Math<\/span>.sin(time * <span class=\"c-n\">2.2<\/span> + calculatedUV.x * <span class=\"c-n\">9.0<\/span>) * <span class=\"c-n\">10.0<\/span> * calculatedUV.x;<\/span>","<span class=\"cl\">            relativePosition.y += wave;<\/span>","<span class=\"cl\">            relativePosition.x += <span class=\"c-t\">Math<\/span>.cos(time * <span class=\"c-n\">1.8<\/span> + calculatedUV.y * <span class=\"c-n\">6.0<\/span>) * <span class=\"c-n\">3.0<\/span> * calculatedUV.x;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    };<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> time = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class FlagWave extends hxsl.Shader {\n    static var SRC = {\n        @:import h3d.shader.Base2d;\n        @param var time : Float;\n        function vertex() {\n            // more displacement toward the right edge (uv.x: 0 left, 1 right)\n            final wave = Math.sin(time * 2.2 + calculatedUV.x * 9.0) * 10.0 * calculatedUV.x;\n            relativePosition.y += wave;\n            relativePosition.x += Math.cos(time * 1.8 + calculatedUV.y * 6.0) * 3.0 * calculatedUV.x;\n        }\n    };\n    public var time = 0.0;\n}"},{"k":"ul","i":["Drive <code>time<\/code> from the effect system: <code>flagShader.time = Game.me.clock;<\/code> each frame.","Same technique: water surface, jelly UI, tree sway, banner idle."]}],"src":"12_ch11.txt:95","n":233},{"ch":12,"kind":"content","title":"Fragment Shader: Grayscale and Tint Bands","tt":"Fragment Shader: Grayscale and Tint Bands","blocks":[{"k":"p","h":"Per-pixel math in the fragment stage — the classic filters."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Desaturate<\/span> <span class=\"c-k\">extends<\/span> hxsl.<span class=\"c-t\">Shader<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">SRC<\/span> = {<\/span>","<span class=\"cl\">        @:<span class=\"c-k\">import<\/span> h3d.shader.<span class=\"c-t\">Base2d<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> strength : <span class=\"c-t\">Float<\/span>;          <span class=\"c-c\">// 0 = normal, 1 = full grayscale<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> fragment() {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> g = (pixelColor.r + pixelColor.g + pixelColor.b) / <span class=\"c-n\">3.0<\/span>;<\/span>","<span class=\"cl\">            pixelColor.rgb = <span class=\"c-t\">Vec3<\/span>(<\/span>","<span class=\"cl\">                pixelColor.r + (g - pixelColor.r) * strength,<\/span>","<span class=\"cl\">                pixelColor.g + (g - pixelColor.g) * strength,<\/span>","<span class=\"cl\">                pixelColor.b + (g - pixelColor.b) * strength);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    };<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> strength = <span class=\"c-n\">1.0<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Desaturate extends hxsl.Shader {\n    static var SRC = {\n        @:import h3d.shader.Base2d;\n        @param var strength : Float;          // 0 = normal, 1 = full grayscale\n        function fragment() {\n            final g = (pixelColor.r + pixelColor.g + pixelColor.b) / 3.0;\n            pixelColor.rgb = Vec3(\n                pixelColor.r + (g - pixelColor.r) * strength,\n                pixelColor.g + (g - pixelColor.g) * strength,\n                pixelColor.b + (g - pixelColor.b) * strength);\n        }\n    };\n    public var strength = 1.0;\n}"},{"k":"ul","i":["Cavern Run use: desaturate the world behind pause/game-over dialogs (<code>strength = 0.65<\/code>) — instant focus."]},{"k":"best","t":"Reuse the strength-uniform pattern","h":"Every shader with a 0..1 strength blends \"off\" and \"on\" and can be tweened (Chapter 13). Effects that are always-on are effects that cannot be art-directed."}],"src":"12_ch11.txt:116","n":234},{"ch":12,"kind":"content","title":"Textures and Samplers in hxsl","tt":"Textures and Samplers in hxsl","blocks":[{"k":"p","h":"Sample extra textures inside a shader — noise for dissolve (Chapter 9), palettes, masks."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">PaletteSwap<\/span> <span class=\"c-k\">extends<\/span> hxsl.<span class=\"c-t\">Shader<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">SRC<\/span> = {<\/span>","<span class=\"cl\">        @:<span class=\"c-k\">import<\/span> h3d.shader.<span class=\"c-t\">Base2d<\/span>;<\/span>","<span class=\"cl\">        @param <span class=\"c-k\">var<\/span> palette : <span class=\"c-t\">Sampler2D<\/span>;       <span class=\"c-c\">// 256x1 gradient texture<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">function<\/span> fragment() {<\/span>","<span class=\"cl\">            <span class=\"c-c\">// use the sprite's luminance as an index into the palette<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> g = (pixelColor.r + pixelColor.g + pixelColor.b) / <span class=\"c-n\">3.0<\/span>;<\/span>","<span class=\"cl\">            pixelColor.rgb = palette.get(<span class=\"c-t\">Vec2<\/span>(g, <span class=\"c-n\">0.5<\/span>)).rgb;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    };<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> palette : h3d.mat.<span class=\"c-t\">Texture<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(tex) { <span class=\"c-k\">super<\/span>(); <span class=\"c-k\">this<\/span>.palette = tex; }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class PaletteSwap extends hxsl.Shader {\n    static var SRC = {\n        @:import h3d.shader.Base2d;\n        @param var palette : Sampler2D;       // 256x1 gradient texture\n        function fragment() {\n            // use the sprite's luminance as an index into the palette\n            final g = (pixelColor.r + pixelColor.g + pixelColor.b) / 3.0;\n            pixelColor.rgb = palette.get(Vec2(g, 0.5)).rgb;\n        }\n    };\n    public var palette : h3d.mat.Texture;\n    public function new(tex) { super(); this.palette = tex; }\n}"},{"k":"ul","i":["Sampler wrapping/filtering follow the texture's setup (<code>tex.wrap = Repeat<\/code> for tiling noise).","Palette textures are 1D data in disguise — entire 90s-style palette effects run per-pixel for free."]}],"src":"12_ch11.txt:136","n":235},{"ch":12,"kind":"content","title":"h2d Filters: The Built-In Toolkit","tt":"h2d Filters: The Built-In Toolkit","blocks":[{"k":"p","h":"Filters are scene-graph-level effects — Heaps implements them as shaders plus automatic render-to-texture."},{"k":"table","head":["Filter","What it does","Typical use"],"rows":[["Blur","gaussian blur, radius/quality","depth of field, smears"],["Glow","additive halo (color, size)","pickups, neon UI, danger"],["DropShadow","offset blurred silhouette","readable text/UI over gameplay"],["Outline","colored silhouette edge","selected units, comic style"],["ColorMatrix","4x5 color transform","hit flash, damage states"],["DisplacementMap","UVs pushed by a texture","heat haze, water"]]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\">label.filter = <span class=\"c-k\">new<\/span> h2d.filter.<span class=\"c-t\">DropShadow<\/span>(<span class=\"c-n\">2<\/span>, <span class=\"c-n\">2<\/span>, <span class=\"c-n\">0x000000<\/span>, <span class=\"c-n\">0.7<\/span>);<\/span>","<span class=\"cl\">gemIcon.filter = <span class=\"c-k\">new<\/span> h2d.filter.<span class=\"c-t\">Glow<\/span>(<span class=\"c-n\">0xFFD700<\/span>, <span class=\"c-n\">24<\/span>, <span class=\"c-n\">1.2<\/span>, <span class=\"c-n\">2<\/span>, <span class=\"c-n\">1<\/span>, <span class=\"c-k\">true<\/span>);<\/span>","<span class=\"cl\">bossSprite.filter = <span class=\"c-k\">new<\/span> h2d.filter.<span class=\"c-t\">Outline<\/span>(<span class=\"c-n\">3<\/span>, <span class=\"c-n\">0xFF3030<\/span>);<\/span>","<span class=\"cl\">hero.filter = <span class=\"c-k\">new<\/span> h2d.filter.<span class=\"c-t\">ColorMatrix<\/span>();   <span class=\"c-c\">// then drive .matrix per state<\/span><\/span>"],"raw":"label.filter = new h2d.filter.DropShadow(2, 2, 0x000000, 0.7);\ngemIcon.filter = new h2d.filter.Glow(0xFFD700, 24, 1.2, 2, 1, true);\nbossSprite.filter = new h2d.filter.Outline(3, 0xFF3030);\nhero.filter = new h2d.filter.ColorMatrix();   // then drive .matrix per state"},{"k":"pit","t":"Filters are render targets — mind mobile","h":"Each filtered drawable costs an offscreen buffer per frame. Desktop: casual use is fine. Mobile: reserve filters for UI and hero states, never per-enemy."}],"src":"12_ch11.txt:155","n":236},{"ch":12,"kind":"content","title":"Custom Filters: Building Your Own","tt":"Custom Filters: Building Your Own","blocks":[{"k":"p","h":"A filter = your shader + Heaps' plumbing (render-to-texture, re-project, restore). Subclassing <code>h2d.filter.Filter<\/code> is rarely needed — compose instead."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// \"wavy heat\" = your wobble shader (vertex) inside a filter region:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">HeatFi
