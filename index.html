=\"c-n\">0<\/span> ? alignRight(e) : alignLeft(e);<\/span>","<span class=\"cl\">                e.vx = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">            }<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        e.y += dy;                                     <span class=\"c-c\">// then Y<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (dy &gt; <span class=\"c-n\">0<\/span> &amp;&amp; bottomSolid(e)) { e.y = alignUp(e); e.vy = <span class=\"c-n\">0<\/span>; grounded = <span class=\"c-k\">true<\/span>; }<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (dy &lt; <span class=\"c-n\">0<\/span> &amp;&amp; topSolid(e)) { e.y = alignDown(e); e.vy = <span class=\"c-n\">0<\/span>; }<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> grounded;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-c\">// helpers sample 3 points along the leading edge — see course repo<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> lineSolid(_, _, _) <span class=\"c-k\">return<\/span> <span class=\"c-k\">false<\/span>; <span class=\"c-k\">function<\/span> bottomSolid(_) <span class=\"c-k\">return<\/span> <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> topSolid(_) <span class=\"c-k\">return<\/span> <span class=\"c-k\">false<\/span>; <span class=\"c-k\">function<\/span> alignUp(_) <span class=\"c-k\">return<\/span> <span class=\"c-n\">0<\/span>.; <span class=\"c-k\">function<\/span> alignDown(_) <span class=\"c-k\">return<\/span> <span class=\"c-n\">0<\/span>.;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> alignRight(_) <span class=\"c-k\">return<\/span> <span class=\"c-n\">0<\/span>.; <span class=\"c-k\">function<\/span> alignLeft(_) <span class=\"c-k\">return<\/span> <span class=\"c-n\">0<\/span>.;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class TileCollision {\n    public var grid : Array<Array<Int>>;    // from LevelData (Ch. 5)\n    public var tileW = 32; public var tileH = 32;\n\n    public function solidAt(px:Float, py:Float) : Bool {\n        final tx = Std.int(px / tileW), ty = Std.int(py / tileH);\n        return tx < 0 || ty < 0 || ty >= grid.length\n            || tx >= grid[ty].length || grid[ty][tx] == 1;\n    }\n\n    /** move e by (dx, dy), resolving against solid tiles; sets grounded */\n    public function move(e:{ x:Float, y:Float, w:Float, h:Float, vx:Float, vy:Float }, dx:Float, dy:Float) : Bool {\n        var grounded = false;\n        e.x += dx;                                     // X first\n        if (dx != 0) {\n            final dir = dx > 0 ? e.x + e.w : e.x;      // leading edge\n            if (lineSolid(dir, e.y, e.y + e.h)) {      // sample top/mid/bottom\n                e.x = dx > 0 ? alignRight(e) : alignLeft(e);\n                e.vx = 0;\n            }\n        }\n        e.y += dy;                                     // then Y\n        if (dy > 0 && bottomSolid(e)) { e.y = alignUp(e); e.vy = 0; grounded = true; }\n        if (dy < 0 && topSolid(e)) { e.y = alignDown(e); e.vy = 0; }\n        return grounded;\n    }\n    // helpers sample 3 points along the leading edge — see course repo\n    function lineSolid(_, _, _) return false; function bottomSolid(_) return false;\n    function topSolid(_) return false; function alignUp(_) return 0.; function alignDown(_) return 0.;\n    function alignRight(_) return 0.; function alignLeft(_) return 0.;\n}"},{"k":"note","h":"The full eight-helper version is mechanical (sample leading edge at 3 heights, snap to tile boundary). It is deliberately not printed here: type it once, keep it forever — or copy the standalone file from the course repo."}],"src":"07_ch06.txt:164","n":140},{"ch":7,"kind":"content","title":"Sensors and One-Way Platforms","tt":"Sensors and One-Way Platforms","blocks":[{"k":"p","h":"<code>= platforms<\/code> (jump-through from below) need one rule change, not a new system."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// One-way: solid only when falling AND the player's feet were above the top last tick<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">function<\/span> oneWayBlocked(platformTop:<span class=\"c-t\">Float<\/span>, prevFeet:<span class=\"c-t\">Float<\/span>, vy:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Bool<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">return<\/span> vy &gt;= <span class=\"c-n\">0<\/span> &amp;&amp; prevFeet &lt;= platformTop + <span class=\"c-n\">0.01<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// Drop-through: hold Down + Jump to ignore one-ways for one tick<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">if<\/span> (<span class=\"c-t\">Input<\/span>.down(<span class=\"c-t\">Down<\/span>) &amp;&amp; <span class=\"c-t\">Input<\/span>.pressed(<span class=\"c-t\">Jump<\/span>)) dropTimer = <span class=\"c-n\">0.18<\/span>;<\/span>"],"raw":"// One-way: solid only when falling AND the player's feet were above the top last tick\nfunction oneWayBlocked(platformTop:Float, prevFeet:Float, vy:Float) : Bool\n    return vy >= 0 && prevFeet <= platformTop + 0.01;\n\n// Drop-through: hold Down + Jump to ignore one-ways for one tick\nif (Input.down(Down) && Input.pressed(Jump)) dropTimer = 0.18;"},{"k":"ul","i":["Sensors (<code>^<\/code> spikes, triggers): overlap tests with <b>no resolution<\/b> — they call <code>onTouch(entity)<\/code> instead.","Sensor + resolution separation keeps hazards, doors and pickups out of the physics path entirely."]},{"k":"best","t":"Three tile behaviors is all a platformer needs","h":"Solid, one-way, sensor. Encode as tile ids in the level data (Chapter 5) and resist a plugin system until a level genuinely demands one."}],"src":"07_ch06.txt:178","n":141},{"ch":7,"kind":"content","title":"Bounding Circles and Cheap Distance Tests","tt":"Bounding Circles and Cheap Distance Tests","blocks":[{"k":"p","h":"Gems, explosion radii and bat swarm checks read better as circles — and they are faster than they look."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> dist2(ax:<span class=\"c-t\">Float<\/span>, ay:<span class=\"c-t\">Float<\/span>, bx:<span class=\"c-t\">Float<\/span>, by:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Float<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> dx = ax - bx, dy = ay - by;<\/span>","<span class=\"cl\">    <span class=\"c-k\">return<\/span> dx * dx + dy * dy;                 <span class=\"c-c\">// squared — NO sqrt<\/span><\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-c\">// circle test with squared radius (also no sqrt):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> circleHit(ax, ay, ar, bx, by, br)<\/span>","<span class=\"cl\">    <span class=\"c-k\">return<\/span> dist2(ax, ay, bx, by) &lt;= (ar + br) * (ar + br);<\/span>"],"raw":"static inline function dist2(ax:Float, ay:Float, bx:Float, by:Float) : Float {\n    final dx = ax - bx, dy = ay - by;\n    return dx * dx + dy * dy;                 // squared — NO sqrt\n}\n// circle test with squared radius (also no sqrt):\nstatic inline function circleHit(ax, ay, ar, bx, by, br)\n    return dist2(ax, ay, bx, by) <= (ar + br) * (ar + br);"},{"k":"ul","i":["Never <code>Math.sqrt<\/code> in per-entity tests; compare squared distances.","Pickup radii are generous (1.5x the gem art) — collection should feel magnetic."]},{"k":"note","h":"Mix shapes deliberately: player vs tiles = AABB; player vs gems = circle; explosion = circle. Real games are shape-polyglots and it costs nothing."}],"src":"07_ch06.txt:193","n":142},{"ch":7,"kind":"content","title":"Spatial Partitioning: The Uniform Grid","tt":"Spatial Partitioning: The Uniform Grid","blocks":[{"k":"p","h":"The broad phase that carries this course from hundreds to tens of thousands of entities."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">world space divided into cells (cell = 128 px)<\/span>","<span class=\"cl\">      │ cell(0,0)   cell(1,0) │<\/span>","<span class=\"cl\">      │  [bat]      [gem,gem] │      query \"who is near the player?\"<\/span>","<span class=\"cl\">      │ [player]              │      → check only the 3x3 cells around it<\/span>","<span class=\"cl\">      │           [bat][bat]  │      → 5 tests instead of 300<\/span>"],"raw":"world space divided into cells (cell = 128 px)\n      │ cell(0,0)   cell(1,0) │\n      │  [bat]      [gem,gem] │      query \"who is near the player?\"\n      │ [player]              │      → check only the 3x3 cells around it\n      │           [bat][bat]  │      → 5 tests instead of 300"},{"k":"ul","i":["Insert each entity into its cell each tick (or on move); query neighbors by cell range.","Cell size heuristic: ~2x the average entity diameter, so most queries touch 4-9 cells."]},{"k":"best","t":"Grids beat quadtrees for moving entities 95% of the time","h":"Quadtrees shine for huge static worlds; game entities move every frame, and rebuilding a flat grid costs far less than maintaining tree invariants."}],"src":"07_ch06.txt:206","n":143},{"ch":7,"kind":"content","title":"Uniform Grid Implementation","tt":"Uniform Grid Implementation","blocks":[{"k":"p","h":"Forty lines that make entity count a non-problem. Note: no allocations per tick."},{"k":"code","lang":"haxe","file":"SpatialGrid.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">SpatialGrid<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">CELL<\/span> = <span class=\"c-n\">128<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> buckets = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Map<\/span>&lt;<span class=\"c-t\">Int<\/span>, <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Entity<\/span>&gt;&gt;();<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> scratch = [];                                  <span class=\"c-c\">// reused query results<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> rebuild(all:<span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Entity<\/span>&gt;) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (b in buckets) b.splice(<span class=\"c-n\">0<\/span>, b.length);       <span class=\"c-c\">// keep arrays, clear contents<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (e in all) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> k = key(<span class=\"c-t\">Std<\/span>.int(e.x / <span class=\"c-t\">CELL<\/span>), <span class=\"c-t\">Std<\/span>.int(e.y / <span class=\"c-t\">CELL<\/span>));<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (!buckets.exists(k)) buckets[k] = [];<\/span>","<span class=\"cl\">            buckets[k].push(e);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> query(x0:<span class=\"c-t\">Float<\/span>, y0:<span class=\"c-t\">Float<\/span>, x1:<span class=\"c-t\">Float<\/span>, y1:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Entity<\/span>&gt; {<\/span>","<span class=\"cl\">        scratch.splice(<span class=\"c-n\">0<\/span>, scratch.length);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> cx0 = <span class=\"c-t\">Std<\/span>.int(x0 / <span class=\"c-t\">CELL<\/span>), cy0 = <span class=\"c-t\">Std<\/span>.int(y0 / <span class=\"c-t\">CELL<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> cx1 = <span class=\"c-t\">Std<\/span>.int(x1 / <span class=\"c-t\">CELL<\/span>), cy1 = <span class=\"c-t\">Std<\/span>.int(y1 / <span class=\"c-t\">CELL<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (cy in cy0...cy1 + <span class=\"c-n\">1<\/span>) <span class=\"c-k\">for<\/span> (cx in cx0...cx1 + <span class=\"c-n\">1<\/span>) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> b = buckets[key(cx, cy)];<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (b != <span class=\"c-k\">null<\/span>) <span class=\"c-k\">for<\/span> (e in b) <span class=\"c-k\">if<\/span> (!scratch.contains(e)) scratch.push(e);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> scratch;                                <span class=\"c-c\">// valid until next query<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> key(cx:<span class=\"c-t\">Int<\/span>, cy:<span class=\"c-t\">Int<\/span>) <span class=\"c-k\">return<\/span> cx * <span class=\"c-n\">8192<\/span> + cy;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class SpatialGrid {\n    public static var CELL = 128;\n    var buckets = new Map<Int, Array<Entity>>();\n    var scratch = [];                                  // reused query results\n\n    public function rebuild(all:Array<Entity>) {\n        for (b in buckets) b.splice(0, b.length);       // keep arrays, clear contents\n        for (e in all) {\n            final k = key(Std.int(e.x / CELL), Std.int(e.y / CELL));\n            if (!buckets.exists(k)) buckets[k] = [];\n            buckets[k].push(e);\n        }\n    }\n    public function query(x0:Float, y0:Float, x1:Float, y1:Float) : Array<Entity> {\n        scratch.splice(0, scratch.length);\n        final cx0 = Std.int(x0 / CELL), cy0 = Std.int(y0 / CELL);\n        final cx1 = Std.int(x1 / CELL), cy1 = Std.int(y1 / CELL);\n        for (cy in cy0...cy1 + 1) for (cx in cx0...cx1 + 1) {\n            final b = buckets[key(cx, cy)];\n            if (b != null) for (e in b) if (!scratch.contains(e)) scratch.push(e);\n        }\n        return scratch;                                // valid until next query\n    }\n    inline function key(cx:Int, cy:Int) return cx * 8192 + cy;\n}"},{"k":"pit","t":"Using the query result after another query","h":"The scratch array is shared for speed (zero allocation). Copy <code>query().copy()<\/code> if you must hold it — or iterate immediately, which is the intended use."}],"src":"07_ch06.txt:237","n":144},{"ch":7,"kind":"content","title":"Broad Phase + Narrow Phase: The Pipeline","tt":"Broad Phase + Narrow Phase: The Pipeline","blocks":[{"k":"p","h":"Assemble the pieces into the system that runs every tick."},{"k":"code","lang":"haxe","file":"CollisionSystem.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">CollisionSystem<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> grid = <span class=\"c-k\">new<\/span> <span class=\"c-t\">SpatialGrid<\/span>();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> run(w:<span class=\"c-t\">WorldController<\/span>, dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        grid.rebuild(w.entities);<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (a in w.entities) {<\/span>","<span class=\"cl\">            <span class=\"c-c\">// 1. BROAD: candidates near a (cheap, ~5 entities)<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> near = grid.query(a.x - <span class=\"c-n\">64<\/span>, a.y - <span class=\"c-n\">64<\/span>, a.x + <span class=\"c-n\">64<\/span>, a.y + <span class=\"c-n\">64<\/span>);<\/span>","<span class=\"cl\">            <span class=\"c-k\">for<\/span> (b in near) {<\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (b == a || b.id &lt;= a.id) <span class=\"c-k\">continue<\/span>;      <span class=\"c-c\">// each pair once<\/span><\/span>","<span class=\"cl\">                <span class=\"c-c\">// 2. NARROW: exact test (AABB or circle per pair type)<\/span><\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (a.hit.overlaps(b.hit)) <span class=\"c-t\">Interaction<\/span>.apply(a, b);<\/span>","<span class=\"cl\">            }<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">enum<\/span> <span class=\"c-t\">Interaction<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> apply(a:<span class=\"c-t\">Entity<\/span>, b:<span class=\"c-t\">Entity<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// gem+player → collect; player+bat → damage; crate+bat → squash…<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class CollisionSystem {\n    static var grid = new SpatialGrid();\n\n    public static function run(w:WorldController, dt:Float) {\n        grid.rebuild(w.entities);\n        for (a in w.entities) {\n            // 1. BROAD: candidates near a (cheap, ~5 entities)\n            final near = grid.query(a.x - 64, a.y - 64, a.x + 64, a.y + 64);\n            for (b in near) {\n                if (b == a || b.id <= a.id) continue;      // each pair once\n                // 2. NARROW: exact test (AABB or circle per pair type)\n                if (a.hit.overlaps(b.hit)) Interaction.apply(a, b);\n            }\n        }\n    }\n}\nenum Interaction {\n    static function apply(a:Entity, b:Entity) {\n        // gem+player → collect; player+bat → damage; crate+bat → squash…\n    }\n}"},{"k":"ul","i":["<code>b.id &lt;= a.id<\/code> dedup halves the work — but keep the comparison stable (never both directions).","Interaction rules live in one <code>apply<\/code> switch: the gameplay designer's switchboard."]}],"src":"07_ch06.txt:265","n":145},{"ch":7,"kind":"content","title":"Enemies: State-Driven Behavior","tt":"Enemies: State-Driven Behavior","blocks":[{"k":"p","h":"Three-state AI is 90% of classic enemies — bats patrol, notice, chase — as a pure state machine."},{"k":"code","lang":"haxe","file":"BatAI.hx","lines":["<span class=\"cl\"><span class=\"c-k\">enum<\/span> <span class=\"c-t\">AIState<\/span> { <span class=\"c-t\">Patrol<\/span>; <span class=\"c-t\">Notice<\/span>; <span class=\"c-t\">Chase<\/span>; }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">BatAI<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> state = <span class=\"c-t\">Patrol<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> timer = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> tick(self:<span class=\"c-t\">Entity<\/span>, player:<span class=\"c-t\">Entity<\/span>, dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">switch<\/span> state {<\/span>","<span class=\"cl\">            <span class=\"c-k\">case<\/span> <span class=\"c-t\">Patrol<\/span>:<\/span>","<span class=\"cl\">                self.vx = <span class=\"c-t\">Math<\/span>.sin(self.x * <span class=\"c-n\">0.05<\/span>) * <span class=\"c-n\">40<\/span>;   <span class=\"c-c\">// lazy sine patrol<\/span><\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (circleHit(self.x, self.y, <span class=\"c-n\">120<\/span>, player.x, player.y, <span class=\"c-n\">1<\/span>)) {<\/span>","<span class=\"cl\">                    state = <span class=\"c-t\">Notice<\/span>; timer = <span class=\"c-n\">0.25<\/span>;<\/span>","<span class=\"cl\">                }<\/span>","<span class=\"cl\">            <span class=\"c-k\">case<\/span> <span class=\"c-t\">Notice<\/span>:<\/span>","<span class=\"cl\">                timer -= dt;                              <span class=\"c-c\">// wind-up telegraph<\/span><\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (timer &lt;= <span class=\"c-n\">0<\/span>) state = <span class=\"c-t\">Chase<\/span>;<\/span>","<span class=\"cl\">            <span class=\"c-k\">case<\/span> <span class=\"c-t\">Chase<\/span>:<\/span>","<span class=\"cl\">                <span class=\"c-k\">final<\/span> dx = player.x - self.x, dy = player.y - self.y;<\/span>","<span class=\"cl\">                <span class=\"c-k\">final<\/span> d = <span class=\"c-t\">Math<\/span>.sqrt(dx * dx + dy * dy);<\/span>","<span class=\"cl\">                self.vx = dx / d * <span class=\"c-n\">130<\/span>; self.vy = dy / d * <span class=\"c-n\">130<\/span>;<\/span>","<span class=\"cl\">                <span class=\"c-k\">if<\/span> (d &gt; <span class=\"c-n\">260<\/span>) state = <span class=\"c-t\">Patrol<\/span>;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"enum AIState { Patrol; Notice; Chase; }\n\nclass BatAI {\n    var state = Patrol;\n    var timer = 0.0;\n    public function tick(self:Entity, player:Entity, dt:Float) {\n        switch state {\n            case Patrol:\n                self.vx = Math.sin(self.x * 0.05) * 40;   // lazy sine patrol\n                if (circleHit(self.x, self.y, 120, player.x, player.y, 1)) {\n                    state = Notice; timer = 0.25;\n                }\n            case Notice:\n                timer -= dt;                              // wind-up telegraph\n                if (timer <= 0) state = Chase;\n            case Chase:\n                final dx = player.x - self.x, dy = player.y - self.y;\n                final d = Math.sqrt(dx * dx + dy * dy);\n                self.vx = dx / d * 130; self.vy = dy / d * 130;\n                if (d > 260) state = Patrol;\n        }\n    }\n}"},{"k":"ul","i":["The <b>Notice<\/b> state (a visible wind-up) is what makes dodging a skill instead of luck."]},{"k":"best","t":"AI that reads well beats AI that is clever","h":"Players only perceive: telegraph, approach, attack. Nail those three states with clear animation cues before dreaming of behavior trees."}],"src":"07_ch06.txt:295","n":146},{"ch":7,"kind":"content","title":"Collectibles, Hazards and Scoring","tt":"Collectibles, Hazards and Scoring","blocks":[{"k":"p","h":"Pickups and hazards share the sensor pattern (no resolution); scoring is an event away from the renderer."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// Interaction.apply(a, b) — the gameplay switchboard:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">if<\/span> (a.kind == <span class=\"c-t\">KGem<\/span> &amp;&amp; b.isPlayer()) {<\/span>","<span class=\"cl\">    a.dead = <span class=\"c-k\">true<\/span>;                                   <span class=\"c-c\">// world: remove<\/span><\/span>","<span class=\"cl\">    <span class=\"c-t\">Game<\/span>.me.events.gemCollected(a.get(<span class=\"c-t\">GemKind<\/span>).id);  <span class=\"c-c\">// score + views react<\/span><\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">if<\/span> (a.kind == <span class=\"c-t\">KSpikes<\/span> &amp;&amp; b.isPlayer())<\/span>","<span class=\"cl\">    b.get(<span class=\"c-t\">Health<\/span>).hit(<span class=\"c-n\">1<\/span>);            <span class=\"c-c\">// iframes + knockback live inside Health<\/span><\/span>"],"raw":"// Interaction.apply(a, b) — the gameplay switchboard:\nif (a.kind == KGem && b.isPlayer()) {\n    a.dead = true;                                   // world: remove\n    Game.me.events.gemCollected(a.get(GemKind).id);  // score + views react\n}\nif (a.kind == KSpikes && b.isPlayer())\n    b.get(Health).hit(1);            // iframes + knockback live inside Health"},{"k":"ul","i":["Score lives in the world; sound/particles live in views reacting to events (Chapter 4's separation).","Magnet pickups: gems drift toward the player inside a radius — one lerp (Chapter 8) of pure joy."]},{"k":"pit","t":"Scoring from the renderer (\"gem drawn = score\")","h":"Presentation state drifts from simulation state the first time a view is culled or pooled. Score only in the world; views display."}],"src":"07_ch06.txt:310","n":147},{"ch":7,"kind":"content","title":"Player Lives, Damage and Invulnerability Frames","tt":"Player Lives, Damage and Invulnerability Frames","blocks":[{"k":"p","h":"Lives, hit flashes and i-frames are one component — the health system from Chapter 4 earning its keep."},{"k":"code","lang":"haxe","file":"Health.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Health<\/span> <span class=\"c-k\">extends<\/span> <span class=\"c-t\">Component<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> hp : <span class=\"c-t\">Int<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> max : <span class=\"c-t\">Int<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> iframes = <span class=\"c-n\">0.0<\/span>;                 <span class=\"c-c\">// seconds of invulnerability<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(max) { <span class=\"c-k\">this<\/span>.max = hp = max; }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> hit(n:<span class=\"c-t\">Int<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (iframes &gt; <span class=\"c-n\">0<\/span> || hp &lt;= <span class=\"c-n\">0<\/span>) <span class=\"c-k\">return<\/span>;<\/span>","<span class=\"cl\">        hp -= n;<\/span>","<span class=\"cl\">        iframes = <span class=\"c-n\">0.9<\/span>;                        <span class=\"c-c\">// ~54 frames of safety<\/span><\/span>","<span class=\"cl\">        entity.vy = -<span class=\"c-n\">260<\/span>;                     <span class=\"c-c\">// knockback pop<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (hp &lt;= <span class=\"c-n\">0<\/span>) entity.dead = <span class=\"c-k\">true<\/span>;      <span class=\"c-c\">// or trigger GameOver event<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> tick(dt:<span class=\"c-t\">Float<\/span>) <span class=\"c-k\">if<\/span> (iframes &gt; <span class=\"c-n\">0<\/span>) iframes -= dt;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Health extends Component {\n    public var hp : Int; public var max : Int;\n    public var iframes = 0.0;                 // seconds of invulnerability\n\n    public function new(max) { this.max = hp = max; }\n\n    public function hit(n:Int) {\n        if (iframes > 0 || hp <= 0) return;\n        hp -= n;\n        iframes = 0.9;                        // ~54 frames of safety\n        entity.vy = -260;                     // knockback pop\n        if (hp <= 0) entity.dead = true;      // or trigger GameOver event\n    }\n    public function tick(dt:Float) if (iframes > 0) iframes -= dt;\n}"},{"k":"ul","i":["I-frames exist to make damage <em>readable<\/em>, not to be fair — flash the sprite (view toggles alpha at 30 Hz while <code>iframes &gt; 0<\/code>)."]},{"k":"best","t":"Damage events, not damage side-effects","h":"<code>hit()<\/code> changes numbers; the view listens for the hit event and does camera shake, flash, sfx. Tuning feel then never touches gameplay logic."}],"src":"07_ch06.txt:332","n":148},{"ch":7,"kind":"content","title":"Game Over, Respawn and Checkpoints","tt":"Game Over, Respawn and Checkpoints","blocks":[{"k":"p","h":"Death flow as state: pause input, play effect, restore, resume. Screens (Chapter 7) host the UI; the world owns the flow."},{"k":"code","lang":"haxe","file":"Respawn.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Respawn<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> checkpoint : { x : <span class=\"c-t\">Float<\/span>, y : <span class=\"c-t\">Float<\/span> };     <span class=\"c-c\">// set at doors / level thirds<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> lives = <span class=\"c-n\">3<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> onPlayerDeath(w:<span class=\"c-t\">WorldController<\/span>) {<\/span>","<span class=\"cl\">        lives--;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (lives &lt;= <span class=\"c-n\">0<\/span>) <span class=\"c-t\">Game<\/span>.me.events.gameOver();<\/span>","<span class=\"cl\">        <span class=\"c-k\">else<\/span> {<\/span>","<span class=\"cl\">            w.entities = w.entities.filter(e -&gt; !e.isPlayer() &amp;&amp; !e.kindTransient);<\/span>","<span class=\"cl\">            <span class=\"c-t\">LevelFactory<\/span>.build(w, w.lastLevelData);   <span class=\"c-c\">// fresh entities, fresh gems<\/span><\/span>","<span class=\"cl\">            checkpointRestore(w);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Respawn {\n    var checkpoint : { x : Float, y : Float };     // set at doors / level thirds\n    var lives = 3;\n\n    public function onPlayerDeath(w:WorldController) {\n        lives--;\n        if (lives <= 0) Game.me.events.gameOver();\n        else {\n            w.entities = w.entities.filter(e -> !e.isPlayer() && !e.kindTransient);\n            LevelFactory.build(w, w.lastLevelData);   // fresh entities, fresh gems\n            checkpointRestore(w);\n        }\n    }\n}"},{"k":"ul","i":["Respawn policy (\"keep collected gems or not?\") is a design decision — make it a named constant with a comment, not an accident."]},{"k":"best","t":"Checkpoint = a spawn point plus a save point","h":"The same checkpoint data drives respawn and the save system (Chapter 7) — define it once in LevelData."}],"src":"07_ch06.txt:353","n":149},{"ch":7,"kind":"content","title":"The Game Camera: Follow and Dead Zones","tt":"The Game Camera: Follow and Dead Zones","blocks":[{"k":"p","h":"The camera is a character: it has intent (follow), patience (dead zone) and moods (locks, shake — next slide)."},{"k":"code","lang":"haxe","file":"Camera.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Camera<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> x = <span class=\"c-n\">0.0<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> y = <span class=\"c-n\">0.0<\/span>;          <span class=\"c-c\">// top-left of view<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> deadZone = <span class=\"c-n\">90.0<\/span>;                     <span class=\"c-c\">// px box where camera waits<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> speed = <span class=\"c-n\">6.0<\/span>;                         <span class=\"c-c\">// follow stiffness<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> follow(px:<span class=\"c-t\">Float<\/span>, py:<span class=\"c-t\">Float<\/span>, dt:<span class=\"c-t\">Float<\/span>, s2d:h2d.<span class=\"c-t\">Scene<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> vw = s2d.width, vh = s2d.height;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> cx = x + vw / <span class=\"c-n\">2<\/span>, cy = y + vh / <span class=\"c-n\">2<\/span>;     <span class=\"c-c\">// current view center<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> tx = px, ty = py;                        <span class=\"c-c\">// desired center = player<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> dx = tx - cx, dy = ty - cy;<\/span>","<span class=\"cl\">        <span class=\"c-c\">// DEAD ZONE: hold while the player stays inside the box<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (<span class=\"c-t\">Math<\/span>.abs(dx) &gt; deadZone) tx = cx + <span class=\"c-t\">Math<\/span>.sign(dx) * deadZone; <span class=\"c-k\">else<\/span> tx = cx;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (<span class=\"c-t\">Math<\/span>.abs(dy) &gt; deadZone) ty = cy + <span class=\"c-t\">Math<\/span>.sign(dy) * deadZone; <span class=\"c-k\">else<\/span> ty = cy;<\/span>","<span class=\"cl\">        <span class=\"c-c\">// Smooth approach — frame-rate independent (Ch. 8 derives this)<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> k = <span class=\"c-n\">1<\/span> - <span class=\"c-t\">Math<\/span>.exp(<span class=\"c-f\">-speed<\/span> * dt);<\/span>","<span class=\"cl\">        x += (tx - vw / <span class=\"c-n\">2<\/span> - x) * k;<\/span>","<span class=\"cl\">        y += (ty - vh / <span class=\"c-n\">2<\/span> - y) * k;<\/span>","<span class=\"cl\">        clampToWorld();<\/span>","<span class=\"cl\">        s2d.cameraX = x; s2d.cameraY = y;           <span class=\"c-c\">// ← the actual Heaps hookup<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Camera {\n    public var x = 0.0; public var y = 0.0;          // top-left of view\n    public var deadZone = 90.0;                     // px box where camera waits\n    public var speed = 6.0;                         // follow stiffness\n\n    public function follow(px:Float, py:Float, dt:Float, s2d:h2d.Scene) {\n        final vw = s2d.width, vh = s2d.height;\n        final cx = x + vw / 2, cy = y + vh / 2;     // current view center\n        var tx = px, ty = py;                        // desired center = player\n        final dx = tx - cx, dy = ty - cy;\n        // DEAD ZONE: hold while the player stays inside the box\n        if (Math.abs(dx) > deadZone) tx = cx + Math.sign(dx) * deadZone; else tx = cx;\n        if (Math.abs(dy) > deadZone) ty = cy + Math.sign(dy) * deadZone; else ty = cy;\n        // Smooth approach — frame-rate independent (Ch. 8 derives this)\n        final k = 1 - Math.exp(-speed * dt);\n        x += (tx - vw / 2 - x) * k;\n        y += (ty - vh / 2 - y) * k;\n        clampToWorld();\n        s2d.cameraX = x; s2d.cameraY = y;           // ← the actual Heaps hookup\n    }\n}"},{"k":"ul","i":["<code>s2d.cameraX/cameraY<\/code> (Chapter 3) is the whole integration — the rest is policy."]},{"k":"pit","t":"Camera chasing dt directly","h":"<code>x += (tx-x) <em> speed <\/em> dt<\/code> changes stiffness with framerate. Use the exp form (<code>1 - exp(-k*dt)<\/code>) — Chapter 8 derives it properly."}],"src":"07_ch06.txt:381","n":150},{"ch":7,"kind":"content","title":"Camera Locks, Bounds and Shake","tt":"Camera Locks, Bounds and Shake","blocks":[{"k":"p","h":"Three production camera behaviors, each ~10 lines."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// 1. LOCKS — sections where the camera pins (boss rooms, tutorials)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">var<\/span> lockX : <span class=\"c-t\">Null<\/span>&lt;<span class=\"c-t\">Float<\/span>&gt; = <span class=\"c-k\">null<\/span>;   <span class=\"c-c\">// set by trigger entities (sensors)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">if<\/span> (lockX != <span class=\"c-k\">null<\/span>) x = lockX - vw / <span class=\"c-n\">2<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// 2. BOUNDS — never show outside the level (clampToWorld above)<\/span><\/span>","<span class=\"cl\">x = clamp(x, <span class=\"c-n\">0<\/span>, levelPixelW - vw);<\/span>","<span class=\"cl\">y = clamp(y, <span class=\"c-n\">0<\/span>, levelPixelH - vh);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// 3. SHAKE — trauma model: decays, uses noise, never adds directly<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">var<\/span> trauma = <span class=\"c-n\">0.0<\/span>;                                  <span class=\"c-c\">// 0..1<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> addShake(amount) trauma = <span class=\"c-t\">Math<\/span>.min(<span class=\"c-n\">1<\/span>, trauma + amount);<\/span>","<span class=\"cl\"><span class=\"c-k\">function<\/span> shakeTick(dt) {<\/span>","<span class=\"cl\">    trauma = <span class=\"c-t\">Math<\/span>.max(<span class=\"c-n\">0<\/span>, trauma - <span class=\"c-n\">1.6<\/span> * dt);       <span class=\"c-c\">// linear decay<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> s = trauma * trauma * <span class=\"c-n\">14<\/span>;                 <span class=\"c-c\">// quadratic: small hits stay small<\/span><\/span>","<span class=\"cl\">    s2d.cameraX = x + (<span class=\"c-t\">Math<\/span>.random() * <span class=\"c-n\">2<\/span> - <span class=\"c-n\">1<\/span>) * s;<\/span>","<span class=\"cl\">    s2d.cameraY = y + (<span class=\"c-t\">Math<\/span>.random() * <span class=\"c-n\">2<\/span> - <span class=\"c-n\">1<\/span>) * s;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"// 1. LOCKS — sections where the camera pins (boss rooms, tutorials)\nvar lockX : Null<Float> = null;   // set by trigger entities (sensors)\nif (lockX != null) x = lockX - vw / 2;\n\n// 2. BOUNDS — never show outside the level (clampToWorld above)\nx = clamp(x, 0, levelPixelW - vw);\ny = clamp(y, 0, levelPixelH - vh);\n\n// 3. SHAKE — trauma model: decays, uses noise, never adds directly\nvar trauma = 0.0;                                  // 0..1\npublic function addShake(amount) trauma = Math.min(1, trauma + amount);\nfunction shakeTick(dt) {\n    trauma = Math.max(0, trauma - 1.6 * dt);       // linear decay\n    final s = trauma * trauma * 14;                 // quadratic: small hits stay small\n    s2d.cameraX = x + (Math.random() * 2 - 1) * s;\n    s2d.cameraY = y + (Math.random() * 2 - 1) * s;\n}"},{"k":"ul","i":["Trauma model (credit: Squirrel Eiserloh's GDC talk) makes every shake source additive without tuning each pair."]},{"k":"best","t":"Add trauma, not offsets","h":"Five simultaneous <code>shake(3)<\/code> calls become one strong shake instead of five stacked offsets that vomit the camera off-level."}],"src":"07_ch06.txt:405","n":151},{"ch":7,"kind":"content","title":"Project: The Playable Vertical Slice","tt":"Project: The Playable Vertical Slice","blocks":[{"k":"p","h":"Chapter 6's exit: a Cavern Run you can actually lose."},{"k":"ul","i":["Player moves with coyote time, buffering and variable jump height; sweeps tiles in two axes.","Bats patrol/notice/chase; gems collect with magnet radius; spikes and pits damage; i-frames flash.","Lives → respawn at checkpoint → game over screen stub (Chapter 7 makes it real).","Camera: dead-zone follow, world bounds, trauma shake on damage."]},{"k":"best","t":"Vertical slice = tune everything here","h":"All numbers (gravity 1900, jump 620, dead zone 90) are now in one <code>Tuning.hx<\/code>. Two hours of tuning this file is the difference between \"tech demo\" and \"game\"."}],"src":"07_ch06.txt:413","n":152},{"ch":7,"kind":"content","title":"Chapter 6 Checklist","tt":"Chapter 6 Checklist","blocks":[{"k":"ul","i":["Two-phase collision pipeline runs: grid broad phase, AABB/circle narrow phase.","Tile sweep resolves X then Y; one-way platforms and sensors behave.","Interaction rules centralized in one switch — no collision code in views.","Health with i-frames; death → respawn → game-over flow works.","Camera uses dead zones, world bounds, locks and trauma shake.","Everything above is fixed-step deterministic (Chapter 2 accumulator)."]}],"src":"07_ch06.txt:421","n":153},{"ch":8,"kind":"chapter","title":"Game States, Screens &amp; the UI Framework","tt":"Game States, Screens & the UI Framework","sub":"Title, settings, gameplay, pause — a screen system on top of Flow, skins, focus, localization and bulletproof saves.","blocks":[],"src":"08_ch07.txt:1","n":154},{"ch":8,"kind":"content","title":"Why Game State Management?","tt":"Why Game State Management?","blocks":[{"k":"p","h":"Every game is secretly several applications sharing one window: title screen, settings, playing, paused, game over. Without a management pattern, they tangle into <code>if (state == TITLE &amp;&amp; !paused)<\/code> soup."},{"k":"ul","i":["<b>States as classes<\/b> (<code>TitleScreen<\/code>, <code>PlayScreen<\/code>) own their objects, input handling and update logic.","A <b>manager<\/b> owns transitions, input routing and update order — one place, one policy.","UI is layered on top: widgets (Flow), skins (looks), focus (keyboard/gamepad) — this chapter builds all three."]},{"k":"pit","t":"The boolean fog","h":"<code>paused<\/code>, <code>inMenu<\/code>, <code>isGameOver<\/code>, <code>loading<\/code> — four bools are 16 states, of which 12 are nonsense. A typed state machine forbids nonsense at compile time."}],"src":"08_ch07.txt:10","n":155},{"ch":8,"kind":"content","title":"The Screen Interface: Design","tt":"The Screen Interface: Design","blocks":[{"k":"p","h":"Every screen answers the same five questions. The interface is deliberately tiny — it fits in your head."},{"k":"code","lang":"haxe","file":"Screen.hx","lines":["<span class=\"cl\"><span class=\"c-k\">interface<\/span> <span class=\"c-t\">Screen<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> root(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : h2d.<span class=\"c-t\">Object<\/span>;   <span class=\"c-c\">// scene-graph container, manager re-parents it<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> enter(<span class=\"c-k\">from<\/span>:<span class=\"c-t\">Class<\/span>&lt;<span class=\"c-t\">Screen<\/span>&gt;) : <span class=\"c-t\">Void<\/span>;   <span class=\"c-c\">// build objects, subscribe, start music<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> exit(<span class=\"c-k\">to<\/span>:<span class=\"c-t\">Class<\/span>&lt;<span class=\"c-t\">Screen<\/span>&gt;) : <span class=\"c-t\">Void<\/span>;      <span class=\"c-c\">// unsubscribe; disposal policy below<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Void<\/span>;            <span class=\"c-c\">// called only while this screen is top<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> onEvent(e:hxd.<span class=\"c-t\">Event<\/span>) : <span class=\"c-t\">Bool<\/span>;        <span class=\"c-c\">// true = consumed, manager stops there<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"interface Screen {\n    var root(default, null) : h2d.Object;   // scene-graph container, manager re-parents it\n    function enter(from:Class<Screen>) : Void;   // build objects, subscribe, start music\n    function exit(to:Class<Screen>) : Void;      // unsubscribe; disposal policy below\n    function update(dt:Float) : Void;            // called only while this screen is top\n    function onEvent(e:hxd.Event) : Bool;        // true = consumed, manager stops there\n}"},{"k":"ul","i":["<code>root<\/code> is added/removed from <code>s2d<\/code> by the manager — screens never touch the scene directly.","<code>onEvent<\/code> returning <code>true<\/code> implements input capture: pause menus swallow Escape, the game never sees it."]},{"k":"best","t":"Screens are cheap objects, not singletons","h":"<code>new SettingsScreen()<\/code> per visit keeps screens stateless between visits; \"remember scroll position\" is explicit data, not leftover fields."}],"src":"08_ch07.txt:25","n":156},{"ch":8,"kind":"content","title":"The Screen Manager: Implementation","tt":"The Screen Manager: Implementation","blocks":[{"k":"p","h":"Thirty lines that own the transition pipeline — the heart of Cavern Run's flow."},{"k":"code","lang":"haxe","file":"ScreenManager.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">ScreenManager<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> game : <span class=\"c-t\">Game<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> current : <span class=\"c-t\">Screen<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> transitioning = <span class=\"c-k\">false<\/span>;             <span class=\"c-c\">// modal flag (Ch. 9 builds on it)<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(game) <span class=\"c-k\">this<\/span>.game = game;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> show(next:<span class=\"c-t\">Screen<\/span>, ?transition:<span class=\"c-t\">Transition<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> old = current;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (old != <span class=\"c-k\">null<\/span>) {<\/span>","<span class=\"cl\">            old.exit(<span class=\"c-t\">Type<\/span>.getClass(next));<\/span>","<span class=\"cl\">            old.root.remove();<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        current = next;<\/span>","<span class=\"cl\">        game.s2d.addChild(next.root);<\/span>","<span class=\"cl\">        next.enter(old == <span class=\"c-k\">null<\/span> ? <span class=\"c-k\">null<\/span> : <span class=\"c-t\">Type<\/span>.getClass(old));<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (transition != <span class=\"c-k\">null<\/span>) transition.play(old, next);   <span class=\"c-c\">// Chapter 9<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) current.update(dt);<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> onEvent(e:hxd.<span class=\"c-t\">Event<\/span>) : <span class=\"c-t\">Bool<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> current != <span class=\"c-k\">null<\/span> &amp;&amp; current.onEvent(e);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class ScreenManager {\n    final game : Game;\n    var current : Screen;\n    public var transitioning = false;             // modal flag (Ch. 9 builds on it)\n\n    public function new(game) this.game = game;\n\n    public function show(next:Screen, ?transition:Transition) {\n        final old = current;\n        if (old != null) {\n            old.exit(Type.getClass(next));\n            old.root.remove();\n        }\n        current = next;\n        game.s2d.addChild(next.root);\n        next.enter(old == null ? null : Type.getClass(old));\n        if (transition != null) transition.play(old, next);   // Chapter 9\n    }\n\n    public function update(dt:Float) current.update(dt);\n    public function onEvent(e:hxd.Event) : Bool\n        return current != null && current.onEvent(e);\n}"},{"k":"ul","i":["The manager owns <b>one<\/b> current screen; stacks (pause-over-play) are Chapter 9's layered extension.","Update order stays honest: screens update in <code>Game.update<\/code> <em>before<\/em> the world (Chapter 4's diagram)."]}],"src":"08_ch07.txt:55","n":157},{"ch":8,"kind":"content","title":"Screen Stack vs Graph Navigation","tt":"Screen Stack vs Graph Navigation","blocks":[{"k":"p","h":"Two navigation models, one choice per project."},{"k":"table","head":["Model","Mechanism","Best for"],"rows":[["Graph (manager above)","<code>show()<\/code> swaps current","linear flows (title → game → game over)"],["Stack","push/pop overlays","pause menus, dialogs, inventory over gameplay"]]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// Stack extension — pause is a pushed overlay, gameplay keeps rendering under it:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">function<\/span> pause() { stack.push(<span class=\"c-k\">new<\/span> <span class=\"c-t\">PauseScreen<\/span>()); s2d.addChild(stack.last().root); }<\/span>","<span class=\"cl\"><span class=\"c-k\">function<\/span> unpause() { <span class=\"c-k\">final<\/span> s = stack.pop(); s.exit(<span class=\"c-k\">null<\/span>); s.root.remove(); }<\/span>","<span class=\"cl\"><span class=\"c-k\">function<\/span> update(dt) <span class=\"c-k\">for<\/span> (s in stack) s.update(s == stack.last() ? dt : <span class=\"c-n\">0<\/span>);  <span class=\"c-c\">// only top gets time<\/span><\/span>"],"raw":"// Stack extension — pause is a pushed overlay, gameplay keeps rendering under it:\nfunction pause() { stack.push(new PauseScreen()); s2d.addChild(stack.last().root); }\nfunction unpause() { final s = stack.pop(); s.exit(null); s.root.remove(); }\nfunction update(dt) for (s in stack) s.update(s == stack.last() ? dt : 0);  // only top gets time"},{"k":"ul","i":["Rule of the stack: only the <b>top<\/b> receives input and update; everything below is a frozen picture."]},{"k":"best","t":"Pause = pushed screen, not a bool","h":"With pause-as-screen, the pause menu gets the whole screen toolkit (focus, transitions, sounds) for free and gameplay code stays ignorant of pausing."}],"src":"08_ch07.txt:71","n":158},{"ch":8,"kind":"content","title":"Passing Data Between Screens","tt":"Passing Data Between Screens","blocks":[{"k":"p","h":"Screens must talk: play → game over needs the run's score; settings → everywhere needs the config. Two sanctioned channels only."},{"k":"ul","i":["<b>Constructor injection<\/b> for the one-shot flow: <code>new GameOverScreen(run.score, run.gems)<\/code> — explicit, typed, no globals.","<b>Services for ambient state<\/b>: <code>Game.me.settings<\/code>, <code>Game.me.save<\/code> — long-lived, read by many, written rarely."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\">manager.show(<span class=\"c-k\">new<\/span> <span class=\"c-t\">GameOverScreen<\/span>(score, timeSec));   <span class=\"c-c\">// data in via constructor<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\">// GameOverScreen buttons:<\/span><\/span>","<span class=\"cl\">onRetry = () -&gt; manager.show(<span class=\"c-k\">new<\/span> <span class=\"c-t\">PlayScreen<\/span>(levelId));   <span class=\"c-c\">// and out via callbacks<\/span><\/span>"],"raw":"manager.show(new GameOverScreen(score, timeSec));   // data in via constructor\n// GameOverScreen buttons:\nonRetry = () -> manager.show(new PlayScreen(levelId));   // and out via callbacks"},{"k":"pit","t":"Reading gameplay internals from the title screen","h":"If <code>TitleScreen<\/code> greps into <code>world.player.hp<\/code>, recompile breaks every screen. Screens receive plain data (typedefs) — the same discipline as Chapter 4's model/view split."}],"src":"08_ch07.txt:82","n":159},{"ch":8,"kind":"content","title":"UI Architecture: The Widget Stack","tt":"UI Architecture: The Widget Stack","blocks":[{"k":"p","h":"Chapter 7's UI framework in one diagram — each layer is this chapter's next topic."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">Widgets (Button, Label, Panel, List…)     behavior + state      ← Flow-based<\/span>","<span class=\"cl\">    ▲ uses<\/span>","<span class=\"cl\">Layout engine (h2d.Flow)                  position + size       ← Ch. 3 revisited<\/span>","<span class=\"cl\">    ▲ styled by<\/span>","<span class=\"cl\">Skins (theme atlas + ScaleGrid)           visuals               ← one Skin class<\/span>","<span class=\"cl\">    ▲ driven by<\/span>","<span class=\"cl\">Focus &amp; navigation (keyboard/pad)         selection             ← Focus manager<\/span>","<span class=\"cl\">    ▲ routed from<\/span>","<span class=\"cl\">Input (Chapter 2 actions)                 events                ← Input manager<\/span>"],"raw":"Widgets (Button, Label, Panel, List…)     behavior + state      ← Flow-based\n    ▲ uses\nLayout engine (h2d.Flow)                  position + size       ← Ch. 3 revisited\n    ▲ styled by\nSkins (theme atlas + ScaleGrid)           visuals               ← one Skin class\n    ▲ driven by\nFocus & navigation (keyboard/pad)         selection             ← Focus manager\n    ▲ routed from\nInput (Chapter 2 actions)                 events                ← Input manager"},{"k":"ul","i":["The same five layers describe desktop game UI, console UI and mobile UI — only the routing differs."]}],"src":"08_ch07.txt:97","n":160},{"ch":8,"kind":"content","title":"Layout: The Flow Engine in Practice","tt":"Layout: The Flow Engine in Practice","blocks":[{"k":"p","h":"Chapter 3 introduced Flow; now use it as a real layout engine — dialogs, menus, HUD bars."},{"k":"code","lang":"haxe","file":"DialogLayout.hx","lines":["<span class=\"cl\"><span class=\"c-k\">function<\/span> makeDialog() {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> box = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Flow<\/span>(s2d);<\/span>","<span class=\"cl\">    box.vertical = <span class=\"c-k\">true<\/span>;                       <span class=\"c-c\">// top→bottom<\/span><\/span>","<span class=\"cl\">    box.spacing = <span class=\"c-n\">14<\/span>;<\/span>","<span class=\"cl\">    box.padding = <span class=\"c-n\">22<\/span>;<\/span>","<span class=\"cl\">    box.backgroundTile = skin.panel();         <span class=\"c-c\">// 9-slice (Ch. 3) as background!<\/span><\/span>","<span class=\"cl\">    box.maxWidth = <span class=\"c-n\">420<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> title = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Text<\/span>(skin.font, box);<\/span>","<span class=\"cl\">    title.text = <span class=\"c-s\">\"PAUSED\"<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> row = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Flow<\/span>(box);             <span class=\"c-c\">// nested: a row inside the column<\/span><\/span>","<span class=\"cl\">    row.horizontal = <span class=\"c-k\">true<\/span>;<\/span>","<span class=\"cl\">    row.spacing = <span class=\"c-n\">10<\/span>;<\/span>","<span class=\"cl\">    row.verticalAlign = h2d.<span class=\"c-t\">Flow<\/span>.<span class=\"c-t\">FlowAlign<\/span>.<span class=\"c-t\">Middle<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">for<\/span> (label in [<span class=\"c-s\">\"Resume\"<\/span>, <span class=\"c-s\">\"Restart\"<\/span>, <span class=\"c-s\">\"Quit\"<\/span>]) row.addChild(<span class=\"c-k\">new<\/span> <span class=\"c-t\">Button<\/span>(skin, label).root);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    box.reflow();                              <span class=\"c-c\">// force layout NOW (before measuring)<\/span><\/span>","<span class=\"cl\">    box.x = (s2d.width - box.outerWidth) / <span class=\"c-n\">2<\/span>;  <span class=\"c-c\">// center using measured size<\/span><\/span>","<span class=\"cl\">    box.y = (s2d.height - box.outerHeight) / <span class=\"c-n\">2<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"function makeDialog() {\n    final box = new h2d.Flow(s2d);\n    box.vertical = true;                       // top→bottom\n    box.spacing = 14;\n    box.padding = 22;\n    box.backgroundTile = skin.panel();         // 9-slice (Ch. 3) as background!\n    box.maxWidth = 420;\n\n    final title = new h2d.Text(skin.font, box);\n    title.text = \"PAUSED\";\n\n    final row = new h2d.Flow(box);             // nested: a row inside the column\n    row.horizontal = true;\n    row.spacing = 10;\n    row.verticalAlign = h2d.Flow.FlowAlign.Middle;\n    for (label in [\"Resume\", \"Restart\", \"Quit\"]) row.addChild(new Button(skin, label).root);\n\n    box.reflow();                              // force layout NOW (before measuring)\n    box.x = (s2d.width - box.outerWidth) / 2;  // center using measured size\n    box.y = (s2d.height - box.outerHeight) / 2;\n}"},{"k":"ul","i":["<code>backgroundTile<\/code> turns any Flow into a skinned panel — ScaleGrid and Flow compose.","<code>reflow()<\/code> then <code>outerWidth/outerHeight<\/code> is the measure cycle; call it before positioning."]},{"k":"pit","t":"Positioning before reflow","h":"Flow sizes lag one update behind content changes. After dynamic content (<code>label.text = ...<\/code>), call <code>flow.reflow()<\/code> before reading measurements or you center yesterday's size."}],"src":"08_ch07.txt:126","n":161},{"ch":8,"kind":"content","title":"Building Widgets: The Button","tt":"Building Widgets: The Button","blocks":[{"k":"p","h":"The course Button = Interactive (hit) + Flow (layout) + skin (visuals) + focus (navigation). Study it; every widget is a variation."},{"k":"code","lang":"haxe","file":"Button.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Button<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">final<\/span> root : h2d.<span class=\"c-t\">Flow<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> hit : h2d.<span class=\"c-t\">Interactive<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> label : h2d.<span class=\"c-t\">Text<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> onFocus : <span class=\"c-t\">Void<\/span> -&gt; <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> onClick : () -&gt; <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(skin:<span class=\"c-t\">Skin<\/span>, text:<span class=\"c-t\">String<\/span>, ?parent) {<\/span>","<span class=\"cl\">        root = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Flow<\/span>(parent);<\/span>","<span class=\"cl\">        root.padding = <span class=\"c-n\">10<\/span>; root.spacing = <span class=\"c-n\">8<\/span>;<\/span>","<span class=\"cl\">        root.backgroundTile = skin.button();<\/span>","<span class=\"cl\">        label = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Text<\/span>(skin.font, root);<\/span>","<span class=\"cl\">        label.text = text;<\/span>","<span class=\"cl\">        hit = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Interactive<\/span>(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">0<\/span>, root);     <span class=\"c-c\">// sized after reflow (below)<\/span><\/span>","<span class=\"cl\">        root.reflow();<\/span>","<span class=\"cl\">        hit.width = root.outerWidth;               <span class=\"c-c\">// hit rect follows layout<\/span><\/span>","<span class=\"cl\">        hit.height = root.outerHeight;<\/span>","<span class=\"cl\">        hit.onClick = e -&gt; { <span class=\"c-k\">if<\/span> (onClick != <span class=\"c-k\">null<\/span>) onClick(); };<\/span>","<span class=\"cl\">        hit.onOver  = e -&gt; setFocus(<span class=\"c-k\">this<\/span>);         <span class=\"c-c\">// mouse hover moves focus (below)<\/span><\/span>","<span class=\"cl\">        hit.cursor = hxd.<span class=\"c-t\">Cursor<\/span>.<span class=\"c-t\">Button<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> setFocus(b) <span class=\"c-t\">Focus<\/span>.set(<span class=\"c-k\">this<\/span>);  <span class=\"c-c\">// focus manager hookup<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> focusChanged(on:<span class=\"c-t\">Bool<\/span>) {       <span class=\"c-c\">// called by focus manager<\/span><\/span>","<span class=\"cl\">        root.backgroundTile = on ? skin.buttonFocused() : skin.button();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Button {\n    public final root : h2d.Flow;\n    final hit : h2d.Interactive;\n    final label : h2d.Text;\n    public var onFocus : Void -> Void;\n    public var onClick : () -> Void;\n\n    public function new(skin:Skin, text:String, ?parent) {\n        root = new h2d.Flow(parent);\n        root.padding = 10; root.spacing = 8;\n        root.backgroundTile = skin.button();\n        label = new h2d.Text(skin.font, root);\n        label.text = text;\n        hit = new h2d.Interactive(0, 0, root);     // sized after reflow (below)\n        root.reflow();\n        hit.width = root.outerWidth;               // hit rect follows layout\n        hit.height = root.outerHeight;\n        hit.onClick = e -> { if (onClick != null) onClick(); };\n        hit.onOver  = e -> setFocus(this);         // mouse hover moves focus (below)\n        hit.cursor = hxd.Cursor.Button;\n    }\n    public function setFocus(b) Focus.set(this);  // focus manager hookup\n    public function focusChanged(on:Bool) {       // called by focus manager\n        root.backgroundTile = on ? skin.buttonFocused() : skin.button();\n    }\n}"},{"k":"ul","i":["One class, three input modalities: mouse (Interactive), keyboard (focus), gamepad (focus) — nothing duplicated."]},{"k":"best","t":"Widgets own their hit rectangles' lifecycle","h":"Resize content → <code>reflow()<\/code> → resize Interactive. A widget class where hit and visuals can drift is a widget that ships dead zones."}],"src":"08_ch07.txt:159","n":162},{"ch":8,"kind":"content","title":"Focus and Keyboard Navigation","tt":"Focus and Keyboard Navigation","blocks":[{"k":"p","h":"Console certification lives or dies on focus; desktop players expect it too. A focus manager is ~60 lines."},{"k":"code","lang":"haxe","file":"Focus.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Focus<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> widgets : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Focusable<\/span>&gt; = [];    <span class=\"c-c\">// per screen, rebuilt on enter<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> current(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">Int<\/span> = -<span class=\"c-n\">1<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> set(w:<span class=\"c-t\">Focusable<\/span>)<\/span>","<span class=\"cl\">        { current = widgets.indexOf(w); notify(); }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> move(dir:<span class=\"c-t\">Int<\/span>) {          <span class=\"c-c\">// dir: -1 up/left, +1 down/right<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (widgets.length == <span class=\"c-n\">0<\/span>) <span class=\"c-k\">return<\/span>;<\/span>","<span class=\"cl\">        current = (current + dir + widgets.length) % widgets.length;<\/span>","<span class=\"cl\">        notify();<\/span>","<span class=\"cl\">        <span class=\"c-t\">Sfx<\/span>.play(<span class=\"c-t\">Res<\/span>.snd.ui_move);                  <span class=\"c-c\">// audio feedback is not optional<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> press()                  <span class=\"c-c\">// A / Enter / Space<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (current &gt;= <span class=\"c-n\">0<\/span>) widgets[current].activate();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> notify()<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (i =&gt; w in widgets) w.focusChanged(i == current);<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">interface<\/span> <span class=\"c-t\">Focusable<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> focusChanged(on:<span class=\"c-t\">Bool<\/span>) : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> activate() : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Focus {\n    static var widgets : Array<Focusable> = [];    // per screen, rebuilt on enter\n    public static var current(default, null) : Int = -1;\n\n    public static function set(w:Focusable)\n        { current = widgets.indexOf(w); notify(); }\n\n    public static function move(dir:Int) {          // dir: -1 up/left, +1 down/right\n        if (widgets.length == 0) return;\n        current = (current + dir + widgets.length) % widgets.length;\n        notify();\n        Sfx.play(Res.snd.ui_move);                  // audio feedback is not optional\n    }\n    public static function press()                  // A / Enter / Space\n        if (current >= 0) widgets[current].activate();\n\n    public static function notify()\n        for (i => w in widgets) w.focusChanged(i == current);\n}\ninterface Focusable {\n    function focusChanged(on:Bool) : Void;\n    function activate() : Void;\n}"},{"k":"ul","i":["The screen routes <code>Input.pressed(Jump) → Focus.press()<\/code>, <code>Left/Right → Focus.move(±1)<\/code>."]},{"k":"best","t":"Focus follows spatial layout, not creation order","h":"For grids, pick the nearest widget in the movement direction (compute centers). The wrap-around fallback keeps odd layouts usable."}],"src":"08_ch07.txt:189","n":163},{"ch":8,"kind":"content","title":"Skins and Theming: Design","tt":"Skins and Theming: Design","blocks":[{"k":"p","h":"Skin = one atlas page + palette + metrics. The whole game's look swaps by changing the skin object — the point of the separation."},{"k":"code","lang":"haxe","file":"Skin.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Skin<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">final<\/span> atlas : <span class=\"c-t\">Atlas<\/span>;                    <span class=\"c-c\">// Chapter 5<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">final<\/span> font : h2d.<span class=\"c-t\">Font<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">final<\/span> palette : { accent : <span class=\"c-t\">Int<\/span>, text : <span class=\"c-t\">Int<\/span>, dim : <span class=\"c-t\">Int<\/span> };<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">final<\/span> metrics : { gap : <span class=\"c-t\">Int<\/span>, pad : <span class=\"c-t\">Int<\/span>, minButton : <span class=\"c-t\">Int<\/span> };<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(atlas, font) { <span class=\"c-k\">this<\/span>.atlas = atlas; <span class=\"c-k\">this<\/span>.font = font; }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> panel() : h2d.<span class=\"c-t\">Tile<\/span>     <span class=\"c-c\">// 9-slice-able tile<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> atlas.get(<span class=\"c-s\">\"panel\"<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> button() <span class=\"c-k\">return<\/span> atlas.get(<span class=\"c-s\">\"btn_up\"<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> buttonFocused() <span class=\"c-k\">return<\/span> atlas.get(<span class=\"c-s\">\"btn_focus\"<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> checkbox(on:<span class=\"c-t\">Bool<\/span>) <span class=\"c-k\">return<\/span> on ? atlas.get(<span class=\"c-s\">\"check_on\"<\/span>) : atlas.get(<span class=\"c-s\">\"check_off\"<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> sliderRail() <span class=\"c-k\">return<\/span> atlas.get(<span class=\"c-s\">\"slider_rail\"<\/span>);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Skin {\n    public final atlas : Atlas;                    // Chapter 5\n    public final font : h2d.Font;\n    public final palette : { accent : Int, text : Int, dim : Int };\n    public final metrics : { gap : Int, pad : Int, minButton : Int };\n\n    public function new(atlas, font) { this.atlas = atlas; this.font = font; }\n\n    public function panel() : h2d.Tile     // 9-slice-able tile\n        return atlas.get(\"panel\");\n    public function button() return atlas.get(\"btn_up\");\n    public function buttonFocused() return atlas.get(\"btn_focus\");\n    public function checkbox(on:Bool) return on ? atlas.get(\"check_on\") : atlas.get(\"check_off\");\n    public function sliderRail() return atlas.get(\"slider_rail\");\n}"},{"k":"ul","i":["Widgets ask the skin; they never hardcode atlas names — one rename updates everything."]},{"k":"best","t":"Ship one \"fake theme\" for free","h":"Implement <code>DebugSkin<\/code> (flat colors via <code>Tile.fromColor<\/code>) alongside the real one. Screens develop before art exists, and UI layout bugs are visible without art noise."}],"src":"08_ch07.txt:211","n":164},{"ch":8,"kind":"content","title":"Widget Tour: Checkbox, Slider, List","tt":"Widget Tour: Checkbox, Slider, List","blocks":[{"k":"p","h":"The rest of the toolkit, briefly — each is a Flow + Interactive + state, same as Button."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// CHECKBOX — click toggles `on`, skin swaps tile<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> cb = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Checkbox<\/span>(skin, <span class=\"c-s\">\"Fullscreen\"<\/span>, settings.fullscreen);<\/span>","<span class=\"cl\">cb.onChange = on -&gt; settings.fullscreen = on;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// SLIDER — drag maps to 0..1 (Ch. 12's drag pattern, reused)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> vol = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Slider<\/span>(skin, settings.sfx);<\/span>","<span class=\"cl\">vol.onChange = v -&gt; { settings.sfx = v; <span class=\"c-t\">Sfx<\/span>.master = v; }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// LIST — Flow column of rows; virtualized when row count &gt; ~30 (below)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> list = <span class=\"c-k\">new<\/span> <span class=\"c-t\">SelectList<\/span>(skin, [<span class=\"c-s\">\"Cavern 1\"<\/span>, <span class=\"c-s\">\"Cavern 2\"<\/span>, <span class=\"c-s\">\"Cavern 3\"<\/span>]);<\/span>","<span class=\"cl\">list.onPick = i -&gt; manager.show(<span class=\"c-k\">new<\/span> <span class=\"c-t\">PlayScreen<\/span>(i));<\/span>"],"raw":"// CHECKBOX — click toggles `on`, skin swaps tile\nfinal cb = new Checkbox(skin, \"Fullscreen\", settings.fullscreen);\ncb.onChange = on -> settings.fullscreen = on;\n\n// SLIDER — drag maps to 0..1 (Ch. 12's drag pattern, reused)\nfinal vol = new Slider(skin, settings.sfx);\nvol.onChange = v -> { settings.sfx = v; Sfx.master = v; }\n\n// LIST — Flow column of rows; virtualized when row count > ~30 (below)\nfinal list = new SelectList(skin, [\"Cavern 1\", \"Cavern 2\", \"Cavern 3\"]);\nlist.onPick = i -> manager.show(new PlayScreen(i));"},{"k":"ul","i":["All three implement <code>Focusable<\/code> — navigation works without extra code per widget."]},{"k":"pit","t":"Sliders that fight the pointer","h":"Clamp drag steps and commit <code>onChange<\/code> on release only — firing every pixel makes volume settings ear-splitting and settings thrash in saves."}],"src":"08_ch07.txt:229","n":165},{"ch":8,"kind":"content","title":"Virtualized Lists for Big Data","tt":"Virtualized Lists for Big Data","blocks":[{"k":"p","h":"Level selects with 500 entries, leaderboards, inventory grids: rendering 500 Flow rows is 500 layout trees — slow. Virtualization renders only the visible window."},{"k":"code","lang":"haxe","file":"VList.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">VList<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">ROW_H<\/span> = <span class=\"c-n\">44<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> clip : h2d.<span class=\"c-t\">Flow<\/span>;                     <span class=\"c-c\">// with overflow clipping via a mask<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> pool : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Row<\/span>&gt; = [];              <span class=\"c-c\">// recycled row views<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> scrollTop = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> count = <span class=\"c-n\">0<\/span>;                      <span class=\"c-c\">// data length<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> sync() {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> first = <span class=\"c-t\">Std<\/span>.int(scrollTop / <span class=\"c-t\">ROW_H<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> visible = <span class=\"c-t\">Math<\/span>.ceil(clipHeight / <span class=\"c-t\">ROW_H<\/span>) + <span class=\"c-n\">1<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...visible) {               <span class=\"c-c\">// only ~15 rows ever exist<\/span><\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> row = pool[i];<\/span>","<span class=\"cl\">            row.bind(first + i);               <span class=\"c-c\">// fill from data source<\/span><\/span>","<span class=\"cl\">            row.root.y = (first + i) * <span class=\"c-t\">ROW_H<\/span> - <span class=\"c-t\">Std<\/span>.int(scrollTop);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class VList {\n    static final ROW_H = 44;\n    final clip : h2d.Flow;                     // with overflow clipping via a mask\n    final pool : Array<Row> = [];              // recycled row views\n    public var scrollTop = 0.0;\n    public var count = 0;                      // data length\n\n    public function sync() {\n        final first = Std.int(scrollTop / ROW_H);\n        final visible = Math.ceil(clipHeight / ROW_H) + 1;\n        for (i in 0...visible) {               // only ~15 rows ever exist\n            final row = pool[i];\n            row.bind(first + i);               // fill from data source\n            row.root.y = (first + i) * ROW_H - Std.int(scrollTop);\n        }\n    }\n}"},{"k":"ul","i":["The pool is fixed-size (visible + 1); scrolling rebinds data into recycled rows.","Wheel events translate to <code>scrollTop<\/code>; <code>onEvent<\/code> returns true to eat the wheel when the list can scroll."]},{"k":"best","t":"Virtualize at 30 rows, not 30,000","h":"Layout cost is superlinear; players feel 60 FPS → 45 FPS in scrolling menus long before crashes. The pattern is 80 lines — adopt it as the default list."}],"src":"08_ch07.txt:254","n":166},{"ch":8,"kind":"content","title":"Dialogs, Modals and the Scrim","tt":"Dialogs, Modals and the Scrim","blocks":[{"k":"p","h":"Modal dialogs = pushed screen stack entry + a dimmed input-blocking backdrop."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">function<\/span> confirm(text:<span class=\"c-t\">String<\/span>, onYes:() -&gt; <span class=\"c-t\">Void<\/span>) {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> scrim = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(<\/span>","<span class=\"cl\">        h2d.<span class=\"c-t\">Tile<\/span>.fromColor(<span class=\"c-n\">0x000000<\/span>, s2d.width, s2d.height, <span class=\"c-n\">0.6<\/span>), s2d);<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> dialog = <span class=\"c-k\">new<\/span> <span class=\"c-t\">ConfirmDialog<\/span>(skin, text, () -&gt; { onYes(); close(); }, close);<\/span>","<span class=\"cl\">    stack.push(dialog); s2d.addChild(scrim); s2d.addChild(dialog.root);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"function confirm(text:String, onYes:() -> Void) {\n    final scrim = new h2d.Bitmap(\n        h2d.Tile.fromColor(0x000000, s2d.width, s2d.height, 0.6), s2d);\n    final dialog = new ConfirmDialog(skin, text, () -> { onYes(); close(); }, close);\n    stack.push(dialog); s2d.addChild(scrim); s2d.addChild(dialog.root);\n}"},{"k":"ul","i":["The scrim <b>must<\/b> participate in input blocking: attach an Interactive over it that cancels events (<code>e.cancel = true<\/code>) — visuals alone leak clicks to the game below."]},{"k":"best","t":"Modal = screen stack entry, always","h":"Even a two-button confirm. It inherits focus management, transitions and input capture; bespoke \"just this once\" dialogs never quite block everything."}],"src":"08_ch07.txt:267","n":167},{"ch":8,"kind":"content","title":"Text, Localization-Ready Labels","tt":"Text, Localization-Ready Labels","blocks":[{"k":"p","h":"String hygiene now saves a localization sprint later — even if you never translate."},{"k":"code","lang":"haxe","file":"Strings.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Strings<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> table : <span class=\"c-t\">Map<\/span>&lt;<span class=\"c-t\">String<\/span>, <span class=\"c-t\">String<\/span>&gt; = [<\
