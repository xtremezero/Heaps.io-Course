s":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Main<\/span> <span class=\"c-k\">extends<\/span> hxd.<span class=\"c-t\">App<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-c\">// --- what you inherit (the important fields) ---<\/span><\/span>","<span class=\"cl\">    <span class=\"c-c\">// s2d      : h2d.Scene   2D root (Chapter 3)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-c\">// s3d      : h3d.scene.Scene   3D root (Chapter 14)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-c\">// sevents  : hxd.SceneEvents   dispatches pointer/key events<\/span><\/span>","<span class=\"cl\">    <span class=\"c-c\">// engine   : h3d.Engine        low-level renderer singleton<\/span><\/span>","<span class=\"cl\">    <span class=\"c-c\">// ini      : AppConfig         startup configuration<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> init() {}              <span class=\"c-c\">// once, after engine + scenes exist<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {}    <span class=\"c-c\">// every frame, dt in seconds<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> onResize() {}          <span class=\"c-c\">// window resized / rotated<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Main extends hxd.App {\n    // --- what you inherit (the important fields) ---\n    // s2d      : h2d.Scene   2D root (Chapter 3)\n    // s3d      : h3d.scene.Scene   3D root (Chapter 14)\n    // sevents  : hxd.SceneEvents   dispatches pointer/key events\n    // engine   : h3d.Engine        low-level renderer singleton\n    // ini      : AppConfig         startup configuration\n\n    override function init() {}              // once, after engine + scenes exist\n    override function update(dt:Float) {}    // every frame, dt in seconds\n    override function onResize() {}          // window resized / rotated\n}"},{"k":"ul","i":["Constructing the subclass (<code>new Main()<\/code>) boots the engine; never construct scenes yourself before <code>init()<\/code>.","The lifecycle callbacks are plain methods — override them, don't reinvent the loop."]},{"k":"note","h":"Many Heaps samples override <code>onKeyDown<\/code>, <code>onKeyUp<\/code>, <code>onTextInput<\/code> on <code>App<\/code> for quick tests. Real projects route through an input manager (later this chapter)."}],"src":"03_ch02.txt:43","n":38},{"ch":3,"kind":"content","title":"Lifecycle: init, update, onResize — Order and Guarantees","tt":"Lifecycle: init, update, onResize — Order and Guarantees","blocks":[{"k":"p","h":"Reasoning about callbacks requires knowing exactly when each runs."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">new Main()<\/span>","<span class=\"cl\">  └─ engine init (window, driver, both scenes)<\/span>","<span class=\"cl\">       └─ App.init()            ← safe to create objects, load sync resources<\/span>","<span class=\"cl\">            └─ each frame:<\/span>","<span class=\"cl\">                 events pumped → resize? → onResize()<\/span>","<span class=\"cl\">                 update(dt)          ← your game step<\/span>","<span class=\"cl\">                 Anim/Flow/timers advanced<\/span>","<span class=\"cl\">                 render 3D, then 2D<\/span>"],"raw":"new Main()\n  └─ engine init (window, driver, both scenes)\n       └─ App.init()            ← safe to create objects, load sync resources\n            └─ each frame:\n                 events pumped → resize? → onResize()\n                 update(dt)          ← your game step\n                 Anim/Flow/timers advanced\n                 render 3D, then 2D"},{"k":"ul","i":["<b>init()<\/b> runs exactly once, after <code>s2d<\/code>/<code>s3d<\/code> exist. Loading resources, building UI, spawning the first screen: all legal here.","<b>update(dt)<\/b> may be skipped on heavy frames? No — it is called exactly once per rendered frame, with the true elapsed time.","<b>onResize()<\/b> fires after the new size is applied; read <code>s2d.width<\/code>/<code>s2d.height<\/code> or <code>engine.width<\/code>/<code>engine.height<\/code> there."]},{"k":"pit","t":"Loading in field initializers","h":"<code>var t = hxd.Res.x.toTile()<\/code> at field level can run before <code>Res.init()<\/code> — mysterious null crashes. Initialize resources inside <code>init()<\/code> or later, never in field defaults that touch <code>Res<\/code>."}],"src":"03_ch02.txt:60","n":39},{"ch":3,"kind":"content","title":"Window Events and the Resolution Strategy","tt":"Window Events and the Resolution Strategy","blocks":[{"k":"p","h":"Games do not react to resolution changes by accident — they pick a strategy. Heaps supports both mainstream options natively."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> init() {<\/span>","<span class=\"cl\">    <span class=\"c-c\">// Option A — fixed internal resolution, letterboxed, pixel-consistent art:<\/span><\/span>","<span class=\"cl\">    s2d.setFixedSize(<span class=\"c-n\">1280<\/span>, <span class=\"c-n\">720<\/span>);<\/span>","<span class=\"cl\">    <span class=\"c-c\">// engine scales the scene to the window; s2d.width stays 1280.<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-c\">// Option B — fluid: s2d matches the window (default).<\/span><\/span>","<span class=\"cl\">    <span class=\"c-c\">// UI must then respond to onResize() and scale itself.<\/span><\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> onResize() {<\/span>","<span class=\"cl\">    trace(<span class=\"c-s\">'window now ${engine.width}x${engine.height}'<\/span>);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"override function init() {\n    // Option A — fixed internal resolution, letterboxed, pixel-consistent art:\n    s2d.setFixedSize(1280, 720);\n    // engine scales the scene to the window; s2d.width stays 1280.\n\n    // Option B — fluid: s2d matches the window (default).\n    // UI must then respond to onResize() and scale itself.\n}\noverride function onResize() {\n    trace('window now ${engine.width}x${engine.height}');\n}"},{"k":"ul","i":["Fixed size (A) is right for pixel art and consistent gameplay views — Cavern Run uses it.","Fluid (B) suits UI-heavy or 3D apps; Chapter 7's layout engine does the heavy lifting there."]},{"k":"best","t":"Decide resolution strategy on day one","h":"Retrofitting a resolution strategy into a finished game re-touches every UI layout. It is a five-minute decision now or a five-day migration later."}],"src":"03_ch02.txt:79","n":40},{"ch":3,"kind":"content","title":"h3d.Engine: Width, Height, FPS and the Driver","tt":"h3d.Engine: Width, Height, FPS and the Driver","blocks":[{"k":"p","h":"<code>h3d.Engine<\/code> is the low-level heart: one per process, reachable anywhere."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> e = h3d.<span class=\"c-t\">Engine<\/span>.getCurrent();<\/span>","<span class=\"cl\">trace(e.width, e.height);   <span class=\"c-c\">// current render size in pixels<\/span><\/span>","<span class=\"cl\">trace(e.fps);               <span class=\"c-c\">// smoothed frames-per-second<\/span><\/span>","<span class=\"cl\">trace(e.driver.getDriverName()); <span class=\"c-c\">// \"OpenGL\", \"DirectX11\", \"WebGL\"...<\/span><\/span>","<span class=\"cl\">e.vsync = <span class=\"c-k\">false<\/span>;            <span class=\"c-c\">// uncap FPS for benchmarking (tears on screen)<\/span><\/span>","<span class=\"cl\">e.isFullscreen();           <span class=\"c-c\">// query fullscreen state<\/span><\/span>","<span class=\"cl\">e.setFullscreen(<span class=\"c-k\">true<\/span>);      <span class=\"c-c\">// request fullscreen (user gesture on web!)<\/span><\/span>"],"raw":"final e = h3d.Engine.getCurrent();\ntrace(e.width, e.height);   // current render size in pixels\ntrace(e.fps);               // smoothed frames-per-second\ntrace(e.driver.getDriverName()); // \"OpenGL\", \"DirectX11\", \"WebGL\"...\ne.vsync = false;            // uncap FPS for benchmarking (tears on screen)\ne.isFullscreen();           // query fullscreen state\ne.setFullscreen(true);      // request fullscreen (user gesture on web!)"},{"k":"ul","i":["You rarely call render yourself — <code>App<\/code> does — but you read <code>fps<\/code>, <code>width<\/code>, <code>height<\/code> constantly (debug HUD, adaptive quality).","On web, <code>setFullscreen<\/code> must run inside a click/keydown handler to satisfy browser gesture rules."]},{"k":"pit","t":"Reading engine.fps every frame for logic","h":"FPS is a smoothed display value. Use the <code>dt<\/code> given to <code>update()<\/code> for gameplay math; use <code>fps<\/code> only for display and heuristics."}],"src":"03_ch02.txt:94","n":41},{"ch":3,"kind":"content","title":"Delta Time: The Heartbeat of Your Game","tt":"Delta Time: The Heartbeat of Your Game","blocks":[{"k":"p","h":"<code>dt<\/code> (seconds since previous frame) is the only correct way to move anything. At 144 FPS, \"move 4px per frame\" is 2.4x faster than at 60 FPS."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Mover<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">SPEED<\/span> = <span class=\"c-n\">260.0<\/span>; <span class=\"c-c\">// pixels per SECOND<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (hxd.<span class=\"c-t\">Key<\/span>.isDown(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">LEFT<\/span>))  x -= <span class=\"c-t\">SPEED<\/span> * dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (hxd.<span class=\"c-t\">Key<\/span>.isDown(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">RIGHT<\/span>)) x += <span class=\"c-t\">SPEED<\/span> * dt;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Mover {\n    static final SPEED = 260.0; // pixels per SECOND\n    public static function update(dt:Float) {\n        if (hxd.Key.isDown(hxd.Key.LEFT))  x -= SPEED * dt;\n        if (hxd.Key.isDown(hxd.Key.RIGHT)) x += SPEED * dt;\n    }\n}"},{"k":"ul","i":["Rule: <b>any<\/b> per-frame change is <code>rate * dt<\/code>. Rotation, fades, timers, spawns — all of it.","Guard against tab-switch spikes (browsers throttle background tabs) by clamping:"]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> dt2 = dt &gt; <span class=\"c-n\">0.1<\/span> ? <span class=\"c-n\">0.1<\/span> : dt;   <span class=\"c-c\">// never simulate more than 100ms<\/span><\/span>"],"raw":"final dt2 = dt > 0.1 ? 0.1 : dt;   // never simulate more than 100ms"},{"k":"best","t":"Clamp dt, then trust it","h":"A single unclamped 3-second hitch can teleport entities through walls (Chapter 6) and freeze timers. Clamping at 50–100ms converts \"impossible bug\" into \"tiny slowdown\"."}],"src":"03_ch02.txt:112","n":42},{"ch":3,"kind":"content","title":"Framerate Management: Fixed vs Variable Timestep","tt":"Framerate Management: Fixed vs Variable Timestep","blocks":[{"k":"p","h":"There are two philosophies of simulation, and Heaps lets you implement either on top of <code>update(dt)<\/code>."},{"k":"table","head":["Approach","How","Use when"],"rows":[["Variable","<code>pos += speed * dt<\/code> everywhere","casual games, effects, camera"],["Fixed","accumulate dt, step simulation at 60 Hz, interpolate render","physics, precision platformers, replays"]]},{"k":"ul","i":["Variable is simpler and is used for most of this course's effects code.","Fixed guarantees identical behavior on every machine — mandatory once Box2D arrives (Chapter 10)."]},{"k":"code","lang":"haxe","file":"FixedStep.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">FixedStep<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">STEP<\/span> = <span class=\"c-n\">1<\/span> / <span class=\"c-n\">60<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> acc = <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> frame(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        acc += dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> guard = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">while<\/span> (acc &gt;= <span class=\"c-t\">STEP<\/span> &amp;&amp; guard++ &lt; <span class=\"c-n\">5<\/span>) {<\/span>","<span class=\"cl\">            tick(<span class=\"c-t\">STEP<\/span>);        <span class=\"c-c\">// deterministic simulation step<\/span><\/span>","<span class=\"cl\">            acc -= <span class=\"c-t\">STEP<\/span>;<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        render(acc / <span class=\"c-t\">STEP<\/span>);    <span class=\"c-c\">// interpolation alpha (0..1)<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> tick(s:<span class=\"c-t\">Float<\/span>) {} <span class=\"c-c\">// all gameplay movement<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> render(a:<span class=\"c-t\">Float<\/span>) {} <span class=\"c-c\">// draw at blended positions<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"class FixedStep {\n    static final STEP = 1 / 60;\n    static var acc = 0.0;\n    public static function frame(dt:Float) {\n        acc += dt;\n        var guard = 0;\n        while (acc >= STEP && guard++ < 5) {\n            tick(STEP);        // deterministic simulation step\n            acc -= STEP;\n        }\n        render(acc / STEP);    // interpolation alpha (0..1)\n    }\n    static function tick(s:Float) {} // all gameplay movement\n    static function render(a:Float) {} // draw at blended positions\n}"},{"k":"pit","t":"Guard the catch-up loop","h":"If the machine stalls for two seconds, an unguarded <code>while<\/code> tries 120 catch-up steps and freezes worse. The <code>guard<\/code> counter turns a spiral of death into a small time skip."}],"src":"03_ch02.txt:140","n":43},{"ch":3,"kind":"content","title":"Graphics Module in Practice: Designing for Consistency","tt":"Graphics Module in Practice: Designing for Consistency","blocks":[{"k":"p","h":"Beyond <code>setFixedSize<\/code>, a production 2D pipeline fixes three numbers on day one and never revisits them."},{"k":"ul","i":["<b>Design resolution<\/b>: 1280x720 for Cavern Run. All layouts and levels are authored against it.","<b>Zoom level<\/b>: how many design pixels per art pixel (Cavern Run: 1:1; pixel-art games often 2:1 or 3:1 with <code>s2d.zoom<\/code>).","<b>Aspect handling<\/b>: letterbox (fixed) or anchor-based stretch (fluid). Fixed size gives letterboxing for free."]},{"k":"best","t":"Author art at final size, not 4K","h":"Assets authored at the internal resolution keep atlas memory predictable (Chapter 5) and let <code>setFixedSize<\/code> do all scaling in one place — the GPU."}],"src":"03_ch02.txt:147","n":44},{"ch":3,"kind":"content","title":"Audio Module: Sound Effects vs Streaming Music","tt":"Audio Module: Sound Effects vs Streaming Music","blocks":[{"k":"p","h":"Heaps splits audio the way consoles do, because mobile and web force the distinction."},{"k":"ul","i":["<b>Sfx<\/b> — short, fully decoded in memory, many simultaneous instances: jumps, hits, UI clicks. <code>hxd.res.Sound<\/code> resources played directly.","<b>Music/ambience<\/b> — long, decoded progressively or streamed: loops, beds. One instance, low mixing overhead, slower start."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// SFX: fire and forget (resource = res/snd/jump.wav)<\/span><\/span>","<span class=\"cl\">hxd.<span class=\"c-t\">Res<\/span>.snd.jump.play();                  <span class=\"c-c\">// default volume, once<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// Music: grab the channel to control it<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">var<\/span> music = hxd.<span class=\"c-t\">Res<\/span>.snd.music.play(<span class=\"c-k\">true<\/span>); <span class=\"c-c\">// true = loop<\/span><\/span>","<span class=\"cl\">music.volume = <span class=\"c-n\">0.55<\/span>;                      <span class=\"c-c\">// master bed level<\/span><\/span>"],"raw":"// SFX: fire and forget (resource = res/snd/jump.wav)\nhxd.Res.snd.jump.play();                  // default volume, once\n\n// Music: grab the channel to control it\nvar music = hxd.Res.snd.music.play(true); // true = loop\nmusic.volume = 0.55;                      // master bed level"},{"k":"ul","i":["The same <code>hxd.res.Sound<\/code> resource type serves both; the split is about <b>usage discipline<\/b>, not API."]},{"k":"pit","t":"Decoding a 4-minute track as sfx","h":"A fully-decoded music track can cost 40+ MB of RAM on some backends. Reserve \"load fully\" for sub-second effects; stream or loop long beds."}],"src":"03_ch02.txt:162","n":45},{"ch":3,"kind":"content","title":"Playing Sound Effects Well","tt":"Playing Sound Effects Well","blocks":[{"k":"p","h":"Game-feel lives in the details of sfx playback. Three habits separate demos from products."},{"k":"code","lang":"haxe","file":"Sfx.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Sfx<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-c\">// tiny random pitch variance kills machine-gun repetition<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> play(res:hxd.res.<span class=\"c-t\">Sound<\/span>, volume = <span class=\"c-n\">1.0<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> c = res.play();<\/span>","<span class=\"cl\">        c.volume = volume;<\/span>","<span class=\"cl\">        c.position = <span class=\"c-k\">null<\/span>; <span class=\"c-c\">// see note below on 2D pitch variance<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> c;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Sfx {\n    // tiny random pitch variance kills machine-gun repetition\n    public static function play(res:hxd.res.Sound, volume = 1.0) {\n        final c = res.play();\n        c.volume = volume;\n        c.position = null; // see note below on 2D pitch variance\n        return c;\n    }\n}"},{"k":"ul","i":["<b>Pool-friendly<\/b>: fire-and-forget is fine; hold the returned channel only if you must stop it later.","<b>Vary pitch/volume<\/b> slightly per play when a sound repeats fast (footsteps, coin showers) — check your backend's channel pitch API; on targets without it, alternate 2-3 pre-pitched resource copies.","<b>Respect a master sfx volume<\/b> from settings (Chapter 7): multiply, never override."]},{"k":"best","t":"Centralize every play() call","h":"One <code>Sfx.play(name)<\/code> wrapper is where volume settings, mute-on-focus-loss and future mixing get implemented once — not pasted across 60 call sites."}],"src":"03_ch02.txt:180","n":46},{"ch":3,"kind":"content","title":"Streaming Music and Manual Fades","tt":"Streaming Music and Manual Fades","blocks":[{"k":"p","h":"Channel control gives you fades and crossfades with two lines of arithmetic."},{"k":"code","lang":"haxe","file":"Music.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Music<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> current : hxd.snd.<span class=\"c-t\">Channel<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> fade : { c : hxd.snd.<span class=\"c-t\">Channel<\/span>, <span class=\"c-k\">from<\/span> : <span class=\"c-t\">Float<\/span>, <span class=\"c-k\">to<\/span> : <span class=\"c-t\">Float<\/span>, t : <span class=\"c-t\">Float<\/span>, dur : <span class=\"c-t\">Float<\/span> };<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> play(res:hxd.res.<span class=\"c-t\">Sound<\/span>, ?fadeSec = <span class=\"c-n\">1.0<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> next = res.play(<span class=\"c-k\">true<\/span>);   <span class=\"c-c\">// loop<\/span><\/span>","<span class=\"cl\">        next.volume = fadeSec &lt;= <span class=\"c-n\">0<\/span> ? <span class=\"c-n\">1.0<\/span> : <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">        fade = { c : next, <span class=\"c-k\">from<\/span> : <span class=\"c-n\">0<\/span>, <span class=\"c-k\">to<\/span> : <span class=\"c-n\">1<\/span>, t : <span class=\"c-n\">0<\/span>, dur : fadeSec };<\/span>","<span class=\"cl\">        stopOld(fadeSec);<\/span>","<span class=\"cl\">        current = next;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (fade == <span class=\"c-k\">null<\/span>) <span class=\"c-k\">return<\/span>;<\/span>","<span class=\"cl\">        fade.t += dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> k = <span class=\"c-t\">Math<\/span>.min(<span class=\"c-n\">1<\/span>, fade.t / fade.dur);<\/span>","<span class=\"cl\">        fade.c.volume = fade.<span class=\"c-k\">from<\/span> + (fade.<span class=\"c-k\">to<\/span> - fade.<span class=\"c-k\">from<\/span>) * k; <span class=\"c-c\">// Chapter 8 lerp!<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (k &gt;= <span class=\"c-n\">1<\/span>) fade = <span class=\"c-k\">null<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Music {\n    static var current : hxd.snd.Channel;\n    static var fade : { c : hxd.snd.Channel, from : Float, to : Float, t : Float, dur : Float };\n\n    public static function play(res:hxd.res.Sound, ?fadeSec = 1.0) {\n        final next = res.play(true);   // loop\n        next.volume = fadeSec <= 0 ? 1.0 : 0.0;\n        fade = { c : next, from : 0, to : 1, t : 0, dur : fadeSec };\n        stopOld(fadeSec);\n        current = next;\n    }\n    public static function update(dt:Float) {\n        if (fade == null) return;\n        fade.t += dt;\n        final k = Math.min(1, fade.t / fade.dur);\n        fade.c.volume = fade.from + (fade.to - fade.from) * k; // Chapter 8 lerp!\n        if (k >= 1) fade = null;\n    }\n}"},{"k":"ul","i":["Manual fading is target-independent — it works identically on every backend, unlike per-backend fade helpers."]},{"k":"note","h":"Some Heaps versions expose <code>Channel.fadeTo(volume, seconds)<\/code>. If available on your pinned version it is fine; the manual approach above is version-proof and teaches the lerp pattern used everywhere else."}],"src":"03_ch02.txt:206","n":47},{"ch":3,"kind":"content","title":"Audio Pitfalls: Codecs and Autoplay Rules","tt":"Audio Pitfalls: Codecs and Autoplay Rules","blocks":[{"k":"p","h":"Audio is where \"same code, every platform\" meets the hardest browser rules."},{"k":"table","head":["Target","Safe formats","Gotcha"],"rows":[["HashLink (desktop)",".wav, .ogg","none — decode freely"],["Web (Chrome/Firefox)",".ogg, .mp3","compressed formats only for fast decode","wav via decodeAudioData works but is heavy"],["Web (Safari)",".mp3, .m4a","no ogg","decodeAudioData historically async"],["Mobile (iOS)",".mp3, .caf","silent-switch mutes everything","one user gesture unlocks audio"]]},{"k":"pit","t":"Autoplay policy: silent web build","h":"Browsers suspend <code>AudioContext<\/code> until a user gesture. Unlock on the first click/keypress (\"Press to start\" title screen) — this is why Chapter 7's title screen exists before the music does."}],"src":"03_ch02.txt:217","n":48},{"ch":3,"kind":"content","title":"Input Module: The hxd.Event System","tt":"Input Module: The hxd.Event System","blocks":[{"k":"p","h":"All pointer/touch input flows through one event class. Learn its shape once; Chapter 3's <code>Interactive<\/code> and Chapter 12's gestures both consume it."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// Global listener on the 2D scene (everything, no hit-testing):<\/span><\/span>","<span class=\"cl\">s2d.addEventListener(<span class=\"c-k\">function<\/span>(e:hxd.<span class=\"c-t\">Event<\/span>) {<\/span>","<span class=\"cl\">    <span class=\"c-k\">switch<\/span> (e.kind) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-t\">EPush<\/span>:      trace(<span class=\"c-s\">'down at ${e.relX},${e.relY}'<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-t\">ERelease<\/span>:   trace(<span class=\"c-s\">'up'<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-t\">EMove<\/span>:      <span class=\"c-c\">// hover / drag<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-t\">EWheel<\/span>:     e.wheelDelta;<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-t\">EKeyDown<\/span>:   e.keyCode;   <span class=\"c-c\">// see hxd.Key<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-t\">EKeyUp<\/span>:<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-t\">ETextInput<\/span>: e.text;<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> <span class=\"c-t\">EReleaseOutside<\/span>, <span class=\"c-t\">EOver<\/span>, <span class=\"c-t\">EOut<\/span>, <span class=\"c-t\">EClick<\/span>, <span class=\"c-t\">ECheck<\/span>:<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">});<\/span>"],"raw":"// Global listener on the 2D scene (everything, no hit-testing):\ns2d.addEventListener(function(e:hxd.Event) {\n    switch (e.kind) {\n        case EPush:      trace('down at ${e.relX},${e.relY}');\n        case ERelease:   trace('up');\n        case EMove:      // hover / drag\n        case EWheel:     e.wheelDelta;\n        case EKeyDown:   e.keyCode;   // see hxd.Key\n        case EKeyUp:\n        case ETextInput: e.text;\n        case EReleaseOutside, EOver, EOut, EClick, ECheck:\n    }\n});"},{"k":"ul","i":["<code>e.relX / e.relY<\/code> are scene coordinates (accounting for fixed-size scaling).","Touch points carry <code>e.touchId<\/code>; multi-touch = multiple events with distinct ids.","Set <code>e.cancel = true<\/code> in a global listener to stop further propagation of that event."]},{"k":"best","t":"Use global listeners for game gestures, Interactive for UI","h":"Chapter 3 shows <code>h2d.Interactive<\/code> — pointer handling with hit-testing, hover and clicks for buttons. Global listeners are for camera drags and gesture recognition (Chapter 12)."}],"src":"03_ch02.txt:239","n":49},{"ch":3,"kind":"content","title":"Keyboard: Polling with hxd.Key","tt":"Keyboard: Polling with hxd.Key","blocks":[{"k":"p","h":"For gameplay (as opposed to UI), polling reads best: \"what is held <b>right now<\/b>\"."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> held    = hxd.<span class=\"c-t\">Key<\/span>.isDown(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">RIGHT<\/span>);<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> pressed = hxd.<span class=\"c-t\">Key<\/span>.isPressed(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">SPACE<\/span>); <span class=\"c-c\">// true only on the frame it went down<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> released = hxd.<span class=\"c-t\">Key<\/span>.isReleased(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">SPACE<\/span>);<\/span>"],"raw":"final held    = hxd.Key.isDown(hxd.Key.RIGHT);\nfinal pressed = hxd.Key.isPressed(hxd.Key.SPACE); // true only on the frame it went down\nfinal released = hxd.Key.isReleased(hxd.Key.SPACE);"},{"k":"ul","i":["<code>isPressed<\/code> is frame-local — consume it in the same frame or lose it. That is ideal for jump buffering (Chapter 6).","<code>hxd.Key<\/code> constants are platform-mapped (<code>WASD<\/code>, arrows, <code>hxd.Key.MOUSEWheelUp<\/code> for the wheel as a key).","Polling + fixed timestep (this chapter) is deterministic and replay-friendly."]},{"k":"note","h":"<code>isPressed<\/code>/<code>isReleased<\/code> state is reset after each frame — read them inside <code>update()<\/code>, not inside callbacks that can run at other times."}],"src":"03_ch02.txt:251","n":50},{"ch":3,"kind":"content","title":"Keyboard: Event-Driven Input and Focus Loss","tt":"Keyboard: Event-Driven Input and Focus Loss","blocks":[{"k":"p","h":"Event callbacks (<code>App.onKeyDown<\/code>, or the global listener from two slides ago) suit menus, text fields and debug keys."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> onKeyDown(code:hxd.<span class=\"c-t\">Key<\/span>, e:hxd.<span class=\"c-t\">Event<\/span>) {<\/span>","<span class=\"cl\">    <span class=\"c-k\">switch<\/span> (code) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">ESCAPE<\/span>: togglePauseMenu();<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">F2<\/span> <span class=\"c-k\">if<\/span> (<span class=\"c-t\">Constants<\/span>.<span class=\"c-t\">DEBUG<\/span>): debugOverlay.toggle();<\/span>","<span class=\"cl\">        <span class=\"c-k\">case<\/span> _:<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"override function onKeyDown(code:hxd.Key, e:hxd.Event) {\n    switch (code) {\n        case hxd.Key.ESCAPE: togglePauseMenu();\n        case hxd.Key.F2 if (Constants.DEBUG): debugOverlay.toggle();\n        case _:\n    }\n}"},{"k":"ul","i":["On web, some keys are reserved (F5, Ctrl+W…) — design debug keys accordingly.","<b>Focus loss<\/b>: when the window loses focus, polled keys can stick. Heaps clears held keys on focus loss on most backends; still, pause the game on blur as a policy (Chapter 7's screens make this easy)."]},{"k":"pit","t":"Debug keys shipped to players","h":"Gate every <code>if (key == F2)<\/code> branch behind a debug constant that is <code>false<\/code> in release, or compile it out with <code>#if debug<\/code>."}],"src":"03_ch02.txt:266","n":51},{"ch":3,"kind":"content","title":"Mouse and Pointer Input","tt":"Mouse and Pointer Input","blocks":[{"k":"p","h":"Desktop players expect pointer polish: hover states, cursor changes, wheel zoom."},{"k":"ul","i":["For UI: <code>h2d.Interactive<\/code> (Chapter 3) — automatic hit-testing in scene coordinates.","For gameplay camera drag: a global <code>EPush<\/code>/<code>EMove<\/code>/<code>ERelease<\/code> state machine (you write it in Chapter 12 and reuse it for touch).","Wheel: <code>EWheel<\/code> events (<code>e.wheelDelta<\/code>), or <code>hxd.Key.isPressed(K.MOUSEWheelUp)<\/code>."]},{"k":"best","t":"Treat the mouse as one finger","h":"If input code says \"pointer down at x,y\", then mouse, touch and pen all feed the same logic for free. Chapter 12 formalizes this into the input router."}],"src":"03_ch02.txt:273","n":52},{"ch":3,"kind":"content","title":"Touch Input Fundamentals","tt":"Touch Input Fundamentals","blocks":[{"k":"p","h":"Everything from Chapter 12 (joysticks, gestures) reduces to these mechanics, so pin them down now."},{"k":"ul","i":["A finger down is <code>EPush<\/code>, movement <code>EMove<\/code>, lift <code>ERelease<\/code> — same kinds as the mouse.","Distinguish fingers by <code>e.touchId<\/code>; track a <code>Map&lt;Int, {x, y}&gt;<\/code> of active touches for multi-touch.","<code>e.relX/relY<\/code> are already scene-scaled — a fixed-size scene means identical coordinates on a 4-inch phone and a 4K monitor."]},{"k":"pit","t":"Hover logic on touch","h":"There is no hover on touchscreens. Any UI that only appears on hover is invisible to half your players. Always pair hover with a tap-or-press alternative (Chapter 7 applies this)."}],"src":"03_ch02.txt:280","n":53},{"ch":3,"kind":"content","title":"Gamepad: hxd.Pad","tt":"Gamepad: hxd.Pad","blocks":[{"k":"p","h":"Controllers are first-class: hot-plugging, analog axes, buttons-as-flags."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">PadInput<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> pad : hxd.<span class=\"c-t\">Pad<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>() {<\/span>","<span class=\"cl\">        hxd.<span class=\"c-t\">Pad<\/span>.waitFor(<span class=\"c-k\">function<\/span>(p) {   <span class=\"c-c\">// fires on connect (incl. at startup)<\/span><\/span>","<span class=\"cl\">            pad = p;<\/span>","<span class=\"cl\">            p.onDisconnect = () -&gt; pad = <span class=\"c-k\">null<\/span>;<\/span>","<span class=\"cl\">        });<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> axis() {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (pad == <span class=\"c-k\">null<\/span>) <span class=\"c-k\">return<\/span> <span class=\"c-n\">0.0<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> x = pad.xAxis;                    <span class=\"c-c\">// -1..1, deadzone not applied<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-t\">Math<\/span>.abs(x) &lt; <span class=\"c-n\">0.18<\/span> ? <span class=\"c-n\">0.0<\/span> : x;    <span class=\"c-c\">// apply your own deadzone<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> jumpPressed()<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> pad != <span class=\"c-k\">null<\/span> &amp;&amp; pad.isPressed(hxd.<span class=\"c-t\">Pad<\/span>.<span class=\"c-t\">A<\/span>);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class PadInput {\n    var pad : hxd.Pad;\n    public function new() {\n        hxd.Pad.waitFor(function(p) {   // fires on connect (incl. at startup)\n            pad = p;\n            p.onDisconnect = () -> pad = null;\n        });\n    }\n    public function axis() {\n        if (pad == null) return 0.0;\n        final x = pad.xAxis;                    // -1..1, deadzone not applied\n        return Math.abs(x) < 0.18 ? 0.0 : x;    // apply your own deadzone\n    }\n    public function jumpPressed()\n        return pad != null && pad.isPressed(hxd.Pad.A);\n}"},{"k":"ul","i":["<code>pad.isDown / isPressed / isReleased<\/code> mirror <code>hxd.Key<\/code> semantics — wire them into the same input manager (next slide).","Vibration: <code>pad.rumble(strength, time)<\/code> on backends that support it (console/mobile); guard for null-ability and test per target — signature differs slightly across backends."]},{"k":"best","t":"Own your deadzone","h":"Backend deadzones are inconsistent. Apply a radial deadzone yourself (above) so the stick feels identical on every platform."}],"src":"03_ch02.txt:304","n":54},{"ch":3,"kind":"content","title":"Building the Input Manager (Capstone Pattern)","tt":"Building the Input Manager (Capstone Pattern)","blocks":[{"k":"p","h":"All input channels converge on <b>actions<\/b> — the abstraction every system reads. This class ships in both capstones."},{"k":"code","lang":"haxe","file":"Input.hx","lines":["<span class=\"cl\"><span class=\"c-k\">enum<\/span> <span class=\"c-k\">abstract<\/span> <span class=\"c-t\">Action<\/span>(<span class=\"c-t\">Int<\/span>) <span class=\"c-k\">to<\/span> <span class=\"c-t\">Int<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> <span class=\"c-t\">Left<\/span> = <span class=\"c-n\">0<\/span>; <span class=\"c-k\">final<\/span> <span class=\"c-t\">Right<\/span>; <span class=\"c-k\">final<\/span> <span class=\"c-t\">Jump<\/span>; <span class=\"c-k\">final<\/span> <span class=\"c-t\">Pause<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Input<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> held = [<span class=\"c-k\">for<\/span> (_ in <span class=\"c-n\">0<\/span>...<span class=\"c-n\">4<\/span>) <span class=\"c-k\">false<\/span>];<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> hit  = [<span class=\"c-k\">for<\/span> (_ in <span class=\"c-n\">0<\/span>...<span class=\"c-n\">4<\/span>) <span class=\"c-k\">false<\/span>];<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> pad : <span class=\"c-t\">PadInput<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> init() { pad = <span class=\"c-k\">new<\/span> <span class=\"c-t\">PadInput<\/span>(); }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> update() {           <span class=\"c-c\">// call once per frame, BEFORE gameplay<\/span><\/span>","<span class=\"cl\">        hit[<span class=\"c-t\">Left<\/span>]  = hxd.<span class=\"c-t\">Key<\/span>.isPressed(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">LEFT<\/span>)  || hxd.<span class=\"c-t\">Key<\/span>.isPressed(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">Q<\/span>);<\/span>","<span class=\"cl\">        held[<span class=\"c-t\">Left<\/span>] = hxd.<span class=\"c-t\">Key<\/span>.isDown(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">LEFT<\/span>)     || hxd.<span class=\"c-t\">Key<\/span>.isDown(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">Q<\/span>);<\/span>","<span class=\"cl\">        hit[<span class=\"c-t\">Jump<\/span>]  = hxd.<span class=\"c-t\">Key<\/span>.isPressed(hxd.<span class=\"c-t\">Key<\/span>.<span class=\"c-t\">SPACE<\/span>);<\/span>","<span class=\"cl\">        <span class=\"c-c\">// ... plus pad contributions, plus touch controls (Chapter 12)<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> down(a:<span class=\"c-t\">Action<\/span>) <span class=\"c-k\">return<\/span> held[a];<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> pressed(a:<span class=\"c-t\">Action<\/span>) <span class=\"c-k\">return<\/span> hit[a];<\/span>","<span class=\"cl\">}<\/span>"],"raw":"enum abstract Action(Int) to Int {\n    final Left = 0; final Right; final Jump; final Pause;\n}\n\nclass Input {\n    static var held = [for (_ in 0...4) false];\n    static var hit  = [for (_ in 0...4) false];\n    static var pad : PadInput;\n\n    public static function init() { pad = new PadInput(); }\n\n    public static function update() {           // call once per frame, BEFORE gameplay\n        hit[Left]  = hxd.Key.isPressed(hxd.Key.LEFT)  || hxd.Key.isPressed(hxd.Key.Q);\n        held[Left] = hxd.Key.isDown(hxd.Key.LEFT)     || hxd.Key.isDown(hxd.Key.Q);\n        hit[Jump]  = hxd.Key.isPressed(hxd.Key.SPACE);\n        // ... plus pad contributions, plus touch controls (Chapter 12)\n    }\n    public static inline function down(a:Action) return held[a];\n    public static inline function pressed(a:Action) return hit[a];\n}"},{"k":"best","t":"One update point, one source of truth","h":"Because <code>isPressed<\/code> is consumed per frame, <code>Input.update()<\/code> must run exactly once at the top of the frame. Chapter 4's coordinator guarantees the order: input → simulation → presentation."}],"src":"03_ch02.txt:330","n":55},{"ch":3,"kind":"content","title":"Files Module: Internal vs External Storage","tt":"Files Module: Internal vs External Storage","blocks":[{"k":"p","h":"Two storage concepts, cleanly separated by Heaps — mixing them up is the #1 data-loss bug in shipped games."},{"k":"table","head":["Kind","Access","Writable","Typical use"],"rows":[["Internal (embedded)","<code>hxd.Res<\/code>","at build time only","images, fonts, shipped levels"],["External (user dir)","<code>hxd.Save<\/code>, <code>hxd.File<\/code>","at runtime","settings, progress, saves"]]},{"k":"ul","i":["<code>hxd.Save<\/code> writes to the OS-appropriate location: <code>%APPDATA%<\/code>/<code>Library/Application Support<\/code>/<code>~/.local/share<\/code> on desktop, IndexedDB-backed storage on web, app documents on mobile.","<code>hxd.File.getBytes<\/code> / <code>hxd.File.saveBytes<\/code> reach the real filesystem on <code>sys<\/code> targets only — web has no such thing (that is what saves and HTTP are for)."]},{"k":"pit","t":"Writing saves next to the executable","h":"On Windows under Program Files and on every console that is forbidden or wiped by sandboxing. Always go through <code>hxd.Save<\/code> — it knows the right place per platform."}],"src":"03_ch02.txt:341","n":56},{"ch":3,"kind":"content","title":"hxd.Save: Small Persistent Data","tt":"hxd.Save: Small Persistent Data","blocks":[{"k":"p","h":"Settings and progress in three calls — this is all Chapter 7 needs for real persistence."},{"k":"code","lang":"haxe","file":"SettingsSaver.hx","lines":["<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">Settings<\/span> = {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> music : <span class=\"c-t\">Bool<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> sfx : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> scale : <span class=\"c-t\">String<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">SettingsSaver<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">final<\/span> <span class=\"c-t\">NAME<\/span> = <span class=\"c-s\">\"settings\"<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> defaults() : <span class=\"c-t\">Settings<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> { music : <span class=\"c-k\">true<\/span>, sfx : <span class=\"c-n\">0.8<\/span>, scale : <span class=\"c-s\">\"fit\"<\/span> };<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> load() : <span class=\"c-t\">Settings<\/span> {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// load(name, default): returns default when nothing saved yet<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> hxd.<span class=\"c-t\">Save<\/span>.load(<span class=\"c-t\">NAME<\/span>, defaults());<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> save(s:<span class=\"c-t\">Settings<\/span>) {<\/span>","<span class=\"cl\">        hxd.<span class=\"c-t\">Save<\/span>.save(s, <span class=\"c-t\">NAME<\/span>);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"typedef Settings = {\n    final music : Bool;\n    final sfx : Float;\n    final scale : String;\n}\n\nclass SettingsSaver {\n    static final NAME = \"settings\";\n    static function defaults() : Settings\n        return { music : true, sfx : 0.8, scale : \"fit\" };\n\n    public static function load() : Settings {\n        // load(name, default): returns default when nothing saved yet\n        return hxd.Save.load(NAME, defaults());\n    }\n    public static function save(s:Settings) {\n        hxd.Save.save(s, NAME);\n    }\n}"},{"k":"ul","i":["Data must be serializable (typedef of plain values — no object references, no h2d objects).","Save on change + on exit, never per frame (web storage writes are not free)."]},{"k":"best","t":"Version your save schema on day one","h":"Add a <code>version:Int<\/code> field now, migrate in <code>load()<\/code> later (Chapter 7 dedicates a full slide to migration when fields arrive)."}],"src":"03_ch02.txt:368","n":57},{"ch":3,"kind":"content","title":"Networking: hxd.Http","tt":"Networking: hxd.Http","blocks":[{"k":"p","h":"<code>hxd.Http<\/code> is the cross-platform HTTP client: daily builds, leaderboards, remote configs."},{"k":"code","lang":"haxe","file":"Leaderboard.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Leaderboard<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> submit(score:<span class=\"c-t\">Int<\/span>, name:<span class=\"c-t\">String<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> url = <span class=\"c-s\">'https://api.example.com/scores?name=${name}&amp;score=${score}'<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> http = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">Http<\/span>(url);<\/span>","<span class=\"cl\">        http.onError = <span class=\"c-k\">function<\/span>(e) trace(<span class=\"c-s\">'submit failed: $e'<\/span>);<\/span>","<span class=\"cl\">        http.onData  = <span class=\"c-k\">function<\/span>(d) trace(<span class=\"c-s\">'server said: $d'<\/span>);<\/span>","<span class=\"cl\">        http.request();                       <span class=\"c-c\">// asynchronous, non-blocking<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> top(onDone:(<span class=\"c-t\">String<\/span>)-&gt;<span class=\"c-t\">Void<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> http = <span class=\"c-k\">new<\/span> hxd.<span class=\"c-t\">Http<\/span>(<span class=\"c-s\">\"https://api.example.com/scores\"<\/span>);<\/span>","<span class=\"cl\">        http.onData  = onDone;<\/span>","<span class=\"cl\">        http.onError = <span class=\"c-k\">function<\/span>(e) onDone(<span class=\"c-s\">\"[]\"<\/span>);   <span class=\"c-c\">// fail soft, never crash the game<\/span><\/span>","<span class=\"cl\">        http.request();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Leaderboard {\n    public static function submit(score:Int, name:String) {\n        final url = 'https://api.example.com/scores?name=${name}&score=${score}';\n        final http = new hxd.Http(url);\n        http.onError = function(e) trace('submit failed: $e');\n        http.onData  = function(d) trace('server said: $d');\n        http.request();                       // asynchronous, non-blocking\n    }\n    public static function top(onDone:(String)->Void) {\n        final http = new hxd.Http(\"https://api.example.com/scores\");\n        http.onData  = onDone;\n        http.onError = function(e) onDone(\"[]\");   // fail soft, never crash the game\n        http.request();\n    }\n}"},{"k":"ul","i":["Requests are async everywhere (even on <code>sys<\/code> targets) — never block the frame waiting.","POST bodies and custom headers are supported; see the class docs for the full request API."]},{"k":"pit","t":"XHR errors on web are usually CORS","h":"If the browser console shows network errors that \"work in curl\", the server lacks CORS headers for your origin. It is a server fix, not a game fix."}],"src":"03_ch02.txt:391","n":58},{"ch":3,"kind":"content","title":"Networking: WebSockets and Realtime","tt":"Networking: WebSockets and Realtime","blocks":[{"k":"p","h":"Heaps deliberately ships no socket layer — the right one depends on target and game. Know the landscape."},{"k":"ul","i":["<b>Web target<\/b>: use the browser <code>WebSocket<\/code> API through Haxe's JS interop (or a Haxe websocket library targeting JS).","<b>Native (sys)<\/b>: <code>sys.net.Socket<\/code> for raw TCP/UDP, or a Haxe websocket haxelib that supports <code>hl<\/code>.","<b>Design rule<\/b>: wrap whatever you pick behind a small <code>Connection<\/code> interface (connect / send(bytes) / onMessage / close) so the game never imports platform sockets."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">interface<\/span> <span class=\"c-t\">Connection<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> connect(host:<span class=\"c-t\">String<\/span>, port:<span class=\"c-t\">Int<\/span>) : <span class=\"c-t\">Bool<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">function<\/span> send(bytes:haxe.io.<span class=\"c-t\">Bytes<\/span>) : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">dynamic<\/span> <span class=\"c-k\">function<\/span> onMessage(bytes:haxe.io.<span class=\"c-t\">Bytes<\/span>) : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">dynamic<\/span> <span class=\"c-k\">function<\/span> onClose() : <span class=\"c-t\">Void<\/span>;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"interface Connection {\n    function connect(host:String, port:Int) : Bool;\n    function send(bytes:haxe.io.Bytes) : Void;\n    dynamic function onMessage(bytes:haxe.io.Bytes) : Void;\n    dynamic function onClose() : Void;\n}"},{"k":"best","t":"Keep gameplay protocol target-agnostic","h":"Serialize with <code>haxe.io.Bytes<\/code> + your own packer (Chapter 5's binary format slides), never by sending Haxe class names. Chapter 5's binary tools double as your network protocol toolkit."}],"src":"03_ch02.txt:406","n":59},{"ch":3,"kind":"content","title":"Logging, Exit and Timeouts","tt":"Logging, Exit and Timeouts","blocks":[{"k":"p","h":"Three <code>hxd.System<\/code> facilities every shipped game uses."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\">hxd.<span class=\"c-t\">System<\/span>.exit();                              <span class=\"c-c\">// graceful quit (fires cleanup hooks)<\/span><\/span>","<span class=\"cl\">hxd.<span class=\"c-t\">System<\/span>.setTimeout(<span class=\"c-k\">function<\/span>() { }, <span class=\"c-n\">500<\/span>);     <span class=\"c-c\">// ms-precision deferred call, main thread<\/span><\/span>","<span class=\"cl\">hxd.<span class=\"c-t\">Log<\/span>.warn(<span class=\"c-s\">\"level file truncated, using defaults\"<\/span>);  <span class=\"c-c\">// leveled logging (backend-dependent colors)<\/span><\/span>"],"raw":"hxd.System.exit();                              // graceful quit (fires cleanup hooks)\nhxd.System.setTimeout(function() { }, 500);     // ms-precision deferred call, main thread\nhxd.Log.warn(\"level file truncated, using defaults\");  // leveled logging (backend-dependent colors)"},{"k":"ul","i":["Prefer <code>hxd.Log<\/code> levels (<code>debug/info/warn/error<\/code>) over raw <code>trace<\/code> in engine-facing code — they can be filtered per target at boot.","<code>System.exit()<\/code> (not <code>Sys.exit()<\/code>) runs Heaps' disposal and is web-safe (no-ops gracefully where tabs cannot close themselves)."]},{"k":"pit","t":"Calling System.exit() mid-frame","h":"Exit during <code>update<\/code> on some backends skips buffer swaps and can crash the driver. Set a <code>wantExit<\/code> flag and call <code>exit()<\/code> from the top of the next frame."}],"src":"03_ch02.txt:417","n":60},{"ch":3,"kind":"content","title":"Threading Considerations","tt":"Threading Considerations","blocks":[{"k":"p","h":"The frame loop is single-threaded, and that is a feature — scene graphs and GPU state are not thread-safe."},{"k":"ul","i":["<b>Web<\/b>: workers exist but share nothing; message-passing only. Keep heavy work in short frame slices.","<b>Native (hl)<\/b>: <code>sys.thread.Thread<\/code> pools are fine for image decoding, pathfinding, compression — never for scene-graph or draw calls.","<b>The golden rule<\/b>: workers compute bytes/numbers, the main thread owns every <code>h2d/h3d<\/code> object. Transfer results via queues and apply them next frame."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// native only: typical worker hand-off<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> job = sys.thread.<span class=\"c-t\">Thread<\/span>.create(<span class=\"c-k\">function<\/span>() {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> result = heavyComputation();           <span class=\"c-c\">// pure data in, data out<\/span><\/span>","<span class=\"cl\">    mainThreadQueue.push(result);                <span class=\"c-c\">// apply on main thread in update()<\/span><\/span>","<span class=\"cl\">}<\/span>"],"raw":"// native only: typical worker hand-off\nfinal job = sys.thread.Thread.create(function() {\n    final result = heavyComputation();           // pure data in, data out\n    mainThreadQueue.push(result);                // apply on main thread in update()\n}"},{"k":"best","t":"Profile before you thread","h":"A 4-thread pathfinder that misses a cache line is slower than a single-threaded Dijkstra. Chapter 14's batching slides show how much perf comes from memory layout alone."}],"src":"03_ch02.txt:431","n":61},{"ch":3,"kind":"content","title":"Platform Conditionals Cheat Sheet","tt":"Platform Conditionals Cheat Sheet","blocks":[{"k":"p","h":"When conditionals are unavoidable, use the narrowest one that works."},{"k":"table","head":["Conditional","True on"],"rows":[["<code>#if hl<\/code>","HashLink (desktop dev, mobile)"],["<code>#if js<\/code>","browser target"],["<code>#if sys<\/code>","any native target (desktop + mobile, not web)"],["<code>#if (sys &amp;&amp; hl)<\/code>","HashLink native only"],["<code>#if debug<\/code>","built with <code>-D debug<\/code>"],["<code>#if heaps_...<\/code>","engine feature flags (see Heaps docs)"]]},{"k":"ul","i":["Feature-detect at runtime when it is about <b>capability<\/b> (fullscreen, vibration), compile-time when it is about <b>API absence<\/b> (filesystem)."]},{"k":"best","t":"Put #if at module boundaries, not inline","h":"A file <code>PlatformWeb.hx<\/code> full of conditionals beats ten scattered <code>#if js<\/code> inside gameplay classes. Chapter 12's input router demonstrates the pattern."}],"src":"03_ch02.txt:445","n":62},{"ch":3,"kind":"content","title":"Project: A Resilient App Skeleton","tt":"Project: A Resilient App Skeleton","blocks":[{"k":"p","h":"Chapter 2 closes by upgrading Chapter 1's <code>Main.hx<\/code> into the skeleton both capstones grow from."},{"k":"code","lang":"haxe","file":"Main.hx","lines":["<span class=\"cl\"><span class=\"c-k\">import<\/span> hxd.<span class=\"c-t\">Res<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Main<\/span> <span class=\"c-k\">extends<\/span> hxd.<span class=\"c-t\">App<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> game : <span class=\"c-t\">Game<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> init() {<\/span>","<span class=\"cl\">        <span class=\"c-t\">Res<\/span>.initEmbed();<\/span>","<span class=\"cl\">        s2d.setFixedSize(<span class=\"c-n\">1280<\/span>, <span class=\"c-n\">720<\/span>);      <span class=\"c-c\">// resolution strategy (decided, not defaulted)<\/span><\/span>","<span class=\"cl\">        game = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Game<\/span>(s2d, s3d);        <span class=\"c-c\">// Chapter 4 gives Game its real body<\/span><\/span>","<span class=\"cl\">        game.start();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">if<\/span> (dt &gt; <span class=\"c-n\">0.1<\/span>) dt = <span class=\"c-n\">0.1<\/span>;           <span class=\"c-c\">// hitch clamp<\/span><\/span>","<span class=\"cl\">        <span class=\"c-t\">Input<\/span>.update();                   <span class=\"c-c\">// exactly once per frame, first<\/span><\/span>","<span class=\"cl\">        game.update(dt);                  <span class=\"c-c\">// then simulation<\/span><\/span>","<span class=\"cl\">        game.render();                    <span class=\"c-c\">// then presentation<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> onResize()<\/span>","<span class=\"cl\">        game.onResize(engine.width, engine.height);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> main() <span class=\"c-k\">new<\/span> <span class=\"c-t\">Main<\/span>();<\/span>","<span class=\"cl\">}<\/span>"],"raw":"import hxd.Res;\n\nclass Main extends hxd.App {\n    var game : Game;\n\n    override function init() {\n        Res.initEmbed();\n        s2d.setFixedSize(1280, 720);      // resolution strategy (decided, not defaulted)\n        game = new Game(s2d, s3d);        // Chapter 4 gives Game its real body\n        game.start();\n    }\n\n    override function update(dt:Float) {\n        if (dt > 0.1) dt = 0.1;           // hitch clamp\n        Input.update();                   // exactly once per frame, first\n        game.update(dt);                  // then simulation\n        game.render();                    // then presentation\n    }\n\n    override function onResize()\n        game.onResize(engine.width, engine.height);\n\n    static function main() new Main();\n}"},{"k":"ul","i":["Note the frame order: <b>input → simulation → presentation<\/b>. Chapter 4 turns that ordering into the course's core architecture.","This file is finished for the rest of the course — a good <code>Main.hx<\/code> never grows."]}],"src":"03_ch02.txt:476","n":63},{"ch":3,"kind":"content","title":"Chapter 2 Checklist","tt":"Chapter 2 Checklist","blocks":[{"k":"ul","i":["Lifecycle: which callback runs when, and what is legal inside each.","Resolution strategy chosen (<code>setFixedSize<\/code> for Cavern Run) and <code>onResize<\/code> handled.","All motion is <code>rate * dt<\/code>; dt is clamped.","Fixed-timestep accumulator understood — ready for Chapter 10.","Sfx vs music discipline; autoplay unlock planned for web.","Input manager skeleton exists; keyboard + pad feed actions.","Settings persist via <code>hxd.Save<\/code> with a <code>version<\/code> field.","HTTP used asynchronously with fail-soft callbacks."]}],"src":"03_ch02.txt:486","n":64},{"ch":4,"kind":"chapter","title":"2D Fundamentals: Scene, Tiles &amp; Drawables","tt":"2D Fundamentals: Scene, Tiles & Drawables","sub":"The h2d scene graph — objects, bitmaps, text, graphics, layout, interactives. The vocabulary of every 2D Heaps game.","blocks":[],"src":"04_ch03.txt:1","n":65},{"ch":4,"kind":"content","title":"The h2d Scene Graph Model","tt":"The h2d Scene Graph Model","blocks":[{"k":"p","h":"<code>h2d<\/code> organizes 2D rendering as a <b>tree<\/b> of objects. One mental model, then every class this chapter is just a node type."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">Scene (root)<\/span>","<span class=\"cl\"> ├── Bitmap        (draws a tile)<\/span>","<span class=\"cl\"> ├── Anim          (draws a sequence of tiles)<\/span>","<span class=\"cl\"> ├── Text          (draws glyphs)<\/span>","<span class=\"cl\"> ├── Graphics      (draws shapes)<\/span>","<span class=\"cl\"> └── Sprite        (container: transforms its children)<\/span>","<span class=\"cl\">      ├── Bitmap<\/span>","<span class=\"cl\">      └── Sprite<\/span>","<span class=\"cl\">           └── ...<\/span>"],"raw":"Scene (root)\n ├── Bitmap        (draws a tile)\n ├── Anim          (draws a sequence of tiles)\n ├── Text          (draws glyphs)\n ├── Graphics      (draws shapes)\n └── Sprite        (container: transforms its children)\n      ├── Bitmap\n      └── Sprite\n           └── ..."},{"k":"ul","i":["<b>Children inherit the parent transform<\/b> (position, rotation, scale, alpha, visibility).","Drawing order = tree order (depth-first); <code>Layers<\/code> (this chapter) gives explicit z-layers.","The scene updates (animations, layout) then renders the tree each frame."]},{"k":"best","t":"Think in trees, not draw calls","h":"Group entities as <code>Sprite<\/code> roots — a \"player\" is one Sprite with body/weapon/shadow children. Moving the parent moves everything: free rigging, free culling by visibility."}],"src":"04_ch03.txt:21","n":66},{"ch":4,"kind":"content","title":"h2d.Object: Position, Transform, Children","tt":"h2d.Object: Position, Transform, Children","blocks":[{"k":"p","h":"<code>h2d.Object<\/code> is the base node: transform + children. You manipulate these members a thousand times a day."},{"k":"code","lang":"haxe","file":"TransformBasics.hx","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> container = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Object<\/span>(s2d);    <span class=\"c-c\">// parent optional everywhere<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">container.x = <span class=\"c-n\">100<\/span>;               <span class=\"c-c\">// pixels (scene units)<\/span><\/span>","<span class=\"cl\">container.y = <span class=\"c-n\">50<\/span>;<\/span>","<span class=\"cl\">container.rotation = <span class=\"c-n\">0.5<\/span>;        <span class=\"c-c\">// radians, around the object's origin<\/span><\/span>","<span class=\"cl\">container.scaleX = <span class=\"c-n\">2.0<\/span>;          <span class=\"c-c\">// 1.0 = unscaled<\/span><\/span>","<span class=\"cl\">container.scaleY = <span class=\"c-n\">2.0<\/span>;<\/span>","<span class=\"cl\">container.set(<span class=\"c-n\">120<\/span>, <span class=\"c-n\">80<\/span>);          <span class=\"c-c\">// sugar: x/y together<\/span><\/span>","<span class=\"cl\">container.setScale(<span class=\"c-n\">2.0<\/span>);         <span class=\"c-c\">// sugar: both scales<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> child = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Object<\/span>(container); <span class=\"c-c\">// parent = container<\/span><\/span>","<span class=\"cl\">child.remove();                           <span class=\"c-c\">// detach from parent<\/span><\/span>","<span class=\"cl\">container.addChild(child);                <span class=\"c-c\">// re-attach (at end)<\/span><\/span>","<span class=\"cl\">container.addChildAt(child, <span class=\"c-n\">0<\/span>);           <span class=\"c-c\">// attach at specific depth<\/span><\/span>"],"raw":"final container = new h2d.Object(s2d);    // parent optional everywhere\n\ncontainer.x = 100;               // pixels (scene units)\ncontainer.y = 50;\ncontainer.rotation = 0.5;        // radians, around the object's origin\ncontainer.scaleX = 2.0;          // 1.0 = unscaled\ncontainer.scaleY = 2.0;\ncontainer.set(120, 80);          // sugar: x/y together\ncontainer.setScale(2.0);         // sugar: both scales\n\nfinal child = new h2d.Object(container); // parent = container\nchild.remove();                           // detach from parent\ncontainer.addChild(child);                // re-attach (at end)\ncontainer.addChildAt(child, 0);           // attach at specific depth"},{"k":"ul","i":["Rotation and scale pivot around the object's <b>origin<\/b> (its own x/y), not its center — Chapter 5's <code>tile.setCenter()<\/code> fixes sprites to match intuition.","<code>visible = false<\/code> hides the whole subtree; <code>alpha<\/code> multiplies down the tree."]},{"k":"pit","t":"Thinking in degrees","h":"h2d rotation is <b>radians<\/b>. <code>rotation = 1<\/code> is about 57 degrees. <code>hxd.Math.degToRad<\/code> converts when authoring in degrees."}],"src":"04_ch03.txt:43","n":67},{"ch":4,"kind":"content","title":"Tiles: The Atomic Image Unit","tt":"Tiles: The Atomic Image Unit","blocks":[{"k":"p","h":"A <code>h2d.Tile<\/code> is a rectangle of a texture: position, size and a pixel offset. All 2D drawing reduces to tiles."},{"k":"code","lang":"haxe","file":"Tiles.hx","lines":["<span class=\"cl\"><span class=\"c-c\">// Solid-color tiles — perfect for prototypes and placeholders:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> white = h2d.<span class=\"c-t\">Tile<\/span>.fromColor(<span class=\"c-n\">0xFFFFFF<\/span>, <span class=\"c-n\">16<\/span>, <span class=\"c-n\">16<\/span>);<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> black = h2d.<span class=\"c-t\">Tile<\/span>.fromColor(<span class=\"c-n\">0x101018<\/span>, <span class=\"c-n\">64<\/span>, <span class=\"c-n\">32<\/span>, <span class=\"c-n\">0.8<\/span>); <span class=\"c-c\">// alpha 0.8<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// Sub-tiles — carve atlas sheets (Chapter 5's core operation):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> sheet  = <span class=\"c-t\">Res<\/span>.img.spritesheet.toTile();     <span class=\"c-c\">// the whole PNG<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> hero   = sheet.sub(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">32<\/span>, <span class=\"c-n\">48<\/span>);          <span class=\"c-c\">// x, y, w, h within the sheet<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> gem    = sheet.sub(<span class=\"c-n\">32<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">16<\/span>, <span class=\"c-n\">16<\/span>);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// Origin fix-up — make (0,0) the sprite's center instead of top-left:<\/span><\/span>","<span class=\"cl\">hero.setCenter();            <span class=\"c-c\">// dx/dy = -w/2, -h/2<\/span><\/span>","<span class=\"cl\">gem.setCenterRatio(<span class=\"c-n\">0.5<\/span>, <span class=\"c-n\">1.0<\/span>);<span class=\"c-c\">// bottom-center pivot (great for units on terrain)<\/span><\/span>"],"raw":"// Solid-color tiles — perfect for prototypes and placeholders:\nfinal white = h2d.Tile.fromColor(0xFFFFFF, 16, 16);\nfinal black = h2d.Tile.fromColor(0x101018, 64, 32, 0.8); // alpha 0.8\n\n// Sub-tiles — carve atlas sheets (Chapter 5's core operation):\nfinal sheet  = Res.img.spritesheet.toTile();     // the whole PNG\nfinal hero   = sheet.sub(0, 0, 32, 48);          // x, y, w, h within the sheet\nfinal gem    = sheet.sub(32, 0, 16, 16);\n\n// Origin fix-up — make (0,0) the sprite's center instead of top-left:\nhero.setCenter();            // dx/dy = -w/2, -h/2\ngem.setCenterRatio(0.5, 1.0);// bottom-center pivot (great for units on terrain)"},{"k":"ul","i":["<code>tile.dx / tile.dy<\/code> shift the tile at draw time — the cheapest \"pivot\" in 2D.","Sub-tiles share the parent's texture: <b>no extra GPU memory<\/b>, and the renderer batches them (next chapters)."]},{"k":"best","t":"Prototype with fromColor, ship with atlas subs","h":"<code>fromColor<\/code> lets you build the entire game logic with grey boxes; swapping to atlas tiles later is a one-line change per visual."}],"src":"04_ch03.txt:63","n":68},{"ch":4,"kind":"content","title":"Bitmap: Displaying a Tile","tt":"Bitmap: Displaying a Tile","blocks":[{"k":"p","h":"<code>h2d.Bitmap<\/code> is \"a tile at a transform\" — the workhorse of h2d."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> bmp = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(heroTile, s2d);<\/span>","<span class=\"cl\">bmp.x = <span class=\"c-n\">640<\/span>; bmp.y = <span class=\"c-n\">400<\/span>;<\/span>","<span class=\"cl\">bmp.tile = otherTile;       <span class=\"c-c\">// swap visuals freely (animation does exactly this)<\/span><\/span>","<span class=\"cl\">bmp.color.load(<span class=\"c-n\">0x88FF88<\/span>);   <span class=\"c-c\">// tint (multiplies the texture)<\/span><\/span>","<span class=\"cl\">bmp.alpha = <span class=\"c-n\">0.5<\/span>;            <span class=\"c-c\">// transparency (multiplied with color.a)<\/span><\/span>","<span class=\"cl\">bmp.blendMode = <span class=\"c-t\">Alpha<\/span>;      <span class=\"c-c\">// default; Add for glows, Erase for cutouts<\/span><\/span>"],"raw":"final bmp = new h2d.Bitmap(heroTile, s2d);\nbmp.x = 640; bmp.y = 400;\nbmp.tile = otherTile;       // swap visuals freely (animation does exactly this)\nbmp.color.load(0x88FF88);   // tint (multiplies the texture)\nbmp.alpha = 0.5;            // transparency (multiplied with color.a)\nbmp.blendMode = Alpha;      // default; Add for glows, Erase for cutouts"},{"k":"ul","i":["<code>color<\/code> is a <code>h3d.Vector<\/code> (r,g,b,a as 0..1 multipliers) — tinting is free on the GPU.","Blend modes: <code>Alpha<\/code> (normal), <code>Add<\/code> (fire, glow, HUD flashes), <code>Multiply<\/code>, <code>Erase<\/code>, and screen/mask variants."]},{"k":"pit","t":"Tinting to white does nothing","h":"<code>color<\/code> <b>multiplies<\/b>. To brighten you need a filter/shader (Chapter 11) or a brighter texture — multiplying by (2,2,2) via <code>color.scale()<\/code> works only up to texture range on some pipelines."}],"src":"04_ch03.txt:77","n":69},{"ch":4,"kind":"content","title":"Loading Images with hxd.Res","tt":"Loading Images with hxd.Res","blocks":[{"k":"p","h":"Chapter 1 introduced <code>Res.initEmbed()<\/code>; now use it properly for a 2D game."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// res/img/hero.png, res/img/spritesheet.png, res/fnt/montserrat.fnt(+png)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> hero = <span class=\"c-t\">Res<\/span>.img.hero.toTile();<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> fnt  = <span class=\"c-t\">Res<\/span>.fnt.montserrat.toFont();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// Any Image resource can also become a raw texture (3D uses this, Ch. 14):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> tex = <span class=\"c-t\">Res<\/span>.img.ground.toTexture();<\/span>"],"raw":"// res/img/hero.png, res/img/spritesheet.png, res/fnt/montserrat.fnt(+png)\nfinal hero = Res.img.hero.toTile();\nfinal fnt  = Res.fnt.montserrat.toFont();\n\n// Any Image resource can also become a raw texture (3D uses this, Ch. 14):\nfinal tex = Res.img.ground.toTexture();"},{"k":"ul","i":["Typed paths (<code>Res.img.hero<\/code>) fail at compile time if the file is missing — typos die before playtesting.","<code>Res<\/code> caches decoded results; asking twice returns the same instance (Chapter 5 covers disposal)."]},{"k":"note","h":"Keep art exports flat PNGs in <code>res/img/<\/code>; atlases are generated as a build step and live beside them — the pipeline in Chapter 5 keeps \"source art\" and \"packed art\" separate."}],"src":"04_ch03.txt:91","n":70},{"ch":4,"kind":"content","title":"Anim: Frame Animation in One Line","tt":"Anim: Frame Animation in One Line","blocks":[{"k":"p","h":"<code>h2d.Anim<\/code> cycles an array of tiles at a fixed frame rate — spritesheet animation without any engine ceremony."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> frames = [ <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...<span class=\"c-n\">8<\/span>) sheet.sub(i * <span class=\"c-n\">32<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">32<\/span>, <span class=\"c-n\">48<\/span>) ];<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> run = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Anim<\/span>(frames, <span class=\"c-n\">10<\/span>, s2d);   <span class=\"c-c\">// 10 fps<\/span><\/span>","<span class=\"cl\">run.pause = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">run.speed = <span class=\"c-n\">12<\/span>;          <span class=\"c-c\">// change fps on the fly<\/span><\/span>","<span class=\"cl\">run.currentFrame = <span class=\"c-n\">0<\/span>;    <span class=\"c-c\">// seek<\/span><\/span>","<span class=\"cl\">run.play(idleFrames);    <span class=\"c-c\">// swap animation, restarts at frame 0<\/span><\/span>"],"raw":"final frames = [ for (i in 0...8) sheet.sub(i * 32, 0, 32, 48) ];\nfinal run = new h2d.Anim(frames, 10, s2d);   // 10 fps\nrun.pause = false;\nrun.speed = 12;          // change fps on the fly\nrun.currentFrame = 0;    // seek\nrun.play(idleFrames);    // swap animation, restarts at frame 0"},{"k":"ul","i":["The engine advances <code>Anim<\/code> automatically each frame — no update code needed.","Chapter 13 adds events, play modes (loop/ping-pong/reverse) and a full controller on top of this base."]},{"k":"best","t":"Keep one Anim per entity, swap frames","h":"Creating/destroying Anim objects per animation change churns the scene graph. <code>play(frames)<\/code> reuses the node — this discipline scales to hundreds of entities."}],"src":"04_ch03.txt:105","n":71},{"ch":4,"kind":"content","title":"Text and Fonts","tt":"Text and Fonts","blocks":[{"k":"p","h":"Heaps renders text from BMFont-format fonts (<code>.fnt<\/code> + PNG, exported by free tools like BMFont/Littera/Hiero)."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> font = <span class=\"c-t\">Res<\/span>.fnt.montserrat.toFont();<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> tf = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Text<\/span>(font, s2d);<\/span>","<span class=\"cl\">tf.text = <span class=\"c-s\">\"GEMS 0\"<\/span>;<\/span>","<span class=\"cl\">tf.textColor = <span class=\"c-n\">0xFFFFFF<\/span>;<\/span>","<span class=\"cl\">tf.x = <span class=\"c-n\">20<\/span>; tf.y = <span class=\"c-n\">20<\/span>;<\/span>","<span class=\"cl\">tf.scale = <span class=\"c-n\">2<\/span>;                       <span class=\"c-c\">// integer scales keep pixels crisp<\/span><\/span>","<span class=\"cl\">tf.maxWidth = <span class=\"c-n\">300<\/span>;                  <span class=\"c-c\">// wraps text at 300px<\/span><\/span>","<span class=\"cl\">tf.textAlign = h2d.<span class=\"c-t\">Text<\/span>.<span class=\"c-t\">Align<\/span>.<span class=\"c-t\">Center<\/span>;<\/span>","<span class=\"cl\">tf.dropShadow = { dx : <span class=\"c-n\">1<\/span>, dy : <span class=\"c-n\">1<\/span>, color : <span class=\"c-n\">0x000000<\/span>, alpha : <span class=\"c-n\">0.6<\/span> };<\/span>"],"raw":"final font = Res.fnt.montserrat.toFont();\nfinal tf = new h2d.Text(font, s2d);\ntf.text = \"GEMS 0\";\ntf.textColor = 0xFFFFFF;\ntf.x = 20; tf.y = 20;\ntf.scale = 2;                       // integer scales keep pixels crisp\ntf.maxWidth = 300;                  // wraps text at 300px\ntf.textAlign = h2d.Text.Align.Center;\ntf.dropShadow = { dx : 1, dy : 1, color : 0x000000, alpha : 0.6 };"},{"k":"ul","i":["Rebuilding text every frame (<code>tf.text = 'GEMS ${n}'<\/code>) is fine — layout is cached when the string is unchanged.","<code>h2d.Text<\/code> measures itself: <code>tf.textWidth<\/code>, <code>tf.textHeight<\/code> drive UI layout (Chapter 7)."]},{"k":"pit","t":"Web build shows squares for text","h":"The <code>.fnt<\/code> PNG failed to embed (path case-sensitivity!) or the font references glyphs outside its charset. Re-export with the needed ranges (ASCII+Latin-1 covers this course)."}],"src":"04_ch03.txt:122","n":72},{"ch":4,"kind":"content","title":"Graphics: Procedural Drawing","tt":"Graphics: Procedural Drawing","blocks":[{"k":"p","h":"<code>h2d.Graphics<\/code> is a retained-mode shape recorder — debug overlays, procedural UI backgrounds, editor gizmos."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> g = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Graphics<\/span>(s2d);<\/span>","<span class=\"cl\">g.beginFill(<span class=\"c-n\">0xFFCC00<\/span>, <span class=\"c-n\">0.85<\/span>);   <span class=\"c-c\">// color, alpha<\/span><\/span>","<span class=\"cl\">g.drawRect(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">200<\/span>, <span class=\"c-n\">48<\/span>);<\/span>","<span class=\"cl\">g.endFill();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">g.lineStyle(<span class=\"c-n\">2<\/span>, <span class=\"c-n\">0xFFFFFF<\/span>, <span class=\"c-n\">0.9<\/span>); <span class=\"c-c\">// thickness, color, alpha<\/span><\/span>","<span class=\"cl\">g.drawRect(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">200<\/span>, <span class=\"c-n\">48<\/span>);<\/span>","<span class=\"cl\">g.drawCircle(<span class=\"c-n\">320<\/span>, <span class=\"c-n\">120<\/span>, <span class=\"c-n\">40<\/span>);<\/span>","<span class=\"cl\">g.drawLine(<span class=\"c-n\">0<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">100<\/span>, <span class=\"c-n\">100<\/span>);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">g.clear();                     <span class=\"c-c\">// wipe and rebuild (debug overlays every frame)<\/span><\/span>"],"raw":"final g = new h2d.Graphics(s2d);\ng.beginFill(0xFFCC00, 0.85);   // color, alpha\ng.drawRect(0, 0, 200, 48);\ng.endFill();\n\ng.lineStyle(2, 0xFFFFFF, 0.9); // thickness, color, alpha\ng.drawRect(0, 0, 200, 48);\ng.drawCircle(320, 120, 40);\ng.drawLine(0, 0, 100, 100);\n\ng.clear();                     // wipe and rebuild (debug overlays every frame)"},{"k":"ul","i":["Retained-mode: draw once, it stays; call <code>clear()<\/code> + redraw when
