 data changes (not every frame unless needed).","Draw commands batch into a single GPU buffer — a Graphics with 500 rects is one draw call."]},{"k":"best","t":"Graphics is your debug layer's best friend","h":"Collision boxes (Chapter 6), physics shapes (Chapter 10) and the particle editor (Chapter 8) all draw through one reusable <code>Graphics<\/code> overlay."}],"src":"04_ch03.txt:141","n":73},{"ch":4,"kind":"content","title":"Coordinates, Pivots and Rotation Intuition","tt":"Coordinates, Pivots and Rotation Intuition","blocks":[{"k":"p","h":"2D transforms bite exactly one class of developer: those who skip this slide."},{"k":"ul","i":["Scene coordinates: y grows <b>downward<\/b>; angles grow <b>clockwise<\/b> (because y is flipped vs math class).","Rotation happens around the object's origin; with <code>tile.dx = -w/2, dy = -h/2<\/code> (setCenter), origin equals sprite center and rotation \"looks right\" immediately.","Parent scale multiplies: <code>parent.scale = 2<\/code> makes child pixel positions count double."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> spinner = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(boltTile, s2d);<\/span>","<span class=\"cl\">spinner.tile.setCenter();          <span class=\"c-c\">// pivot = center<\/span><\/span>","<span class=\"cl\">spinner.x = <span class=\"c-n\">640<\/span>; spinner.y = <span class=\"c-n\">360<\/span>;  <span class=\"c-c\">// now x/y IS the center position<\/span><\/span>","<span class=\"cl\">spinner.rotation += <span class=\"c-n\">3<\/span> * dt;        <span class=\"c-c\">// spins in place, finally<\/span><\/span>"],"raw":"final spinner = new h2d.Bitmap(boltTile, s2d);\nspinner.tile.setCenter();          // pivot = center\nspinner.x = 640; spinner.y = 360;  // now x/y IS the center position\nspinner.rotation += 3 * dt;        // spins in place, finally"}],"src":"04_ch03.txt:153","n":74},{"ch":4,"kind":"content","title":"Layers and Draw Order","tt":"Layers and Draw Order","blocks":[{"k":"p","h":"When \"add order = draw order\" is not enough (sky behind, UI in front, player between), <code>h2d.Layers<\/code> gives explicit z control."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> layers = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Layers<\/span>(s2d);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">layers.add(sky, <span class=\"c-n\">0<\/span>);        <span class=\"c-c\">// z = 0: furthest back<\/span><\/span>","<span class=\"cl\">layers.add(farParallax, <span class=\"c-n\">1<\/span>);<\/span>","<span class=\"cl\">layers.add(worldRoot, <span class=\"c-n\">10<\/span>);<\/span>","<span class=\"cl\">layers.add(hero, <span class=\"c-n\">11<\/span>);<\/span>","<span class=\"cl\">layers.add(fx, <span class=\"c-n\">20<\/span>);        <span class=\"c-c\">// particles over gameplay<\/span><\/span>","<span class=\"cl\">layers.add(hud, <span class=\"c-n\">100<\/span>);      <span class=\"c-c\">// UI always on top<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">layers.under(hero, fx);    <span class=\"c-c\">// relative reorder: fx now below hero<\/span><\/span>","<span class=\"cl\">layers.y(slice, <span class=\"c-n\">5<\/span>);        <span class=\"c-c\">// move to layer 5 (re-sorts)<\/span><\/span>"],"raw":"final layers = new h2d.Layers(s2d);\n\nlayers.add(sky, 0);        // z = 0: furthest back\nlayers.add(farParallax, 1);\nlayers.add(worldRoot, 10);\nlayers.add(hero, 11);\nlayers.add(fx, 20);        // particles over gameplay\nlayers.add(hud, 100);      // UI always on top\n\nlayers.under(hero, fx);    // relative reorder: fx now below hero\nlayers.y(slice, 5);        // move to layer 5 (re-sorts)"},{"k":"ul","i":["<code>h2d.Scene<\/code> itself <b>is<\/b> a Layers — <code>s2d.add(child, 5)<\/code> works directly on the scene.","Same z = insertion order. Choose a documented z convention (constants, not magic numbers) — Chapter 4 freezes Cavern Run's layer table."]},{"k":"pit","t":"Debugging invisible objects: 90% is order","h":"\"My sprite vanished\" almost always means: drawn behind an opaque one, <code>visible=false<\/code> inherited, alpha 0 up the tree, or off-screen due to a forgotten parent transform. Check <code>getBounds<\/code> (next slide's cousin) before suspecting the renderer."}],"src":"04_ch03.txt:172","n":75},{"ch":4,"kind":"content","title":"Blend Modes and Alpha","tt":"Blend Modes and Alpha","blocks":[{"k":"p","h":"The small blend-mode toolbox, with the game situations that need each."},{"k":"table","head":["Mode","Effect","Use for"],"rows":[["Alpha","normal transparency","everything default"],["Add","src + dst, brighter","glows, fire, lasers, pickups sparkle"],["Multiply","src * dst","lighting tints, day-night overlays"],["Erase","subtracts src alpha from dst","masks, hole cutting"],["Screen","brightens without clipping","soft light effects"]]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\">glowBmp.blendMode = h2d.<span class=\"c-t\">BlendMode<\/span>.<span class=\"c-t\">Add<\/span>;     <span class=\"c-c\">// additive sparkle<\/span><\/span>","<span class=\"cl\">nightOverlay.blendMode = h2d.<span class=\"c-t\">BlendMode<\/span>.<span class=\"c-t\">Multiply<\/span>; <span class=\"c-c\">// darkens scene under it<\/span><\/span>"],"raw":"glowBmp.blendMode = h2d.BlendMode.Add;     // additive sparkle\nnightOverlay.blendMode = h2d.BlendMode.Multiply; // darkens scene under it"},{"k":"best","t":"One multiply overlay = instant mood","h":"A fullscreen 60% blue <code>Multiply<\/code> bitmap sells \"night\" better than repainting art — Cavern Run's cave mood is one overlay, not new assets."}],"src":"04_ch03.txt:188","n":76},{"ch":4,"kind":"content","title":"Interactive: Pointer Events on Scene Objects","tt":"Interactive: Pointer Events on Scene Objects","blocks":[{"k":"p","h":"<code>h2d.Interactive<\/code> is an invisible hit-rectangle that participates in pointer events — the base of every button (Chapter 7)."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> hit = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Interactive<\/span>(<span class=\"c-n\">200<\/span>, <span class=\"c-n\">48<\/span>, buttonSprite); <span class=\"c-c\">// w, h, parent<\/span><\/span>","<span class=\"cl\">hit.onClick = <span class=\"c-k\">function<\/span>(e) trace(<span class=\"c-s\">'clicked at ${e.relX},${e.relY}'<\/span>); <span class=\"c-c\">// relX within the hit rect<\/span><\/span>","<span class=\"cl\">hit.onOver  = <span class=\"c-k\">function<\/span>(e) { buttonSprite.alpha = <span class=\"c-n\">1.0<\/span>; };<\/span>","<span class=\"cl\">hit.onOut   = <span class=\"c-k\">function<\/span>(e) { buttonSprite.alpha = <span class=\"c-n\">0.8<\/span>; };<\/span>","<span class=\"cl\">hit.onPush  = <span class=\"c-k\">function<\/span>(e) { <span class=\"c-c\">/* press feedback */<\/span> };<\/span>","<span class=\"cl\">hit.cursor = hxd.<span class=\"c-t\">Cursor<\/span>.<span class=\"c-t\">Button<\/span>;   <span class=\"c-c\">// finger/hand cursor on desktop<\/span><\/span>","<span class=\"cl\">hit.isEllipse = <span class=\"c-k\">false<\/span>;            <span class=\"c-c\">// circular hit tests for round UI<\/span><\/span>"],"raw":"final hit = new h2d.Interactive(200, 48, buttonSprite); // w, h, parent\nhit.onClick = function(e) trace('clicked at ${e.relX},${e.relY}'); // relX within the hit rect\nhit.onOver  = function(e) { buttonSprite.alpha = 1.0; };\nhit.onOut   = function(e) { buttonSprite.alpha = 0.8; };\nhit.onPush  = function(e) { /* press feedback */ };\nhit.cursor = hxd.Cursor.Button;   // finger/hand cursor on desktop\nhit.isEllipse = false;            // circular hit tests for round UI"},{"k":"ul","i":["Interactives are z-sorted automatically: the top-most interactive under the pointer receives the event.","<code>e.cancel = true<\/code> in a handler stops propagation to interactives below.","Interactives work with touch for free — they are the reason UI code is input-agnostic."]},{"k":"best","t":"Resize interactives with their visuals","h":"Keep hit rectangles generous on touch (44px+ minimum, Chapter 12) and update width/height whenever the visual scales."}],"src":"04_ch03.txt:204","n":77},{"ch":4,"kind":"content","title":"The ColorMatrix Filter: Brightness, Contrast, Flash","tt":"The ColorMatrix Filter: Brightness, Contrast, Flash","blocks":[{"k":"p","h":"When tinting is not enough, <code>h2d.filter.ColorMatrix<\/code> multiplies every pixel by a 4x5 matrix — brightness, saturation, hue and the classic hit-flash."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> cm = <span class=\"c-k\">new<\/span> h2d.filter.<span class=\"c-t\">ColorMatrix<\/span>();<\/span>","<span class=\"cl\">bmp.filter = cm;<\/span>","<span class=\"cl\"><span class=\"c-c\">// brightness +20%: scale RGB<\/span><\/span>","<span class=\"cl\">cm.matrix.scale(<span class=\"c-n\">1.2<\/span>, <span class=\"c-n\">1.2<\/span>, <span class=\"c-n\">1.2<\/span>, <span class=\"c-n\">1<\/span>);<\/span>","<span class=\"cl\"><span class=\"c-c\">// desaturate (grayscale):<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> grey = <span class=\"c-k\">new<\/span> h3d.<span class=\"c-t\">Matrix<\/span>();<\/span>","<span class=\"cl\">grey.colorSaturation(<span class=\"c-n\">0.0<\/span>);<\/span>","<span class=\"cl\">cm.matrix = grey;<\/span>","<span class=\"cl\">bmp.filter = <span class=\"c-k\">null<\/span>;   <span class=\"c-c\">// remove — IMPORTANT on mobile (see pitfall)<\/span><\/span>"],"raw":"final cm = new h2d.filter.ColorMatrix();\nbmp.filter = cm;\n// brightness +20%: scale RGB\ncm.matrix.scale(1.2, 1.2, 1.2, 1);\n// desaturate (grayscale):\nfinal grey = new h3d.Matrix();\ngrey.colorSaturation(0.0);\ncm.matrix = grey;\nbmp.filter = null;   // remove — IMPORTANT on mobile (see pitfall)"},{"k":"ul","i":["Filters render the drawable into a texture first — powerful but not free (Chapter 11 measures the cost)."]},{"k":"pit","t":"Filters silently allocate render targets","h":"Every filtered drawable costs an offscreen buffer per frame while attached. Attach on state change (flash start), detach when done; never ship a permanently-filtered HUD."}],"src":"04_ch03.txt:220","n":78},{"ch":4,"kind":"content","title":"ScaleGrid: 9-Slice UI Panels","tt":"ScaleGrid: 9-Slice UI Panels","blocks":[{"k":"p","h":"One small panel texture stretches to every button, dialog and tooltip in the game without distortion."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// panel.png: 48x48, borders of 16px hold the frame art<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> panel = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">ScaleGrid<\/span>(<span class=\"c-t\">Res<\/span>.img.panel.toTile(), <span class=\"c-n\">16<\/span>, <span class=\"c-n\">16<\/span>, s2d);<\/span>","<span class=\"cl\">panel.width = <span class=\"c-n\">420<\/span>;      <span class=\"c-c\">// stretches only the middle<\/span><\/span>","<span class=\"cl\">panel.height = <span class=\"c-n\">160<\/span>;<\/span>","<span class=\"cl\">panel.tileBorders = <span class=\"c-k\">false<\/span>; <span class=\"c-c\">// stretch borders too (rarely wanted)<\/span><\/span>"],"raw":"// panel.png: 48x48, borders of 16px hold the frame art\nfinal panel = new h2d.ScaleGrid(Res.img.panel.toTile(), 16, 16, s2d);\npanel.width = 420;      // stretches only the middle\npanel.height = 160;\npanel.tileBorders = false; // stretch borders too (rarely wanted)"},{"k":"ul","i":["Corners stay pixel-perfect, edges stretch, center tiles.","One texture = every dialog size — the backbone of Chapter 7's skin system."]},{"k":"best","t":"Author UI textures at the smallest useful size ; scale up ScaleGrid panels to the layout's need and memory stays tiny while radii stay consistent.","h":""}],"src":"04_ch03.txt:233","n":79},{"ch":4,"kind":"content","title":"Flow: Automatic Layout Containers","tt":"Flow: Automatic Layout Containers","blocks":[{"k":"p","h":"<code>h2d.Flow<\/code> is h2d's layout engine: stack children horizontally/vertically, with gaps, padding, alignment and wrapping. It powers the whole UI chapter."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">final<\/span> row = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Flow<\/span>(s2d);<\/span>","<span class=\"cl\">row.horizontal = <span class=\"c-k\">true<\/span>;          <span class=\"c-c\">// children left→right (false = vertical)<\/span><\/span>","<span class=\"cl\">row.spacing = <span class=\"c-n\">8<\/span>;               <span class=\"c-c\">// gap between children (px)<\/span><\/span>","<span class=\"cl\">row.padding = <span class=\"c-n\">12<\/span>;              <span class=\"c-c\">// inner padding on all sides<\/span><\/span>","<span class=\"cl\">row.verticalAlign = h2d.<span class=\"c-t\">Flow<\/span>.<span class=\"c-t\">FlowAlign<\/span>.<span class=\"c-t\">Middle<\/span>;<\/span>","<span class=\"cl\">row.align = h2d.<span class=\"c-t\">Flow<\/span>.<span class=\"c-t\">FlowAlign<\/span>.<span class=\"c-t\">Left<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">row.addChild(label);<\/span>","<span class=\"cl\">row.addChild(icon);<\/span>","<span class=\"cl\">row.addChild(button);<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">row.maxWidth = <span class=\"c-n\">400<\/span>;            <span class=\"c-c\">// wraps into rows when exceeded<\/span><\/span>","<span class=\"cl\">row.multiline = <span class=\"c-k\">true<\/span>;          <span class=\"c-c\">// enable wrapping mode<\/span><\/span>","<span class=\"cl\">row.isGridLayout = <span class=\"c-k\">false<\/span>;      <span class=\"c-c\">// uniform grid mode also available<\/span><\/span>"],"raw":"final row = new h2d.Flow(s2d);\nrow.horizontal = true;          // children left→right (false = vertical)\nrow.spacing = 8;               // gap between children (px)\nrow.padding = 12;              // inner padding on all sides\nrow.verticalAlign = h2d.Flow.FlowAlign.Middle;\nrow.align = h2d.Flow.FlowAlign.Left;\n\nrow.addChild(label);\nrow.addChild(icon);\nrow.addChild(button);\n\nrow.maxWidth = 400;            // wraps into rows when exceeded\nrow.multiline = true;          // enable wrapping mode\nrow.isGridLayout = false;      // uniform grid mode also available"},{"k":"ul","i":["Flow is reactive: add/remove children and it reflows on the next update automatically.","Flows nest: rows of columns of rows build any dialog without manual x/y."]},{"k":"pit","t":"Absolute positions inside a Flow","h":"Manually setting <code>child.x<\/code> inside a Flow gets overwritten on the next reflow. Escape via an inner <code>h2d.Object<\/code> wrapper when a child truly needs free placement."}],"src":"04_ch03.txt:255","n":80},{"ch":4,"kind":"content","title":"Custom Drawables: Extending h2d.Drawable","tt":"Custom Drawables: Extending h2d.Drawable","blocks":[{"k":"p","h":"When you need drawing primitives beyond tiles and shapes, subclass <code>Drawable<\/code> and own the sync step. This is how minimal custom renderers (and later, debug layers) are born."},{"k":"code","lang":"haxe","file":"Crosshair.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Crosshair<\/span> <span class=\"c-k\">extends<\/span> h2d.<span class=\"c-t\">Drawable<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> tex : h3d.mat.<span class=\"c-t\">Texture<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(?parent) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">super<\/span>(parent);<\/span>","<span class=\"cl\">        tex = h2d.<span class=\"c-t\">Tile<\/span>.fromColor(<span class=\"c-n\">0xFFFFFF<\/span>).getTexture();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> sync(ctx:h2d.<span class=\"c-t\">RenderContext<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">super<\/span>.sync(ctx);                       <span class=\"c-c\">// keep transform machinery<\/span><\/span>","<span class=\"cl\">        <span class=\"c-c\">// custom tile emission goes through drawTile — see the<\/span><\/span>","<span class=\"cl\">        <span class=\"c-c\">// h2d.Drawable sources; most games instead compose:<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Crosshair extends h2d.Drawable {\n    var tex : h3d.mat.Texture;\n    public function new(?parent) {\n        super(parent);\n        tex = h2d.Tile.fromColor(0xFFFFFF).getTexture();\n    }\n    override function sync(ctx:h2d.RenderContext) {\n        super.sync(ctx);                       // keep transform machinery\n        // custom tile emission goes through drawTile — see the\n        // h2d.Drawable sources; most games instead compose:\n    }\n}"},{"k":"ul","i":["In practice, composing Bitmap/Anim/Graphics covers 95% of needs; true custom drawables are for batched special cases (thousands of glyphs, custom batchers)."]},{"k":"best","t":"Compose before you subclass","h":"Reaching for a custom Drawable before exhausting composition is the classic over-engineering trap — the scene graph is already a batching system."}],"src":"04_ch03.txt:274","n":81},{"ch":4,"kind":"content","title":"Scene Background, Zoom and Camera Basics","tt":"Scene Background, Zoom and Camera Basics","blocks":[{"k":"p","h":"<code>h2d.Scene<\/code> ships the essentials of a 2D camera: background color, zoom, and camera offsets."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\">s2d.backgroundColor = <span class=\"c-n\">0x0B0E14<\/span>;    <span class=\"c-c\">// scene clear color (null = transparent)<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">s2d.zoom = <span class=\"c-n\">2<\/span>;                     <span class=\"c-c\">// 2x magnification (pixel-art friendly)<\/span><\/span>","<span class=\"cl\">s2d.cameraX = <span class=\"c-n\">500<\/span>;                <span class=\"c-c\">// scroll: what the camera centers on<\/span><\/span>","<span class=\"cl\">s2d.cameraY = <span class=\"c-n\">300<\/span>;                <span class=\"c-c\">// (top-left of the zoomed view)<\/span><\/span>"],"raw":"s2d.backgroundColor = 0x0B0E14;    // scene clear color (null = transparent)\n\ns2d.zoom = 2;                     // 2x magnification (pixel-art friendly)\ns2d.cameraX = 500;                // scroll: what the camera centers on\ns2d.cameraY = 300;                // (top-left of the zoomed view)"},{"k":"ul","i":["<code>cameraX/cameraY<\/code> + <code>zoom<\/code> define the visible rectangle: width = <code>s2d.width / zoom<\/code>.","Chapter 6 builds the real game camera (dead zones, locks, shake) by writing <code>cameraX/cameraY<\/code> every frame."]},{"k":"note","h":"With <code>setFixedSize<\/code>, zoom works on top of the fixed internal resolution — <code>zoom = 2<\/code> on a 640x360 fixed size yields an effective 320x180 view, the classic pixel-art recipe."}],"src":"04_ch03.txt:287","n":82},{"ch":4,"kind":"content","title":"Project: Bouncing Logo Playground","tt":"Project: Bouncing Logo Playground","blocks":[{"k":"p","h":"Close the chapter by exercising every drawable in one screen — Cavern Run's debug sandbox."},{"k":"code","lang":"haxe","file":"Playground.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Playground<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(s2d:h2d.<span class=\"c-t\">Scene<\/span>) {<\/span>","<span class=\"cl\">        s2d.backgroundColor = <span class=\"c-n\">0x101018<\/span>;<\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> sheet = <span class=\"c-t\">Res<\/span>.img.spritesheet.toTile();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> frames = [ <span class=\"c-k\">for<\/span> (i in <span class=\"c-n\">0<\/span>...<span class=\"c-n\">8<\/span>) sheet.sub(i * <span class=\"c-n\">32<\/span>, <span class=\"c-n\">0<\/span>, <span class=\"c-n\">32<\/span>, <span class=\"c-n\">48<\/span>) ];<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (t in frames) t.setCenterRatio();   <span class=\"c-c\">// center pivots<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> hero = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Anim<\/span>(frames, <span class=\"c-n\">10<\/span>, s2d);<\/span>","<span class=\"cl\">        hero.x = <span class=\"c-n\">640<\/span>; hero.y = <span class=\"c-n\">400<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> label = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Text<\/span>(<span class=\"c-t\">Res<\/span>.fnt.montserrat.toFont(), s2d);<\/span>","<span class=\"cl\">        label.text = <span class=\"c-s\">\"h2d playground\"<\/span>;<\/span>","<span class=\"cl\">        label.dropShadow = { dx : <span class=\"c-n\">1<\/span>, dy : <span class=\"c-n\">1<\/span>, color : <span class=\"c-n\">0<\/span>, alpha : <span class=\"c-n\">0.6<\/span> };<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> g = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Graphics<\/span>(s2d);<\/span>","<span class=\"cl\">        g.beginFill(<span class=\"c-n\">0x334466<\/span>, <span class=\"c-n\">0.5<\/span>); g.drawRect(<span class=\"c-n\">32<\/span>, <span class=\"c-n\">32<\/span>, <span class=\"c-n\">200<\/span>, <span class=\"c-n\">100<\/span>); g.endFill();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-k\">final<\/span> glow = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>(h2d.<span class=\"c-t\">Tile<\/span>.fromColor(<span class=\"c-n\">0x88AAFF<\/span>, <span class=\"c-n\">64<\/span>, <span class=\"c-n\">64<\/span>), s2d);<\/span>","<span class=\"cl\">        glow.blendMode = <span class=\"c-t\">Add<\/span>;<\/span>","<span class=\"cl\">        glow.tile.setCenter();<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Playground {\n    public function new(s2d:h2d.Scene) {\n        s2d.backgroundColor = 0x101018;\n        final sheet = Res.img.spritesheet.toTile();\n\n        final frames = [ for (i in 0...8) sheet.sub(i * 32, 0, 32, 48) ];\n        for (t in frames) t.setCenterRatio();   // center pivots\n        final hero = new h2d.Anim(frames, 10, s2d);\n        hero.x = 640; hero.y = 400;\n\n        final label = new h2d.Text(Res.fnt.montserrat.toFont(), s2d);\n        label.text = \"h2d playground\";\n        label.dropShadow = { dx : 1, dy : 1, color : 0, alpha : 0.6 };\n\n        final g = new h2d.Graphics(s2d);\n        g.beginFill(0x334466, 0.5); g.drawRect(32, 32, 200, 100); g.endFill();\n\n        final glow = new h2d.Bitmap(h2d.Tile.fromColor(0x88AAFF, 64, 64), s2d);\n        glow.blendMode = Add;\n        glow.tile.setCenter();\n    }\n}"},{"k":"ul","i":["Add motion in <code>update()<\/code> (Chapter 2's <code>dt<\/code> discipline) and you have every visual primitive the capstone uses."]}],"src":"04_ch03.txt:315","n":83},{"ch":4,"kind":"content","title":"Chapter 3 Checklist","tt":"Chapter 3 Checklist","blocks":[{"k":"ul","i":["You can explain parent-child transforms and predict where a child renders.","Tiles: sub, setCenter, dx/dy; atlas subs share one texture.","Bitmap tint/alpha/blend; Anim basics; Text with BMFont; Graphics shapes.","Layers z-order convention written down for Cavern Run.","Interactive hit rectangles wired and cancellable.","Flow layout understood — Chapter 7 builds all UI on it.","<code>cameraX/cameraY/zoom<\/code> and fixed-size interaction clear."]}],"src":"04_ch03.txt:324","n":84},{"ch":5,"kind":"chapter","title":"Game Architecture: Patterns That Scale","tt":"Game Architecture: Patterns That Scale","sub":"From scripts to systems — the coordinator, world controller, world renderer, Entity-Component and MVC, applied to Heaps.","blocks":[],"src":"05_ch04.txt:1","n":85},{"ch":5,"kind":"content","title":"Why Architecture Matters in Games","tt":"Why Architecture Matters in Games","blocks":[{"k":"p","h":"Every game starts as one file — Heaps makes that pleasant. And every game past 2,000 lines punishes it. Architecture is deciding, <em>before<\/em> the pain, where each kind of change goes."},{"k":"ul","i":["<b>Change velocity<\/b>: gameplay changes daily. Architecture isolates those changes so they do not ripple.","<b>Team scaling<\/b>: two programmers can double a codebase only if they never edit the same file.","<b>Testing and debugging<\/b>: when the world (simulation) is separate from the scene graph (presentation), crashes become reproducible, not \"visual\".","<b>Reuse<\/b>: Cavern Run's architecture is Orbital Salvage's architecture — that reuse is Chapter 14's superpower."]},{"k":"pit","t":"The two failure modes","h":"Architecture-less: speed for a week, then every bug fix breaks two features. Architecture-first: three weeks of abstract classes and no game. This course threads the needle: five concrete classes, zero frameworks."}],"src":"05_ch04.txt:11","n":86},{"ch":5,"kind":"content","title":"The Layered Architecture of This Course","tt":"The Layered Architecture of This Course","blocks":[{"k":"p","h":"One diagram to memorize — it is the map of both capstones and of most shipped Heaps games."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">Main (hxd.App)                       boot, wiring — Chapter 2 skeleton<\/span>","<span class=\"cl\">   │<\/span>","<span class=\"cl\">GameCoordinator  (Game)              owns screens, world, global services<\/span>","<span class=\"cl\">   ├── ScreenManager                title / play / settings (Chapter 7)<\/span>","<span class=\"cl\">   ├── WorldController (World)      SIMULATION: entities, physics, rules<\/span>","<span class=\"cl\">   │     └── Entities + Systems     data + behavior (this chapter)<\/span>","<span class=\"cl\">   ├── WorldRenderer                PRESENTATION: scene-graph views of entities<\/span>","<span class=\"cl\">   │     └── views (Bitmap/Anim…)   h2d objects only<\/span>","<span class=\"cl\">   └── services: Input, Sfx, Save, Config<\/span>"],"raw":"Main (hxd.App)                       boot, wiring — Chapter 2 skeleton\n   │\nGameCoordinator  (Game)              owns screens, world, global services\n   ├── ScreenManager                title / play / settings (Chapter 7)\n   ├── WorldController (World)      SIMULATION: entities, physics, rules\n   │     └── Entities + Systems     data + behavior (this chapter)\n   ├── WorldRenderer                PRESENTATION: scene-graph views of entities\n   │     └── views (Bitmap/Anim…)   h2d objects only\n   └── services: Input, Sfx, Save, Config"},{"k":"ul","i":["<b>Rule of arrows<\/b>: Game talks down; World never reaches up; Renderer reads World.","Simulation must run — and even be testable — with the scene graph absent."]},{"k":"best","t":"Steal this layering, do not invent one on slide 3","h":"Boring, battle-tested, and small. You can always add layers later; removing wrong ones is the expensive direction."}],"src":"05_ch04.txt:28","n":87},{"ch":5,"kind":"content","title":"The Game Coordinator: Duties and Code","tt":"The Game Coordinator: Duties and Code","blocks":[{"k":"p","h":"The coordinator is the top object below <code>Main<\/code>. It owns frame order and global services — nothing else."},{"k":"code","lang":"haxe","file":"Game.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Game<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> me : <span class=\"c-t\">Game<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> world(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">WorldController<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> renderer(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">WorldRenderer<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> screens(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">ScreenManager<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(s2d:h2d.<span class=\"c-t\">Scene<\/span>, s3d:h3d.scene.<span class=\"c-t\">Scene<\/span>) {<\/span>","<span class=\"cl\">        me = <span class=\"c-k\">this<\/span>;<\/span>","<span class=\"cl\">        screens = <span class=\"c-k\">new<\/span> <span class=\"c-t\">ScreenManager<\/span>(<span class=\"c-k\">this<\/span>);        <span class=\"c-c\">// Chapter 7<\/span><\/span>","<span class=\"cl\">        world = <span class=\"c-k\">new<\/span> <span class=\"c-t\">WorldController<\/span>();<\/span>","<span class=\"cl\">        renderer = <span class=\"c-k\">new<\/span> <span class=\"c-t\">WorldRenderer<\/span>(world, s2d);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> start() screens.show(<span class=\"c-k\">new<\/span> <span class=\"c-t\">TitleScreen<\/span>());<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        screens.update(dt);      <span class=\"c-c\">// screens own the world while playing<\/span><\/span>","<span class=\"cl\">        world.update(dt);<\/span>","<span class=\"cl\">        renderer.sync();         <span class=\"c-c\">// presentation AFTER simulation<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> render() {}  <span class=\"c-c\">// h2d renders itself; hook for custom passes<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> onResize(w, h) screens.onResize(w, h);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Game {\n    public static var me : Game;\n\n    public var world(default, null) : WorldController;\n    public var renderer(default, null) : WorldRenderer;\n    public var screens(default, null) : ScreenManager;\n\n    public function new(s2d:h2d.Scene, s3d:h3d.scene.Scene) {\n        me = this;\n        screens = new ScreenManager(this);        // Chapter 7\n        world = new WorldController();\n        renderer = new WorldRenderer(world, s2d);\n    }\n    public function start() screens.show(new TitleScreen());\n\n    public function update(dt:Float) {\n        screens.update(dt);      // screens own the world while playing\n        world.update(dt);\n        renderer.sync();         // presentation AFTER simulation\n    }\n    public function render() {}  // h2d renders itself; hook for custom passes\n    public function onResize(w, h) screens.onResize(w, h);\n}"},{"k":"ul","i":["Note what is <em>absent<\/em>: no gameplay rules, no drawing, no input polling. The coordinator coordinates."]},{"k":"pit","t":"The god-object trap","h":"The moment <code>Game<\/code> grows a <code>player:Hero<\/code> field or <code>spawnGem()<\/code> method, the architecture is dead. Route through the world; the coordinator schedules, it does not play."}],"src":"05_ch04.txt:58","n":88},{"ch":5,"kind":"content","title":"The World Controller: Owning Simulation State","tt":"The World Controller: Owning Simulation State","blocks":[{"k":"p","h":"<code>WorldController<\/code> (this course calls it <code>World<\/code>) holds entities, advances rules, answers queries. It is the \"model\" half of the game."},{"k":"code","lang":"haxe","file":"WorldController.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">WorldController<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> entities(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">Array<\/span>&lt;<span class=\"c-t\">Entity<\/span>&gt; = [];<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> level(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">LevelData<\/span>;      <span class=\"c-c\">// Chapter 5<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> state(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">PlayState<\/span> = <span class=\"c-t\">Playing<\/span>; <span class=\"c-c\">// enum<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> loadLevel(data:<span class=\"c-t\">LevelData<\/span>) {<\/span>","<span class=\"cl\">        entities = [];<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (e in data.spawnEntities()) entities.push(e);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (e in entities) e.update(dt);       <span class=\"c-c\">// behavior lives in entities<\/span><\/span>","<span class=\"cl\">        cleanupDead();                          <span class=\"c-c\">// deferred removal (below)<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> player() : <span class=\"c-t\">Hero<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-k\">cast<\/span> entities.find(e -&gt; e.isPlayer);<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">enum<\/span> <span class=\"c-k\">abstract<\/span> <span class=\"c-t\">PlayState<\/span>(<span class=\"c-t\">Int<\/span>) { <span class=\"c-k\">final<\/span> <span class=\"c-t\">Playing<\/span>; <span class=\"c-k\">final<\/span> <span class=\"c-t\">Paused<\/span>; <span class=\"c-k\">final<\/span> <span class=\"c-t\">GameOver<\/span>; }<\/span>"],"raw":"class WorldController {\n    public var entities(default, null) : Array<Entity> = [];\n    public var level(default, null) : LevelData;      // Chapter 5\n    public var state(default, null) : PlayState = Playing; // enum\n\n    public function loadLevel(data:LevelData) {\n        entities = [];\n        for (e in data.spawnEntities()) entities.push(e);\n    }\n    public function update(dt:Float) {\n        for (e in entities) e.update(dt);       // behavior lives in entities\n        cleanupDead();                          // deferred removal (below)\n    }\n    public function player() : Hero\n        return cast entities.find(e -> e.isPlayer);\n}\nenum abstract PlayState(Int) { final Playing; final Paused; final GameOver; }"},{"k":"ul","i":["The world is pure Haxe: no <code>h2d<\/code> imports. That one constraint is the architecture."]},{"k":"best","t":"Deferred entity removal","h":"Removing while iterating corrupts the loop. Mark dead (<code>e.dead = true<\/code>), sweep after the loop — one line that prevents a classic crash class."}],"src":"05_ch04.txt:82","n":89},{"ch":5,"kind":"content","title":"The World Renderer: Owning Presentation","tt":"The World Renderer: Owning Presentation","blocks":[{"k":"p","h":"<code>WorldRenderer<\/code> mirrors the world into the scene graph. Views are dumb; they display what entities already decided."},{"k":"code","lang":"haxe","file":"WorldRenderer.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">WorldRenderer<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> world : <span class=\"c-t\">WorldController<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> root : h2d.<span class=\"c-t\">Layers<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> views = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Map<\/span>&lt;<span class=\"c-t\">Entity<\/span>, <span class=\"c-t\">EntityView<\/span>&gt;();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(world, s2d:h2d.<span class=\"c-t\">Scene<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">this<\/span>.world = world;<\/span>","<span class=\"cl\">        root = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Layers<\/span>(s2d);<\/span>","<span class=\"cl\">        root.add(staticLayer = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Layers<\/span>(), <span class=\"c-n\">0<\/span>);<\/span>","<span class=\"cl\">        root.add(entityLayer = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Layers<\/span>(), <span class=\"c-n\">10<\/span>);<\/span>","<span class=\"cl\">        root.add(fxLayer = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Layers<\/span>(), <span class=\"c-n\">20<\/span>);<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> sync() {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// add views for new entities, drop views for dead ones<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (e in world.entities) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (!views.exists(e)) { <span class=\"c-k\">final<\/span> v = makeView(e); views[e] = v; entityLayer.add(v, e.layer); }<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (e in views.keys())<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (e.dead) { views[e].remove(); views.remove(e); }<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (v in views) v.sync();   <span class=\"c-c\">// view reads its entity, updates h2d objects<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class WorldRenderer {\n    final world : WorldController;\n    final root : h2d.Layers;\n    final views = new Map<Entity, EntityView>();\n\n    public function new(world, s2d:h2d.Scene) {\n        this.world = world;\n        root = new h2d.Layers(s2d);\n        root.add(staticLayer = new h2d.Layers(), 0);\n        root.add(entityLayer = new h2d.Layers(), 10);\n        root.add(fxLayer = new h2d.Layers(), 20);\n    }\n    public function sync() {\n        // add views for new entities, drop views for dead ones\n        for (e in world.entities) {\n            if (!views.exists(e)) { final v = makeView(e); views[e] = v; entityLayer.add(v, e.layer); }\n        }\n        for (e in views.keys())\n            if (e.dead) { views[e].remove(); views.remove(e); }\n        for (v in views) v.sync();   // view reads its entity, updates h2d objects\n    }\n}"},{"k":"ul","i":["<code>sync()<\/code> runs after <code>world.update()<\/code>: views copy positions, swap Anim frames, show/hide.","Views never write back into the world (no <code>entity.x = view.x<\/code>)."]},{"k":"pit","t":"Presentation logic leaking into simulation","h":"\"Death particles played\" is renderer business; \"entity died\" is world business. If you can say it without mentioning pixels, it belongs in the world."}],"src":"05_ch04.txt:112","n":90},{"ch":5,"kind":"content","title":"Separating Simulation from Presentation: Payoffs","tt":"Separating Simulation from Presentation: Payoffs","blocks":[{"k":"p","h":"The discipline feels heavy on slide 10 and pays every day after slide 11."},{"k":"ul","i":["<b>Determinism<\/b>: fixed-step simulation (Chapter 2) with no rendering inside means replays and lockstep multiplayer remain possible.","<b>Headless testing<\/b>: load a level, run 600 ticks, assert the player reached the exit — a unit test with no window.","<b>Hot-swap rendering<\/b>: the Orbital Salvage renderer (h3d) plugs into the same world interface.","<b>Performance freedom<\/b>: when entities exceed 1,000, Chapter 8 replaces per-entity Anim views with a batched renderer — simulation untouched."]},{"k":"best","t":"The \"no h2d import\" audit","h":"Once per milestone, grep the simulation package for <code>h2d.<\/code>/<code>h3d.<\/code> — zero hits or the architecture needs repair. Five minutes, total protection."}],"src":"05_ch04.txt:120","n":91},{"ch":5,"kind":"content","title":"The Entity Model: Plain Data First","tt":"The Entity Model: Plain Data First","blocks":[{"k":"p","h":"Before patterns, the base type. An entity is: an id, a transform, a category, behavior hooks, and a death flag. Resist adding more."},{"k":"code","lang":"haxe","file":"Entity.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Entity<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> <span class=\"c-t\">NEXT_ID<\/span> = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">final<\/span> id : <span class=\"c-t\">Int<\/span> = <span class=\"c-t\">NEXT_ID<\/span>++;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> kind(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">EntityKind<\/span>;     <span class=\"c-c\">// enum abstract<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> x : <span class=\"c-t\">Float<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> y : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> vx : <span class=\"c-t\">Float<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> vy : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> w : <span class=\"c-t\">Float<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> h : <span class=\"c-t\">Float<\/span>;      <span class=\"c-c\">// AABB (Chapter 6)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> dead = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> layer(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">Int<\/span> = <span class=\"c-n\">10<\/span>;      <span class=\"c-c\">// renderer hint<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> view : <span class=\"c-t\">EntityView<\/span>;                    <span class=\"c-c\">// renderer writes this, world never reads it<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(kind, x, y) { <span class=\"c-k\">this<\/span>.kind = kind; <span class=\"c-k\">this<\/span>.x = x; <span class=\"c-k\">this<\/span>.y = y; }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {}              <span class=\"c-c\">// behavior override point<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> isPlayer() <span class=\"c-k\">return<\/span> kind == <span class=\"c-t\">KPlayer<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-k\">enum<\/span> <span class=\"c-k\">abstract<\/span> <span class=\"c-t\">EntityKind<\/span>(<span class=\"c-t\">Int<\/span>) { <span class=\"c-k\">final<\/span> <span class=\"c-t\">KPlayer<\/span>; <span class=\"c-k\">final<\/span> <span class=\"c-t\">KBat<\/span>; <span class=\"c-k\">final<\/span> <span class=\"c-t\">KGem<\/span>; <span class=\"c-k\">final<\/span> <span class=\"c-t\">KDoor<\/span>; <span class=\"c-k\">final<\/span> <span class=\"c-t\">KCrate<\/span>; }<\/span>"],"raw":"class Entity {\n    static var NEXT_ID = 0;\n    public final id : Int = NEXT_ID++;\n    public var kind(default, null) : EntityKind;     // enum abstract\n    public var x : Float; public var y : Float;\n    public var vx : Float; public var vy : Float;\n    public var w : Float; public var h : Float;      // AABB (Chapter 6)\n    public var dead = false;\n    public var layer(default, null) : Int = 10;      // renderer hint\n    public var view : EntityView;                    // renderer writes this, world never reads it\n    public function new(kind, x, y) { this.kind = kind; this.x = x; this.y = y; }\n    public function update(dt:Float) {}              // behavior override point\n    public inline function isPlayer() return kind == KPlayer;\n}\nenum abstract EntityKind(Int) { final KPlayer; final KBat; final KGem; final KDoor; final KCrate; }"},{"k":"ul","i":["No <code>h2d.Bitmap<\/code> inside. <code>view<\/code> exists for the renderer's convenience — the world never touches it."]},{"k":"best","t":"Composition over fields-per-feature","h":"When \"bat also needs a fuse timer\", do not add <code>fuse:Float<\/code> to Entity — next slide's components handle cross-cutting data without bloating the base."}],"src":"05_ch04.txt:142","n":92},{"ch":5,"kind":"content","title":"The Entity-Component Pattern: Principles","tt":"The Entity-Component Pattern: Principles","blocks":[{"k":"p","h":"EC is not a framework — it is the observation that <b>behavior = data + loop over data<\/b>. This course implements it in ~80 lines, not a library."},{"k":"ul","i":["<b>Component<\/b> = a bag of data attached to entities that need it (Position exists on all; Fuse only on bombs).","<b>System<\/b> = a function that iterates entities having a component set and updates it (FuseSystem decrements and explodes).","<b>Entity<\/b> stays the identity unit — what saves refer to, what views attach to."]},{"k":"two","a":[{"k":"p","h":"<b>When plain classes win<\/b>"},{"k":"ul","i":["small entity counts (&lt; 200)","few shared behaviors","gameplay-coded, not data-coded","Cavern Run default"]}],"b":[{"k":"p","h":"<b>When EC wins<\/b>"},{"k":"ul","i":["hundreds/thousands of entities","behaviors composed per-level","designers tune component bags","bullet-heaven style games"]}]},{"k":"note","h":"Chapters 8 (particles) and 14 (3D debris) hit EC-shaped problems; the course uses EC there and plain entities elsewhere. Choose per problem, not per fashion."}],"src":"05_ch04.txt:164","n":93},{"ch":5,"kind":"content","title":"EC Implementation: Components and Registry","tt":"EC Implementation: Components and Registry","blocks":[{"k":"p","h":"Data as classes, attachment via a type-keyed map. No macros, no magic, fully debuggable."},{"k":"code","lang":"haxe","file":"Components.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Component<\/span> { <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> entity : <span class=\"c-t\">Entity<\/span>; }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Fuse<\/span> <span class=\"c-k\">extends<\/span> <span class=\"c-t\">Component<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> time = <span class=\"c-n\">1.0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> power = <span class=\"c-n\">10<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Health<\/span> <span class=\"c-k\">extends<\/span> <span class=\"c-t\">Component<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> hp = <span class=\"c-n\">1<\/span>; <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> max = <span class=\"c-n\">1<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> hit(n) { hp -= n; <span class=\"c-k\">if<\/span> (hp &lt;= <span class=\"c-n\">0<\/span>) entity.dead = <span class=\"c-k\">true<\/span>; }<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// On Entity:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Entity<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> comps = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Map<\/span>&lt;<span class=\"c-t\">Class<\/span>&lt;<span class=\"c-t\">Component<\/span>&gt;, <span class=\"c-t\">Component<\/span>&gt;();<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> add&lt;<span class=\"c-t\">T<\/span>:<span class=\"c-t\">Component<\/span>&gt;(c:<span class=\"c-t\">T<\/span>) : <span class=\"c-t\">T<\/span> {<\/span>","<span class=\"cl\">        c.entity = <span class=\"c-k\">this<\/span>; comps[<span class=\"c-t\">Type<\/span>.getClass(c)] = c; <span class=\"c-k\">return<\/span> c;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> get&lt;<span class=\"c-t\">T<\/span>:<span class=\"c-t\">Component<\/span>&gt;(cl:<span class=\"c-t\">Class<\/span>&lt;<span class=\"c-t\">T<\/span>&gt;) : <span class=\"c-t\">T<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> <span class=\"c-k\">cast<\/span> comps[cl];<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">inline<\/span> <span class=\"c-k\">function<\/span> has(cl) <span class=\"c-k\">return<\/span> comps.exists(cl);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Component { public var entity : Entity; }\n\nclass Fuse extends Component {\n    public var time = 1.0;\n    public var power = 10;\n}\n\nclass Health extends Component {\n    public var hp = 1; public var max = 1;\n    public function hit(n) { hp -= n; if (hp <= 0) entity.dead = true; }\n}\n\n// On Entity:\nclass Entity {\n    var comps = new Map<Class<Component>, Component>();\n    public function add<T:Component>(c:T) : T {\n        c.entity = this; comps[Type.getClass(c)] = c; return c;\n    }\n    public function get<T:Component>(cl:Class<T>) : T\n        return cast comps[cl];\n    public inline function has(cl) return comps.exists(cl);\n}"},{"k":"best","t":"Components hold data, systems hold code","h":"A <code>hit()<\/code> on Health is acceptable sugar, but the rule of thumb keeps physics/AI in systems so iteration order (and therefore determinism) is explicit."}],"src":"05_ch04.txt:192","n":94},{"ch":5,"kind":"content","title":"EC Implementation: Systems as Functions","tt":"EC Implementation: Systems as Functions","blocks":[{"k":"p","h":"Systems are ordered, named steps — the world's update becomes a readable pipeline."},{"k":"code","lang":"haxe","file":"Systems.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Systems<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> run(w:<span class=\"c-t\">WorldController<\/span>, dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        fuse(w, dt);        <span class=\"c-c\">// timers → explosions<\/span><\/span>","<span class=\"cl\">        health(w);          <span class=\"c-c\">// deaths flagged<\/span><\/span>","<span class=\"cl\">        ai(w, dt);          <span class=\"c-c\">// enemies steer<\/span><\/span>","<span class=\"cl\">        physics(w, dt);     <span class=\"c-c\">// movement + collision (Chapter 6)<\/span><\/span>","<span class=\"cl\">        pickups(w);         <span class=\"c-c\">// overlap → collect<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> fuse(w:<span class=\"c-t\">WorldController<\/span>, dt:<span class=\"c-t\">Float<\/span>)<\/span>","<span class=\"cl\">        <span class=\"c-k\">for<\/span> (e in w.entities) {<\/span>","<span class=\"cl\">            <span class=\"c-k\">final<\/span> f = e.get(<span class=\"c-t\">Fuse<\/span>);<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (f == <span class=\"c-k\">null<\/span>) <span class=\"c-k\">continue<\/span>;<\/span>","<span class=\"cl\">            f.time -= dt;<\/span>","<span class=\"cl\">            <span class=\"c-k\">if<\/span> (f.time &lt;= <span class=\"c-n\">0<\/span>) explode(w, e, f.power);<\/span>","<span class=\"cl\">        }<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> explode(w, e, power) { <span class=\"c-c\">/* spawn blast, flag crates */<\/span> }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Systems {\n    public static function run(w:WorldController, dt:Float) {\n        fuse(w, dt);        // timers → explosions\n        health(w);          // deaths flagged\n        ai(w, dt);          // enemies steer\n        physics(w, dt);     // movement + collision (Chapter 6)\n        pickups(w);         // overlap → collect\n    }\n    static function fuse(w:WorldController, dt:Float)\n        for (e in w.entities) {\n            final f = e.get(Fuse);\n            if (f == null) continue;\n            f.time -= dt;\n            if (f.time <= 0) explode(w, e, f.power);\n        }\n    static function explode(w, e, power) { /* spawn blast, flag crates */ }\n}"},{"k":"ul","i":["The order IS gameplay semantics: fuse before health, so a fuse-explosion this tick can kill this tick.","Each system is independently unit-testable with a hand-made world state."]},{"k":"pit","t":"Invisible coupling via order","h":"When a bug depends on \"system A before B\", add a comment at the pipeline and a test that pins the order — future-you will reorder otherwise."}],"src":"05_ch04.txt:217","n":95},{"ch":5,"kind":"content","title":"Composition vs Inheritance: The Practical Line","tt":"Composition vs Inheritance: The Practical Line","blocks":[{"k":"p","h":"Haxe gives you both. The course uses inheritance for the small stable spine, composition for the growing surface."},{"k":"ul","i":["<b>Inherit<\/b> identity and transform: <code>Entity<\/code> with x/y/dead — it never changes.","<b>Compose<\/b> capabilities: <code>Fuse<\/code>, <code>Health<\/code>, <code>Carrier<\/code> — they get added, removed and recombined weekly.","<b>Anti-pattern<\/b>: <code>Bat extends Enemy extends Entity<\/code> plus <code>Gem extends Pickup extends Entity<\/code> — when the bat needs health and the gem needs a fuse, diamond-shaped regret follows."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// The wrong road:<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\">// class Bat extends Enemy, class Crate extends Entity  // Crate wants fuse: stuck.<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// The course road:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> bat   = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Entity<\/span>(<span class=\"c-t\">KBat<\/span>, x, y);   bat.add(<span class=\"c-k\">new<\/span> <span class=\"c-t\">Health<\/span>(<span class=\"c-n\">3<\/span>));<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> crate = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Entity<\/span>(<span class=\"c-t\">KCrate<\/span>, x, y); crate.add(<span class=\"c-k\">new<\/span> <span class=\"c-t\">Fuse<\/span>(<span class=\"c-n\">1.5<\/span>, <span class=\"c-n\">8<\/span>));<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> gem   = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Entity<\/span>(<span class=\"c-t\">KGem<\/span>, x, y);   gem.layer = <span class=\"c-n\">12<\/span>;<\/span>"],"raw":"// The wrong road:\n// class Bat extends Enemy, class Crate extends Entity  // Crate wants fuse: stuck.\n\n// The course road:\nfinal bat   = new Entity(KBat, x, y);   bat.add(new Health(3));\nfinal crate = new Entity(KCrate, x, y); crate.add(new Fuse(1.5, 8));\nfinal gem   = new Entity(KGem, x, y);   gem.layer = 12;"}],"src":"05_ch04.txt:232","n":96},{"ch":5,"kind":"content","title":"MVC in Games: The Translation","tt":"MVC in Games: The Translation","blocks":[{"k":"p","h":"Model-View-Controller maps cleanly onto what we built — recognizing it helps you reuse pattern literature."},{"k":"table","head":["MVC term","In this architecture","Heaps objects involved"],"rows":[["Model","WorldController + entities/systems","none (pure Haxe)"],["View","WorldRenderer + EntityViews","h2d/h3d scene graph"],["Controller","InputManager + screens (intent routing)","hxd.Key/Pad/Interactive"]]},{"k":"ul","i":["Input (controller) mutates the model; the model never mutates the view; the view reads the model — the classic one-way street, and it is exactly our arrow rule."]},{"k":"best","t":"Say it in MVC when arguing, implement it in Game/World/Renderer","h":"The three-class vocabulary of this chapter IS MVC with game-appropriate names. That naming keeps newcomers productive faster than \"Model.java\" would."}],"src":"05_ch04.txt:243","n":97},{"ch":5,"kind":"content","title":"Heaps-Specific: The Scene Graph as View Layer","tt":"Heaps-Specific: The Scene Graph as View Layer","blocks":[{"k":"p","h":"The architecture maps onto h2d naturally because the scene graph is already a retained-mode view tree."},{"k":"ul","i":["<code>WorldRenderer.root<\/code> (Layers) is the only h2d object the world ever (indirectly) produces — one ownership hand-off point.","Views subscribe to entity lifetime by construction: created in <code>sync()<\/code>, removed in <code>sync()<\/code> — no listeners, no leaks.","Interactive events flow controller-side: a click maps to an action passed to the world (<code>world.requestPause()<\/code>), never a direct mutation from a click handler."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// A click is controller input, translated through the world API:<\/span><\/span>","<span class=\"cl\">pauseButton.onClick = e -&gt; game.world.togglePause();<\/span>"],"raw":"// A click is controller input, translated through the world API:\npauseButton.onClick = e -> game.world.togglePause();"},{"k":"pit","t":"Views mutating entities from event handlers","h":"It compiles, it ships, it corrupts determinism. Event → action → world method call; the two extra indirections are the whole architecture."}],"src":"05_ch04.txt:254","n":98},{"ch":5,"kind":"content","title":"Organizing Source Folders and Modules","tt":"Organizing Source Folders and Modules","blocks":[{"k":"p","h":"Folder structure documents architecture — a new contributor navigates by it."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">src/<\/span>","<span class=\"cl\">├── Main.hx                 # boot only (Chapter 2 skeleton)<\/span>","<span class=\"cl\">├── game/                   # coordinator, screens, services<\/span>","<span class=\"cl\">│   ├── Game.hx<\/span>","<span class=\"cl\">│   ├── screens/            # TitleScreen, PlayScreen, SettingsScreen…  (Ch.7)<\/span>","<span class=\"cl\">│   └── services/           # Input, Sfx, Music, SaveGame, Config<\/span>","<span class=\"cl\">├── world/                  # SIMULATION — no h2d imports allowed<\/span>","<span class=\"cl\">│   ├── WorldController.hx<\/span>","<span class=\"cl\">│   ├── Entity.hx  Components.hx  Systems.hx<\/span>","<span class=\"cl\">│   └── behaviors/          # per-entity-kind update overrides<\/span>","<span class=\"cl\">├── render/                 # PRESENTATION — the only h2d-heavy package<\/span>","<span class=\"cl\">│   ├── WorldRenderer.hx  EntityView.hx  views/…<\/span>","<span class=\"cl\">│   └── fx/                 # particles, transitions (Ch. 8–9)<\/span>","<span class=\"cl\">├── levels/                 # data classes + loader (Ch. 5)<\/span>","<span class=\"cl\">└── ui/                     # widget toolkit (Ch. 7)<\/span>"],"raw":"src/\n├── Main.hx                 # boot only (Chapter 2 skeleton)\n├── game/                   # coordinator, screens, services\n│   ├── Game.hx\n│   ├── screens/            # TitleScreen, PlayScreen, SettingsScreen…  (Ch.7)\n│   └── services/           # Input, Sfx, Music, SaveGame, Config\n├── world/                  # SIMULATION — no h2d imports allowed\n│   ├── WorldController.hx\n│   ├── Entity.hx  Components.hx  Systems.hx\n│   └── behaviors/          # per-entity-kind update overrides\n├── render/                 # PRESENTATION — the only h2d-heavy package\n│   ├── WorldRenderer.hx  EntityView.hx  views/…\n│   └── fx/                 # particles, transitions (Ch. 8–9)\n├── levels/                 # data classes + loader (Ch. 5)\n└── ui/                     # widget toolkit (Ch. 7)"},{"k":"ul","i":["Enforce the boundary mechanically: a <code>#if<\/code>-free audit script (grep for <code>h2d.<\/code> under <code>world/<\/code>) run in CI."]},{"k":"best","t":"One package = one reason to change","h":"If a gameplay request touches <code>world/<\/code> and <code>render/<\/code> but nothing else, the architecture is working. If it touches everything, draw the boundaries again — cheaper now than at chapter 10."}],"src":"05_ch04.txt:276","n":99},{"ch":5,"kind":"content","title":"Game Loop Integration: Ordering Is Architecture","tt":"Game Loop Integration: Ordering Is Architecture","blocks":[{"k":"p","h":"Chapter 2's skeleton already encodes this chapter's rules — now the order is <em>explained<\/em>, not inherited."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">frame(dt):<\/span>","<span class=\"cl\">  Input.update()          # 1 controller: poll into actions<\/span>","<span class=\"cl\">  screens.update(dt)      # 2 which screen consumes input / forwards dt<\/span>","<span class=\"cl\">  world.update(dt)        #   simulation (systems pipeline inside)<\/span>","<span class=\"cl\">  renderer.sync()         # 3 presentation copies results into h2d<\/span>","<span class=\"cl\">  → engine renders scene graph<\/span>"],"raw":"frame(dt):\n  Input.update()          # 1 controller: poll into actions\n  screens.update(dt)      # 2 which screen consumes input / forwards dt\n  world.update(dt)        #   simulation (systems pipeline inside)\n  renderer.sync()         # 3 presentation copies results into h2d\n  → engine renders scene graph"},{"k":"ul","i":["Input first: actions reflect this frame's key state, not stale state.","Rendering last: players never see a half-updated world.","The fixed-timestep accumulator (Chapter 2) wraps steps 1–3 identically for determinism."]},{"k":"best","t":"Write the order in a comment at the top of Game.update","h":"The frame order is the single most load-bearing decision in the codebase. Make it documentation, not folklore."}],"src":"05_ch04.txt:291","n":100},{"ch":5,"kind":"content","title":"Time Management: Pausing, Slow-Motion, Time Scales","tt":"Time Management: Pausing, Slow-Motion, Time Scales","blocks":[{"k":"p","h":"Once dt flows through one place, time becomes a controllable dimension — cheap features, big feel wins."},{"k":"code","lang":"haxe","file":"Time.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Time<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> scale = <span class=\"c-n\">1.0<\/span>;         <span class=\"c-c\">// 0.5 = half speed, 2 = fast-forward<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> paused = <span class=\"c-k\">false<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">var<\/span> unscaled : <span class=\"c-t\">Float<\/span>;    <span class=\"c-c\">// dt before scaling (UI anims use this)<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> tick(dt:<span class=\"c-t\">Float<\/span>) : <span class=\"c-t\">Float<\/span> {<\/span>","<span class=\"cl\">        unscaled = dt;<\/span>","<span class=\"cl\">        <span class=\"c-k\">return<\/span> paused ? <span class=\"c-n\">0<\/span> : dt * scale;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"><span class=\"c-c\">// Game.update:<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> gdt = <span class=\"c-t\">Time<\/span>.tick(dt);     <span class=\"c-c\">// gameplay dt<\/span><\/span>","<span class=\"cl\">world.update(gdt);<\/span>","<span class=\"cl\">screens.update(dt);            <span class=\"c-c\">// UI runs on unscaled time — pause menus animate!<\/span><\/span>"],"raw":"class Time {\n    public static var scale = 1.0;         // 0.5 = half speed, 2 = fast-forward\n    public static var paused = false;\n    public static var unscaled : Float;    // dt before scaling (UI anims use this)\n    public static function tick(dt:Float) : Float {\n        unscaled = dt;\n        return paused ? 0 : dt * scale;\n    }\n}\n// Game.update:\nfinal gdt = Time.tick(dt);     // gameplay dt\nworld.update(gdt);\nscreens.update(dt);            // UI runs on unscaled time — pause menus animate!"},{"k":"ul","i":["Hit-stop (5 frames of <code>scale = 0<\/code> on a big hit) and slow-mo death cams are now one-liners."]},{"k":"pit","t":"Anim runs while paused","h":"<code>h2d.Anim<\/code> advances on engine time. Pausing gameplay does not pause an Anim unless you set <code>anim.pause = true<\/code> too — views should read the world's pause flag in <code>sync()<\/code>."}],"src":"05_ch04.txt:311","n":101},{"ch":5,"kind":"content","title":"Error Handling: Failing Fast in Games","tt":"Error Handling: Failing Fast in Games","blocks":[{"k":"p","h":"Servers crash and restart; games must limp home. But silent corruption is worse than a crash — strike the balance deliberately."},{"k":"ul","i":["<b>Load-time fail-fast<\/b>: bad level data → hard error with file+field in the message. Never \"best-guess\" a corrupted spawn table.","<b>Runtime containment<\/b>: a dead entity with a null component → skip with one logged warning, keep the frame alive.","<b>Save-time paranoia<\/b>: validate on load; keep one <code>.bak<\/code> generation (Chapter 7 does exactly this)."]},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">function<\/span> requireComponent&lt;<span class=\"c-t\">T<\/span>:<span class=\"c-t\">Component<\/span>&gt;(e:<span class=\"c-t\">Entity<\/span>, cl:<span class=\"c-t\">Class<\/span>&lt;<span class=\"c-t\">T<\/span>&gt;) : <span class=\"c-t\">T<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> c = e.get(cl);<\/span>","<span class=\"cl\">    <span class=\"c-k\">if<\/span> (c == <span class=\"c-k\">null<\/span>) <span class=\"c-k\">throw<\/span> <span class=\"c-s\">'Entity ${e.id} (${e.kind}) missing ${Type.getClassName(cl)} — level data bug'<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">return<\/span> c;<\/span>","<span class=\"cl\">}<\/span>"],"raw":"function requireComponent<T:Component>(e:Entity, cl:Class<T>) : T {\n    final c = e.get(cl);\n    if (c == null) throw 'Entity ${e.id} (${e.kind}) missing ${Type.getClassName(cl)} — level data bug';\n    return c;\n}"},{"k":"best","t":"Crash loudly in dev, degrade gracefully in release","h":"Wrap the fail-fast throws behind <code>#if debug<\/code> where they matter; release builds log, skip and continue. Both behaviors, one policy place."}],"src":"05_ch04.txt:325","n":102},{"ch":5,"kind":"content","title":"Architecture Checklist: Cavern Run Edition","tt":"Architecture Checklist: Cavern Run Edition","blocks":[{"k":"p","h":"The gate to Chapter 5 — every line of the rest of the course lands inside this shape."},{"k":"ul","i":["<code>Game<\/code> coordinator exists; <code>Main.hx<\/code> is untouched forever after.","<code>WorldController<\/code> compiles with zero <code>h2d<\/code>/<code>h3d<\/code> imports.","<code>WorldRenderer.sync()<\/code> adds/removes views automatically; no view writes to entities.","Entities are plain data; components + systems exist and the fuse/health pair is exercised.","Frame order (input → screens → world → renderer) is documented in <code>Game.update<\/code>.","<code>Time<\/code> scale/pause exists; pause menus animate on unscaled time.","Folder layout matches the slide; the boundary audit is a one-line script."]}],"src":"05_ch04.txt:335","n":103},{"ch":6,"kind":"chapter","title":"Resources, Atlases &amp; Level Data","tt":"Resources, Atlases & Level Data","sub":"The asset pipeline: sprite packing, texture atlases, async loading, memory discipline, hot reload, and a custom level format with loader.","blocks":[],"src":"06_ch05.txt:1","n":104},{"ch":6,"kind":"content","title":"The Resource Pipeline: Overview","tt":"The Resource Pipeline: Overview","blocks":[{"k":"p","h":"Assets have a lifecycle, and each stage is its own bug class. This chapter walks the whole pipe."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">source art (PSD/Aseprite/…)          owned by artists<\/span>","<span class=\"cl\">   → export flat PNG/WAV/FNT        into res/                     (this ch.)<\/span>","<span class=\"cl\">   → pack sprites into atlases       texture atlas + regions      (this ch.)<\/span>","<span class=\"cl\">   → load (sync or async)            hxd.Res typed resources      (this ch.)<\/span>","<span class=\"cl\">   → use: Tile.sub / Anim / Text     GPU textures in memory       (Ch. 3,6–8)<\/span>","<span class=\"cl\">   → dispose / reload / hot reload   memory + iteration           (this ch.)<\/span>","<span class=\"cl\">   → level data authoring + loading  JSON/XML/text/binary         (this ch.)<\/span>"],"raw":"source art (PSD/Aseprite/…)          owned by artists\n   → export flat PNG/WAV/FNT        into res/                     (this ch.)\n   → pack sprites into atlases       texture atlas + regions      (this ch.)\n   → load (sync or async)            hxd.Res typed resources      (this ch.)\n   → use: Tile.sub / Anim / Text     GPU textures in memory       (Ch. 3,6–8)\n   → dispose / reload / hot reload   memory + iteration           (this ch.)\n   → level data authoring + loading  JSON/XML/text/binary         (this ch.)"},{"k":"ul","i":["One rule frames everything: <b>GPU memory is the budget, draw calls are the tax, artist time is the treasure.<\/b>"]},{"k":"best","t":"Script the pipeline, don't do it by hand","h":"Every manual step between \"Aseprite save\" and \"game shows sprite\" is a step that will be skipped under deadline. A 20-line export script (Aseprite CLI or TexturePacker CLI) pays for itself in a week."}],"src":"06_ch05.txt:17","n":105},{"ch":6,"kind":"content","title":"hxd.Res Deep Dive: Typed Resources","tt":"hxd.Res Deep Dive: Typed Resources","blocks":[{"k":"p","h":"Beyond <code>initEmbed<\/code>, <code>Res<\/code> is a generated typed tree — understand what the macro builds and daily asset work becomes frictionless."},{"k":"code","lang":"haxe","file":"","lines":["<span class=\"cl\"><span class=\"c-c\">// res/img/hero.png → Res.img.hero : hxd.res.Image<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\">// res/snd/jump.wav → Res.snd.jump : hxd.res.Sound<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\">// res/fnt/ui.fnt   → Res.fnt.ui   : hxd.res.Font<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\">// res/levels/1.json→ Res.levels.level_1     (\"1\" is not a valid Haxe ident → auto-renamed)<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> img : hxd.res.<span class=\"c-t\">Image<\/span> = <span class=\"c-t\">Res<\/span>.img.hero;<\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> tex = img.toTile();          <span class=\"c-c\">// first call decodes+uploads, then cached<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> info = img.getInfo();        <span class=\"c-c\">// width/height without full decode<\/span><\/span>"],"raw":"// res/img/hero.png → Res.img.hero : hxd.res.Image\n// res/snd/jump.wav → Res.snd.jump : hxd.res.Sound\n// res/fnt/ui.fnt   → Res.fnt.ui   : hxd.res.Font\n// res/levels/1.json→ Res.levels.level_1     (\"1\" is not a valid Haxe ident → auto-renamed)\n\nfinal img : hxd.res.Image = Res.img.hero;\nfinal tex = img.toTile();          // first call decodes+uploads, then cached\nfinal info = img.getInfo();        // width/height without full decode"},{"k":"ul","i":["Numeric-leading filenames are renamed (<code>1.json<\/code> → <code>level_1<\/code>) — a classic confusion; name files as valid identifiers from the start.","<code>Res<\/code> caches: the second <code>Res.img.hero.toTile()<\/code> reuses the same texture object (tiles share it)."]},{"k":"pit","t":"Re-decoding by breaking the cache","h":"<code>toTile()<\/code> on the same resource returns tiles sharing one texture. If you dispose one tile's texture expecting independence, every sprite from that image dies. Disposal is per-resource, not per-tile (see this chapter's memory slides)."}],"src":"06_ch05.txt:33","n":106},{"ch":6,"kind":"content","title":"Embedded vs External vs Streaming: Choosing Per Asset Class","tt":"Embedded vs External vs Streaming: Choosing Per Asset Class","blocks":[{"k":"p","h":"Three loading modes, chosen by asset size and use pattern — not by taste."},{"k":"table","head":["Mode","API","Best for"],"rows":[["Embedded","<code>Res.initEmbed()<\/code>","&lt; a few hundred KB, needed at boot (UI font, first level)"],["External","<code>Res.initLocal()<\/code>","everything else on desktop builds"],["Async loader","<code>Res.init(cb)<\/code> + progress","web builds, mobile, large atlases"]]},{"k":"ul","i":["Web <b>requires<\/b> embedding or async loading — the browser cannot synchronously read local files.","The capstone policy: embed the UI font + first level only; everything else async so the title screen appears in under a second."]},{"k":"best","t":"Separate \"boot set\" from \"game set\"","h":"A <code>BootSet<\/code> (font, logo, level 1) embedded and a <code>GameSet<\/code> (all worlds) async keeps cold start snappy on every platform — including the web, where first impression is measured in frames."}],"src":"06_ch05.txt:45","n":107},{"ch":6,"kind":"content","title":"Sprite Packing: Why Atlases Matter","tt":"Sprite Packing: Why Atlases Matter","blocks":[{"k":"p","h":"A texture atlas packs many sprites into one texture. The reason is not memory — it is <b>draw calls<\/b>."},{"k":"ul","i":["Each texture switch can end a GPU batch: 300 sprites from 300 PNGs = up to 300 draw calls; from 1 atlas = 1-3.","On web and mobile, draw calls dominate frame time long before fill rate does.","Atlases also improve texture-cache hit rate — sprites drawn together live together in memory."]},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">WITHOUT atlas                      WITH atlas<\/span>","<span class=\"cl\">draw hero.png      → draw call 1   ┌──────────────┐<\/span>","<span class=\"cl\">draw sword.png     → draw call 2   │ hero│sword│gem│   → 1 draw call<\/span>","<span class=\"cl\">draw gem.png       → draw call 3   │ bat │door│…   │      (batched)<\/span>","<span class=\"cl\">…                                  └──────────────┘<\/span>"],"raw":"WITHOUT atlas                      WITH atlas\ndraw hero.png      → draw call 1   ┌──────────────┐\ndraw sword.png     → draw call 2   │ hero│sword│gem│   → 1 draw call\ndraw gem.png       → draw call 3   │ bat │door│…   │      (batched)\n…                                  └──────────────┘"},{"k":"best","t":"Count draw calls before optimizing pixels","h":"Heaps batches same-texture draws automatically — your only job is to <em>give it same-texture runs<\/em>. Group by atlas, not by asset folder aesthetics."}],"src":"06_ch05.txt:59","n":108},{"ch":6,"kind":"content","title":"Texture Atlases: Regions, Padding and Bleeding","tt":"Texture Atlases: Regions, Padding and Bleeding","blocks":[{"k":"p","h":"Packing sprites correctly requires three settings that every packer (and hand-rolled atlas) must get right."},{"k":"ul","i":["<b>Region = (x, y, w, h)<\/b> in atlas pixels; <code>tile.sub(x, y, w, h)<\/code> carves it (Chapter 3).","<b>Padding<\/b>: 2px transparent border between sprites stops <b>bleeding<\/b> — neighboring pixels smearing in when filtered or on sub-pixel positions.","<b>Extrusion<\/b> (advanced): duplicate the border row for tiling tiles that must filter perfectly.","Keep <b>related animations on one page<\/b>: a run cycle split across atlas pages re-introduces the draw-call problem mid-animation."]},{"k":"pit","t":"Invisible seams on scrolling backgrounds","h":"One-pixel gaps or doubled rows between tiled atlas cells show up as hairlines while scrolling. Padding solves 90%; power-of-two cell sizes solve the rest."}],"src":"06_ch05.txt:67","n":109},{"ch":6,"kind":"content","title":"Atlas Tooling: TexturePacker, Heaps and CDB","tt":"Atlas Tooling: TexturePacker, Heaps and CDB","blocks":[{"k":"p","h":"The ecosystem's standard options, and what this course standardizes on."},{"k":"ul","i":["<b>TexturePacker<\/b> (commercial, has CLI) exports PNG + a JSON/XML region table — the de-facto interchange.","<b>Aseprite/Photoshop export scripts<\/b> can emit the same JSON shape.","<b>Heaps<\/b> reads standard atlas data through its own resource types (e.g. TexturePacker-format files); this course parses the JSON explicitly — once, in ~30 lines — so you own the format.","<b>CastleDB<\/b> (by the Heaps authors) is for game <em>data<\/em> tables (Chapter 5's data-adjacent topics) — not for sprite packing."]},{"k":"best","t":"Own your atlas format in code","h":"A tiny <code>Atlas<\/code> class (next slide) reading TexturePacker JSON survives engine version drift, tool swaps and custom pipelines. Vendor magic is rented; 30 lines of parsing are owned."}],"src":"06_ch05.txt:75","n":110},{"ch":6,"kind":"content","title":"The Atlas Class: Parsing TexturePacker JSON","tt":"The Atlas Class: Parsing TexturePacker JSON","blocks":[{"k":"p","h":"The course's reusable atlas loader — production use, no external library."},{"k":"code","lang":"haxe","file":"Atlas.hx","lines":["<span class=\"cl\"><span class=\"c-k\">import<\/span> hxd.<span class=\"c-t\">Res<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\
