<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heaps.io Game Development — The Complete Course</title>
<meta name="description" content="A 300+ slide interactive course on cross-platform game development with Haxe and the Heaps.io engine: 2D and 3D, architecture, physics, shaders, UI, animation and shipping.">
<style>
:root{
  --bg:#0b0e14; --bg2:#0e1219; --panel:#131926; --panel2:#1a2132; --line:#232c42;
  --text:#e9edf5; --dim:#98a2b8; --dim2:#5d6880;
  --good:#3ddc97; --bad:#ff6b7a; --note:#58a6ff; --amber:#ffb454;
  --mono:"Cascadia Code","JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,"Liberation Mono",ui-monospace,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 700px at 70% -10%,rgba(64,86,150,.16),transparent 60%),
             radial-gradient(900px 600px at -10% 110%,rgba(120,80,180,.10),transparent 55%);}
::selection{background:rgba(255,180,84,.35)}
button{font-family:inherit}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.06);z-index:60;cursor:pointer}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ff7a59);
  transition:width .25s ease}
#topbar{position:fixed;top:3px;left:0;right:0;display:flex;align-items:center;gap:8px;
  padding:10px 14px 16px;z-index:50;pointer-events:none;
  background:linear-gradient(to bottom,rgba(11,14,20,.82),rgba(11,14,20,0))}
#topbar .brand{pointer-events:auto;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
#topbar .brand b{font-size:13px;letter-spacing:.06em;color:var(--text);font-weight:650}
#topbar .brand span{font-size:11px;color:var(--dim2);letter-spacing:.08em}
.tbtn{pointer-events:auto;background:rgba(19,25,38,.85);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;height:32px;min-width:34px;padding:0 10px;font-size:12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px);transition:.15s}
.tbtn:hover{color:var(--text);border-color:#3a4666;background:var(--panel2)}
.tbtn svg{width:14px;height:14px;fill:currentColor}
#topbar .spacer{flex:1}
#botbar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;z-index:50;
  padding:20px 14px 10px;pointer-events:none;font-size:11px;color:var(--dim2);
  background:linear-gradient(to top,rgba(11,14,20,.94),rgba(11,14,20,.55) 60%,rgba(11,14,20,0))}
#botbar .spacer{flex:1}
#keys{letter-spacing:.04em}
#navcluster{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(19,25,38,.85);
  border:1px solid var(--line);border-radius:10px;padding:4px 8px;backdrop-filter:blur(6px)}
#counter{font-size:12px;color:var(--dim);min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
#counter b{color:var(--text)}
#chlabel{pointer-events:auto;color:var(--dim);font-size:11px;letter-spacing:.05em;margin-right:14px;
  max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chlabel b{color:var(--text)}
#chlabel i{font-style:normal;color:var(--hue,var(--amber))}
.nbtn{background:none;border:0;color:var(--dim);font-size:15px;width:30px;height:28px;cursor:pointer;border-radius:6px}
.nbtn:hover{background:var(--panel2);color:var(--text)}

/* ---------- sidebar ---------- */
#sidebar{position:fixed;top:0;bottom:0;left:0;width:308px;max-width:86vw;z-index:80;
  background:rgba(13,17,26,.98);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column}
body.side #sidebar{transform:none}
#sidebar .shead{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
#sidebar .shead b{font-size:14px;display:block}
#sidebar .shead span{font-size:11px;color:var(--dim2)}
#sidebar .slist{overflow-y:auto;padding:8px 10px 24px;flex:1}
.chrow{margin:2px 0}
.chrow>.chhead{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;
  color:var(--dim);font-size:12.5px;user-select:none}
.chrow>.chhead:hover{background:var(--panel2);color:var(--text)}
.chrow>.chhead .badge{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;color:#0b0e14;background:var(--hue)}
.chrow>.chhead .ct{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrow>.chhead .rng{font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums}
.chrow .sl{display:none;margin:2px 0 6px 12px;border-left:1px solid var(--line);padding-left:6px}
.chrow.open .sl{display:block}
.chrow .sl a{display:flex;gap:8px;padding:4px 8px;border-radius:6px;color:var(--dim);
  font-size:11.5px;cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden}
.chrow .sl a:hover{color:var(--text);background:var(--panel)}
.chrow .sl a.cur{color:var(--text);background:var(--panel2)}
.chrow .sl a i{font-style:normal;color:var(--dim2);font-variant-numeric:tabular-nums;min-width:26px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:75;opacity:0;pointer-events:none;transition:.25s}
body.side #scrim{opacity:1;pointer-events:auto}
#sideclose{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer}

/* ---------- deck / slides ---------- */
#deck{position:fixed;inset:0;z-index:10}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px clamp(26px,6vw,88px) 58px;
  display:none;opacity:0}
.slide.active{display:flex;flex-direction:column;align-items:center;animation:sIn .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes sIn{from{opacity:0;transform:translateX(var(--fx,34px))}to{opacity:1;transform:none}}
#deck[data-dir="back"]{--fx:-34px}
@media (prefers-reduced-motion:reduce){.slide.active{animation:none;opacity:1}}
.sinner{width:100%;max-width:1140px}

.shead{margin-bottom:18px}
.kick{font-size:11px;letter-spacing:.22em;color:var(--hue,var(--amber));font-weight:600;margin-bottom:8px}
.shead h2{margin:0;font-size:clamp(22px,2.6vw,32px);font-weight:700;letter-spacing:-.01em;line-height:1.18}
.shead .rule{height:2px;width:64px;margin-top:12px;border-radius:2px;
  background:linear-gradient(90deg,var(--hue,var(--amber)),transparent)}

.sbody{display:flex;flex-direction:column;gap:13px;font-size:clamp(14.5px,1.05vw + 8px,17px);line-height:1.6}
.sbody p{margin:0}
.sbody code, .callout code, .tbl code, .ovt code{font-family:var(--mono);font-size:.88em;
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#ffd9a0;white-space:nowrap}
.sbody ul{margin:0;padding-left:4px;list-style:none;display:flex;flex-direction:column;gap:7px}
.sbody ul li{position:relative;padding-left:20px}
.sbody ul li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;
  background:var(--hue,var(--amber));opacity:.75;transform:rotate(45deg)}
.sbody ul ul{margin-top:6px}
.sbody ul ul li::before{background:var(--dim2);transform:none;border-radius:50%}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:13px;font-size:.96em}

/* auto-fit layout modes (applied by fitSlide) */
.slide.code-s11 pre.code{font-size:11.2px;line-height:1.46}
.slide.code-s10 pre.code{font-size:10.6px;line-height:1.44}
.slide.code-wrap pre.code .cl{white-space:pre-wrap}
.slide.split-code pre.code{column-count:2;column-gap:18px}
.slide.split-code pre.code .cl{break-inside:avoid}
.slide.split-body .sbody{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);
  column-gap:22px;align-items:start}
.slide.split-body .sbody > .codewrap{grid-column:1;grid-row:1 / span 80}
.slide.split-body .sbody > *:not(.codewrap){grid-column:2}
@media (max-width:900px){
  .slide.split-code pre.code{column-count:1}
  .slide.split-body .sbody{display:flex}
}

/* callouts */
.callout{border-left:3px solid;border-radius:4px 10px 10px 4px;padding:11px 15px;font-size:.94em;line-height:1.55}
.callout .clabel{font-size:10px;font-weight:700;letter-spacing:.18em;margin-bottom:5px}
.callout b.ct{display:block;font-size:.98em;margin-bottom:3px;color:var(--text)}
.callout.best{background:rgba(61,220,151,.07);border-color:var(--good)}
.callout.best .clabel{color:var(--good)}
.callout.pit{background:rgba(255,107,122,.07);border-color:var(--bad)}
.callout.pit .clabel{color:var(--bad)}
.callout.note{background:rgba(88,166,255,.07);border-color:var(--note)}
.callout.note .clabel{color:var(--note)}

/* code blocks */
.codewrap{background:#0c1018;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.35)}
.codehead{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.02)}
.codehead .lang{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--hue,var(--amber));
  text-transform:uppercase}
.codehead .fname{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.codehead .grip{flex:1}
.copy{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:7px;
  font-size:11px;padding:3px 12px;cursor:pointer;transition:.15s}
.copy:hover{color:var(--text);border-color:#3a4666}
.copy.ok{color:var(--good);border-color:rgba(61,220,151,.5)}
pre.code{margin:0;padding:12px 14px 14px;overflow-x:auto;font-family:var(--mono);
  font-size:12.8px;line-height:1.52;counter-reset:ln;tab-size:4}
pre.code .cl{display:block;counter-increment:ln;white-space:pre}
pre.code .cl::before{content:counter(ln);display:inline-block;width:2.1em;margin-right:1.4em;
  text-align:right;color:#39415a;font-size:11px;user-select:none}
.c-k{color:#c792ea}.c-t{color:#7fdbca}.c-s{color:#ecc48d}.c-c{color:#5c6a8a;font-style:italic}
.c-n{color:#f78c6c}.c-p{color:#ff5874}.c-f{color:#82aaff}.cl{color:#c9d4ea}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.tbl{border-collapse:collapse;width:100%;font-size:.9em;line-height:1.45}
.tbl th{background:var(--panel2);text-align:left;font-size:.86em;letter-spacing:.05em;color:var(--dim)}
.tbl th,.tbl td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{color:var(--text)}

/* chapter divider + cover */
.slide.k-chapter{justify-content:center;align-items:center;text-align:center}
.k-chapter .chbig{font-size:clamp(72px,14vw,170px);font-weight:800;line-height:1;letter-spacing:-.04em;
  color:transparent;-webkit-text-stroke:1.5px var(--hue);opacity:.55;font-variant-numeric:tabular-nums}
.k-chapter .chlab{font-size:12px;letter-spacing:.5em;color:var(--hue);font-weight:700;margin:22px 0 10px}
.k-chapter h2{margin:0;font-size:clamp(28px,4vw,52px);font-weight:750;letter-spacing:-.015em;max-width:900px}
.k-chapter .chsub{color:var(--dim);font-size:clamp(14px,1.4vw,18px);margin-top:14px;max-width:720px;line-height:1.55}
.k-chapter .chrng{margin-top:26px;display:inline-flex;gap:8px;align-items:center;font-size:11px;
  color:var(--dim2);border:1px solid var(--line);border-radius:999px;padding:6px 16px;letter-spacing:.1em}
.slide.k-chapter{background:
  radial-gradient(900px 480px at 50% 0%,color-mix(in srgb,var(--hue) 13%,transparent),transparent 70%),
  radial-gradient(700px 420px at 85% 100%,rgba(40,60,110,.22),transparent 70%)}

.slide.k-cover{justify-content:center;align-items:center;text-align:center;
  background:radial-gradient(1000px 600px at 50% -12%,rgba(255,180,84,.14),transparent 65%),
             radial-gradient(800px 500px at 10% 110%,rgba(120,90,220,.14),transparent 65%)}
.k-cover .cvkick{font-size:12px;letter-spacing:.5em;color:var(--amber);font-weight:700;margin-bottom:22px}
.k-cover h1{margin:0;font-size:clamp(34px,5.4vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1.08;max-width:1000px}
.k-cover h1 span{color:var(--amber)}
.k-cover .cvsub{color:var(--dim);font-size:clamp(15px,1.6vw,20px);margin-top:18px;max-width:760px;line-height:1.6}
.k-cover .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:30px}
.k-cover .chip{border:1px solid var(--line);background:rgba(19,25,38,.7);border-radius:999px;
  padding:7px 16px;font-size:12px;color:var(--dim)}
.k-cover .chip b{color:var(--text)}
.k-cover .cvhint{margin-top:44px;font-size:12px;color:var(--dim2);letter-spacing:.06em}
.k-cover .cvhint b{color:var(--dim);font-weight:600}
.k-cover .cvver{margin-top:12px;font-size:10.5px;color:#39415a;letter-spacing:.1em}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);
  margin-right:10px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}

/* overview */
#ov{position:fixed;inset:0;z-index:90;background:rgba(8,11,17,.96);display:none;overflow-y:auto;padding:70px 34px 44px}
body.ov #ov{display:block}
#ov .ovhead{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:14px 22px;
  background:rgba(8,11,17,.97);border-bottom:1px solid var(--line);z-index:5}
#ov .ovhead b{font-size:14px}
#ov .ovhead span{font-size:11px;color:var(--dim2)}
#ov .ovhead .sp{flex:1}
#ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px;max-width:1500px;margin:0 auto}
.ovc{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;cursor:pointer;
  position:relative;overflow:hidden;transition:.12s;min-height:78px}
.ovc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--hue)}
.ovc:hover{border-color:#41507a;transform:translateY(-2px)}
.ovc.cur{border-color:var(--hue);background:var(--panel2)}
.ovc .ovn{font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.08em;margin-bottom:4px}
.ovc .ovt{font-size:12.5px;line-height:1.35;color:var(--text);font-weight:550}
.ovc .ovc2{font-size:10px;color:var(--dim2);margin-top:5px;letter-spacing:.05em}

/* search */
#search{position:fixed;inset:0;z-index:95;background:rgba(8,11,17,.9);display:none;align-items:flex-start;
  justify-content:center;padding:11vh 20px 30px}
body.sr #search{display:flex}
#srbox{width:min(720px,94vw);background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden}
#srbox .srtop{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
#srq{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:17px;font-family:inherit}
#srq::placeholder{color:var(--dim2)}
#srlist{max-height:56vh;overflow-y:auto;padding:8px}
.srr{display:flex;gap:12px;align-items:baseline;padding:10px 12px;border-radius:9px;cursor:pointer}
.srr:hover,.srr.sel{background:var(--panel2)}
.srr .srn{font-size:11px;color:var(--hue);min-width:44px;font-variant-numeric:tabular-nums}
.srr .srt{font-size:13.5px;color:var(--text)}
.srr .srt mark{background:rgba(255,180,84,.3);color:#ffd9a0;border-radius:3px;padding:0 2px}
.srr .srs{font-size:11px;color:var(--dim2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#srempty{padding:26px;text-align:center;color:var(--dim2);font-size:13px}

/* misc */
.hidden{display:none!important}
@media (max-width:760px){
  #keys{display:none}
  #topbar .brand span{display:none}
  .slide{padding:56px 20px 54px}
}
@media print{
  body{overflow:visible;background:#fff}
  #deck{position:static}
  .slide{position:static;display:flex!important;opacity:1!important;animation:none!important;
    page-break-after:always;min-height:96vh}
  #topbar,#botbar,#sidebar,#scrim,#ov,#search{display:none!important}
  body{background:#fff;color:#111}
}
</style>
</head>
<body>

<div id="bar" title="Click to jump"><i id="barfill"></i></div>

<div id="topbar">
  <button class="tbtn" id="btn-side" title="Course index (chapters)">
    <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
    <span class="hidelabel">Index</span>
  </button>
  <div class="brand" id="brand">
    <b>HEAPS.IO GAME DEVELOPMENT</b>
    <span>THE COMPLETE COURSE</span>
  </div>
  <div class="spacer"></div>
  <button class="tbtn" id="btn-sr" title="Search (/)">
    <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.3 14l5 5 1.4-1.4-5-5A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
    <span class="hidelabel">Search</span>
  </button>
  <button class="tbtn" id="btn-ov" title="Slide overview (O)">
    <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg>
    <span class="hidelabel">Overview</span>
  </button>
  <button class="tbtn" id="btn-fs" title="Fullscreen (F)">
    <svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zM21 3h-7v2h5v5h2zM3 21h7v-2H5v-5H3zM21 21h-7v-2h5v-5h2z"/></svg>
  </button>
</div>

<div id="deck"></div>

<div id="botbar">
  <span id="keys">←/→ navigate · O overview · / search · G go-to · F fullscreen</span>
  <span class="spacer"></span>
  <span id="chlabel"></span>
  <div id="navcluster">
    <button class="nbtn" id="btn-prev" title="Previous">←</button>
    <span id="counter"></span>
    <button class="nbtn" id="btn-next" title="Next">→</button>
  </div>
</div>

<div id="scrim"></div>
<nav id="sidebar">
  <button id="sideclose" title="Close">×</button>
  <div class="shead">
    <b>Course Index</b>
    <span>Heaps.io Game Development · Preface to Chapter 14</span>
  </div>
  <div class="slist" id="slist"></div>
</nav>

<div id="ov">
  <div class="ovhead">
    <b>Overview</b><span>304 slides · click a card to jump</span>
    <div class="sp"></div>
    <button class="tbtn" id="ovclose">Close (Esc)</button>
  </div>
  <div id="ovgrid"></div>
</div>

<div id="search">
  <div id="srbox">
    <div class="srtop">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#5d6880"><path d="M10 2a8 8 0 105.3 14l5 5 1.4-1.4-5-5A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
      <input id="srq" type="text" placeholder="Search slides, topics, code..." autocomplete="off" spellcheck="false">
      <span style="font-size:10px;color:#5d6880;letter-spacing:.1em">ESC TO CLOSE</span>
    </div>
    <div id="srlist"></div>

<script id="slide-data" type="application/json">{"title":"Heaps.io Game Development","built":"2026-11-16","chapters":[{"i":0,"id":"cover","label":"START","title":"Cover","sub":"","hue":"#ffb454","start":1,"end":1},{"i":1,"id":"preface","label":"PREFACE","title":"Preface — Why Heaps, and What You Will Build","sub":"What the engine is, who uses it, what you need to know, and how this course is organized.","hue":"#7fd1f7","start":2,"end":12},{"i":2,"id":"ch1","label":"CHAPTER 01","title":"Getting Started: Haxe, Toolchain & First Project","sub":"The language you will write, the toolchain you will install, and the project skeleton every later chapter builds on.","hue":"#8bd450","start":13,"end":34},{"i":3,"id":"ch2","label":"CHAPTER 02","title":"Engine Modules: App, Graphics, Audio, Input, Files, Network","sub":"The hxd platform layer — one API over every target. Master it before writing a single gameplay line.","hue":"#b18cff","start":35,"end":64},{"i":4,"id":"ch3","label":"CHAPTER 03","title":"2D Fundamentals: Scene, Tiles & Drawables","sub":"The h2d scene graph — objects, bitmaps, text, graphics, layout, interactives. The vocabulary of every 2D Heaps game.","hue":"#4fd8d0","start":65,"end":84},{"i":5,"id":"ch4","label":"CHAPTER 04","title":"Game Architecture: Patterns That Scale","sub":"From scripts to systems — the coordinator, world controller, world renderer, Entity-Component and MVC, applied to Heaps.","hue":"#ff8f70","start":85,"end":103},{"i":6,"id":"ch5","label":"CHAPTER 05","title":"Resources, Atlases & Level Data","sub":"The asset pipeline: sprite packing, texture atlases, async loading, memory discipline, hot reload, and a custom level format with loader.","hue":"#ffd24f","start":104,"end":131},{"i":7,"id":"ch6","label":"CHAPTER 06","title":"Gameplay Mechanics: Collisions, Lives & Camera","sub":"AABB math, tile collision, spatial partitioning, player lives, game over and the game camera — the vertical slice chapter.","hue":"#6db4ff","start":132,"end":153},{"i":8,"id":"ch7","label":"CHAPTER 07","title":"Game States, Screens & the UI Framework","sub":"Title, settings, gameplay, pause — a screen system on top of Flow, skins, focus, localization and bulletproof saves.","hue":"#4fd6a8","start":154,"end":175},{"i":9,"id":"ch8","label":"CHAPTER 08","title":"Effects: Particles, Parallax & Lerp","sub":"Lerp and easing math, frame-rate independence, parallax layers, and a data-driven particle system with its own editor.","hue":"#f472a8","start":176,"end":192},{"i":10,"id":"ch9","label":"CHAPTER 09","title":"Screen Transitions","sub":"Fade, slide, wipe and shader-based transitions — the polish layer between screens.","hue":"#ffb066","start":193,"end":205},{"i":11,"id":"ch10","label":"CHAPTER 10","title":"2D Physics with Box2D","sub":"Rigid bodies, entity types, shapes and fixtures, a physics adapter over Heaps, contacts, joints — plus when NOT to use a physics engine.","hue":"#f47575","start":206,"end":227},{"i":12,"id":"ch11","label":"CHAPTER 11","title":"Custom Shaders: hxsl and Filters","sub":"The Heaps shader model — hxsl, vertex and fragment effects, h2d filters, uniform binding and post-processing.","hue":"#8f9dff","start":228,"end":244},{"i":13,"id":"ch12","label":"CHAPTER 12","title":"Alternative Input: Touch, Tilt & Gestures","sub":"Virtual joysticks, touch buttons, accelerometer, swipes and multi-touch — plus the input router that unifies everything.","hue":"#a8de70","start":245,"end":258},{"i":14,"id":"ch13","label":"CHAPTER 13","title":"Animation Systems & Tweening","sub":"Sprite-sheet playback modes, animation events, a declarative tween engine with sequences and parallel execution, and game-feel juice.","hue":"#d078e8","start":259,"end":275},{"i":15,"id":"ch14","label":"CHAPTER 14","title":"3D Graphics & Physics: Orbital Salvage","sub":"The h3d pipeline: scenes, lights, materials, cameras, models, instancing, raycasting — and a 3D physics layer with constraints, triggers and shadow studies.","hue":"#ffe066","start":276,"end":304}],"slides":[{"ch":0,"kind":"cover","title":"<b>Heaps.io<\/b> Game Development","tt":"**Heaps.io** Game Development","sub":"Building production-quality, cross-platform games with Haxe and the Heaps.io engine — from your first window to shipped 2D and 3D titles.","blocks":[],"src":"00_cover.txt:1","n":1},{"ch":1,"kind":"chapter","title":"Preface — Why Heaps, and What You Will Build","tt":"Preface — Why Heaps, and What You Will Build","sub":"What the engine is, who uses it, what you need to know, and how this course is organized.","blocks":[],"src":"01_preface.txt:1","n":2},{"ch":1,"kind":"content","title":"Welcome and How This Course Works","tt":"Welcome and How This Course Works","blocks":[{"k":"p","h":"This is a complete, practitioner-grade course on <b>Heaps.io<\/b>, the 2D/3D game engine written in <b>Haxe<\/b> that powers titles like <em>Dead Cells<\/em> and <em>Northgard<\/em>. It assumes no prior Heaps experience but does not water things down: every subsystem is covered at the depth you need to ship real games."},{"k":"ul","i":["The course runs from this preface through Chapter 14, following the structure of the curriculum topic by topic.","Every chapter ends in a project or checklist that turns the material into running code.","Two capstone games carry the whole course: a 2D platformer (<b>Cavern Run<\/b>) and a 3D physics playground (<b>Orbital Salvage<\/b>)."]},{"k":"best","t":"Read actively, not linearly","h":"Use the overview grid (<code>O<\/code>) and search (<code>/<\/code>) to jump to any subsystem when you need it in your own project — the deck is designed as a reference as much as a course."}],"src":"01_preface.txt:10","n":3},{"ch":1,"kind":"content","title":"How to Navigate This Deck","tt":"How to Navigate This Deck","blocks":[{"k":"p","h":"This presentation is a single self-contained HTML file. It works offline, from a local disk or any static web server."},{"k":"ul","i":["<b>Arrow keys / Space<\/b> — move forward and backward. <b>Home / End<\/b> — jump to the ends.","<b>O<\/b> — open the overview grid of all slides. <b><code>/<\/code><\/b> — full-text search across titles and code. <b>G<\/b> — jump to a slide number. <b>F<\/b> — fullscreen.","<b>Index button<\/b> (top left) — chapter-by-chapter table of contents with every slide title.","Every code block has a <b>Copy<\/b> button so you can paste listings straight into your project.","The top progress bar is clickable: jump proportionally through the deck."]},{"k":"note","h":"Your position is remembered between sessions (browser local storage) and mirrored into the URL hash, so you can bookmark any slide."}],"src":"01_preface.txt:19","n":4},{"ch":1,"kind":"content","title":"What Is Heaps.io?","tt":"What Is Heaps.io?","blocks":[{"k":"p","h":"Heaps.io is an open-source, cross-platform 2D and 3D game engine designed around the Haxe language. It is the \"M\" in the <b>H<\/b>L/<b>H<\/b>axe/<b>H<\/b>eaps stack that Shiro Games and Motion Twin use for their commercial titles."},{"k":"ul","i":["<b>One codebase, many targets<\/b>: the same Haxe code runs on desktop (via HashLink and HL/C), in the browser (WebGL), and on consoles (through vendor ports).","<b>Low-level by design<\/b>: Heaps gives you a scene graph, batches, shaders and sound — not opinions about your game loop or save format.","<b>Fast iteration<\/b>: Haxe compiles quickly, HashLink starts instantly, and assets can be hot-reloaded.","<b>Ship-proven<\/b>: Dead Cells, Northgard, Evoland I and II, and many game-jam titles were built with it."]},{"k":"pit","t":"Do not expect a \"kitchen sink\" engine","h":"Heaps has no built-in editor, physics module or scene serializer. Chapters 5, 7 and 10 solve exactly those gaps with production-ready patterns."}],"src":"01_preface.txt:27","n":5},{"ch":1,"kind":"content","title":"Heaps at a Glance: The Core Subsystems","tt":"Heaps at a Glance: The Core Subsystems","blocks":[{"k":"p","h":"Before diving in, map the territory. Every box on this diagram becomes one or more chapters of this course."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">        ┌─────────────────────────────────────────────┐<\/span>","<span class=\"cl\">        │             YOUR GAME                       │<\/span>","<span class=\"cl\">        │ states · entities · levels · UI · fx        │<\/span>","<span class=\"cl\">        └───────────────┬─────────────────────────────┘<\/span>","<span class=\"cl\">                        │  h2d (2D scene)   h3d (3D scene)<\/span>","<span class=\"cl\">        ┌───────────────┴─────────────────────────────┐<\/span>","<span class=\"cl\">        │                HEAPS CORE                   │<\/span>","<span class=\"cl\">        │ scene graphs · batching · shaders (hxsl)    │<\/span>","<span class=\"cl\">        │ hxd.App · resources · events · audio        │<\/span>","<span class=\"cl\">        └───────────────┬─────────────────────────────┘<\/span>","<span class=\"cl\">                        │  platform abstraction (backends)<\/span>","<span class=\"cl\">        ┌───────┬───────┴───────┬─────────────────────┐<\/span>","<span class=\"cl\">        │ HL    │ JS / WebGL    │ console             │<\/span>","<span class=\"cl\">        │ (SDL) │ (browser)     │ SDK layers          │<\/span>","<span class=\"cl\">        └───────┴───────────────┴─────────────────────┘<\/span>"],"raw":"        ┌─────────────────────────────────────────────┐\n        │             YOUR GAME                       │\n        │ states · entities · levels · UI · fx        │\n        └───────────────┬─────────────────────────────┘\n                        │  h2d (2D scene)   h3d (3D scene)\n        ┌───────────────┴─────────────────────────────┐\n        │                HEAPS CORE                   │\n        │ scene graphs · batching · shaders (hxsl)    │\n        │ hxd.App · resources · events · audio        │\n        └───────────────┬─────────────────────────────┘\n                        │  platform abstraction (backends)\n        ┌───────┬───────┴───────┬─────────────────────┐\n        │ HL    │ JS / WebGL    │ console             │\n        │ (SDL) │ (browser)     │ SDK layers          │\n        └───────┴───────────────┴─────────────────────┘"},{"k":"ul","i":["<code>hxd<\/code> is the platform abstraction layer: application, input, files, sound, network.","<code>h2d<\/code> and <code>h3d<\/code> are the 2D and 3D scene layers you render into.","Chapters 2–3 cover these layers bottom-up; Chapters 4–14 build upward."]}],"src":"01_preface.txt:50","n":6},{"ch":1,"kind":"content","title":"The Feature Set: What the Engine Gives You","tt":"The Feature Set: What the Engine Gives You","blocks":[{"k":"p","h":"Heaps' feature list explains both its speed and its small API surface."},{"k":"ul","i":["<b>Renderer<\/b>: automatic batching of 2D sprites, h3d pipeline with configurable renderers and passes, custom shaders in Haxe itself (<code>hxsl<\/code>).","<b>Scenes<\/b>: hierarchical 2D and 3D scene graphs with culling, layers, interactives (pointer events), layout containers and 9-slice.","<b>Formats<\/b>: images (PNG, JPEG, DDS, Basis), audio, BMFont fonts, texture atlases, tile maps (Tiled), 3D models (HMD/FBX, GLTF in recent versions), CDB (CastleDB) data.","<b>Platforms<\/b>: Windows, macOS, Linux, all modern browsers, iOS, Android, and current consoles via porting partners.","<b>Tooling<\/b>: FPS and memory statistics, profilers, hot shader reloading, and the Heaps Inspector for debugging scenes."]},{"k":"best","t":"Match ambition to feature set","h":"Heaps shines for hand-rolled, performance-sensitive games where you want a fast renderer and control. If you need a visual editor and turnkey physics out of the box, budget time for Chapters 5, 10 and 14 — they fill those gaps."}],"src":"01_preface.txt:59","n":7},{"ch":1,"kind":"content","title":"Community and Documentation Resources","tt":"Community and Documentation Resources","blocks":[{"k":"p","h":"You will not read Heaps correctly from IDE autocomplete alone. Keep these references open while you take the course."},{"k":"ul","i":["<b>heaps.io<\/b> — the official site with feature overview and the API documentation (<code>heaps.io/api/<\/code>).","<b>github.com/HeapsIO/heaps<\/b> — the engine source. The <code>samples/<\/code> folder is the de-facto manual: almost every subsystem has a runnable example.","<b>Haxe community channels<\/b> — the Haxe Discord and forum carry active Heaps threads; engine authors answer there.","<b>HashLink documentation<\/b> — <code>hashlink.io<\/code> — for the VM, native libraries and HL/C compilation.","<b>CastleDB and Tiled<\/b> docs — for data-driven design decisions used in Chapter 5."]},{"k":"best","t":"Read the source when the docs are thin","h":"Heaps is a small codebase by engine standards. Searching <code>class Flow<\/code> or <code>class Interactive<\/code> in the repo is often faster than any web search."}],"src":"01_preface.txt:68","n":8},{"ch":1,"kind":"content","title":"Prerequisites and Expected Background","tt":"Prerequisites and Expected Background","blocks":[{"k":"p","h":"The course is self-contained on the Heaps side, but you will enjoy it much more with these foundations."},{"k":"ul","i":["<b>A working knowledge of any C-family language<\/b> — Haxe will feel familiar in an afternoon.","<b>Object-oriented basics<\/b>: classes, inheritance, interfaces — Heaps' scene graph uses them everywhere.","<b>Basic game-loop literacy<\/b>: knowing what \"delta time\" means helps, even though Chapter 2 re-teaches it properly.","<b>Command line comfort<\/b>: you will run <code>haxe<\/code>, <code>haxelib<\/code> and a few build commands.","Not required: prior Haxe, shader experience, or 3D math. Both are taught inline (Chapters 1, 11, 14)."]},{"k":"pit","t":"Haxe looks like TypeScript, but is not","h":"Haxe has structural types, macros, enum abstracts and dead-code elimination semantics that have no TS equivalent. Chapter 1's crash course covers the constructs used throughout this course."}],"src":"01_preface.txt:77","n":9},{"ch":1,"kind":"content","title":"The Two Capstone Projects","tt":"The Two Capstone Projects","blocks":[{"k":"p","h":"Every technique in the course lands in one of two games that grow chapter by chapter."},{"k":"ul","i":["<b>Cavern Run (2D)<\/b>: a tile-based cave platformer — player movement, level loading, enemies, collectibles, particles, UI flow, settings, saves, physics props and mobile controls.","<b>Orbital Salvage (3D)<\/b>: a physics-driven orbital junkyard — lighting, shadows, model loading, instancing, raycast picking, rigid bodies, constraints and a stress-test stacking scene."]},{"k":"two","a":[{"k":"p","h":"<b>Cavern Run covers<\/b>"},{"k":"ul","i":["Chapters 1–8, 10, 12–13","Fixed-resolution 2D rendering","JSON level pipeline","Screens, settings, saves","Box2D crates and props"]}],"b":[{"k":"p","h":"<b>Orbital Salvage covers<\/b>"},{"k":"ul","i":["Chapter 14 (built on all prior theory)","Perspective and ortho cameras","HMD model pipeline","Lights, shadows, materials","3D physics and triggers"]}]},{"k":"best","t":"Keep the capstones running as you learn","h":"Each chapter's project slide extends the same codebase. By the end you will have two complete, structured repositories you can strip-mine for your own games."}],"src":"01_preface.txt:100","n":10},{"ch":1,"kind":"content","title":"Conventions, Versions and Code Style","tt":"Conventions, Versions and Code Style","blocks":[{"k":"p","h":"All listings target <b>Haxe 4.x<\/b> and <b>Heaps 1.10+<\/b> running on <b>HashLink<\/b> (development) and <b>JavaScript/WebGL<\/b> (web). Haxe moves faster than book prose, so one convention applies throughout."},{"k":"ul","i":["Code is formatted for reading: 4-space indent, explicit types on public APIs, <code>final<\/code> where it helps clarity.","Where an API has shifted between Heaps versions, the slide says so explicitly and shows the stable pattern.","Paths assume the recommended layout from Chapter 1: <code>src/<\/code> for code, <code>res/<\/code> for assets, one <code>.hxml<\/code> per target."]},{"k":"note","h":"Full engine API details: heaps.io/api. When a listing does not compile against your version, diff the class in the Heaps repository — the fix is usually a renamed argument, not a changed architecture."}],"src":"01_preface.txt:107","n":11},{"ch":1,"kind":"content","title":"What You Will Be Able to Do","tt":"What You Will Be Able to Do","blocks":[{"k":"p","h":"By the final slide you will have shipped-grade answers to the questions that actually decide whether a Heaps project survives contact with reality."},{"k":"ul","i":["Set up a reproducible multi-target toolchain and build configuration.","Architect a game with clean separation of simulation, presentation and state flow.","Manage assets: atlases, async loading, memory discipline, hot reload.","Implement collision, physics, shaders, tweens, particles and UI that scale past a prototype.","Take a game to desktop, web and mobile — inputs included."]},{"k":"p","h":"Start the engine: the next slide opens Chapter 1."}],"src":"01_preface.txt:116","n":12},{"ch":2,"kind":"chapter","title":"Getting Started: Haxe, Toolchain &amp; First Project","tt":"Getting Started: Haxe, Toolchain & First Project","sub":"The language you will write, the toolchain you will install, and the project skeleton every later chapter builds on.","blocks":[],"src":"02_ch01.txt:1","n":13},{"ch":2,"kind":"content","title":"Why Haxe? The Language Behind Heaps","tt":"Why Haxe? The Language Behind Heaps","blocks":[{"k":"p","h":"Heaps is not just <em>written in<\/em> Haxe — your game is written in it too. Understanding why Shiro Games chose Haxe explains most of Heaps' ergonomics."},{"k":"ul","i":["<b>One language, many outputs<\/b>: the Haxe compiler emits C++ (via hxcpp), JavaScript, HashLink bytecode, and more. You never write target-specific glue for the basics.","<b>Strong typing with inference<\/b>: refactor safely, keep IDE completion, skip type-noise where it does not help.","<b>Modern features<\/b>: pattern matching, algebraic enums, <code>abstract<\/code> types, structural typing, and <b>macros<\/b> — compile-time code generation (used by Heaps for shader compilation and resource typing).","<b>Dead code elimination<\/b>: the release build contains only what you actually call."]},{"k":"best","t":"Learn Haxe as \"Haxe\", not as \"like X\"","h":"Ten focused minutes with the constructs on the next slide removes 90% of beginner friction with Heaps examples and API sources."}],"src":"02_ch01.txt:11","n":14},{"ch":2,"kind":"content","title":"Haxe Crash Course: The Constructs You Will Meet","tt":"Haxe Crash Course: The Constructs You Will Meet","blocks":[{"k":"p","h":"These five constructs cover nearly every line of Haxe in this course. Skim now, return when a listing surprises you."},{"k":"code","lang":"haxe","file":"HaxeEssentials.hx","lines":["<span class=\"cl\"><span class=\"c-c\">// 1. Typedefs — structural, renameable data shapes (used for saves, configs, particles)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">typedef<\/span> <span class=\"c-t\">Settings<\/span> = {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> music : <span class=\"c-t\">Bool<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> volume : <span class=\"c-t\">Float<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// 2. Enum abstract — int constants with exhaustiveness checking (input actions, entity kinds)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">enum<\/span> <span class=\"c-k\">abstract<\/span> <span class=\"c-t\">Gem<\/span>(<span class=\"c-t\">Int<\/span>) <span class=\"c-k\">to<\/span> <span class=\"c-t\">Int<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> <span class=\"c-t\">Ruby<\/span> = <span class=\"c-n\">0<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">final<\/span> <span class=\"c-t\">Emerald<\/span> = <span class=\"c-n\">1<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// 3. Pattern matching — safe dispatch over enums or structures<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">function<\/span> label(g:<span class=\"c-t\">Gem<\/span>) <span class=\"c-k\">return<\/span> <span class=\"c-k\">switch<\/span> g {<\/span>","<span class=\"cl\">    <span class=\"c-k\">case<\/span> <span class=\"c-t\">Ruby<\/span>: <span class=\"c-s\">\"hp +10\"<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">case<\/span> <span class=\"c-t\">Emerald<\/span>: <span class=\"c-s\">\"mana +5\"<\/span>;<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// 4. Class + interface — classic OO for scene-graph types<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Hero<\/span> <span class=\"c-k\">extends<\/span> <span class=\"c-t\">Entity<\/span> <span class=\"c-k\">implements<\/span> <span class=\"c-t\">Damageable<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">var<\/span> hp(<span class=\"c-k\">default<\/span>, <span class=\"c-k\">null<\/span>) : <span class=\"c-t\">Int<\/span> = <span class=\"c-n\">100<\/span>; <span class=\"c-c\">// property with custom getter/setter syntax<\/span><\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> takeDamage(n:<span class=\"c-t\">Int<\/span>) hp = <span class=\"c-t\">Math<\/span>.imax(<span class=\"c-n\">0<\/span>, hp - n);<\/span>","<span class=\"cl\">}<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-c\">// 5. Anonymous structures &amp; closures — the bread and butter of game code<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">final<\/span> onDeath = () -&gt; trace(<span class=\"c-s\">\"game over\"<\/span>);<\/span>"],"raw":"// 1. Typedefs — structural, renameable data shapes (used for saves, configs, particles)\ntypedef Settings = {\n    final music : Bool;\n    final volume : Float;\n}\n\n// 2. Enum abstract — int constants with exhaustiveness checking (input actions, entity kinds)\nenum abstract Gem(Int) to Int {\n    final Ruby = 0;\n    final Emerald = 1;\n}\n\n// 3. Pattern matching — safe dispatch over enums or structures\nfunction label(g:Gem) return switch g {\n    case Ruby: \"hp +10\";\n    case Emerald: \"mana +5\";\n}\n\n// 4. Class + interface — classic OO for scene-graph types\nclass Hero extends Entity implements Damageable {\n    public var hp(default, null) : Int = 100; // property with custom getter/setter syntax\n    public function takeDamage(n:Int) hp = Math.imax(0, hp - n);\n}\n\n// 5. Anonymous structures & closures — the bread and butter of game code\nfinal onDeath = () -> trace(\"game over\");"},{"k":"note","h":"Haxe API docs for all of this live at haxe.org/manual. The course uses <code>final<\/code> for values that never change and <code>var<\/code> for mutable state."}],"src":"02_ch01.txt:43","n":15},{"ch":2,"kind":"content","title":"The Compilation Pipeline: From Source to Running Game","tt":"The Compilation Pipeline: From Source to Running Game","blocks":[{"k":"p","h":"Knowing what each tool produces makes debugging builds trivial later."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">        Main.hx + *.hx  ──(haxe + compile.hxml)──►  TARGET OUTPUT<\/span>","<span class=\"cl\">                                                    │<\/span>","<span class=\"cl\">              ┌─────────────────────────────────────┼──────────────────────┐<\/span>","<span class=\"cl\">              ▼                                     ▼                      ▼<\/span>","<span class=\"cl\">        HashLink bytecode                      JavaScript            HL/C sources<\/span>","<span class=\"cl\">        hlboot.dat  →  `hl` VM runs it         game.js → &lt;script&gt;    main.c → gcc/cl<\/span>","<span class=\"cl\">        (fast dev loop)                        (web target)          (release native exe)<\/span>","<span class=\"cl\">              │<\/span>","<span class=\"cl\">              └── assets in res/ are embedded or loaded at runtime by hxd.Res<\/span>"],"raw":"        Main.hx + *.hx  ──(haxe + compile.hxml)──►  TARGET OUTPUT\n                                                    │\n              ┌─────────────────────────────────────┼──────────────────────┐\n              ▼                                     ▼                      ▼\n        HashLink bytecode                      JavaScript            HL/C sources\n        hlboot.dat  →  `hl` VM runs it         game.js → <script>    main.c → gcc/cl\n        (fast dev loop)                        (web target)          (release native exe)\n              │\n              └── assets in res/ are embedded or loaded at runtime by hxd.Res"},{"k":"ul","i":["The compiler reads one <code>.hxml<\/code> file describing target, classpaths and libraries.","<b>HashLink (HL)<\/b> is a fast VM designed for development: instant start, quick compile.","<b>HL/C<\/b> compiles the same bytecode to C sources, then to an optimized native binary for release."]},{"k":"pit","t":"Mixing up HL and hxcpp","h":"Heaps' first-class native path is HashLink, not hxcpp. If a tutorial says <code>-cpp bin<\/code>, it predates the modern stack — follow this course's <code>.hxml<\/code> files instead."}],"src":"02_ch01.txt:61","n":16},{"ch":2,"kind":"content","title":"Platforms and Backends: How Heaps Reaches Them","tt":"Platforms and Backends: How Heaps Reaches Them","blocks":[{"k":"p","h":"Heaps isolates you from platform APIs through backends. You write against <code>hxd.*<\/code>, a backend implements it."},{"k":"ul","i":["<b>HashLink (desktop)<\/b> — SDL window, OpenGL/Vulkan/DX driver, full filesystem and audio. Primary development target.","<b>JavaScript (browser)<\/b> — WebGL 1/2 renderer, WebAudio, XHR/fetch, local storage. Same code, browser constraints (see each module chapter).","<b>Mobile (iOS/Android)<\/b> — HashLink-based runtimes with touch input, accelerometer and packaging scripts.","<b>Consoles<\/b> — certified vendor ports of the same abstraction layer; source code stays identical, certification is your problem, not the engine's."]},{"k":"best","t":"Develop on HashLink, test on web early","h":"The browser target surfaces resource-size, codec and blocking-IO assumptions that HL quietly forgives. A weekly web build keeps cross-platform promises honest."}],"src":"02_ch01.txt:69","n":17},{"ch":2,"kind":"content","title":"Installing the Haxe Toolchain","tt":"Installing the Haxe Toolchain","blocks":[{"k":"p","h":"Everything in the course needs exactly three pieces: the Haxe compiler, the HashLink VM, and the package tool."},{"k":"ul","i":["Download and run the <b>Haxe installer<\/b> for your OS (haxe.org). It bundles the standard library and <code>haxelib<\/code>.","Install <b>HashLink<\/b> (hashlink.io): the <code>hl<\/code> executable plus <code>hl.dll<\/code>/<code>libhl<\/code> runtime libraries. On macOS: <code>brew install hashlink<\/code>. On Linux, build from source or use your distro's package.","Verify everything with two commands:"]},{"k":"code","lang":"bash","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">haxe<\/span> <span class=\"c-f\">--version<\/span>      <span class=\"c-c\"># expect 4.3.x or newer<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">hl<\/span> <span class=\"c-f\">--version<\/span>        <span class=\"c-c\"># the HashLink VM<\/span><\/span>"],"raw":"haxe --version      # expect 4.3.x or newer\nhl --version        # the HashLink VM"},{"k":"ul","i":["Add <code>haxe<\/code> and <code>hl<\/code> to your <code>PATH<\/code> if the installer did not (Windows: the installer handles it; macOS/Linux: check your shell profile)."]},{"k":"pit","t":"Version drift breaks shader compilation","h":"Heaps generates shaders through Haxe macros. An Haxe 4.0/4.1 with modern Heaps will fail with cryptic macro errors. Always start on current stable Haxe 4.x before suspecting your code."}],"src":"02_ch01.txt:81","n":18},{"ch":2,"kind":"content","title":"Verifying the Install: A Five-Line Sanity Check","tt":"Verifying the Install: A Five-Line Sanity Check","blocks":[{"k":"p","h":"Do this before creating any project; it isolates toolchain problems from project problems."},{"k":"code","lang":"bash","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">mkdir<\/span> <span class=\"c-f\">-p<\/span> /tmp/hxcheck/src<\/span>"],"raw":"mkdir -p /tmp/hxcheck/src"},{"k":"code","lang":"haxe","file":"/tmp/hxcheck/src/Main.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Main<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> main() trace(<span class=\"c-s\">\"toolchain OK\"<\/span>);<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class Main {\n    static function main() trace(\"toolchain OK\");\n}"},{"k":"code","lang":"bash","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">cd<\/span> /tmp/hxcheck<\/span>","<span class=\"cl\"><span class=\"c-k\">echo<\/span> <span class=\"c-s\">\"-cp src -main Main -hl out.hl\"<\/span> &gt; build.hxml<\/span>","<span class=\"cl\"><span class=\"c-k\">haxe<\/span> build.hxml &amp;&amp; <span class=\"c-k\">hl<\/span> out.hl   <span class=\"c-c\"># must print: Main.hx:2: toolchain OK<\/span><\/span>"],"raw":"cd /tmp/hxcheck\necho \"-cp src -main Main -hl out.hl\" > build.hxml\nhaxe build.hxml && hl out.hl   # must print: Main.hx:2: toolchain OK"},{"k":"p","h":"If this prints, compiler and VM agree. If not, fix paths and versions now — every later step depends on it."}],"src":"02_ch01.txt:98","n":19},{"ch":2,"kind":"content","title":"Choosing and Configuring an IDE","tt":"Choosing and Configuring an IDE","blocks":[{"k":"p","h":"Haxe support is genuinely good in two editors; pick one and learn its project flow."},{"k":"ul","i":["<b>VS Code + the \"Haxe\" extension (by KLab / nadako)<\/b> — selection of <code>.hxml<\/code> builds in the status bar, completion, \"goto definition\" into engine sources, inline errors. The default choice for this course.","<b>IntelliJ IDEA + the \"HaxeToolkit\" plugin<\/b> — stronger refactoring, familiar to JetBrains users.","<b>Anything with a terminal<\/b> — Haxe is just a compiler invocation; <code>vim<\/code>/<code>emacs<\/code>/<code>sublime<\/code> users only lose some completion."]},{"k":"best","t":"Enable \"goto definition\" into Heaps sources","h":"Reading <code>h2d/Flow.hx<\/code> or <code>hxd/App.hx<\/code> straight from the editor is the single highest-value IDE setup step for this course. Install Heaps via a package manager (next slides) so the sources exist locally."}],"src":"02_ch01.txt:105","n":20},{"ch":2,"kind":"content","title":"Getting Heaps: haxelib vs lix","tt":"Getting Heaps: haxelib vs lix","blocks":[{"k":"p","h":"There are two supported ways to pin library versions in Haxe. Both work with Heaps; teams differ on preference."},{"k":"table","head":["Option","Style","Best for"],"rows":[["haxelib","global per-machine library store, <code>haxelib install heaps<\/code>","solo devs, quick starts, following samples"],["lix","per-project <code>package.json<\/code> + <code>haxe_libraries<\/code> scope files","teams, reproducible builds, CI"]]},{"k":"ul","i":["Both end up writing the same thing into your <code>.hxml<\/code>: <code>-lib heaps<\/code>.","lix uses npm to install itself, but your project needs <b>no node runtime<\/b> afterwards."]},{"k":"best","t":"Use lix for anything with more than one contributor","h":"lix pins exact commits per project, so \"works on my machine\" disappears. If you are solo and following along quickly, haxelib is fine and everything in this course works identically."}],"src":"02_ch01.txt:116","n":21},{"ch":2,"kind":"content","title":"Installing with haxelib (Simple Path)","tt":"Installing with haxelib (Simple Path)","blocks":[{"k":"p","h":"The classic flow. One command gets the engine and its samples."},{"k":"code","lang":"bash","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">haxelib<\/span> install heaps     <span class=\"c-c\"># latest release from the Haxe library registry<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">haxelib<\/span> set heaps <span class=\"c-n\">1.10<\/span>.0  <span class=\"c-c\"># optional: pin a known-good release<\/span><\/span>"],"raw":"haxelib install heaps     # latest release from the Haxe library registry\nhaxelib set heaps 1.10.0  # optional: pin a known-good release"},{"k":"ul","i":["The library lands in a global folder (e.g. <code>~/haxelib/heaps/1.10.0/<\/code>).","Your <code>.hxml<\/code> only says <code>-lib heaps<\/code>; haxelib resolves the pinned version.","Heaps sources (worth reading) are now on disk — <code>haxelib path heaps<\/code> prints the folder."]},{"k":"pit","t":"Global store = global drift","h":"Two projects on one machine can silently use different Heaps versions after an upgrade. If you haxelib-upgrade to fix a bug, old projects may break. Pin with <code>haxelib set<\/code> per project, or move to lix."}],"src":"02_ch01.txt:127","n":22},{"ch":2,"kind":"content","title":"Installing with lix (Reproducible Path)","tt":"Installing with lix (Reproducible Path)","blocks":[{"k":"p","h":"lix manages dependencies per project, npm-style, including the Haxe toolchain itself."},{"k":"code","lang":"bash","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">npm<\/span> install <span class=\"c-f\">-g<\/span> <span class=\"c-k\">lix<\/span>        <span class=\"c-c\"># one-time (needs Node.js installed)<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">cd<\/span> cavern-run<\/span>","<span class=\"cl\"><span class=\"c-k\">npm<\/span> init <span class=\"c-f\">-y<\/span>               <span class=\"c-c\"># creates package.json<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">npx<\/span> <span class=\"c-k\">lix<\/span> install <span class=\"c-k\">haxe<\/span> <span class=\"c-n\">4.3<\/span>.6   <span class=\"c-c\"># pin the compiler itself!<\/span><\/span>","<span class=\"cl\"><span class=\"c-k\">npx<\/span> <span class=\"c-k\">lix<\/span> install github:HeapsIO/heaps<span class=\"c-c\">#1.10.0<\/span><\/span>"],"raw":"npm install -g lix        # one-time (needs Node.js installed)\ncd cavern-run\nnpm init -y               # creates package.json\nnpx lix install haxe 4.3.6   # pin the compiler itself!\nnpx lix install github:HeapsIO/heaps#1.10.0"},{"k":"ul","i":["lix writes <code>.hxml<\/code> scope files into <code>haxe_libraries/<\/code> — commit them together with <code>package.json<\/code>.","Every contributor (and your CI) runs <code>npx lix download<\/code> after cloning and gets bit-identical versions."]},{"k":"best","t":"Pin the compiler too","h":"The biggest source of \"impossible\" Heaps bugs is an Haxe mismatch between teammates. <code>lix install haxe &lt;version&gt;<\/code> removes that variable entirely."}],"src":"02_ch01.txt:140","n":23},{"ch":2,"kind":"content","title":"Anatomy of an hxml Build File","tt":"Anatomy of an hxml Build File","blocks":[{"k":"p","h":"The <code>.hxml<\/code> file is the contract between your IDE, your command line and your CI. Read it once, carefully."},{"k":"code","lang":"hxml","file":"cavern-run.hl.hxml","lines":["<span class=\"cl\"><span class=\"c-c\"># cavern-run.hl.hxml — build &amp; run on HashLink (development)<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-cp<\/span> src                 <span class=\"c-c\"># classpath: where Main.hx and friends live<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-lib<\/span> heaps              <span class=\"c-c\"># resolve the Heaps library<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-main<\/span> Main              <span class=\"c-c\"># entry class with static function main()<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-D<\/span> hlVer=<span class=\"c-n\">1.14<\/span>           <span class=\"c-c\"># target HashLink bytecode version<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-hl<\/span> bin/hlboot.dat      <span class=\"c-c\"># emit bytecode here<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-D<\/span> dce=full             <span class=\"c-c\"># dead code elimination for leaner output<\/span><\/span>","<span class=\"cl\"><span class=\"c-c\"># -D dump=pretty        # uncomment to inspect generated code while learning<\/span><\/span>"],"raw":"# cavern-run.hl.hxml — build & run on HashLink (development)\n-cp src                 # classpath: where Main.hx and friends live\n-lib heaps              # resolve the Heaps library\n-main Main              # entry class with static function main()\n-D hlVer=1.14           # target HashLink bytecode version\n-hl bin/hlboot.dat      # emit bytecode here\n-D dce=full             # dead code elimination for leaner output\n# -D dump=pretty        # uncomment to inspect generated code while learning"},{"k":"ul","i":["One file per target: <code>cavern-run.hl.hxml<\/code>, <code>cavern-run.js.hxml<\/code>, <code>cavern-run-native.hxml<\/code> (HL/C).","Comments start with <code>#<\/code>. Order does not matter; readability does — group by purpose."]},{"k":"note","h":"Run with <code>haxe cavern-run.hl.hxml &amp;&amp; hl bin/hlboot.dat<\/code>. Chapter 2 replaces the manual <code>hl<\/code> call with F5-in-IDE task configs."}],"src":"02_ch01.txt:156","n":24},{"ch":2,"kind":"content","title":"Multi-Target hxml: Web and Native Builds","tt":"Multi-Target hxml: Web and Native Builds","blocks":[{"k":"p","h":"The whole cross-platform promise in two extra files."},{"k":"code","lang":"hxml","file":"cavern-run.js.hxml","lines":["<span class=\"cl\"><span class=\"c-c\"># Browser build (WebGL)<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-cp<\/span> src<\/span>","<span class=\"cl\"><span class=\"c-f\">-lib<\/span> heaps<\/span>","<span class=\"cl\"><span class=\"c-f\">-main<\/span> Main<\/span>","<span class=\"cl\"><span class=\"c-f\">-js<\/span> bin/game.js<\/span>","<span class=\"cl\"><span class=\"c-f\">-D<\/span> js-es=<span class=\"c-n\">6<\/span>                 <span class=\"c-c\"># modern JS output<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-D<\/span> dce=full<\/span>","<span class=\"cl\"><span class=\"c-f\">-D<\/span> heaps-cdb               <span class=\"c-c\"># optional: CastleDB runtime (Chapter 5)<\/span><\/span>"],"raw":"# Browser build (WebGL)\n-cp src\n-lib heaps\n-main Main\n-js bin/game.js\n-D js-es=6                 # modern JS output\n-D dce=full\n-D heaps-cdb               # optional: CastleDB runtime (Chapter 5)"},{"k":"code","lang":"hxml","file":"cavern-run-native.hxml","lines":["<span class=\"cl\"><span class=\"c-c\"># Release native build via HL/C<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-cp<\/span> src<\/span>","<span class=\"cl\"><span class=\"c-f\">-lib<\/span> heaps<\/span>","<span class=\"cl\"><span class=\"c-f\">-main<\/span> Main<\/span>","<span class=\"cl\"><span class=\"c-f\">-hl<\/span> out/cavern-run         <span class=\"c-c\"># emits C sources<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-D<\/span> hlVer=<span class=\"c-n\">1.14<\/span><\/span>","<span class=\"cl\"><span class=\"c-f\">-D<\/span> dce=full<\/span>"],"raw":"# Release native build via HL/C\n-cp src\n-lib heaps\n-main Main\n-hl out/cavern-run         # emits C sources\n-D hlVer=1.14\n-D dce=full"},{"k":"p","h":"Then <code>haxelib run hlc out/cavern-run<\/code> compiles the C sources with your system compiler into a standalone executable."},{"k":"best","t":"Keep a <code>build/<\/code> script per target","h":"A three-line shell script (<code>haxe x.hxml &amp;&amp; hl bin/hlboot.dat<\/code>) per target prevents the classic mistake of rebuilding the wrong target for ten minutes."}],"src":"02_ch01.txt:180","n":25},{"ch":2,"kind":"content","title":"Recommended Project Directory Layout","tt":"Recommended Project Directory Layout","blocks":[{"k":"p","h":"Consistency now pays off when assets, levels and saves enter the picture (Chapters 5–7)."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">cavern-run/<\/span>","<span class=\"cl\">├── res/                    # ALL assets: images, atlases, fonts, sounds, levels<\/span>","<span class=\"cl\">│   ├── img/<\/span>","<span class=\"cl\">│   ├── fnt/<\/span>","<span class=\"cl\">│   ├── snd/<\/span>","<span class=\"cl\">│   └── levels/<\/span>","<span class=\"cl\">├── src/<\/span>","<span class=\"cl\">│   ├── Main.hx             # entry point (Chapter 1)<\/span>","<span class=\"cl\">│   └── game/               # grows every chapter<\/span>","<span class=\"cl\">│       ├── Game.hx<\/span>","<span class=\"cl\">│       └── ...<\/span>","<span class=\"cl\">├── cavern-run.hl.hxml<\/span>","<span class=\"cl\">├── cavern-run.js.hxml<\/span>","<span class=\"cl\">└── README.md<\/span>"],"raw":"cavern-run/\n├── res/                    # ALL assets: images, atlases, fonts, sounds, levels\n│   ├── img/\n│   ├── fnt/\n│   ├── snd/\n│   └── levels/\n├── src/\n│   ├── Main.hx             # entry point (Chapter 1)\n│   └── game/               # grows every chapter\n│       ├── Game.hx\n│       └── ...\n├── cavern-run.hl.hxml\n├── cavern-run.js.hxml\n└── README.md"},{"k":"ul","i":["<code>res/<\/code> is special: <code>hxd.Res<\/code> scans it at compile time (macro) and gives you <b>typed<\/b> resource access.","Source packages mirror architecture layers introduced in Chapter 4."]},{"k":"note","h":"Naming: lowercase, no spaces, no accents anywhere under the project root. It saves endless web-build and packaging pain later."}],"src":"02_ch01.txt:202","n":26},{"ch":2,"kind":"content","title":"res/ and the Resource System: initEmbed vs initLocal","tt":"res/ and the Resource System: initEmbed vs initLocal","blocks":[{"k":"p","h":"<code>hxd.Res<\/code> is Heaps' typed front door to assets. Two initialization modes cover development and shipping."},{"k":"code","lang":"haxe","file":"Main.hx","lines":["<span class=\"cl\"><span class=\"c-k\">import<\/span> hxd.<span class=\"c-t\">Res<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Main<\/span> <span class=\"c-k\">extends<\/span> hxd.<span class=\"c-t\">App<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> init() {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// Mode 1 — embedded (default for web, fine for dev):<\/span><\/span>","<span class=\"cl\">        <span class=\"c-c\">// assets are compiled into the build and always available.<\/span><\/span>","<span class=\"cl\">        <span class=\"c-t\">Res<\/span>.initEmbed();<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-c\">// Mode 2 — external (desktop shipped builds):<\/span><\/span>","<span class=\"cl\">        <span class=\"c-c\">// assets load from disk next to the executable.<\/span><\/span>","<span class=\"cl\">        <span class=\"c-c\">// Res.initLocal();<\/span><\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">        <span class=\"c-c\">// Typed access — completion-checked, typo-safe:<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> tile = <span class=\"c-t\">Res<\/span>.img.hero.toTile();   <span class=\"c-c\">// res/img/hero.png<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"import hxd.Res;\n\nclass Main extends hxd.App {\n    override function init() {\n        // Mode 1 — embedded (default for web, fine for dev):\n        // assets are compiled into the build and always available.\n        Res.initEmbed();\n\n        // Mode 2 — external (desktop shipped builds):\n        // assets load from disk next to the executable.\n        // Res.initLocal();\n\n        // Typed access — completion-checked, typo-safe:\n        var tile = Res.img.hero.toTile();   // res/img/hero.png\n    }\n}"},{"k":"ul","i":["<code>Res.img.hero<\/code> only compiles if <code>res/img/hero.png<\/code> exists — the macro generates that class for you.","Chapter 5 covers async loading, progress and hot reload on top of this base."]},{"k":"pit","t":"Renaming res folders breaks builds confusingly","h":"The macro scans <code>res/<\/code> at compile time. Moving a file changes generated code; if errors mention classes you never wrote, clean-build first, then check <code>res/<\/code>."}],"src":"02_ch01.txt:226","n":27},{"ch":2,"kind":"content","title":"Hello Window: Your First hxd.App","tt":"Hello Window: Your First hxd.App","blocks":[{"k":"p","h":"The smallest complete Heaps program. Twenty real lines, everything explained."},{"k":"code","lang":"haxe","file":"Main.hx","lines":["<span class=\"cl\"><span class=\"c-k\">import<\/span> hxd.<span class=\"c-t\">App<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">import<\/span> h2d.<span class=\"c-t\">Bitmap<\/span>;<\/span>","<span class=\"cl\"><span class=\"c-k\">import<\/span> h2d.<span class=\"c-t\">Tile<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">Main<\/span> <span class=\"c-k\">extends<\/span> <span class=\"c-t\">App<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> logo : <span class=\"c-t\">Bitmap<\/span>;<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> init() {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// init() runs once, after engine + scenes exist.<\/span><\/span>","<span class=\"cl\">        <span class=\"c-c\">// s2d = 2D scene root, s3d = 3D scene root, both are created for you.<\/span><\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> tile = <span class=\"c-t\">Tile<\/span>.fromColor(<span class=\"c-n\">0x1E90FF<\/span>, <span class=\"c-n\">96<\/span>, <span class=\"c-n\">96<\/span>); <span class=\"c-c\">// a solid-color tile<\/span><\/span>","<span class=\"cl\">        logo = <span class=\"c-k\">new<\/span> <span class=\"c-t\">Bitmap<\/span>(tile, s2d);                <span class=\"c-c\">// draw it, parented to the scene<\/span><\/span>","<span class=\"cl\">        logo.x = <span class=\"c-n\">40<\/span>;<\/span>","<span class=\"cl\">        logo.y = <span class=\"c-n\">40<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">override<\/span> <span class=\"c-k\">function<\/span> update(dt:<span class=\"c-t\">Float<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-c\">// update() runs every frame; dt = seconds since last frame.<\/span><\/span>","<span class=\"cl\">        logo.rotation += <span class=\"c-n\">1.2<\/span> * dt;   <span class=\"c-c\">// radians per second, frame-rate independent<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\"> <\/span>","<span class=\"cl\">    <span class=\"c-k\">static<\/span> <span class=\"c-k\">function<\/span> main() {<\/span>","<span class=\"cl\">        <span class=\"c-k\">new<\/span> <span class=\"c-t\">Main<\/span>();     <span class=\"c-c\">// construct → engine boots → init() is called<\/span><\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"import hxd.App;\nimport h2d.Bitmap;\nimport h2d.Tile;\n\nclass Main extends App {\n    var logo : Bitmap;\n\n    override function init() {\n        // init() runs once, after engine + scenes exist.\n        // s2d = 2D scene root, s3d = 3D scene root, both are created for you.\n        var tile = Tile.fromColor(0x1E90FF, 96, 96); // a solid-color tile\n        logo = new Bitmap(tile, s2d);                // draw it, parented to the scene\n        logo.x = 40;\n        logo.y = 40;\n    }\n\n    override function update(dt:Float) {\n        // update() runs every frame; dt = seconds since last frame.\n        logo.rotation += 1.2 * dt;   // radians per second, frame-rate independent\n    }\n\n    static function main() {\n        new Main();     // construct → engine boots → init() is called\n    }\n}"},{"k":"code","lang":"bash","file":"","lines":["<span class=\"cl\"><span class=\"c-k\">haxe<\/span> cavern-run.hl.hxml &amp;&amp; <span class=\"c-k\">hl<\/span> bin/hlboot.dat   <span class=\"c-c\"># blue square, gently spinning<\/span><\/span>"],"raw":"haxe cavern-run.hl.hxml && hl bin/hlboot.dat   # blue square, gently spinning"}],"src":"02_ch01.txt:259","n":28},{"ch":2,"kind":"content","title":"Reading the Main Loop: What Just Happened","tt":"Reading the Main Loop: What Just Happened","blocks":[{"k":"p","h":"Before Chapter 2 dissects the engine modules, understand the loop your <code>update<\/code> lives in."},{"k":"code","lang":"plain","file":"","lines":["<span class=\"cl\">main() → new App() → engine creates window (h3d.Engine)<\/span>","<span class=\"cl\">                  → creates scenes: s2d, s3d + event system (sevents)<\/span>","<span class=\"cl\">                  → calls your init()<\/span>","<span class=\"cl\">loop:  while window open<\/span>","<span class=\"cl\">         ├─ pump platform events (input, resize, close)<\/span>","<span class=\"cl\">         ├─ dt = time since last frame<\/span>","<span class=\"cl\">         ├─ App.update(dt)          ← your code<\/span>","<span class=\"cl\">         ├─ update animations (h2d.Anim etc.)<\/span>","<span class=\"cl\">         └─ render s3d, then s2d    ← GPU work this frame<\/span>","<span class=\"cl\">exit:  window closed → cleanup<\/span>"],"raw":"main() → new App() → engine creates window (h3d.Engine)\n                  → creates scenes: s2d, s3d + event system (sevents)\n                  → calls your init()\nloop:  while window open\n         ├─ pump platform events (input, resize, close)\n         ├─ dt = time since last frame\n         ├─ App.update(dt)          ← your code\n         ├─ update animations (h2d.Anim etc.)\n         └─ render s3d, then s2d    ← GPU work this frame\nexit:  window closed → cleanup"},{"k":"ul","i":["Your <code>update<\/code> runs <b>before<\/b> rendering each frame — nothing you see is drawn until the frame ends.","Both scenes exist always; unused empty scenes cost nothing."]},{"k":"best","t":"Keep update() lean and delegate","h":"Real projects immediately grow a <code>Game<\/code> class that owns sub-systems (Chapter 4). Keep <code>Main.hx<\/code> as a 10-line bootstrapper forever."}],"src":"02_ch01.txt:277","n":29},{"ch":2,"kind":"content","title":"Diagnostics: FPS, Trace and Debug Builds","tt":"Diagnostics: FPS, Trace and Debug Builds","blocks":[{"k":"p","h":"Three habits that make every later chapter easier to debug."},{"k":"code","lang":"haxe","file":"DebugHud.hx","lines":["<span class=\"cl\"><span class=\"c-k\">class<\/span> <span class=\"c-t\">DebugHud<\/span> {<\/span>","<span class=\"cl\">    <span class=\"c-k\">var<\/span> tf : h2d.<span class=\"c-t\">Text<\/span>;<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> <span class=\"c-k\">new<\/span>(parent:h2d.<span class=\"c-t\">Object<\/span>) {<\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> font = hxd.<span class=\"c-t\">Res<\/span>.fnt.montserrat.toFont();<\/span>","<span class=\"cl\">        tf = <span class=\"c-k\">new<\/span> h2d.<span class=\"c-t\">Text<\/span>(font, parent);<\/span>","<span class=\"cl\">        tf.textColor = <span class=\"c-n\">0xFFFFFF<\/span>;<\/span>","<span class=\"cl\">        tf.dropShadow = { dx : <span class=\"c-n\">1<\/span>, dy : <span class=\"c-n\">1<\/span>, color : <span class=\"c-n\">0<\/span>, alpha : <span class=\"c-n\">0.6<\/span> };<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">    <span class=\"c-k\">public<\/span> <span class=\"c-k\">function<\/span> update() {<\/span>","<span class=\"cl\">        <span class=\"c-k\">var<\/span> e = h3d.<span class=\"c-t\">Engine<\/span>.getCurrent();        <span class=\"c-c\">// the low-level engine singleton<\/span><\/span>","<span class=\"cl\">        tf.text = <span class=\"c-s\">'fps: ${e.fps}  ·  ${e.width}x${e.height}'<\/span>;<\/span>","<span class=\"cl\">    }<\/span>","<span class=\"cl\">}<\/span>"],"raw":"class DebugHud {\n    var tf : h2d.Text;\n    public function new(parent:h2d.Object) {\n        var font = hxd.Res.fnt.montserrat.toFont();\n        tf = new h2d.Text(font, parent);\n        tf.textColor = 0xFFFFFF;\n        tf.dropShadow = { dx : 1, dy : 1, color : 0, alpha : 0.6 };\n    }\n    public function update() {\n        var e = h3d.Engine.getCurrent();        // the low-level engine singleton\n        tf.text = 'fps: ${e.fps}  ·  ${e.width}x${e.height}';\n    }\n}"},{"k":"ul","i":["<code>trace()<\/code> prints to console on HL, to browser devtools on web — leave them in during development.","Compile with <code>-D debug<\/code> for better stack traces; <code>-D dump=pretty<\/code> to read generated code when macros confuse you."]},{"k":"pit","t":"Debugging with release builds wastes days","h":"Dead-code elimination and inlining make release stack traces nearly useless. Reproduce on a <code>-D debug<\/code> build first."}],"src":"02_ch01.txt:298","n":30},{"ch":2,"kind":"content","title":"Common Setup Pitfalls (and Their Fixes)","tt":"Common Setup Pitfalls (and Their Fixes)","blocks":[{"k":"p","h":"Every one of these has cost a Heaps beginner at least an hour. Collect them now."},{"k":"pit","t":"\"Could not find haxelib heaps\"","h":"You never installed it, or you are outside the project where the <code>.hxml<\/code> lives. Run <code>haxelib list<\/code> — <code>heaps<\/code> must appear with a version."},{"k":"pit","t":"Black window, no errors, nothing drawn","h":"You used <code>Res.initEmbed()<\/code> but the <code>.hxml<\/code> lacks <code>-cp src<\/code> … or the bitmap was added to <code>s3d<\/code> instead of <code>s2d<\/code>, or has size 0. Draw with <code>Tile.fromColor<\/code> first to isolate."},{"k":"pit","t":"<code>Class not found : Main<\/code>","h":"<code>-cp<\/code> points to the wrong folder, or <code>Main.hx<\/code> declares <code>package game;<\/code>. The classpath must make <code>Main<\/code> top-level unless the package matches the folder."},{"k":"pit","t":"Works on HL, blank on web","h":"Check the browser console: usually a missing resource (case-sensitive path!) or a shader feature unsupported in WebGL1 (Chapter 11 covers compatibility)."}],"src":"02_ch01.txt:305","n":31},{"ch":2,"kind":"content","title":"Planning the 2D Capstone: Cavern Run","tt":"Planning the 2D Capstone: Cavern Run","blocks":[{"k":"p","h":"Chapter by chapter, this game accumulates every technique in the course. Decide its shape now so later chapters have a target to hit."},{"k":"ul","i":["<b>Genre<\/b>: single-screen-scrolling cave platformer — run, jump, collect gems, avoid bats, reach the exit door.","<b>World<\/b>: three tile-based levels, 40x23 tiles each, authored in JSON (Chapter 5) and rendered from an atlas.","<b>Feel<\/b>: fixed internal resolution 1280x720 (Chapter 2), 60 FPS, screen shake and particles (Chapter 8), tweened menus (Chapters 7, 9, 13).","<b>Scope discipline<\/b>: no inventory, no combat — every system that exists exists to teach a chapter."]},{"k":"best","t":"Write the \"done\" checklist before the code","h":"A one-page feature list with chapter numbers beside each feature is the cheapest scope control in game development."}],"src":"02_ch01.txt:313","n":32},{"ch":2,"kind":"content","title":"Planning the 3D Capstone: Orbital Salvage","tt":"Planning the 3D Capstone: Orbital Salvage","blocks":[{"k":"p","h":"Chapter 14 builds this in full, but its architecture is decided by everything before it."},{"k":"ul","i":["<b>Scene<\/b>: a drifting cargo bay above a planet — skybox gradient, directional sun, dynamic point lights, cargo crates.","<b>Gameplay<\/b>: raycast-click to salvage floating orbs; physics-driven crates; a stacking stress scene proving the solver setup.","<b>Tech<\/b>: HMD models, instanced debris (MeshBatch), shadow-mapped sun, 3D audio not required (keep scope tight)."]},{"k":"note","h":"By design, Orbital Salvage reuses Cavern Run's architecture layers (Chapter 4) — coordinator, world, renderer — with a 3D renderer swapped in. Architecture lessons transfer; that is the point."}],"src":"02_ch01.txt:320","n":33},{"ch":2,"kind":"content","title":"Chapter 1 Checklist","tt":"Chapter 1 Checklist","blocks":[{"k":"p","h":"You are ready for Chapter 2 when every box is honestly ticked."},{"k":"ul","i":["Haxe and HashLink installed and version-verified.","IDE with goto-definition into Heaps sources.","Heaps installed (haxelib <b>or<\/b> lix) and pinned.","<code>cavern-run/<\/code> skeleton with <code>res/<\/code>, <code>src/Main.hx<\/code>, and two <code>.hxml<\/code> files.","Spinning blue square runs on HL <b>and<\/b> in the browser.","Debug HUD shows FPS."]}],"src":"02_ch01.txt:329","n":34},{"ch":3,"kind":"chapter","title":"Engine Modules: App, Graphics, Audio, Input, Files, Network","tt":"Engine Modules: App, Graphics, Audio, Input, Files, Network","sub":"The hxd platform layer — one API over every target. Master it before writing a single gameplay line.","blocks":[],"src":"03_ch02.txt:1","n":35},{"ch":3,"kind":"content","title":"The hxd Layer: One API, Many Platforms","tt":"The hxd Layer: One API, Many Platforms","blocks":[{"k":"p","h":"<code>hxd<\/code> is Heaps' platform abstraction layer. Its job is that you never write <code>#if js<\/code> / <code>#if hl<\/code> for ordinary engine work."},{"k":"ul","i":["Every module discussed this chapter (<code>App<\/code>, <code>Key<\/code>, <code>Pad<\/code>, <code>Save<\/code>, <code>Http<\/code>, <code>System<\/code>, <code>Res<\/code>, <code>Sound<\/code>) has a backend per target — you call the same API everywhere.","Platform differences are not erased, they are <b>quarantined<\/b>: codecs, storage locations, fullscreen behavior and autoplay rules are documented per module below.","When you truly need target code, Haxe conditionals (<code>#if hl<\/code>, <code>#if js<\/code>, <code>#if sys<\/code>) are the escape hatch — used sparingly in later chapters."]},{"k":"best","t":"Program against modules, not platforms","h":"Every <code>#if<\/code> you add is code that only runs on some machines. Push platform decisions down into <code>hxd<\/code>-backed APIs and keep your game logic conditional-free."}],"src":"03_ch02.txt:10","n":36},{"ch":3,"kind":"content","title":"Module Map: What Lives Where","tt":"Module Map: What Lives Where","blocks":[{"k":"p","h":"A reference card for the rest of the course."},{"k":"table","head":["Module","Key classes","Chapter"],"rows":[["Application","<code>hxd.App<\/code>, <code>hxd.System<\/code>","this chapter"],["Graphics","<code>h3d.Engine<\/code>, <code>h2d.Scene<\/code>","this chapter + 3"],["Audio","<code>hxd.res.Sound<\/code>, <code>hxd.snd.Channel<\/code>","this chapter"],["Input","<code>hxd.Key<\/code>, <code>hxd.Pad<\/code>, <code>hxd.Event<\/code>, <code>h2d.Interactive<\/code>","this chapter + 3, 12"],["Files","<code>hxd.Res<\/code>, <code>hxd.Save<\/code>, <code>hxd.File<\/code>","this chapter + 5"],["Network","<code>hxd.Http<\/code>, WebSocket libs","this chapter"],["Timing","<code>hxd.Timer<\/code>, <code>hxd.App.update(dt)<\/code>","this chapter + 4"]]}],"src":"03_ch02.txt:23","n":37},{"ch":3,"kind":"content","title":"hxd.App: The Application Framework","tt":"hxd.App: The Application Framework","blocks":[{"k":"p","h":"<code>hxd.App<\/code> is the base class of your entry point. It owns the engine, both scenes and the event system."},{"k":"code","lang":"haxe","file":"AppAnatomy.hx","line
